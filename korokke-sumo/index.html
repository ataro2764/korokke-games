<title>コロッケ大相撲</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
/* Layout: one-screen game. Canvas = 国技館の土俵 (side view), DOM panels and two big pads float on top. Single deliberate look. */
:root {
  --ai: #1F3A68;        /* 藍 */
  --ai-deep: #142849;
  --koromo: #E8A53E;    /* 衣 */
  --koromo-dark: #7A4210;
  --murasaki: #4B2A6B;  /* 水引幕 */
  --paper: #FFFDF6;
  --beni: #D83A4E;      /* 紅 */
  --font-display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  --font-body: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  color-scheme: light;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: #2B1D14;
  color: var(--ai-deep);
  font-family: var(--font-body);
  overflow: hidden;
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
}
#app { position: relative; width: 100%; height: 100%; touch-action: manipulation; }
canvas { display: block; width: 100%; height: 100%; touch-action: none; }

.panel {
  position: absolute; left: 50%; top: 50%;
  transform: translate(-50%, -50%);
  width: min(340px, calc(100% - 32px));
  max-height: calc(100% - 32px); overflow-y: auto;
  background: var(--paper);
  border: 3px solid var(--ai);
  border-radius: 20px;
  box-shadow: 6px 6px 0 var(--ai);
  padding: 22px 20px 20px;
  display: flex; flex-direction: column; align-items: center; gap: 12px;
  text-align: center;
}
.panel h1 {
  margin: 0; font-family: var(--font-display); font-weight: 400;
  font-size: 2.2rem; line-height: 1.15; color: var(--ai);
  text-wrap: balance; letter-spacing: 0.02em;
}
.panel h1 small { display: block; font-size: 0.95rem; color: var(--koromo-dark); letter-spacing: 0.2em; margin-bottom: 4px; }
.panel h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 1.7rem; color: var(--ai); text-wrap: balance; }
.panel p { margin: 0; font-size: 0.95rem; line-height: 1.7; font-weight: 500; }
.how { display: grid; gap: 7px; width: 100%; font-size: 0.88rem; line-height: 1.55; text-align: left; padding: 10px 12px; background: #F3EEE2; border-radius: 12px; }
.how b { color: var(--beni); }
kbd {
  font-family: var(--font-body); font-weight: 800; font-size: 0.78rem;
  border: 2px solid var(--ai); border-bottom-width: 3px; border-radius: 6px; padding: 0 5px; background: #fff;
}
.banzuke { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; font-size: 0.75rem; font-weight: 800; color: var(--koromo-dark); }
.banzuke span { padding: 2px 7px; border-radius: 999px; background: #F3EEE2; }
.banzuke span.done { background: var(--koromo); color: var(--ai-deep); }
.btn {
  font-family: var(--font-display); font-size: 1.3rem; color: var(--ai-deep);
  background: var(--koromo); border: 3px solid var(--ai); border-radius: 999px;
  padding: 10px 34px; box-shadow: 0 5px 0 var(--ai); cursor: pointer;
  transition: transform .08s, box-shadow .08s;
}
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--ai); }
.btn:focus-visible, .sound:focus-visible, .pbtn:focus-visible { outline: 3px solid var(--beni); outline-offset: 3px; }
.kimarite { font-family: var(--font-display); font-size: 1.2rem; color: var(--beni); }
.note { font-size: 0.85rem; font-weight: 800; color: var(--koromo-dark); }

.pad {
  position: absolute; left: 0; right: 0; bottom: 0;
  display: grid; grid-template-columns: 1fr 1.35fr; gap: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-bottom: max(14px, calc(env(safe-area-inset-bottom, 0px) + 10px));
  max-width: 520px; margin: 0 auto;
  pointer-events: none;
}
.pbtn {
  pointer-events: auto; touch-action: none;
  font-family: var(--font-display); font-size: 1.35rem; line-height: 1.1;
  border: 3px solid var(--ai); border-radius: 18px;
  padding: 14px 8px 10px; cursor: pointer;
  box-shadow: 0 6px 0 var(--ai);
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  transition: transform .05s, box-shadow .05s;
}
.pbtn small { font-family: var(--font-body); font-weight: 800; font-size: 0.72rem; opacity: .8; }
.pbtn.guard { background: var(--paper); color: var(--ai); }
.pbtn.push { background: var(--beni); color: var(--paper); }
.pbtn.down { transform: translateY(5px); box-shadow: 0 1px 0 var(--ai); }
.pbtn.guard.down { background: #DCE6F5; }

.sound {
  position: absolute;
  right: max(12px, calc(env(safe-area-inset-right, 0px) + 12px));
  top: max(12px, calc(env(safe-area-inset-top, 0px) + 12px));
  font-family: var(--font-body); font-weight: 800; font-size: 0.8rem;
  background: var(--paper); color: var(--ai); border: 2px solid var(--ai);
  border-radius: 999px; padding: 5px 12px; cursor: pointer;
}
</style>

<div id="app">
  <canvas id="cv"></canvas>

  <div class="panel" id="titlePanel">
    <h1><small>おそうざい場所</small>コロッケ<br>大相撲</h1>
    <div class="how">
      <div><b>つっぱり</b>を連打して、あいてを土俵の外へおし出せ！</div>
      <div>あいての頭に<b>「！」</b>が出たら ぶちかましの合図。<b>ふんばる</b>を押しっぱなしでこらえると、あいてがバテてチャンス。</div>
      <div>立ち合いは、ゲージが<b>まんなか</b>に来た瞬間につっぱり。</div>
      <div>PC：<kbd>スペース</kbd>/<kbd>J</kbd> つっぱり　<kbd>Shift</kbd>/<kbd>F</kbd> ふんばる</div>
    </div>
    <div class="banzuke" id="banzukeTitle"></div>
    <button class="btn" id="startBtn">場所入り</button>
  </div>

  <div class="panel" id="overPanel" hidden>
    <h2 id="overHead">まけ…</h2>
    <div class="kimarite" id="overKimarite"></div>
    <p id="overText"></p>
    <div class="banzuke" id="banzukeOver"></div>
    <div class="note" id="overBest"></div>
    <button class="btn" id="retryBtn">もう一番</button>
  </div>

  <div class="panel" id="winPanel" hidden>
    <h2>全勝優勝！</h2>
    <div class="kimarite">横綱 牛肉コロ富士 を やぶった！</div>
    <p id="winText"></p>
    <div class="note">これできみも 揚げたて横綱。</div>
    <button class="btn" id="againBtn">もう一場所</button>
  </div>

  <div class="pad" id="pad" hidden>
    <button class="pbtn guard" id="guardBtn" type="button">ふんばる<small>押しっぱなし</small></button>
    <button class="pbtn push" id="pushBtn" type="button">つっぱり！<small>れんだ</small></button>
  </div>

  <button class="sound" id="soundBtn" type="button" aria-pressed="true">音：オン</button>
</div>

  // ---------- audio ----------
  let ac = null;
  function audio() {
    if (!soundOn) return null;
    if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch { return null; } }
    if (ac.state === 'suspended') ac.resume();
    return ac;
  }
  function tone(f1, f2, dur, type = 'square', vol = 0.08, delay = 0) {
    const a = audio(); if (!a) return;
    const t = a.currentTime + delay;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(Math.max(30, f2), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + 0.02);
  }
  function noise(dur, vol = 0.12, freq = 900, delay = 0) {
    const a = audio(); if (!a) return;
    const t = a.currentTime + delay;
    const len = Math.max(1, Math.floor(a.sampleRate * dur));
    const buf = a.createBuffer(1, len, a.sampleRate); const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const s = a.createBufferSource(); s.buffer = buf;
    const f = a.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = 0.8;
    const g = a.createGain(); g.gain.value = vol;
    s.connect(f).connect(g).connect(a.destination); s.start(t);
  }

    sprites.player = make(null);

    state = 'intro'; stT = 0;
    p = 0; v = 0; gap = 70; chance = 0; lastBlock = -9; lastHit = -9;
    cpu = { mode: 'push', t: 0, next: 1.6 + Math.random(), tired: 0, phase: Math.random() * TAU };
    result = null; texts = []; taps = []; tachiDone = false; tachiQ = -1;
    pad.hidden = false;
    sfx.taiko(0); sfx.taiko(0.25); sfx.taiko(0.5);
  }

  // ---------- input ----------
  function push() {
    if (state === 'tachiai' && !tachiDone) { doTachiai(); return; }
    if (state !== 'bout') return;
    if (guarding()) return;
    if (time - lastTap < 0.055) return;
    lastTap = time;
    taps.push(time); totalTaps++;
    v += 0.27 * (chance > 0 ? 1.8 : 1);
    armP = 1;
    sfx.slap();
    burst(200 + p * 95, G - 50, 2, '#F2C063');
  }
  function doTachiai() {
    tachiDone = true;
    const d = Math.abs(needle - 0.5);
    tachiQ = d < 0.06 ? 2 : d < 0.15 ? 1 : 0;
    sfx.tachi(tachiQ);
    if (tachiQ === 2) { addText('会心の立ち合い！', '#D83A4E', 30); v = 2.0; shake = 0.6; }
    else if (tachiQ === 1) { addText('いい立ち合い', '#1F3A68', 28); v = 1.0; shake = 0.35; }
    else { addText('出おくれた…', '#7A4210', 28); v = -1.0; shake = 0.35; }
    state = 'bout'; stT = 0;
    setTimeout(() => { if (state === 'bout') addText('のこった！', '#1F3A68', 34, -40); }, 380);
  }

  window.addEventListener('keydown', e => {
    if (e.repeat && !(e.code === 'ShiftLeft' || e.code === 'ShiftRight' || e.code === 'KeyF' || e.code === 'ArrowLeft' || e.code === 'ArrowDown')) {
      if (['Space', 'KeyJ', 'ArrowRight', 'ArrowUp', 'Enter'].includes(e.code)) e.preventDefault();
      return;
    }
    if (['Space', 'KeyJ', 'ArrowRight', 'ArrowUp', 'Enter'].includes(e.code)) {
      e.preventDefault();
      if (state === 'title' && document.activeElement !== $('startBtn')) { startRun(); return; }
      if (state === 'over' && document.activeElement !== $('retryBtn')) { startRun(); return; }
      if (state === 'champion' && document.activeElement !== $('againBtn')) { startRun(); return; }
      push();
    } else if (['ShiftLeft', 'ShiftRight', 'KeyF', 'ArrowLeft', 'ArrowDown'].includes(e.code)) {
      e.preventDefault(); guardKey = true;
    }
  });
  window.addEventListener('keyup', e => {
    if (['ShiftLeft', 'ShiftRight', 'KeyF', 'ArrowLeft', 'ArrowDown'].includes(e.code)) guardKey = false;
  });
  window.addEventListener('blur', () => { guardKey = false; guardTouch = false; guardBtn.classList.remove('down'); });

  pushBtn.addEventListener('pointerdown', e => { e.preventDefault(); pushBtn.classList.add('down'); push(); });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(t => pushBtn.addEventListener(t, () => pushBtn.classList.remove('down')));
  guardBtn.addEventListener('pointerdown', e => {
    e.preventDefault(); guardTouch = true; guardBtn.classList.add('down');
    try { guardBtn.setPointerCapture(e.pointerId); } catch {}
  });
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(t => guardBtn.addEventListener(t, () => { guardTouch = false; guardBtn.classList.remove('down'); }));
  [pushBtn, guardBtn].forEach(b => { b.addEventListener('contextmenu', e => e.preventDefault()); b.addEventListener('click', e => e.preventDefault()); });
  cv.addEventListener('pointerdown', e => { e.preventDefault(); push(); });

  $('startBtn').addEventListener('click', startRun);
  $('retryBtn').addEventListener('click', startRun);
  $('againBtn').addEventListener('click', startRun);

  // ---------- update ----------
  function endBout(win) {
    state = 'result'; stT = 0;
    const o = OPP[stage];
    let kim;
    if (win) {
      const recent = taps.filter(t => time - t < 1).length;
      kim = (chance > 0 || time - lastBlock < 2.5) ? '寄り切り' : recent >= 7 ? '突き出し' : '押し出し';
    } else {
      kim = time - lastHit < 1 ? '押し倒し' : '押し出し';
    }
    const cx = 200 + Math.max(-1, Math.min(1, p)) * 95;
    result = { win, kimarite: kim, dx: 0, dy: 0, rot: 0, vx: win ? 170 : -170, vy: 0, cx };
    shake = 0.5;
    sfx.thud();
    if (win) { sfx.win(); addText(kim + '！', '#D83A4E', 40, -10); }
    else { sfx.lose(); addText(kim, '#1F3A68', 40, -10); }
    pad.hidden = true;
    guardTouch = false; guardBtn.classList.remove('down');
  }

  function afterResult() {
    if (result.win) {
      const wins = stage + 1;
      if (wins > bestWins) { bestWins = wins; store.set('korokke-sumo-best', bestWins); }
      if (wins >= OPP.length) {
        state = 'champion';
        const sec = Math.round(time - runStart);
        $('winText').textContent = `5連勝。つっぱり ${totalTaps}発、${sec}秒の場所でした。`;
        winPanel.hidden = false;
        return;
      }
      stage = wins;
      startBout();
    } else {
      state = 'over';
      const o = OPP[stage];
      $('overHead').textContent = `${o.rank} ${o.name} に まけ…`;
      $('overKimarite').textContent = `決まり手：${result.kimarite}`;
      $('overText').textContent = stage === 0 ? 'まずは立ち合いと連打で、じゃがいも丸をおし出そう。' : `${stage}連勝で ${OPP[stage - 1].rank}まで やぶったよ。`;
      $('overBest').textContent = bestWins >= OPP.length ? 'ベスト：全勝優勝' : `ベスト：${bestWins}連勝`;
      renderBanzuke($('banzukeOver'), stage);
      overPanel.hidden = false;
    }
  }

  function update(dt) {
    time += dt; stT += dt;
    blinkT -= dt; if (blinkT < 0) { blink = 0.12; blinkT = 2 + Math.random() * 3; }
    blink = Math.max(0, blink - dt);
    shake = Math.max(0, shake - dt * 2.2);
    armP = Math.max(0, armP - dt * 7);
    armO = Math.max(0, armO - dt * 4);
    for (const t of texts) { t.life -= dt * 0.8; t.y -= dt * 22; }
    texts = texts.filter(t => t.life > 0);
    for (const q of particles) { q.life -= dt; q.x += q.vx * dt; q.y += q.vy * dt; q.vy += 400 * dt; }
    particles = particles.filter(q => q.life > 0);
    taps = taps.filter(t => time - t < 1.2);

    const o = OPP[stage];
    if (state === 'title') {
      // little demo: they lean back and forth
      p = Math.sin(time * 0.9) * 0.25; gap = 0;
      if (Math.random() < dt * 6) { armP = 1; }
      if (Math.random() < dt * 5) { armO = 1; }
    } else if (state === 'intro') {
      gap = 70;
      if (stT > 2.1) { state = 'tachiai'; stT = 0; needle = 0; }
    } else if (state === 'tachiai') {
      gap = 70;
      needle = 0.5 - 0.5 * Math.cos(stT * o.tach * Math.PI);
      if (stT > 4.2 && !tachiDone) doTachiai();
    } else if (state === 'bout') {
      gap = Math.max(0, gap - dt * 700);
      if (gap === 0 && stT < 0.12) burst(200 + p * 95, G - 50, 1, '#fff');
      chance = Math.max(0, chance - dt);
      cpu.tired = Math.max(0, cpu.tired - dt);
      // CPU push
      let rate = o.rate * (1 + 0.35 * Math.sin(time * 1.7 + cpu.phase));
      if (cpu.tired > 0) rate *= 0.25;
      if (guarding()) rate *= 0.3;
      if (cpu.mode === 'warn') rate = 0;
      if (gap === 0) p -= rate * dt;
      if (gap === 0 && cpu.mode === 'push' && cpu.tired <= 0 && Math.random() < dt * (3 + stage)) armO = 1;
      // CPU ぶちかまし
      cpu.t += dt;
      if (cpu.mode === 'push' && cpu.tired <= 0 && cpu.t > cpu.next) {
        cpu.mode = 'warn'; cpu.t = 0; sfx.warn();
      } else if (cpu.mode === 'warn' && cpu.t > o.warn) {
        cpu.mode = 'push'; cpu.t = 0;
        cpu.next = o.gap[0] + Math.random() * (o.gap[1] - o.gap[0]);
        armO = 1;
        if (guarding()) {
          cpu.tired = 1.6; chance = 1.6; lastBlock = time;
          addText('こらえた！ チャンス！', '#1F3A68', 28);
          sfx.block(); shake = 0.3;
          burst(200 + p * 95, G - 50, 10, '#9CC3FF');
        } else {
          v -= 1.7; lastHit = time;
          addText('ドスン！', '#D83A4E', 34);
          sfx.thud(); shake = 0.8;
          burst(200 + p * 95, G - 50, 12, '#F2C063');
        }
      }
      if (gap === 0) { v *= Math.exp(-6 * dt); p += v * dt; }
      if (p >= 1) endBout(true);
      else if (p <= -1) endBout(false);
    } else if (state === 'result') {
      const r = result;
      r.dx += r.vx * dt;
      const loserX = r.cx + (r.win ? 56 : -56) + r.dx;
      if (loserX < 24 || loserX > 376) { r.vy += 900 * dt; r.rot += dt * 4 * Math.sign(r.vx); }
      r.vx *= Math.exp(-0.8 * dt);
      r.dy += r.vy * dt;
      if (r.dy > 150) { r.dy = 150; r.vy = 0; r.vx *= 0.9; }
      if (stT > 2.4) afterResult();
    }
  }

  // ---------- drawing ----------
  function roundRect(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h); }

  function face(x, y, s, mood) {
    ctx.save(); ctx.translate(x, y);
    ctx.fillStyle = '#2A1A0E'; ctx.strokeStyle = '#2A1A0E'; ctx.lineCap = 'round';
    if (mood === 'hurt' || mood === 'dizzy') {
      ctx.lineWidth = 2.4 * s;
      [-1, 1].forEach(d => {
        if (mood === 'dizzy') { ctx.beginPath(); ctx.arc(d * 12 * s, -2 * s, 4 * s, 0, TAU * 0.8); ctx.stroke(); }
        else {
          ctx.beginPath(); ctx.moveTo(d * 12 * s - 4 * s, -6 * s); ctx.lineTo(d * 12 * s + 4 * s, 2 * s);
          ctx.moveTo(d * 12 * s + 4 * s, -6 * s); ctx.lineTo(d * 12 * s - 4 * s, 2 * s); ctx.stroke();
        }
      });
    } else if (mood === 'happy') {
      ctx.lineWidth = 2.4 * s;
      [-1, 1].forEach(d => { ctx.beginPath(); ctx.arc(d * 12 * s, 0, 4.5 * s, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke(); });
    } else if (blink > 0 && mood === 'idle') {
      ctx.lineWidth = 2.4 * s;
      [-1, 1].forEach(d => { ctx.beginPath(); ctx.moveTo(d * 12 * s - 4 * s, -2 * s); ctx.lineTo(d * 12 * s + 4 * s, -2 * s); ctx.stroke(); });
    } else {
      [-1, 1].forEach(d => {
        ctx.fillStyle = '#2A1A0E'; ctx.beginPath(); ctx.ellipse(d * 12 * s, -2 * s, 4 * s, 5 * s, 0, 0, TAU); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(d * 12 * s + 1.3 * s, -4 * s, 1.6 * s, 0, TAU); ctx.fill();
      });
      if (mood === 'push' || mood === 'angry') {
        ctx.lineWidth = 2.6 * s;
        [-1, 1].forEach(d => { ctx.beginPath(); ctx.moveTo(d * 18 * s, -12 * s); ctx.lineTo(d * 7 * s, -9 * s); ctx.stroke(); });
      }
    }
    ctx.fillStyle = 'rgba(240,110,120,0.55)';
    [-1, 1].forEach(d => { ctx.beginPath(); ctx.ellipse(d * 22 * s, 7 * s, 6 * s, 3.5 * s, 0, 0, TAU); ctx.fill(); });
    ctx.strokeStyle = '#2A1A0E'; ctx.fillStyle = '#C2414F'; ctx.lineWidth = 2.2 * s;
    if (mood === 'hurt' || mood === 'push' || mood === 'dizzy') {
      ctx.beginPath(); ctx.ellipse(0, 9 * s, 4.5 * s, 4 * s, 0, 0, TAU); ctx.fill(); ctx.stroke();
    } else if (mood === 'angry') {
      ctx.beginPath(); ctx.moveTo(-5 * s, 9 * s); ctx.lineTo(5 * s, 9 * s); ctx.stroke();
    } else {
      ctx.beginPath(); ctx.arc(-3 * s, 5 * s, 3 * s, 0.1, Math.PI - 0.1); ctx.stroke();
      ctx.beginPath(); ctx.arc(3 * s, 5 * s, 3 * s, 0.1, Math.PI - 0.1); ctx.stroke();
    }
    ctx.restore();
  }

  // dir: +1 faces right (player), -1 faces left (opponent)
  function drawFighter(x, y0, rot, dir, sprite, belt, mood, arm, opts = {}) {
    const rw = 132, rh = rw * IMG_H / IMG_W, ry = rh / 2;
    const crouch = opts.crouch || 0;
    // shadow
    if (y0 < 30) {
      ctx.fillStyle = 'rgba(60,30,10,0.25)';
      ctx.beginPath(); ctx.ellipse(x, G + 2, 50, 6, 0, 0, TAU); ctx.fill();
    }
    ctx.save();
    ctx.translate(x, G + y0);
    ctx.rotate(rot);
    // legs (wide sumo stance)
    ctx.strokeStyle = '#7A4210'; ctx.lineWidth = 8; ctx.lineCap = 'round';
    [-1, 1].forEach(d => {
      ctx.beginPath(); ctx.moveTo(d * 20, -16 + crouch * 4); ctx.lineTo(d * 32, -3); ctx.stroke();
      ctx.fillStyle = '#5B300B'; ctx.beginPath(); ctx.ellipse(d * 34, -3, 8, 4, 0, 0, TAU); ctx.fill();
    });
    const lean = (opts.lean || 0) * dir;
    ctx.translate(0, -16 - ry + 6 + crouch * 6);
    ctx.rotate(lean);
    ctx.scale(1 + crouch * 0.06, 1 - crouch * 0.08);
    // back arm
    ctx.strokeStyle = '#7A4210'; ctx.lineWidth = 7;
    const a2 = Math.max(0, 0.6 - arm) ;
    ctx.beginPath(); ctx.moveTo(dir * 56, 10); ctx.quadraticCurveTo(dir * 72, 14, dir * (74 + a2 * 18), 6); ctx.stroke();
    ctx.fillStyle = '#C47A22'; ctx.beginPath(); ctx.arc(dir * (74 + a2 * 18), 6, 6, 0, TAU); ctx.fill();
    // body
    const spr = sprite;
    if (spr) ctx.drawImage(spr, -rw / 2, -ry, rw, rh);
    else { ctx.fillStyle = '#E39A3A'; ctx.beginPath(); ctx.ellipse(0, 0, rw / 2, ry, 0, 0, TAU); ctx.fill(); }
    // まげ (topknot)
    ctx.fillStyle = '#22160E';
    ctx.beginPath(); ctx.ellipse(-dir * 4, -ry + 2, 15, 6, 0, Math.PI, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(-dir * 2, -ry - 6, 11, 4.5, -dir * 0.15, 0, TAU); ctx.fill();
    ctx.fillStyle = '#F4F1E8'; ctx.fillRect(-dir * 4 - 2, -ry - 4, 4, 4);
    // まわし
    ctx.save();
    ctx.beginPath(); ctx.ellipse(0, 0, rw / 2 - 2, ry - 2, 0, 0, TAU); ctx.clip();
    ctx.fillStyle = belt;
    ctx.fillRect(-rw / 2, ry * 0.32, rw, ry * 0.42);
    ctx.fillStyle = 'rgba(0,0,0,0.18)'; ctx.fillRect(-rw / 2, ry * 0.32 + ry * 0.34, rw, ry * 0.08);
    ctx.restore();
    if (opts.tsuna) {
      // 綱 with しで
      ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 7;
      ctx.beginPath(); ctx.ellipse(0, ry * 0.2, rw / 2 - 4, ry * 0.22, 0, 0.05, Math.PI - 0.05); ctx.stroke();
      ctx.strokeStyle = '#BFB8A6'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.ellipse(0, ry * 0.2, rw / 2 - 4, ry * 0.22, 0, 0.05, Math.PI - 0.05); ctx.stroke();
      ctx.fillStyle = '#FFFFFF'; ctx.strokeStyle = '#BFB8A6'; ctx.lineWidth = 1;
      [-22, 0, 22].forEach(sx => {
        ctx.beginPath(); ctx.moveTo(sx - 4, ry * 0.42); ctx.lineTo(sx + 4, ry * 0.42); ctx.lineTo(sx, ry * 0.42 + 7);
        ctx.lineTo(sx + 5, ry * 0.42 + 7); ctx.lineTo(sx + 1, ry * 0.42 + 14); ctx.lineTo(sx - 5, ry * 0.42 + 14); ctx.closePath(); ctx.fill(); ctx.stroke();
      });
    } else {
      // さがり
      ctx.strokeStyle = belt; ctx.lineWidth = 2.4;
      for (let i = -2; i <= 2; i++) { ctx.beginPath(); ctx.moveTo(dir * 8 + i * 5, ry * 0.7); ctx.lineTo(dir * 8 + i * 5.5, ry * 0.7 + 12); ctx.stroke(); }
    }
    // front arm (つっぱり)
    ctx.strokeStyle = '#7A4210'; ctx.lineWidth = 7;
    const ext = arm * 22;
    ctx.beginPath(); ctx.moveTo(dir * 54, -6); ctx.quadraticCurveTo(dir * 68, -12, dir * (72 + ext), -8); ctx.stroke();
    ctx.fillStyle = '#C47A22'; ctx.beginPath(); ctx.ellipse(dir * (74 + ext), -8, 7, 8, 0, 0, TAU); ctx.fill();
    face(dir * 16, -8, 0.95, mood);
    if (opts.warn) {
      // red glow + ！
      ctx.globalAlpha = 0.25 + 0.2 * Math.sin(time * 30);
      ctx.fillStyle = '#FF3040'; ctx.beginPath(); ctx.ellipse(0, 0, rw / 2, ry, 0, 0, TAU); ctx.fill();
      ctx.globalAlpha = 1;
    }
    ctx.restore();
    if (opts.warn) {
      const by = G - 130 - Math.abs(Math.sin(time * 14)) * 6;
      ctx.save();
      ctx.font = `46px ${FD}`; ctx.textAlign = 'center';
      ctx.lineWidth = 8; ctx.strokeStyle = '#FFFDF6'; ctx.fillStyle = '#D83A4E';
      ctx.strokeText('！', x, by); ctx.fillText('！', x, by);
      ctx.restore();
    }
    if (opts.sweat) {
      ctx.fillStyle = '#9CC3FF';
      for (let i = 0; i < 3; i++) {
        const t = (time * 1.5 + i / 3) % 1;
        ctx.globalAlpha = 1 - t;
        ctx.beginPath(); ctx.ellipse(x - dir * (40 + i * 8), G - 100 + t * 30, 3, 5, 0, 0, TAU); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
  }

  function drawBackground() {
    // 館内
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#3A2618'); g.addColorStop(0.55, '#5A3C25'); g.addColorStop(1, '#2B1D14');
    ctx.fillStyle = g; ctx.fillRect(-600, -400, W + 1200, H + 800);
    // spotlight
    const sp = ctx.createRadialGradient(200, 330, 40, 200, 330, 300);
    sp.addColorStop(0, 'rgba(255,230,180,0.35)'); sp.addColorStop(1, 'rgba(255,230,180,0)');
    ctx.fillStyle = sp; ctx.fillRect(-600, 0, W + 1200, H);
    // 観客 silhouettes
    ctx.fillStyle = 'rgba(20,12,8,0.55)';
    for (let row = 0; row < 2; row++) {
      for (let i = -12; i < 32; i++) {
        const x = i * 22 + row * 11, y = 300 + row * 34 + Math.sin(i * 1.7 + row) * 3;
        ctx.beginPath(); ctx.arc(x, y, 9, 0, TAU); ctx.fill();
        ctx.fillRect(x - 11, y + 6, 22, 30);
      }
    }
    // 吊り屋根 + 水引幕
    ctx.fillStyle = '#2A1A10'; ctx.fillRect(-600, -400, W + 1200, 442);
    ctx.fillStyle = '#4B2A6B'; ctx.fillRect(-600, 42, W + 1200, 46);
    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    for (let x = -600; x < W + 600; x += 60) { ctx.beginPath(); ctx.moveTo(x, 88); ctx.quadraticCurveTo(x + 30, 100, x + 60, 88); ctx.lineTo(x + 60, 88); ctx.fill(); }
    ctx.fillStyle = '#4B2A6B';
    for (let x = -600; x < W + 600; x += 60) { ctx.beginPath(); ctx.moveTo(x, 86); ctx.quadraticCurveTo(x + 30, 104, x + 60, 86); ctx.fill(); }
    ctx.fillStyle = '#E8C46A'; ctx.fillRect(-600, 40, W + 1200, 4);
    // 房 (blue / red tassels at the visible corners)
    const fusa = (x, c) => {
      ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, 104, 9, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.moveTo(x - 9, 106); ctx.lineTo(x + 9, 106); ctx.lineTo(x + 12, 146); ctx.lineTo(x - 12, 146); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.2)'; ctx.lineWidth = 1;
      for (let i = -8; i <= 8; i += 4) { ctx.beginPath(); ctx.moveTo(x + i * 0.8, 110); ctx.lineTo(x + i, 145); ctx.stroke(); }
    };
    fusa(28, '#2F6FB5'); fusa(372, '#D83A4E');
  }

  function drawDohyo() {
    // body of the dohyo (clay mound) — trapezoid
    ctx.fillStyle = '#9C7246';
    ctx.beginPath(); ctx.moveTo(-10, G + 4); ctx.lineTo(410, G + 4); ctx.lineTo(470, H + 60); ctx.lineTo(-70, H + 60); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#B48A5A';
    ctx.beginPath(); ctx.moveTo(-10, G + 4); ctx.lineTo(410, G + 4); ctx.lineTo(422, G + 30); ctx.lineTo(-22, G + 30); ctx.closePath(); ctx.fill();
    // 俵 along the edge
    ctx.fillStyle = '#D9C27E'; ctx.strokeStyle = '#A88E4A'; ctx.lineWidth = 1.5;
    for (let x = -14; x < 420; x += 26) { roundRect(x, G + 30, 24, 12, 6); ctx.fill(); ctx.stroke(); }
    // surface
    ctx.fillStyle = '#D8B582';
    ctx.fillRect(-10, G - 2, 420, 8);
    // 徳俵 / ring edge markers (where you lose)
    ctx.fillStyle = '#E2CB8A'; ctx.strokeStyle = '#A88E4A';
    [44, 356].forEach(x => { roundRect(x - 10, G - 8, 20, 10, 5); ctx.fill(); ctx.stroke(); });
    // 仕切り線
    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(168, G - 1, 14, 3); ctx.fillRect(218, G - 1, 14, 3);
  }

  function drawGauge() {
    // 押し合いゲージ (top)
    const y = 168, x0 = 44, x1 = 356;
    ctx.save();
    ctx.fillStyle = 'rgba(20,12,8,0.55)'; roundRect(x0 - 8, y - 12, x1 - x0 + 16, 24, 12); ctx.fill();
    const mid = (x0 + x1) / 2;
    const gl = ctx.createLinearGradient(x0, 0, x1, 0);
    gl.addColorStop(0, '#D83A4E'); gl.addColorStop(0.5, '#F4E8CC'); gl.addColorStop(1, '#2F6FB5');
    ctx.fillStyle = gl; roundRect(x0, y - 5, x1 - x0, 10, 5); ctx.fill();
    const mx = mid + Math.max(-1, Math.min(1, p)) * (x1 - x0) / 2;
    ctx.fillStyle = '#E8A53E'; ctx.strokeStyle = '#2A1A0E'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(mx, y, 11, 8, 0, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.font = `800 11px ${FB}`; ctx.fillStyle = '#F4E8CC'; ctx.textAlign = 'left';
    ctx.fillText('ピンチ', x0, y + 26); ctx.textAlign = 'right'; ctx.fillText('かち', x1, y + 26);
    ctx.restore();
  }

  function drawTachiai() {
    const o = OPP[stage];
    const y = 250, x0 = 70, x1 = 330;
    ctx.save();
    ctx.fillStyle = 'rgba(255,253,246,0.94)'; ctx.strokeStyle = '#1F3A68'; ctx.lineWidth = 3;
    roundRect(x0 - 20, y - 46, x1 - x0 + 40, 84, 16); ctx.fill(); ctx.stroke();
    ctx.textAlign = 'center'; ctx.font = `20px ${FD}`; ctx.fillStyle = '#1F3A68';
    ctx.fillText(stT < 0.35 ? '手をついて…' : 'まんなかで つっぱり！', 200, y - 18);
    ctx.fillStyle = '#E9DFC8'; roundRect(x0, y, x1 - x0, 16, 8); ctx.fill();
    const w = x1 - x0;
    ctx.fillStyle = '#F2C063'; ctx.fillRect(x0 + w * (0.5 - 0.15), y, w * 0.30, 16);
    ctx.fillStyle = '#D83A4E'; ctx.fillRect(x0 + w * (0.5 - 0.06), y, w * 0.12, 16);
    const nx = x0 + w * needle;
    ctx.fillStyle = '#1F3A68';
    ctx.beginPath(); ctx.moveTo(nx, y + 18); ctx.lineTo(nx - 8, y + 30); ctx.lineTo(nx + 8, y + 30); ctx.closePath(); ctx.fill();
    ctx.fillRect(nx - 2, y - 4, 4, 22);
    ctx.restore();
  }

  function drawHUD() {
    const o = OPP[stage];
    ctx.save();
    ctx.textAlign = 'center';
    if (state !== 'title' && state !== 'over' && state !== 'champion') {
      // 取組 header
      ctx.font = `800 12px ${FB}`; ctx.fillStyle = '#E8C46A';
      ctx.fillText(`${stage + 1}番目の取組　${o.rank}`, 200, 122);
      ctx.font = `18px ${FD}`;
      ctx.textAlign = 'left'; ctx.fillStyle = '#9CC3FF'; ctx.fillText(PLAYER.name, 30, 146);
      ctx.textAlign = 'right'; ctx.fillStyle = '#FFB3BC'; ctx.fillText(o.name, 370, 146);
      ctx.textAlign = 'center'; ctx.fillStyle = '#F4E8CC'; ctx.font = `800 12px ${FB}`; ctx.fillText('対', 200, 145);
      drawGauge();
      if (state === 'bout') {
        let msg = '', col = '#F4E8CC';
        if (chance > 0) { msg = 'チャンス！ 連打でおしこめ！'; col = '#F2C063'; }
        else if (cpu.mode === 'warn') { msg = 'ぶちかましが来る！ ふんばれ！'; col = '#FF8A96'; }
        else if (p < -0.65) { msg = 'ピンチ！ 連打でこらえろ！'; col = '#FF8A96'; }
        if (msg) {
          ctx.font = `800 15px ${FB}`; ctx.fillStyle = col;
          ctx.fillText(msg, 200, 222);
        }
      }
    }
    if (state === 'intro') {
      ctx.fillStyle = 'rgba(255,253,246,0.95)'; ctx.strokeStyle = '#1F3A68'; ctx.lineWidth = 3;
      roundRect(60, 222, 280, 74, 16); ctx.fill(); ctx.stroke();
      ctx.font = `800 13px ${FB}`; ctx.fillStyle = '#7A4210';
      ctx.fillText(stT < 1 ? 'ひがし〜' : 'にし〜', 200, 246);
      ctx.font = `26px ${FD}`; ctx.fillStyle = stT < 1 ? '#1F3A68' : '#D83A4E';
      ctx.fillText(stT < 1 ? `${PLAYER.name}〜` : `${o.name}〜`, 200, 280);
    }
    if (state === 'tachiai' && !tachiDone) drawTachiai();

    for (const t of texts) {
      ctx.globalAlpha = Math.min(1, t.life * 2);
      ctx.font = `${t.size}px ${FD}`;
      ctx.lineWidth = 7; ctx.strokeStyle = '#2A1A0E'; ctx.fillStyle = t.color === '#1F3A68' ? '#9CC3FF' : t.color === '#7A4210' ? '#F2C063' : '#FF6B7D';
      ctx.strokeText(t.str, 200, 280 + t.y); ctx.fillText(t.str, 200, 280 + t.y);
    }
    ctx.globalAlpha = 1;

    // 軍配 on result
    if (state === 'result' && stT > 0.3) {
      const left = result.win;
      ctx.save(); ctx.translate(200, 92 + 0); ctx.rotate(left ? -0.5 : 0.5);
      ctx.fillStyle = '#7A4210'; ctx.fillRect(-3, 0, 6, 30);
      ctx.fillStyle = '#1A1A1A'; ctx.beginPath(); ctx.ellipse(0, -10, 18, 15, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = '#E8C46A'; ctx.beginPath(); ctx.ellipse(0, -10, 13, 10, 0, 0, TAU); ctx.fill();
      ctx.restore();
    }
    ctx.restore();
  }

  function drawFighters() {
    const o = OPP[stage];
    const sprO = sprites.opp[stage] || null, sprP = sprites.player;
    const cp = Math.max(-1.05, Math.min(1.05, p));
    const cx = 200 + cp * 95;
    let px = cx - 56 - gap, qx = cx + 56 + gap;
    let pRot = 0, qRot = 0, pY = 0, qY = 0;
    let pMood = 'idle', qMood = 'idle';
    let pLean = 0, qLean = 0, pCrouch = 0, qCrouch = 0;
    if (state === 'intro' || (state === 'tachiai' && !tachiDone)) {
      pCrouch = qCrouch = state === 'tachiai' ? 1 : 0.3;
      pLean = qLean = state === 'tachiai' ? 0.25 : 0;
      pMood = qMood = state === 'tachiai' ? 'angry' : 'idle';
    } else if (state === 'bout' || state === 'title') {
      pLean = qLean = 0.18;
      pMood = guarding() ? 'angry' : (armP > 0.3 ? 'push' : (chance > 0 ? 'happy' : 'angry'));
      if (p < -0.7) pMood = 'push';
      if (state === 'bout' && time - lastHit < 0.6) pMood = 'hurt';
      qMood = cpu.tired > 0 ? 'dizzy' : cpu.mode === 'warn' ? 'angry' : (armO > 0.3 ? 'push' : 'angry');
      if (state === 'title') { pMood = armP > 0.3 ? 'push' : 'idle'; qMood = armO > 0.3 ? 'push' : 'idle'; }
      if (guarding() && state === 'bout') pCrouch = 0.8;
      if (cpu.mode === 'warn' && state === 'bout') { qCrouch = 0.6; qx += 10 * Math.min(1, cpu.t / 0.2); }
    } else if (state === 'result' || state === 'over' || state === 'champion') {
      const r = result;
      if (r) {
        const lx = r.cx + (r.win ? 56 : -56) + r.dx;
        if (r.win) { qx = lx; qY = r.dy; qRot = r.rot; qMood = 'hurt'; pMood = 'happy'; px = r.cx - 56; pY = -Math.abs(Math.sin(stT * 8)) * 8 * Math.max(0, 1 - stT / 2); }
        else { px = lx; pY = r.dy; pRot = r.rot; pMood = 'hurt'; qMood = 'happy'; qx = r.cx + 56; qY = -Math.abs(Math.sin(stT * 8)) * 8 * Math.max(0, 1 - stT / 2); }
      }
    }
    const bout = state === 'bout';
    // draw the one further back first: opponent behind player on overlap looks fine either way
    drawFighter(qx, qY, qRot, -1, sprO, o.belt, qMood, armO, { lean: qLean, crouch: qCrouch, tsuna: o.tsuna, warn: bout && cpu.mode === 'warn', sweat: bout && cpu.tired > 0 });
    drawFighter(px, pY, pRot, 1, sprP, PLAYER.belt, pMood, armP, { lean: pLean, crouch: pCrouch, sweat: bout && p < -0.65 });
  }

  function drawParticles() {
    for (const q of particles) {
      ctx.globalAlpha = Math.min(1, q.life * 2);
      ctx.fillStyle = q.color; ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function draw() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = '#2B1D14'; ctx.fillRect(0, 0, cw, ch);
    let sx = 0, sy = 0;
    if (shake > 0) { sx = (Math.random() - 0.5) * 12 * shake; sy = (Math.random() - 0.5) * 12 * shake; }
    ctx.translate(ox + sx, oy + sy);
    ctx.scale(scale, scale);
    drawBackground();
    drawDohyo();
    drawFighters();
    drawParticles();
    drawHUD();
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
