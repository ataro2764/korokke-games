<title>コロッケメガネ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
/* Layout: one-screen tap game. Canvas = コロッケ商店街 (side view, 3 lanes of passersby). DOM panels float on top. */
:root {
  --ai: #1F3A68;
  --ai-deep: #142849;
  --koromo: #E8A53E;
  --koromo-dark: #7A4210;
  --paper: #FFFDF6;
  --beni: #D83A4E;
  --font-display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  --font-body: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  color-scheme: light;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  background: #2B1D14;
  color: var(--ai-deep);
  font-family: var(--font-body);
  overflow: hidden;
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
}
#app { position: relative; width: 100%; height: 100%; touch-action: manipulation; }
canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }

.panel {
  position: absolute; left: 50%; top: 50%;
  transform: translate(-50%, -50%);
  width: min(350px, calc(100% - 32px));
  max-height: calc(100% - 32px); overflow-y: auto;
  box-sizing: border-box;
  background: var(--paper);
  border: 3px solid var(--ai);
  border-radius: 20px;
  box-shadow: 6px 6px 0 var(--ai);
  padding: 22px 18px 20px;
  display: flex; flex-direction: column; align-items: center; gap: 12px;
  text-align: center;
}
.panel h1 {
  margin: 0; font-family: var(--font-display); font-weight: 400;
  font-size: 2.3rem; line-height: 1.15; color: var(--ai);
  letter-spacing: 0.02em;
}
.panel h1 small { display: block; font-size: 0.95rem; color: var(--koromo-dark); letter-spacing: 0.15em; margin-bottom: 4px; }
.panel h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 1.8rem; color: var(--ai); }
.panel p { margin: 0; font-size: 0.95rem; line-height: 1.7; font-weight: 500; }
.how { display: grid; gap: 6px; width: 100%; box-sizing: border-box; font-size: 0.86rem; line-height: 1.55; text-align: left; padding: 10px 12px; background: #F3EEE2; border-radius: 12px; }
.how b { color: var(--beni); }
.diff { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; }
.diff button {
  font-family: var(--font-display); font-size: 1.05rem; color: var(--ai);
  background: #fff; border: 3px solid var(--ai); border-radius: 14px;
  padding: 8px 4px 6px; cursor: pointer; line-height: 1.2;
}
.diff button small { display: block; font-family: var(--font-body); font-weight: 800; font-size: 0.7rem; color: var(--koromo-dark); margin-top: 2px; }
.diff button[aria-pressed="true"] { background: var(--koromo); color: var(--ai-deep); box-shadow: inset 0 -4px 0 rgba(0,0,0,.15); }
.diff button[aria-pressed="true"] small { color: var(--ai-deep); }
.diff button.oni[aria-pressed="true"] { background: var(--beni); color: var(--paper); }
.diff button.oni[aria-pressed="true"] small { color: var(--paper); }
.diffnote { font-size: 0.82rem; font-weight: 800; color: var(--koromo-dark); min-height: 2.6em; line-height: 1.5; }
.btn {
  font-family: var(--font-display); font-size: 1.3rem; color: var(--ai-deep);
  background: var(--koromo); border: 3px solid var(--ai); border-radius: 999px;
  padding: 10px 34px; box-shadow: 0 5px 0 var(--ai); cursor: pointer;
  transition: transform .08s, box-shadow .08s;
}
.btn.sub { background: #fff; font-size: 1rem; padding: 7px 22px; box-shadow: 0 4px 0 var(--ai); }
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--ai); }
.btn:focus-visible, .sound:focus-visible, .diff button:focus-visible { outline: 3px solid var(--beni); outline-offset: 3px; }
.stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; width: 100%; }
.stats div { background: #F3EEE2; border-radius: 12px; padding: 6px 2px; font-size: 0.72rem; font-weight: 800; color: var(--koromo-dark); }
.stats b { display: block; font-family: var(--font-display); font-weight: 400; font-size: 1.4rem; color: var(--ai); }
.rank { font-family: var(--font-display); font-size: 1.2rem; color: var(--beni); }
.newrec { font-size: 0.9rem; font-weight: 800; color: var(--paper); background: var(--beni); border-radius: 999px; padding: 2px 12px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }

.sound {
  position: absolute;
  right: max(12px, calc(env(safe-area-inset-right, 0px) + 12px));
  bottom: max(12px, calc(env(safe-area-inset-bottom, 0px) + 12px));
  font-family: var(--font-body); font-weight: 800; font-size: 0.8rem;
  background: var(--paper); color: var(--ai); border: 2px solid var(--ai);
  border-radius: 999px; padding: 5px 12px; cursor: pointer;
}
.quit {
  position: absolute;
  left: max(12px, calc(env(safe-area-inset-left, 0px) + 12px));
  bottom: max(12px, calc(env(safe-area-inset-bottom, 0px) + 12px));
  font-family: var(--font-body); font-weight: 800; font-size: 0.8rem;
  background: var(--paper); color: var(--ai); border: 2px solid var(--ai);
  border-radius: 999px; padding: 5px 12px; cursor: pointer;
}
</style>

<div id="app">
  <canvas id="cv"></canvas>

  <div class="panel" id="titlePanel">
    <h1><small>まちのみんなに</small>コロッケ<br>メガネ</h1>
    <div class="how">
      <div>通る人の<b>かお</b>をタップすると、コロッケメガネが飛んでいくよ。</div>
      <div>メガネは少しおくれてとどくので、歩く<b>先</b>をねらおう。</div>
      <div>こども・ランナー・いぬは<b>高得点</b>。金ぴかの<b>コロッケ王</b>は+10点＆時間ものびる！</div>
      <div><b>メガネの人</b>と<b>しんぶんで顔がかくれた人</b>には、かけられないよ。</div>
    </div>
    <div class="diff" id="diffBox">
      <button type="button" data-d="easy">かんたん<small>じどうでねらう</small></button>
      <button type="button" data-d="normal">ふつう<small>先をねらう</small></button>
      <button type="button" data-d="hard">むずかしい<small>はずすと−1びょう</small></button>
      <button type="button" data-d="oni" class="oni">おに<small>はやい・ふりむく</small></button>
    </div>
    <div class="diffnote" id="diffNote"></div>
    <button class="btn" id="startBtn" type="button">スタート</button>
  </div>

  <div class="panel" id="overPanel" hidden>
    <h2>おしまい！</h2>
    <div class="rank" id="rankText"></div>
    <div class="stats">
      <div>とくてん<b id="sScore">0</b></div>
      <div>かけた人<b id="sHits">0</b></div>
      <div>さいだいコンボ<b id="sCombo">0</b></div>
    </div>
    <div class="newrec" id="newRec" hidden>じこベスト こうしん！</div>
    <p id="bestText"></p>
    <div class="row">
      <button class="btn" id="againBtn" type="button">もういちど</button>
      <button class="btn sub" id="titleBtn" type="button">むずかしさをかえる</button>
    </div>
  </div>

  <button class="quit" id="quitBtn" type="button" hidden>やめる</button>
  <button class="sound" id="soundBtn" type="button" aria-pressed="true">音：オン</button>
</div>

    const h = w * IMG_H / IMG_W;
    ctx.save(); ctx.translate(x, y); if (rot) ctx.rotate(rot);
    if (croReady) ctx.drawImage(gold && croGold ? croGold : croImg, -w / 2, -h / 2, w, h);
    else { ctx.fillStyle = gold ? '#F5C842' : '#C98A2E'; ctx.beginPath(); ctx.ellipse(0, 0, w / 2, h / 2, 0, 0, TAU); ctx.fill(); }
    ctx.restore();
  }
  // croquette glasses: centered between the eyes, lensW = width of one lens
  function drawGlasses(x, y, lensW, gold, rot = 0, gap = null) {
    const g = gap == null ? lensW * 0.52 : gap;
    const lh = lensW * 0.62;
    ctx.save(); ctx.translate(x, y); if (rot) ctx.rotate(rot);
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#6B3A10'; ctx.lineWidth = Math.max(1.5, lensW * 0.1);
    ctx.beginPath(); ctx.moveTo(-g - lensW * 0.5, -lh * 0.1); ctx.lineTo(-g - lensW * 0.85, -lh * 0.25); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(g + lensW * 0.5, -lh * 0.1); ctx.lineTo(g + lensW * 0.85, -lh * 0.25); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-g + lensW * 0.4, -lh * 0.12); ctx.quadraticCurveTo(0, -lh * 0.45, g - lensW * 0.4, -lh * 0.12); ctx.stroke();

      else { ctx.fillStyle = '#C98A2E'; ctx.beginPath(); ctx.ellipse(0, 0, lensW / 2, lh / 2, 0, 0, TAU); ctx.fill(); }
      ctx.fillStyle = 'rgba(255,255,255,0.55)';

  // ---------- state ----------
  let state = 'title';   // title | ready | play | end | over
  let stT = 0, time = 0;
  let D = DIFF[diffKey];
  let timeLeft = GAME_TIME, score = 0, hits = 0, combo = 0, maxCombo = 0;
  let people = [], flying = [], fx = [], texts = [];
  let spawnT = 0, coolT = 0, throwAnim = 0, lastTick = 0, shake = 0, penFlash = 0;
  let uid = 0;
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const rand = (a, b) => a + Math.random() * (b - a);

  function pickType() {
    const w = D.w; let sum = 0;
    for (const k in w) sum += w[k];
    let r = Math.random() * sum;
    for (const k in w) { r -= w[k]; if (r <= 0) return k; }
    return 'adult';
  }
  function spawn() {
    const type = pickType();
    const laneI = Math.floor(Math.random() * 3);
    const lane = LANES[laneI];
    const dir = Math.random() < 0.5 ? 1 : -1;
    const x = dir > 0 ? -70 : W + 70;
    // avoid spawning on top of someone in the same lane
    for (const p of people) if (p.lane === laneI && Math.abs(p.x - x) < 90) return false;
    const T = TYPES[type];
    const p = {
      id: ++uid, type, lane: laneI, s: lane.s, k: lane.s * T.k, x, dir,
      speed: D.speed * T.spd * lane.s * rand(0.85, 1.2), phase: Math.random() * TAU,
      skin: pick(SKIN), hair: pick(HAIR), hairStyle: Math.floor(Math.random() * 5), shirt: pick(SHIRT), pants: pick(PANTS),
      hat: Math.random() < 0.18, glassed: false, gold: type === 'king', jump: 0, bubble: null, bubbleT: 0,
      paperT: rand(0, 2.5), hide: 0, stopT: 0, turnT: rand(1.5, 4), happy: 0, dogCol: pick(['#B97A3E', '#E9D8B8', '#3B2A1E', '#D9A15B']),
    };
    if (type === 'elder') { p.hair = pick(['#DADADA', '#C8C8C8', '#EFEFEF']); p.hairStyle = 2; }
    if (type === 'kid') p.hat = Math.random() < 0.35;
    people.push(p);
    people.sort((a, b) => a.lane - b.lane);
    return true;
  }
  function faceOf(p) {
    const ly = LANES[p.lane].y - p.jump;
    if (p.type === 'dog') return { x: p.x + p.dir * 33 * p.k, y: ly - 47 * p.k, r: 17 * p.k };
    const lean = p.type === 'elder' ? p.dir * 7 : (p.type === 'runner' ? p.dir * 6 : 0);
    return { x: p.x + lean * p.k, y: ly - 158 * p.k, r: (p.type === 'king' ? 30 : 26) * p.k };
  }
  function isHidden(p) { return p.type === 'paper' && p.hide > 0.45; }

  function startGame() {
    D = DIFF[diffKey];
    timeLeft = GAME_TIME; score = 0; hits = 0; combo = 0; maxCombo = 0;
    people = []; flying = []; fx = []; texts = [];
    spawnT = 0.2; coolT = 0; lastTick = 0;
    // pre-populate a few walkers so the street isn't empty
    for (let i = 0; i < 4; i++) { if (spawn()) { const p = people[people.length - 1]; p.x = rand(W * 0.15, W * 0.85); } }
    people.sort((a, b) => a.lane - b.lane);
    state = 'ready'; stT = 0;
    $('titlePanel').hidden = true; $('overPanel').hidden = true; $('quitBtn').hidden = false;
    audio();
  }
  function endGame() {
    state = 'over';
    $('quitBtn').hidden = true;
    const prev = best[diffKey] || 0;
    const isNew = score > prev;
    if (isNew) { best[diffKey] = score; store.set('korokke-megane-best', best); }
    $('sScore').textContent = score; $('sHits').textContent = hits; $('sCombo').textContent = maxCombo;
    $('newRec').hidden = !(isNew && score > 0);
    $('bestText').textContent = `${D.name}のじこベスト：${best[diffKey] || 0}点`;
    $('rankText').textContent = rankOf(hits);
    $('overPanel').hidden = false;
  }
  function rankOf(h) {
    if (h >= 35) return 'でんせつのコロッケメガネ職人';
    if (h >= 25) return 'コロッケメガネ名人';
    if (h >= 16) return '大人気のメガネやさん';
    if (h >= 8) return 'まちのメガネやさん';
    return 'メガネやさん 見ならい';
  }
  function backToTitle() {
    state = 'title'; people = []; flying = []; texts = []; fx = [];
    $('overPanel').hidden = true; $('quitBtn').hidden = true; $('titlePanel').hidden = false;
    refreshDiff();
    for (let i = 0; i < 5; i++) { if (spawn()) people[people.length - 1].x = rand(0, W); }
    people.sort((a, b) => a.lane - b.lane);
  }

  // ---------- throwing ----------
  const handPos = () => ({ x: W / 2 + 30, y: 790 });
  function throwAt(tx, ty) {
    if (coolT > 0) return;
    coolT = D.cool; throwAnim = 0.25;
    const h = handPos();
    let target = null;
    if (D.auto) {
      let bd = D.auto;
      for (const p of people) {
        if (p.glassed || p.x < -20 || p.x > W + 20) continue;
        const f = faceOf(p); const d = Math.hypot(f.x - tx, f.y - ty);
        if (d < bd + f.r) { bd = d - f.r; target = p; }
      }
    }
    flying.push({ sx: h.x, sy: h.y, tx, ty, t: 0, dur: D.flight * (0.75 + 0.25 * Math.min(1, Math.hypot(tx - h.x, ty - h.y) / 600)), target });
    sfx.throw();
  }
  function penalize(sec, x, y) {
    if (!sec) return;
    timeLeft = Math.max(0, timeLeft - sec);
    penFlash = 0.5;
    texts.push({ x: x, y: y + 30, text: `−${sec}びょう`, col: '#D83A4E', t: 0, size: 26 });
  }
  function land(g) {
    const { tx, ty } = g;
    let hit = g.target, bestR = Infinity;
    if (!hit) {
      for (const p of people) {
        if (p.glassed) continue;
        const f = faceOf(p);
        const hr = f.r * D.hitMul + D.hitAdd;
        const d = Math.hypot(f.x - tx, f.y - ty);
        if (d < hr && d / hr < bestR) { bestR = d / hr; hit = p; }
      }
    }
    if (!hit) {
      combo = 0; sfx.miss();
      fx.push({ kind: 'fall', x: tx, y: ty, vx: rand(-60, 60), vy: -120, rot: 0, vr: rand(-8, 8), t: 0, s: 0.8 });
      texts.push({ x: tx, y: ty - 10, text: 'スカッ', col: '#FFFDF6', t: 0, size: 24 });
      penalize(D.missPen, tx, ty);
      return;
    }
    const f = faceOf(hit);
    if (hit.type === 'megane' || isHidden(hit)) {
      combo = 0; sfx.bad(); shake = 0.25;
      say(hit, hit.type === 'megane' ? 'もうかけてるよ〜' : 'しんぶん読んでるの！', 1.4);
      fx.push({ kind: 'fall', x: f.x, y: f.y, vx: -hit.dir * 90, vy: -200, rot: 0, vr: rand(-10, 10), t: 0, s: hit.s });
      penalize(D.decoyPen, f.x, f.y);

    }
    hit.glassed = true; hit.jump = 0.001; hit.happy = 1;
    hits++; combo++; maxCombo = Math.max(maxCombo, combo);
    const mult = Math.min(4, 1 + Math.floor((combo - 1) / 5));
    const pts = TYPES[hit.type].pts * mult;
    score += pts;
    if (hit.type === 'king') {
      sfx.king(); timeLeft += 5; shake = 0.2;
      say(hit, 'うむ、よきメガネじゃ！', 1.8);
      texts.push({ x: f.x, y: f.y - 80 * hit.s, text: '+5びょう', col: '#3E9D6A', t: 0, size: 26 });
    } else {
      sfx.hit(combo);
      const lines = hit.type === 'dog' ? ['ワン！', 'ワンワン！', 'クゥ〜ン♪'] : hit.type === 'kid' ? SAY_KID : hit.type === 'elder' ? SAY_ELDER : hit.type === 'runner' ? SAY_RUN : SAY;
      say(hit, pick(lines), 1.5);
    }
    texts.push({ x: f.x, y: f.y - 40 * hit.s, text: `+${pts}`, col: hit.gold ? '#F5C842' : '#E8A53E', t: 0, size: 34 + Math.min(16, pts * 2) });
    if (mult > 1 && combo % 5 === 1) texts.push({ x: W / 2, y: 250, text: `コンボ ×${mult}！`, col: '#D83A4E', t: 0, size: 40 });
    for (let i = 0; i < 14; i++) {
      const a = Math.random() * TAU, sp = rand(80, 260);
      fx.push({ kind: 'spark', x: f.x, y: f.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60, t: 0, life: rand(0.4, 0.8), col: pick(['#E8A53E', '#F5C842', '#FFF2C2', '#C9822B']), r: rand(2.5, 5) });

  function say(p, text, dur) { p.bubble = text; p.bubbleT = dur; }

  // ---------- update ----------
  function update(dt) {
    time += dt; stT += dt;
    if (coolT > 0) coolT -= dt;
    if (throwAnim > 0) throwAnim -= dt;
    if (shake > 0) shake -= dt;
    if (penFlash > 0) penFlash -= dt;

    if (state === 'ready') {
      const before = Math.ceil(2.4 - (stT - dt));
      if (stT < 2.4 && Math.ceil(2.4 - stT) !== before) sfx.tick();
      if (stT >= 2.4) { state = 'play'; stT = 0; sfx.go(); }
    } else if (state === 'play') {
      timeLeft -= dt;
      if (timeLeft <= 5 && Math.ceil(timeLeft) !== lastTick && timeLeft > 0) { lastTick = Math.ceil(timeLeft); sfx.tick(); }
      if (timeLeft <= 0) { timeLeft = 0; state = 'end'; stT = 0; sfx.end(); flying = []; }
    } else if (state === 'end') {
      if (stT > 1.6) endGame();
    }

    // spawning (also on title for ambience)
    if (state === 'play' || state === 'ready' || state === 'title' || state === 'over') {
      spawnT -= dt;
      const busy = state === 'play' ? 1 : 2.2;
      if (spawnT <= 0) { spawn(); spawnT = D.spawn * busy * rand(0.6, 1.4); }
    }

    for (const p of people) {
      const T = TYPES[p.type];
      let v = p.speed * (p.glassed ? 1.15 : 1);
      if (D.turn && !p.glassed && state === 'play') {
        if (p.stopT > 0) { p.stopT -= dt; v = 0; if (p.stopT <= 0 && Math.random() < 0.55) p.dir *= -1; }
        else { p.turnT -= dt; if (p.turnT <= 0) { p.turnT = rand(1.2, 3.5); if (p.x > 40 && p.x < W - 40) p.stopT = rand(0.3, 0.8); } }
        v *= 1 + 0.25 * Math.sin(time * 3 + p.id);

      p.x += p.dir * v * dt;
      p.phase += dt * (v / Math.max(0.3, p.k) / 9 + (v === 0 ? 0 : 2));
      if (p.jump > 0) { p.jumpT = (p.jumpT || 0) + dt; p.jump = Math.max(0, Math.sin(p.jumpT * 9) * 26 * p.k); if (p.jumpT * 9 > Math.PI) { p.jump = 0; p.jumpT = 0; } }
      if (p.bubbleT > 0) p.bubbleT -= dt;
      if (p.type === 'paper') {
        p.paperT += dt;
        const cyc = p.paperT % 3.0;      // hidden 1.7s, visible 1.3s
        const target = cyc < 1.7 ? 1 : 0;
        p.hide += (target - p.hide) * Math.min(1, dt * 10);
      }
    }
    people = people.filter(p => (p.dir > 0 ? p.x < W + 110 : p.x > -110) && p.x > -200 && p.x < W + 200);

    for (const g of flying) {
      g.t += dt;
      if (g.target) { const f = faceOf(g.target); g.tx = f.x; g.ty = f.y; }
    }
    for (const g of flying.filter(g => g.t >= g.dur)) land(g);
    flying = flying.filter(g => g.t < g.dur);

    for (const e of fx) {
      e.t += dt;
      if (e.kind === 'spark') { e.x += e.vx * dt; e.y += e.vy * dt; e.vy += 500 * dt; }
      else { e.x += e.vx * dt; e.y += e.vy * dt; e.vy += 900 * dt; e.rot += e.vr * dt; }
    }
    fx = fx.filter(e => e.kind === 'spark' ? e.t < e.life : e.t < 1.2);
    for (const t of texts) t.t += dt;
    texts = texts.filter(t => t.t < 1.1);
  }

  // ---------- drawing ----------
  function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h); }

  function drawBackground() {
    const sky = ctx.createLinearGradient(0, 0, 0, 420);
    sky.addColorStop(0, '#8FC9EE'); sky.addColorStop(1, '#DDF0FA');
    ctx.fillStyle = sky; ctx.fillRect(0, 0, W, 430);
    // clouds
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    for (let i = 0; i < 4; i++) {
      const cx = ((i * 290 + time * 8) % (W + 300)) - 150, cy = 70 + (i % 2) * 40;
      ctx.beginPath(); ctx.arc(cx, cy, 24, 0, TAU); ctx.arc(cx + 28, cy - 10, 30, 0, TAU); ctx.arc(cx + 60, cy, 22, 0, TAU); ctx.fill();
    }
    // arcade banner
    ctx.fillStyle = '#1F3A68'; ctx.fillRect(0, 118, W, 10);
    // shops
    for (const b of town) {
      const top = 430 - b.h;
      ctx.fillStyle = b.col; ctx.fillRect(b.x, top, b.w, b.h);
      ctx.fillStyle = 'rgba(0,0,0,0.08)'; ctx.fillRect(b.x + b.w - 8, top, 8, b.h);
      // windows upstairs
      for (let i = 0; i < b.win; i++) {
        const ww = (b.w - 30) / b.win - 8;
        ctx.fillStyle = '#9FC4D6'; ctx.fillRect(b.x + 15 + i * (ww + 8), top + 18, ww, 36);
        ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.fillRect(b.x + 15 + i * (ww + 8), top + 18, ww * 0.3, 36);
      }
      // sign
      const sy = 430 - 118;
      ctx.fillStyle = '#FFFDF6'; rr(b.x + 10, sy - 32, b.w - 20, 28, 6); ctx.fill();
      ctx.strokeStyle = '#1F3A68'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = b.sign === 'コロッケ' ? '#D83A4E' : '#1F3A68';
      ctx.font = `17px ${FD}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(b.sign, b.x + b.w / 2, sy - 18);
      // awning stripes
      const aw = b.w; const stripes = 6;
      for (let i = 0; i < stripes; i++) {

        ctx.beginPath();

        ctx.lineTo(b.x + (i + 1) * aw / stripes + 4, sy + 26); ctx.lineTo(b.x + i * aw / stripes + 4, sy + 26); ctx.fill();
      }
      // shop front
      ctx.fillStyle = '#5A3A22'; ctx.fillRect(b.x + 8, sy + 26, b.w - 16, 92);
      ctx.fillStyle = '#F7E7C4'; ctx.fillRect(b.x + 14, sy + 34, b.w - 28, 60);
      if (b.sign === 'コロッケ') {
        for (let i = 0; i < 4; i++) drawCro(b.x + 30 + i * (b.w - 60) / 3, sy + 80, 30, false);
      } else if (b.sign === 'メガネ') {
        ctx.strokeStyle = '#1F3A68'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(b.x + b.w / 2 - 16, sy + 64, 11, 0, TAU); ctx.arc(b.x + b.w / 2 + 16, sy + 64, 11, 0, TAU); ctx.stroke();
      } else {
        ctx.fillStyle = 'rgba(31,58,104,0.18)';
        for (let i = 0; i < 3; i++) { rr(b.x + 22 + i * (b.w - 44) / 3, sy + 70, (b.w - 44) / 3 - 8, 20, 4); ctx.fill(); }
      }
    }
    // arcade banner text
    ctx.fillStyle = '#E8A53E'; rr(W / 2 - 150, 100, 300, 44, 22); ctx.fill();
    ctx.strokeStyle = '#1F3A68'; ctx.lineWidth = 3; ctx.stroke();
    ctx.fillStyle = '#1F3A68'; ctx.font = `22px ${FD}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('ころっけ商店街', W / 2, 123);
    // pavement
    const pv = ctx.createLinearGradient(0, 430, 0, H);
    pv.addColorStop(0, '#D9CBB4'); pv.addColorStop(1, '#C2B092');
    ctx.fillStyle = pv; ctx.fillRect(0, 430, W, H - 430);
    ctx.strokeStyle = 'rgba(90,60,30,0.15)'; ctx.lineWidth = 1.5;
    for (let y = 445, i = 0; y < H; y += 18 + i * 4, i++) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
    for (let x = -400; x < W + 400; x += 70) { ctx.beginPath(); ctx.moveTo(W / 2 + (x - W / 2) * 0.35, 430); ctx.lineTo(W / 2 + (x - W / 2) * 1.8, H); ctx.stroke(); }
  }

  function limb(x1, y1, x2, y2, w, col) { ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }

  function drawPerson(p) {
    const ly = LANES[p.lane].y;
    const k = p.k, d = p.dir;
    ctx.save();
    // shadow
    ctx.fillStyle = 'rgba(60,40,20,0.22)';
    ctx.beginPath(); ctx.ellipse(p.x, ly, (p.type === 'dog' ? 40 : 30) * k, 7 * k, 0, 0, TAU); ctx.fill();
    ctx.translate(p.x, ly - p.jump);
    ctx.scale(k, k);
    if (p.type === 'dog') { drawDog(p); ctx.restore(); return; }
    const sw = Math.sin(p.phase) * (p.type === 'runner' ? 0.9 : p.type === 'elder' ? 0.3 : 0.55);
    const bob = Math.abs(Math.cos(p.phase)) * (p.type === 'runner' ? 5 : 2.5);
    const lean = p.type === 'elder' ? d * 7 : p.type === 'runner' ? d * 6 : 0;
    ctx.translate(0, -bob);
    // cape (king) behind
    if (p.type === 'king') {
      ctx.fillStyle = '#C2264A';
      ctx.beginPath(); ctx.moveTo(-20, -128); ctx.lineTo(20, -128); ctx.lineTo(30 - d * 14 + Math.sin(time * 6) * 3, -40); ctx.lineTo(-30 - d * 14 + Math.sin(time * 6) * 3, -40); ctx.fill();
    }
    // legs
    const pants = p.type === 'king' ? '#F5C842' : p.pants;
    const legL = 62;
    limb(-7, -60, -7 + Math.sin(sw) * legL * 0.9, -60 + Math.cos(sw) * legL, 13, shade(pants));
    limb(7, -60, 7 - Math.sin(sw) * legL * 0.9, -60 + Math.cos(sw) * legL, 13, pants);
    // shoes
    ctx.fillStyle = '#2B2B2B';
    ctx.beginPath(); ctx.ellipse(-7 + Math.sin(sw) * legL * 0.9 + d * 4, -60 + Math.cos(sw) * legL, 9, 5, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(7 - Math.sin(sw) * legL * 0.9 + d * 4, -60 + Math.cos(sw) * legL, 9, 5, 0, 0, TAU); ctx.fill();
    // back arm
    const shirt = p.type === 'king' ? '#7A2BB5' : p.shirt;
    const armSw = -sw * 0.8;
    if (p.type === 'runner') limb(lean - 14, -122, lean - 14 - Math.sin(armSw) * 26, -96, 10, shade(shirt));
    else limb(lean * 0.5 - 18, -122, lean * 0.5 - 18 - Math.sin(armSw) * 40, -122 + Math.cos(armSw) * 46, 10, shade(shirt));
    // torso
    ctx.save(); ctx.translate(lean * 0.5, 0);
    ctx.fillStyle = shirt; rr(-22, -134, 44, 80, 14); ctx.fill();
    if (p.type === 'runner') { ctx.fillStyle = '#FFFDF6'; ctx.font = `20px ${FD}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(String(10 + (p.id % 90)), 0, -96); }
    if (p.type === 'megane') { ctx.fillStyle = 'rgba(255,255,255,0.8)'; ctx.fillRect(-3, -132, 6, 30); }
    if (p.type === 'king') { ctx.fillStyle = '#F5C842'; ctx.fillRect(-22, -82, 44, 8); }
    ctx.restore();
    // head
    const hx = lean, hy = -158;
    if (p.type === 'king') {
      drawCro(hx, hy, 82, true);
      // crown
      ctx.fillStyle = '#F5C842'; ctx.strokeStyle = '#8A5A00'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(hx - 20, hy - 18); ctx.lineTo(hx - 22, hy - 42); ctx.lineTo(hx - 10, hy - 30); ctx.lineTo(hx, hy - 46); ctx.lineTo(hx + 10, hy - 30); ctx.lineTo(hx + 22, hy - 42); ctx.lineTo(hx + 20, hy - 18); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#D83A4E'; ctx.beginPath(); ctx.arc(hx, hy - 30, 3.5, 0, TAU); ctx.fill();
    } else {
      // hair behind
      ctx.fillStyle = p.hair;
      if (p.hairStyle === 1) { rr(hx - 28, hy - 18, 56, 52, 18); ctx.fill(); }
      ctx.fillStyle = p.skin; ctx.beginPath(); ctx.arc(hx, hy, 26, 0, TAU); ctx.fill();
      ctx.fillStyle = p.hair;
      ctx.beginPath();
      if (p.hairStyle === 2) { ctx.arc(hx - 20, hy - 6, 9, 0, TAU); ctx.arc(hx + 20, hy - 6, 9, 0, TAU); ctx.fill(); }
      else if (p.hairStyle === 3) { ctx.arc(hx, hy - 6, 27, Math.PI, TAU); ctx.fill(); ctx.beginPath(); ctx.arc(hx, hy - 32, 11, 0, TAU); ctx.fill(); }
      else if (p.hairStyle === 4) { ctx.moveTo(hx - 27, hy - 4); for (let i = 0; i <= 6; i++) ctx.lineTo(hx - 27 + i * 9, hy - (i % 2 ? 36 : 22)); ctx.lineTo(hx + 27, hy - 4); ctx.closePath(); ctx.fill(); }
      else { ctx.arc(hx, hy - 4, 27, Math.PI * 1.02, TAU * 0.99); ctx.fill(); }
      if (p.hat && p.type !== 'elder') {
        ctx.fillStyle = p.type === 'kid' ? '#F2C230' : shade(p.shirt);
        ctx.beginPath(); ctx.arc(hx, hy - 12, 26, Math.PI, TAU); ctx.fill();
        ctx.fillRect(hx + (d > 0 ? 0 : -40), hy - 14, 40, 6);
      }
      if (p.type === 'runner') { ctx.fillStyle = '#D83A4E'; ctx.fillRect(hx - 27, hy - 16, 54, 7); }
    }
    // face
    const ex = hx + d * 4, ey = hy - 2;
    const happy = p.glassed;
    if (p.type !== 'king' || !p.glassed) {
      ctx.fillStyle = '#2A1E16';
      if (happy && p.type !== 'king') {
        ctx.strokeStyle = '#2A1E16'; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.arc(ex - 9, ey + 1, 3.5, Math.PI, TAU); ctx.moveTo(ex + 12.5, ey + 1); ctx.arc(ex + 9, ey + 1, 3.5, Math.PI, TAU); ctx.stroke();
      } else {
        ctx.beginPath(); ctx.arc(ex - 9, ey, 3.2, 0, TAU); ctx.arc(ex + 9, ey, 3.2, 0, TAU); ctx.fill();
      }
    }
    // mouth
    ctx.strokeStyle = '#7A3020'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
    ctx.beginPath();
    if (happy) { ctx.arc(ex, ey + 9, 7, 0.1 * Math.PI, 0.9 * Math.PI); }
    else if (p.bubbleT > 0) { ctx.arc(ex, ey + 13, 3, 0, TAU); }
    else { ctx.moveTo(ex - 5, ey + 12); ctx.lineTo(ex + 5, ey + 12); }
    ctx.stroke();
    if (happy && p.type !== 'king') {
      ctx.fillStyle = 'rgba(232,90,100,0.4)';
      ctx.beginPath(); ctx.arc(ex - 16, ey + 8, 5, 0, TAU); ctx.arc(ex + 16, ey + 8, 5, 0, TAU); ctx.fill();
    }
    if (p.type === 'elder') { // mustache
      ctx.fillStyle = p.hair; ctx.beginPath(); ctx.ellipse(ex - 5, ey + 8, 6, 3, 0.3, 0, TAU); ctx.ellipse(ex + 5, ey + 8, 6, 3, -0.3, 0, TAU); ctx.fill();
    }
    if (p.type === 'megane') {
      ctx.strokeStyle = '#1B1B1B'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(ex - 10, ey, 8, 0, TAU); ctx.moveTo(ex + 18, ey); ctx.arc(ex + 10, ey, 8, 0, TAU); ctx.moveTo(ex - 2, ey); ctx.lineTo(ex + 2, ey); ctx.stroke();
      ctx.fillStyle = 'rgba(180,220,255,0.35)'; ctx.beginPath(); ctx.arc(ex - 10, ey, 7, 0, TAU); ctx.arc(ex + 10, ey, 7, 0, TAU); ctx.fill();
    }
    if (p.glassed) drawGlasses(ex, ey, p.type === 'king' ? 26 : 22, p.gold, 0, p.type === 'king' ? 15 : 11);
    // front arm
    if (p.type === 'elder') {
      limb(lean * 0.5 + 16, -120, lean + d * 22, -78, 10, p.shirt);
      limb(lean + d * 24, -82, lean + d * 30 + Math.sin(p.phase) * 4, 0, 4, '#6B4423');
    } else if (p.type === 'paper') {
      const up = p.hide;
      const px = lean + d * 8, py = -100 - up * 58;
      limb(lean * 0.5 + 16, -122, px + 14, py + 18, 10, p.shirt);
      limb(lean * 0.5 - 16, -122, px - 14, py + 18, 10, shade(p.shirt));
      ctx.save(); ctx.translate(px, py);
      ctx.fillStyle = '#F4F1E8'; ctx.strokeStyle = '#8C8778'; ctx.lineWidth = 1.5;
      rr(-34, -28, 68, 56, 3); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, -28); ctx.lineTo(0, 28); ctx.stroke();
      ctx.fillStyle = '#8C8778';
      ctx.font = `10px ${FD}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('しんぶん', -16, -18);
      for (let i = 0; i < 4; i++) { ctx.fillRect(-30, -8 + i * 8, 26, 3); ctx.fillRect(4, -20 + i * 10, 26, 3); }
      ctx.restore();
    } else if (p.type === 'runner') {
      limb(lean + 14, -122, lean + 14 + Math.sin(armSw) * 26, -96, 10, p.shirt);
    } else {
      limb(lean * 0.5 + 18, -122, lean * 0.5 + 18 + Math.sin(armSw) * 40, -122 + Math.cos(armSw) * 46, 10, shirt);
    }
    ctx.restore();
  }

  function drawDog(p) {
    const d = p.dir, sw = Math.sin(p.phase) * 0.6;
    const col = p.dogCol, dark = shade(col);
    // legs
    for (const [lx, ph] of [[-20, 0], [-12, Math.PI], [16, Math.PI], [24, 0]]) {
      const a = Math.sin(p.phase + ph) * 0.6;
      limb(lx * d, -22, lx * d + Math.sin(a) * 12, 0, 7, ph ? dark : col);
    }
    // tail
    const wag = p.glassed ? Math.sin(time * 20) * 0.6 : Math.sin(time * 6) * 0.3;
    limb(-30 * d, -30, (-30 - Math.cos(wag) * 14) * d, -44 - Math.sin(wag) * 6, 6, col);
    // body
    ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(0, -28, 34, 14, 0, 0, TAU); ctx.fill();
    // collar
    ctx.fillStyle = '#D83A4E'; ctx.fillRect(22 * d - 4, -42, 8, 14);
    // head
    const hx = 33 * d, hy = -47;
    ctx.fillStyle = col; ctx.beginPath(); ctx.arc(hx, hy, 16, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(hx + d * 13, hy + 5, 9, 7, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = dark;
    ctx.beginPath(); ctx.ellipse(hx - d * 10, hy - 6, 6, 11, d * 0.5, 0, TAU); ctx.fill();
    ctx.fillStyle = '#1B1B1B'; ctx.beginPath(); ctx.arc(hx + d * 21, hy + 3, 3.5, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(hx + d * 5, hy - 3, 2.5, 0, TAU); ctx.fill();
    if (p.glassed) {
      ctx.strokeStyle = '#7A3020'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(hx + d * 14, hy + 9, 4, 0.1 * Math.PI, 0.9 * Math.PI); ctx.stroke();
      drawGlasses(hx + d * 4, hy - 3, 14, false, 0, 7);
    }
  }

  function drawBubble(p) {
    if (!(p.bubbleT > 0) || !p.bubble) return;
    const f = faceOf(p);
    const a = Math.min(1, p.bubbleT * 3);
    ctx.save(); ctx.globalAlpha = a;
    const fs = Math.max(15, 20 * Math.max(0.75, p.s));
    ctx.font = `${fs}px ${FB}`; ctx.font = `800 ${fs}px ${FB}`;
    const tw = ctx.measureText(p.bubble).width + 22;
    let bx = Math.max(8, Math.min(W - tw - 8, f.x - tw / 2));
    const by = f.y - f.r - 26 - fs;
    ctx.fillStyle = '#FFFDF6'; ctx.strokeStyle = '#1F3A68'; ctx.lineWidth = 2.5;
    rr(bx, by, tw, fs + 14, 12); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(f.x - 7, by + fs + 13); ctx.lineTo(f.x, by + fs + 24); ctx.lineTo(f.x + 7, by + fs + 13); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(f.x - 7, by + fs + 14); ctx.lineTo(f.x, by + fs + 24); ctx.lineTo(f.x + 7, by + fs + 14); ctx.stroke();
    ctx.fillStyle = '#1F3A68'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(p.bubble, bx + tw / 2, by + (fs + 14) / 2 + 1);
    ctx.restore();
  }

  function shade(hex) {
    const n = parseInt(hex.slice(1), 16);
    const r = Math.round(((n >> 16) & 255) * 0.78), g = Math.round(((n >> 8) & 255) * 0.78), b = Math.round((n & 255) * 0.78);
    return `rgb(${r},${g},${b})`;
  }

  function drawPlayer() {
    const x = W / 2, y = 838;
    const t = throwAnim > 0 ? throwAnim / 0.25 : 0;
    const bounce = Math.sin(time * 4) * 3;
    ctx.save();
    // counter / stand
    ctx.fillStyle = '#5A3A22'; rr(x - 120, y + 20, 240, 60, 12); ctx.fill();
    ctx.fillStyle = '#E8A53E'; rr(x - 112, y + 26, 224, 26, 8); ctx.fill();
    ctx.fillStyle = '#1F3A68'; ctx.font = `16px ${FD}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('コロッケメガネ やさん', x, y + 40);
    // body
    drawCro(x, y - 18 + bounce, 150, false);
    // face
    ctx.fillStyle = '#2A1E16';
    ctx.beginPath(); ctx.arc(x - 18, y - 26 + bounce, 5, 0, TAU); ctx.arc(x + 18, y - 26 + bounce, 5, 0, TAU); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x - 16, y - 28 + bounce, 1.8, 0, TAU); ctx.arc(x + 20, y - 28 + bounce, 1.8, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#5A2A10'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(x, y - 14 + bounce, 8, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
    ctx.fillStyle = 'rgba(232,90,100,0.45)'; ctx.beginPath(); ctx.arc(x - 34, y - 14 + bounce, 7, 0, TAU); ctx.arc(x + 34, y - 14 + bounce, 7, 0, TAU); ctx.fill();
    // arms
    const h = handPos();
    const ax = h.x + (t > 0 ? 10 * t : 0), ay = h.y - 20 + (t > 0 ? -30 * Math.sin(t * Math.PI) : 0) + bounce;
    limb(x + 60, y - 14 + bounce, ax, ay, 8, '#B87828');
    limb(x - 60, y - 14 + bounce, x - 84, y - 36 + bounce + Math.sin(time * 4) * 4, 8, '#B87828');
    // glasses in hand (ready)
    if (state === 'play' && coolT <= 0) drawGlasses(ax, ay - 12, 26, false, -0.15, 15);
    ctx.restore();
  }

  function drawFlying() {
    for (const g of flying) {
      const u = Math.min(1, g.t / g.dur);
      const e = 1 - (1 - u) * (1 - u);
      const x = g.sx + (g.tx - g.sx) * e;
      const y = g.sy + (g.ty - g.sy) * e - Math.sin(u * Math.PI) * 70;
      const sz = 26 - 8 * u;
      // trail
      ctx.fillStyle = 'rgba(255,240,200,0.5)';
      ctx.beginPath(); ctx.arc(x - (g.tx - g.sx) * 0.03, y + 6, sz * 0.5, 0, TAU); ctx.fill();
      drawGlasses(x, y, sz, false, Math.sin(u * TAU * 1.5) * 0.4, sz * 0.58);
    }
    for (const e of fx) {
      if (e.kind === 'spark') {
        ctx.globalAlpha = Math.max(0, 1 - e.t / e.life);
        ctx.fillStyle = e.col; ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, TAU); ctx.fill();
        ctx.globalAlpha = 1;
      } else {
        ctx.globalAlpha = Math.max(0, 1 - e.t / 1.2);
        drawGlasses(e.x, e.y, 20 * e.s + 6, false, e.rot, (20 * e.s + 6) * 0.55);
        ctx.globalAlpha = 1;
      }
    }
  }

  function drawTexts() {
    for (const t of texts) {
      const a = Math.max(0, 1 - Math.max(0, t.t - 0.6) / 0.5);
      const y = t.y - t.t * 50;
      ctx.globalAlpha = a;
      ctx.font = `${t.size}px ${FD}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.lineWidth = 6; ctx.strokeStyle = '#1F3A68'; ctx.lineJoin = 'round';
      ctx.strokeText(t.text, t.x, y);
      ctx.fillStyle = t.col; ctx.fillText(t.text, t.x, y);
      ctx.globalAlpha = 1;
    }
  }

  function drawHUD() {
    if (state === 'title' || state === 'over') return;
    // time
    const tl = Math.ceil(timeLeft);
    ctx.fillStyle = penFlash > 0 ? '#D83A4E' : '#FFFDF6'; ctx.strokeStyle = '#1F3A68'; ctx.lineWidth = 3;
    rr(14, 160, 140, 58, 16); ctx.fill(); ctx.stroke();
    ctx.fillStyle = penFlash > 0 ? '#FFFDF6' : (tl <= 10 ? '#D83A4E' : '#1F3A68');
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = `800 13px ${FB}`; ctx.fillText('のこり', 84, 174);
    ctx.font = `28px ${FD}`; ctx.fillText(`${tl}`, 72, 200); ctx.font = `14px ${FD}`; ctx.fillText('びょう', 118, 205);
    // score
    ctx.fillStyle = '#FFFDF6'; rr(W - 142, 160, 128, 58, 16); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#1F3A68';
    ctx.font = `800 13px ${FB}`; ctx.fillText('とくてん', W - 78, 174);
    ctx.font = `28px ${FD}`; ctx.fillText(`${score}`, W - 78, 200);
    // combo
    if (combo >= 2) {
      const mult = Math.min(4, 1 + Math.floor((combo - 1) / 5));
      ctx.fillStyle = '#D83A4E'; rr(W - 142, 224, 128, 30, 15); ctx.fill();
      ctx.fillStyle = '#FFFDF6'; ctx.font = `15px ${FD}`;
      ctx.fillText(`${combo}コンボ${mult > 1 ? ' ×' + mult : ''}`, W - 78, 240);
    }
    if (state === 'ready') {
      const n = Math.ceil(2.4 - stT);
      bigText(n >= 3 ? 'よーい…' : n === 2 ? 'よーい…' : 'スタート！', n <= 1 ? '#E8A53E' : '#FFFDF6');
    } else if (state === 'play' && stT < 0.6) {
      ctx.globalAlpha = 1 - stT / 0.6; bigText('スタート！', '#E8A53E'); ctx.globalAlpha = 1;
    } else if (state === 'end') {
      bigText('タイムアップ！', '#D83A4E');
    }
  }
  function bigText(s, col) {
    ctx.font = `56px ${FD}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 10; ctx.strokeStyle = '#1F3A68'; ctx.lineJoin = 'round';
    ctx.strokeText(s, W / 2, 330); ctx.fillStyle = col; ctx.fillText(s, W / 2, 330);
  }

  function draw() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = '#2B1D14'; ctx.fillRect(0, 0, cw, ch);
    let sx = 0, sy = 0;
    if (shake > 0) { sx = (Math.random() - 0.5) * 10; sy = (Math.random() - 0.5) * 10; }
    ctx.translate(ox + sx, oy + sy);
    ctx.scale(scale, scale);
    ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();
    drawBackground();
    for (const p of people) drawPerson(p);
    drawPlayer();
    for (const p of people) drawBubble(p);
    drawFlying();
    drawTexts();
    drawHUD();
    ctx.restore();
  }

  // ---------- input ----------
  cv.addEventListener('pointerdown', e => {
    if (state !== 'play') return;
    e.preventDefault();
    const r = cv.getBoundingClientRect();
    const x = (e.clientX - r.left - ox) / scale, y = (e.clientY - r.top - oy) / scale;
    if (x < 0 || x > W || y < 0 || y > H) return;
    throwAt(x, y);
  });

  function refreshDiff() {
    for (const b of document.querySelectorAll('#diffBox button')) b.setAttribute('aria-pressed', String(b.dataset.d === diffKey));
    const b = best[diffKey] || 0;
    $('diffNote').textContent = DIFF[diffKey].note + (b ? `（ベスト ${b}点）` : '');
    D = DIFF[diffKey];
  }
  $('diffBox').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    diffKey = b.dataset.d; store.set('korokke-megane-diff', diffKey); refreshDiff(); sfx.tick();
  });
  $('startBtn').addEventListener('click', startGame);
  $('againBtn').addEventListener('click', startGame);
  $('titleBtn').addEventListener('click', backToTitle);
  $('quitBtn').addEventListener('click', backToTitle);
  const soundBtn = $('soundBtn');
  function refreshSound() { soundBtn.textContent = soundOn ? '音：オン' : '音：オフ'; soundBtn.setAttribute('aria-pressed', String(soundOn)); }
  soundBtn.addEventListener('click', () => { soundOn = !soundOn; store.set('korokke-sound', soundOn); refreshSound(); });
  refreshSound();
  window.addEventListener('keydown', e => {
    if ((e.key === 'Enter' || e.key === ' ') && (state === 'title' || state === 'over') && document.activeElement === document.body) { e.preventDefault(); startGame(); }
  });

  backToTitle();

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
