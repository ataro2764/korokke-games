<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style data-fix="hidden">[hidden]{display:none!important}</style>
<title>コロッケぬくぬく</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: one-screen game. Canvas = ゆきの よる。DOM panels float on top. */
:root {
  --ai: #1F3A68;
  --ai-deep: #142849;
  --koromo: #E8A53E;
  --koromo-dark: #7A4210;
  --paper: #FFFDF6;
  --beni: #D83A4E;
  --font-display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  --font-body: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  color-scheme: light;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  background: #0E1A3A;
  color: var(--ai-deep);
  font-family: var(--font-body);
  overflow: hidden;
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
}
#app { position: relative; width: 100%; height: 100%; touch-action: none; }
canvas { display: block; width: 100%; height: 100%; touch-action: none; }

.panel {
  position: absolute; left: 50%; top: 50%;
  transform: translate(-50%, -50%);
  width: min(350px, calc(100% - 32px));
  max-height: calc(100% - 32px); overflow-y: auto;
  background: var(--paper);
  border: 3px solid var(--ai);
  border-radius: 20px;
  box-shadow: 6px 6px 0 var(--ai);
  padding: 20px 18px 18px;
  display: flex; flex-direction: column; align-items: center; gap: 11px;
  text-align: center;
  box-sizing: border-box;
  touch-action: pan-y;
}
.panel h1 {
  margin: 0; font-family: var(--font-display); font-weight: 400;
  font-size: 2.1rem; line-height: 1.15; color: var(--ai);
  text-wrap: balance; letter-spacing: 0.02em;
}
.panel h1 small { display: block; font-size: 0.9rem; color: var(--koromo-dark); letter-spacing: 0.15em; margin-bottom: 4px; }
.panel h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 1.7rem; color: var(--ai); text-wrap: balance; }
.how { display: grid; gap: 6px; width: 100%; font-size: 0.86rem; line-height: 1.55; text-align: left; padding: 10px 12px; background: #EEF3FA; border-radius: 12px; box-sizing: border-box; }
.how b { color: var(--beni); }
kbd {
  font-family: var(--font-body); font-weight: 800; font-size: 0.76rem;
  border: 2px solid var(--ai); border-bottom-width: 3px; border-radius: 6px; padding: 0 5px; background: #fff;
}
.diffs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; }
.diff {
  font-family: var(--font-body); font-weight: 800; font-size: 1rem; color: var(--ai);
  background: #fff; border: 2px solid var(--ai); border-radius: 14px;
  padding: 7px 4px 6px; cursor: pointer; line-height: 1.2;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
}
.diff small { font-size: 0.68rem; font-weight: 500; color: var(--koromo-dark); }
.diff .best { font-size: 0.66rem; font-weight: 800; color: var(--ai); opacity: .75; }
.diff[aria-pressed="true"] { background: var(--koromo); box-shadow: inset 0 0 0 2px var(--ai); }
.diff[aria-pressed="true"] small { color: var(--ai-deep); }
.diff.oni[aria-pressed="true"] { background: var(--beni); color: var(--paper); }
.diff.oni[aria-pressed="true"] small, .diff.oni[aria-pressed="true"] .best { color: var(--paper); }
.btn {
  font-family: var(--font-display); font-size: 1.3rem; color: var(--ai-deep);
  background: var(--koromo); border: 3px solid var(--ai); border-radius: 999px;
  padding: 10px 34px; box-shadow: 0 5px 0 var(--ai); cursor: pointer;
  transition: transform .08s, box-shadow .08s;
}
.btn.sub { font-size: 0.95rem; padding: 6px 20px; background: #fff; box-shadow: 0 3px 0 var(--ai); }
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--ai); }
.btn:focus-visible, .sound:focus-visible, .diff:focus-visible { outline: 3px solid var(--beni); outline-offset: 3px; }
.big { font-family: var(--font-display); font-size: 2.6rem; color: var(--beni); line-height: 1; }
.rank { font-family: var(--font-display); font-size: 1.15rem; color: var(--ai); }
.stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; width: 100%; }
.stats div { background: #EEF3FA; border-radius: 10px; padding: 6px 2px; font-size: 0.7rem; font-weight: 800; color: var(--koromo-dark); }
.stats b { display: block; font-family: var(--font-display); font-weight: 400; font-size: 1.25rem; color: var(--ai); }
.note { font-size: 0.85rem; font-weight: 800; color: var(--koromo-dark); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center; }

.sound {
  position: absolute;
  right: max(12px, calc(env(safe-area-inset-right, 0px) + 12px));
  top: max(12px, calc(env(safe-area-inset-top, 0px) + 12px));
  font-family: var(--font-body); font-weight: 800; font-size: 0.8rem;
  background: var(--paper); color: var(--ai); border: 2px solid var(--ai);
  border-radius: 999px; padding: 5px 12px; cursor: pointer;
}
</style>

<div id="app">
  <canvas id="cv"></canvas>

  <div class="panel" id="titlePanel">
    <h1><small>さむい よるを のりきれ！</small>コロッケ<br>ぬくぬく</h1>
    <div class="how">
      <div>ゆきの よる。からだが どんどん <b>ひえて</b>いくよ。ふってくる <b>ほかほかコロッケ</b>を キャッチして あたたまろう！</div>
      <div><b>ゆきだま</b>や <b>つらら</b>に あたると ひえちゃう。<b>ふぶき</b>が きたら <b>かまくら</b>に にげこもう！</div>
      <div><b>金のコロッケ</b>で しばらく ぽかぽか むてき。じめんに おちた コロッケも ひろえるよ。<b>あさ</b>まで がんばれ！</div>
      <div>そうさ：ゆびで さわって ひだり・みぎ ／ PC：<kbd>←</kbd> <kbd>→</kbd> か マウス</div>
    </div>
    <div class="diffs" id="diffs"></div>
    <button class="btn" id="startBtn">スタート</button>
  </div>

  <div class="panel" id="overPanel" hidden>
    <h2 id="overHead">あさが きた！</h2>
    <div class="big" id="overScore">0</div>
    <div class="rank" id="overRank"></div>
    <div class="stats">
      <div>たべた<br>コロッケ<b id="stEat">0</b></div>
      <div>さいこう<br>れんぞく<b id="stCombo">0</b></div>
      <div>かまくら<br>セーフ<b id="stSafe">0</b></div>
    </div>
    <div class="note" id="overBest"></div>
    <div class="row">
      <button class="btn" id="retryBtn">もういっかい</button>
      <button class="btn sub" id="menuBtn">むずかしさを かえる</button>
    </div>
  </div>

  <button class="sound" id="soundBtn" type="button" aria-pressed="true">音：オン</button>
</div>

  let ac = null;
  function audio() {
    if (!soundOn) return null;

    if (ac.state === 'suspended') ac.resume();

  function tone(f1, f2, dur, type = 'square', vol = 0.08, delay = 0) {
    const a = audio(); if (!a) return;
    const t = a.currentTime + delay;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(Math.max(30, f2), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + 0.02);
  }
  function noise(dur, vol = 0.12, freq = 900, delay = 0, type = 'lowpass') {
    const a = audio(); if (!a) return;
    const t = a.currentTime + delay;
    const len = Math.max(1, Math.floor(a.sampleRate * dur));
    const buf = a.createBuffer(1, len, a.sampleRate); const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.sin(Math.PI * i / len);
    const s = a.createBufferSource(); s.buffer = buf;
    const f = a.createBiquadFilter(); f.type = type; f.frequency.value = freq;
    const g = a.createGain(); g.gain.value = vol;
    s.connect(f).connect(g).connect(a.destination); s.start(t);
  }

      if (tint) { g.globalCompositeOperation = 'source-atop'; g.fillStyle = tint; g.fillRect(0, 0, IMG_W, IMG_H); }
      return c;
    };
    spr.hot = make('rgba(255,120,40,0.10)');
    spr.gold = make('rgba(255,215,40,0.5)');
    spr.cold = make('rgba(120,170,255,0.45)');
  };
  croImg.src = 'data:image/webp;base64,' + CRO_B64;

  // ---------- scenery (fixed random) ----------
  const stars = Array.from({ length: 46 }, () => ({ x: rand(0, W), y: rand(-120, 330), r: rand(0.6, 1.8), tw: rand(0, TAU) }));
  const trees = [28, 78, 330, 372, 248].map((x, i) => ({ x, s: [1, 0.75, 0.9, 1.1, 0.65][i] }));
  const flakes = Array.from({ length: 90 }, () => ({ x: rand(-40, W + 40), y: rand(-200, H + 100), r: rand(1, 3.2), sp: rand(30, 70), ph: rand(0, TAU) }));

  // ---------- state ----------
  let state = 'title';   // title | count | play | clear | frozen | over
  let D = DIFFS[diffIdx];
  let stT = 0, time = 0, playT = 0;
  let score = 0, shownScore = 0, combo = 0, maxCombo = 0, eaten = 0, safes = 0;
  let warmth = 70, poka = 0, croqT = 0, snowT = 0, iceT = 0, shake = 0, flash = 0, coldFlash = 0;
  let items = [], floats = [], parts = [];
  const kid = { x: W / 2, vx: 0, face: 1, munch: 0, stun: 0, hurt: 0, breath: 0, shiverT: 0, inside: false };
  const input = { left: false, right: false, target: null, mouse: false };
  // blizzard: phase = idle | warn | blow | end
  const bliz = { phase: 'idle', t: 0, next: 0, dir: 1, kx: 200, rise: 0, safe: true, everIn: false };

  const progress = () => clamp(playT / D.time, 0, 1);

  function startGame() {
    D = DIFFS[diffIdx];
    score = 0; shownScore = 0; combo = 0; maxCombo = 0; eaten = 0; safes = 0;
    warmth = 70; poka = 0; croqT = 0.4; snowT = 2.5; iceT = 4; shake = 0; flash = 0; coldFlash = 0;
    items = []; floats = []; parts = [];
    Object.assign(kid, { x: W / 2, vx: 0, face: 1, munch: 0, stun: 0, hurt: 0, breath: 0.5, shiverT: 0, inside: false });
    Object.assign(bliz, { phase: 'idle', t: 0, next: D.bliz.first, rise: 0 });
    input.target = null;
    playT = 0;
    state = 'count'; stT = 0; lastCount = -1;
    $('titlePanel').hidden = true; $('overPanel').hidden = true;
    audio();
  }

  function endGame(cleared) {
    state = cleared ? 'clear' : 'frozen'; stT = 0;
    let bonus = 0;
    if (cleared) {
      bonus = 1000 + Math.round(warmth) * 20;
      score += bonus;
      addFloat(kid.x, GROUND - 120, 'あさだ！ +' + bonus, '#FFD25A', 26);
      sfx.clear();
    } else {
      sfx.freeze(); buzz([60, 40, 120]);
    }
    const prev = best[D.id] || 0;
    const isBest = score > prev;
    if (isBest) { best[D.id] = score; store.set('korokke-samusa-best', best); }
    setTimeout(() => {
      if (state !== 'clear' && state !== 'frozen') return;
      state = 'over';
      $('overHead').innerHTML = cleared ? 'あさが きた！<br>ぬくぬく せいこう！' : 'こおっちゃった…';
      $('overScore').textContent = score.toLocaleString() + ' てん';
      if (cleared) {
        const ratio = score / D.target;
        const ri = ratio >= 1 ? 4 : ratio >= 0.75 ? 3 : ratio >= 0.5 ? 2 : ratio >= 0.25 ? 1 : 0;
        $('overRank').textContent = D.name + '：' + RANKS[ri];
      } else {
        $('overRank').textContent = 'あさまで あと ' + Math.ceil(D.time - playT) + ' びょう！';
      }
      $('stEat').textContent = eaten; $('stCombo').textContent = maxCombo; $('stSafe').textContent = safes;
      $('overBest').textContent = isBest ? 'じこベスト こうしん！' : 'じこベスト ' + prev.toLocaleString() + ' てん';
      $('overPanel').hidden = false;
      $('retryBtn').focus({ preventScroll: true });
    }, cleared ? 1900 : 1600);
  }

  // ---------- spawning ----------
  function spawnCroq() {
    const gold = playT > 6 && Math.random() < 0.07 && !items.some(i => i.type === 'gold');
    let x = rand(28, W - 28);
    items.push({
      type: gold ? 'gold' : 'croq', x, y: -24, vx: 0,
      vy: lerp(D.fall[0], D.fall[1], progress()) * (gold ? 1.25 : 1) * rand(0.9, 1.1),
      sway: rand(0, TAU), rot: rand(-0.3, 0.3), spin: rand(-1.2, 1.2),
      st: 'fall', t: 0, heat: 1, w: gold ? 60 : 56,
    });
  }
  function spawnSnow() {
    items.push({ type: 'snow', x: rand(20, W - 20), y: -20, vx: rand(-15, 15), vy: lerp(D.fall[0], D.fall[1], progress()) * rand(1.05, 1.3), st: 'fall', t: 0, r: rand(10, 13), rot: 0, spin: rand(-3, 3) });
  }
  function spawnIce() {
    // つらら: まず「！」で しらせてから おちる
    let x = rand(24, W - 24);
    if (Math.random() < 0.5) x = clamp(kid.x + rand(-60, 60), 24, W - 24);
    items.push({ type: 'ice', x, y: -40, vx: 0, vy: 0, st: 'warn', t: 0, len: rand(38, 50) });
  }

  function addFloat(x, y, text, color, size = 20) { floats.push({ x, y, text, color, size, t: 0 }); }
  function burst(x, y, color, n, spd = 160, kind = 'dot') {
    for (let i = 0; i < n; i++) {
      const a = rand(0, TAU), s = rand(spd * 0.3, spd);
      parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 40, life: rand(0.4, 0.8), t: 0, color, r: rand(2, 4.5), kind });
    }
  }
  function steamPuff(x, y, n = 5) {
    for (let i = 0; i < n; i++) parts.push({ x: x + rand(-14, 14), y: y + rand(-6, 6), vx: rand(-12, 12), vy: rand(-70, -40), life: rand(0.6, 1.1), t: 0, color: 'rgba(255,255,255,0.8)', r: rand(5, 9), kind: 'puff' });
  }

  function addWarmth(v) {
    const over = Math.max(0, warmth + v - 100);
    warmth = clamp(warmth + v, 0, 100);
    return over;
  }

  function catchCroq(it, fromGround) {
    kid.munch = 0.4;
    eaten++;
    if (it.type === 'gold') {
      addWarmth(30); poka = 6; flash = 0.5;
      score += 500; combo++;
      addFloat(it.x, it.y - 20, 'ぽかぽか むてき！', '#FFD25A', 24);
      sfx.gold(); buzz(30);
      burst(it.x, it.y, '#FFD25A', 22, 220, 'star');
    } else if (fromGround) {
      const v = Math.round(4 + 8 * it.heat);
      const over = addWarmth(v);
      score += 40 + (over > 0 ? 30 : 0);
      addFloat(it.x, it.y - 24, 'もぐもぐ +' + v, '#BFD8FF', 17);
      sfx.pick();
    } else {
      combo++;
      const over = addWarmth(D.warm);
      const pts = 100 + Math.min(combo, 20) * 10 + (over > 0 ? 50 : 0);
      score += pts;
      addFloat(it.x, it.y - 24, over > 0 ? 'ぽかぽか +' + pts : 'はふっ +' + pts, over > 0 ? '#FF9A3C' : '#FFE7A8', 19);
      if (combo >= 3 && combo % 5 === 0) addFloat(kid.x, GROUND - 130, combo + ' れんぞく！', '#FFD25A', 24);
      sfx.catch(combo);
      steamPuff(it.x, it.y, 4);
      burst(it.x, it.y, '#E8A53E', 8, 120);
    }
    maxCombo = Math.max(maxCombo, combo);
  }

  function hitKid(it) {
    if (poka > 0) {
      addFloat(kid.x, GROUND - 110, 'へっちゃら！', '#FFD25A', 18);
      burst(it.x, it.y, '#FFFFFF', 10, 150);
      sfx.pick2();
      return;
    }
    const isIce = it.type === 'ice';
    const dmg = Math.round(D.hit * (isIce ? 1.5 : 1));
    warmth = Math.max(0, warmth - dmg);
    combo = 0;
    kid.hurt = 0.5; coldFlash = 0.35; shake = isIce ? 0.6 : 0.4;
    if (isIce) { kid.stun = 0.6; sfx.ice(); burst(it.x, it.y, '#BFEFFF', 14, 200, 'shard'); }
    else { sfx.hit(); burst(it.x, it.y, '#FFFFFF', 14, 170); }
    addFloat(kid.x, GROUND - 110, (isIce ? 'いたっ！ ' : 'つめたっ！ ') + '-' + dmg, '#8FC8FF', 19);
    buzz(isIce ? 60 : 35);
  }

  // ---------- input ----------
  function toWorldX(e) { const r = cv.getBoundingClientRect(); return ((e.clientX - r.left) - ox) / scale; }
  cv.addEventListener('pointerdown', e => {
    e.preventDefault();
    input.mouse = e.pointerType === 'mouse';
    input.target = toWorldX(e);
    try { cv.setPointerCapture(e.pointerId); } catch {}
    audio();
  });
  cv.addEventListener('pointermove', e => {
    if (e.pointerType === 'mouse') { input.mouse = true; input.target = toWorldX(e); return; }
    if (input.target !== null) input.target = toWorldX(e);
  });
  const release = e => { if (e.pointerType !== 'mouse') input.target = null; };
  cv.addEventListener('pointerup', release);
  cv.addEventListener('pointercancel', release);
  cv.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') input.target = null; });

  window.addEventListener('keydown', e => {
    const k = e.key;
    if (k === 'ArrowLeft' || k === 'a' || k === 'A') { input.left = true; input.target = null; e.preventDefault(); }
    else if (k === 'ArrowRight' || k === 'd' || k === 'D') { input.right = true; input.target = null; e.preventDefault(); }
    else if ((k === 'Enter' || k === ' ') && state === 'title' && document.activeElement?.tagName !== 'BUTTON') { e.preventDefault(); startGame(); }
    else if ((k === 'Enter' || k === ' ') && state === 'over' && document.activeElement?.tagName !== 'BUTTON') { e.preventDefault(); startGame(); }
  });
  window.addEventListener('keyup', e => {
    const k = e.key;
    if (k === 'ArrowLeft' || k === 'a' || k === 'A') input.left = false;
    if (k === 'ArrowRight' || k === 'd' || k === 'D') input.right = false;
  });
  window.addEventListener('blur', () => { input.left = input.right = false; input.target = null; });

  // ---------- menus ----------
  const diffsEl = $('diffs');
  function renderDiffs() {
    diffsEl.innerHTML = '';
    DIFFS.forEach((d, i) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'diff' + (d.id === 'oni' ? ' oni' : '');
      b.setAttribute('aria-pressed', String(i === diffIdx));
      b.innerHTML = d.name + '<small>' + d.sub + '</small>' + (best[d.id] ? '<span class="best">ベスト ' + best[d.id].toLocaleString() + '</span>' : '');
      b.addEventListener('click', () => { diffIdx = i; store.set('korokke-samusa-diff', i); D = DIFFS[i]; renderDiffs(); sfx.pick2(); });
      diffsEl.appendChild(b);
    });
  }
  renderDiffs();
  $('startBtn').addEventListener('click', startGame);
  $('retryBtn').addEventListener('click', startGame);
  $('menuBtn').addEventListener('click', () => {
    state = 'title'; $('overPanel').hidden = true; renderDiffs(); $('titlePanel').hidden = false;
    items = []; bliz.phase = 'idle'; bliz.rise = 0;
  });

  // ---------- update ----------
  let lastCount = -1;
  function update(dt) {
    time += dt; stT += dt;
    shake = Math.max(0, shake - dt * 1.5);
    flash = Math.max(0, flash - dt);
    coldFlash = Math.max(0, coldFlash - dt);
    shownScore += (score - shownScore) * Math.min(1, dt * 12);

    // snowflakes always fall
    const blowing = bliz.phase === 'blow';
    for (const f of flakes) {
      const wx = blowing ? bliz.dir * 260 : Math.sin(time * 0.7 + f.ph) * 14;
      f.x += wx * dt * (f.r / 2.2);
      f.y += f.sp * dt * (blowing ? 2.2 : 1);
      if (f.y > H + 20) { f.y = rand(-60, -10); f.x = rand(-40, W + 40); }
      if (f.x > W + 60) f.x -= W + 120; if (f.x < -60) f.x += W + 120;
    }

    if (state === 'count') {
      const n = 3 - Math.floor(stT / 0.7);
      if (n !== lastCount) { lastCount = n; sfx.count(n <= 0); }
      if (stT >= 2.8) { state = 'play'; stT = 0; addFloat(W / 2, 300, 'コロッケを キャッチ！', '#FFE7A8', 22); }
      updateKid(dt, false);
    } else if (state === 'play') {
      playT += dt;
      updateKid(dt, true);
      updateBliz(dt);
      updateSpawns(dt);
      updateItems(dt);
      // ひえる
      let rate = lerp(D.cool[0], D.cool[1], progress());
      if (bliz.phase === 'blow') rate = kid.inside ? 0 : rate * D.bliz.mult;
      if (poka > 0) { rate = 0; poka -= dt; }
      warmth = Math.max(0, warmth - rate * dt);
      if (warmth < 25) {
        kid.shiverT -= dt;
        if (kid.shiverT <= 0) { kid.shiverT = 0.9; sfx.shiver(); }
      }
      if (warmth <= 0) { endGame(false); }
      else if (playT >= D.time) { endGame(true); }
    } else if (state === 'clear' || state === 'frozen' || state === 'over') {
      if (state === 'clear') { kid.munch = 0; updateKid(dt, false); }
      updateItems(dt, true);
      if (bliz.phase !== 'idle') { bliz.rise = Math.max(0, bliz.rise - dt); if (bliz.rise <= 0) bliz.phase = 'idle'; }
    }

    for (const f of floats) { f.t += dt; f.y -= 34 * dt; }
    floats = floats.filter(f => f.t < 1.2);
    for (const p of parts) {
      p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.kind === 'puff') { p.vx *= 0.96; p.r += dt * 8; } else p.vy += 380 * dt;
    }
    parts = parts.filter(p => p.t < p.life);
  }

  function updateKid(dt, canMove) {
    kid.munch = Math.max(0, kid.munch - dt);
    kid.hurt = Math.max(0, kid.hurt - dt);
    kid.stun = Math.max(0, kid.stun - dt);
    let want = 0;
    const speed = 420;
    if (canMove && kid.stun <= 0) {
      if (input.target !== null) {
        const dx = input.target - kid.x;
        want = clamp(dx * 9, -speed, speed);
        if (Math.abs(dx) < 2) want = 0;
      } else {
        want = (input.right ? speed : 0) - (input.left ? speed : 0);
      }
    }
    kid.vx = lerp(kid.vx, want, Math.min(1, dt * 16));
    if (Math.abs(kid.vx) > 20) kid.face = Math.sign(kid.vx);
    kid.x += kid.vx * dt;
    // ふぶきの かぜ
    if (canMove && bliz.phase === 'blow' && D.wind && !kid.inside) kid.x += bliz.dir * D.wind * dt;
    kid.x = clamp(kid.x, 22, W - 22);
    // いき
    kid.breath -= dt;
    if (kid.breath <= 0 && state !== 'frozen') {
      kid.breath = warmth < 40 ? 0.9 : 1.6;
      parts.push({ x: kid.x + kid.face * 12, y: GROUND - 60, vx: kid.face * 30, vy: -18, life: 0.9, t: 0, color: 'rgba(235,245,255,0.7)', r: 4, kind: 'puff' });
    }
    kid.inside = bliz.phase !== 'idle' && bliz.rise >= 1 && Math.abs(kid.x - bliz.kx) < 34;
  }

  function updateBliz(dt) {
    const B = D.bliz;
    if (bliz.phase === 'idle') {
      bliz.next -= dt;
      if (bliz.next <= 0 && playT < D.time - B.len - 3) {
        bliz.phase = 'warn'; bliz.t = 0;
        bliz.dir = Math.random() < 0.5 ? -1 : 1;
        // かまくらは ちょっと はなれた ところに
        let kx;
        for (let k = 0; k < 10; k++) { kx = rand(60, W - 60); if (Math.abs(kx - kid.x) > 90) break; }
        bliz.kx = kx; bliz.everIn = false;
        sfx.warn();
        addFloat(W / 2, 250, 'ふぶきが くるよ！', '#FFFFFF', 26);
      }
    } else if (bliz.phase === 'warn') {
      bliz.t += dt; bliz.rise = Math.min(1, bliz.rise + dt * 1.6);
      if (bliz.t >= 2.4) { bliz.phase = 'blow'; bliz.t = 0; sfx.wind(); }
    } else if (bliz.phase === 'blow') {
      bliz.t += dt;
      if (kid.inside) bliz.everIn = true;
      if (Math.floor((bliz.t - dt) / 1.5) !== Math.floor(bliz.t / 1.5) && bliz.t < B.len - 0.5) sfx.wind();
      if (bliz.t >= B.len) {
        bliz.phase = 'end'; bliz.t = 0;
        if (kid.inside) {
          safes++; score += 200;
          addFloat(bliz.kx, GROUND - 120, 'かまくら セーフ！ +200', '#FFE7A8', 20);
          sfx.safe();
        }
        bliz.next = B.every;
      }
    } else if (bliz.phase === 'end') {
      bliz.t += dt;
      if (bliz.t > 1) bliz.rise = Math.max(0, bliz.rise - dt * 1.4);
      if (bliz.rise <= 0) bliz.phase = 'idle';
    }
  }

  function updateSpawns(dt) {
    const p = progress();
    croqT -= dt;
    if (croqT <= 0) { spawnCroq(); croqT = lerp(D.croq[0], D.croq[1], p) * rand(0.8, 1.2); }
    const sr = lerp(D.snow[0], D.snow[1], p);
    if (sr > 0) {
      snowT -= dt;
      if (snowT <= 0) { spawnSnow(); snowT = (1 / sr) * rand(0.7, 1.3); }
    }
    const ir = lerp(D.ice[0], D.ice[1], p);
    if (ir > 0) {
      iceT -= dt;
      if (iceT <= 0) { spawnIce(); iceT = (1 / ir) * rand(0.7, 1.3); }
    }
  }

  function kamakuraBlocks(it) {
    return bliz.phase !== 'idle' && bliz.rise >= 0.8 && Math.abs(it.x - bliz.kx) < 46 && it.y > GROUND - 62;
  }

  function updateItems(dt, frozenWorld = false) {
    const blowing = bliz.phase === 'blow';
    const reach = D.reach;
    for (const it of items) {
      it.t += dt;
      if (it.type === 'ice' && it.st === 'warn') {
        if (it.t >= 0.85) { it.st = 'fall'; it.vy = 380; it.t = 0; }
        continue;
      }
      if (it.st === 'fall') {
        let vx = it.vx;
        if (it.type === 'croq' || it.type === 'gold') { vx += Math.sin(it.t * 2.2 + it.sway) * 22; it.rot += it.spin * dt; }
        if (it.type === 'snow') it.rot += it.spin * dt;
        if (blowing && it.type !== 'ice') vx += bliz.dir * 70;
        it.x += vx * dt; it.y += it.vy * dt;
        if (it.type === 'ice') it.vy += 500 * dt;
        it.x = clamp(it.x, 14, W - 14);
        if (!frozenWorld && state === 'play') {
          // あたり判定
          const dx = Math.abs(it.x - kid.x);
          const top = GROUND - 92, bot = GROUND - 14;
          if (it.type === 'croq' || it.type === 'gold') {
            if (dx < reach && it.y > top && it.y < bot) { catchCroq(it, false); it.dead = true; continue; }
          } else {
            const hr = it.type === 'ice' ? 16 : it.r + 10;
            if (kamakuraBlocks(it)) { burst(it.x, it.y, '#FFFFFF', 8, 120); it.dead = true; continue; }
            if (dx < hr && it.y > top + 8 && it.y < bot) { hitKid(it); it.dead = true; continue; }
          }
        }
        if (it.y >= GROUND - 10) {
          if (it.type === 'croq') {
            it.st = 'ground'; it.t = 0; it.y = GROUND - 10; it.rot = rand(-0.08, 0.08);
            if (state === 'play' && combo > 0) { if (combo >= 3) addFloat(it.x, GROUND - 40, 'あっ…', '#BFD8FF', 15); combo = 0; }
            sfx.land(); burst(it.x, GROUND - 6, '#FFFFFF', 5, 80);
          } else if (it.type === 'gold') {
            burst(it.x, GROUND - 8, '#FFD25A', 10, 120, 'star'); it.dead = true;
          } else {
            burst(it.x, GROUND - 6, it.type === 'ice' ? '#BFEFFF' : '#FFFFFF', 9, 130, it.type === 'ice' ? 'shard' : 'dot');
            if (it.type === 'ice') sfx.land();
            it.dead = true;
          }
        }
      } else if (it.st === 'ground') {
        it.heat = clamp(1 - it.t / 3.2, 0, 1);
        if (!frozenWorld && state === 'play' && Math.abs(it.x - kid.x) < 26) { catchCroq(it, true); it.dead = true; continue; }
        if (it.t > 4.2) it.dead = true;
      }
    }
    items = items.filter(i => !i.dead);
  }

  // ---------- drawing ----------
  function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h); }

  function drawSky() {
    // full screen (device space already scaled) so letterbox areas are filled
    const p = state === 'title' ? 0 : progress();
    const dawn = clamp((p - 0.6) / 0.4, 0, 1);
    const top = mixHex('#0B1530', '#3C5C9E', dawn);
    const mid = mixHex('#1B2C5C', '#8FA7D8', dawn);
    const hor = mixHex('#2F4A86', '#FFC08A', dawn);
    const y0 = -oy / scale, y1 = (ch - oy) / scale;
    const g = ctx.createLinearGradient(0, y0, 0, GROUND);
    g.addColorStop(0, top); g.addColorStop(0.6, mid); g.addColorStop(1, hor);
    ctx.fillStyle = g; ctx.fillRect(-ox / scale - 2, y0 - 2, cw / scale + 4, GROUND - y0 + 4);
    // stars
    const sa = 1 - dawn;
    if (sa > 0.02) {
      for (const s of stars) {
        ctx.globalAlpha = sa * (0.5 + 0.5 * Math.sin(time * 2 + s.tw));
        ctx.fillStyle = '#FFF8DC';
        ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, TAU); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
    // moon goes down, sun comes up
    const mx = lerp(320, 390, p), my = lerp(190, 420, p);
    ctx.globalAlpha = 1 - dawn * 0.7;
    ctx.fillStyle = '#FFF4C8';
    ctx.beginPath(); ctx.arc(mx, my, 24, 0, TAU); ctx.fill();
    ctx.fillStyle = mixHex('#1B2C5C', '#8FA7D8', dawn);
    ctx.beginPath(); ctx.arc(mx + 10, my - 6, 20, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
    if (dawn > 0) {
      const sy = lerp(GROUND + 30, GROUND - 120, dawn);
      const sg = ctx.createRadialGradient(70, sy, 4, 70, sy, 90);
      sg.addColorStop(0, 'rgba(255,220,140,' + (0.9 * dawn) + ')'); sg.addColorStop(1, 'rgba(255,200,120,0)');
      ctx.fillStyle = sg; ctx.fillRect(-20, sy - 90, 180, 180);
      ctx.fillStyle = 'rgba(255,170,80,' + dawn + ')';
      ctx.beginPath(); ctx.arc(70, sy, 26, 0, TAU); ctx.fill();
    }
  }

  function drawScenery() {
    const p = state === 'title' ? 0 : progress();
    const dawn = clamp((p - 0.6) / 0.4, 0, 1);
    // far hills
    ctx.fillStyle = mixHex('#3B5592', '#B9C9EA', dawn);
    ctx.beginPath(); ctx.moveTo(-60, GROUND - 40);
    for (let x = -60; x <= W + 60; x += 20) ctx.lineTo(x, GROUND - 70 - Math.sin(x * 0.014) * 30 - Math.sin(x * 0.031 + 1) * 12);
    ctx.lineTo(W + 60, GROUND); ctx.lineTo(-60, GROUND); ctx.fill();
    // little house with warm window
    const hx = 180, hy = GROUND - 52;
    ctx.fillStyle = mixHex('#2A3B66', '#7D8DB5', dawn);
    ctx.fillRect(hx, hy, 46, 30);
    ctx.fillStyle = '#F4F8FF';
    ctx.beginPath(); ctx.moveTo(hx - 8, hy + 2); ctx.lineTo(hx + 23, hy - 20); ctx.lineTo(hx + 54, hy + 2); ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,200,90,' + (0.95 - dawn * 0.6) + ')';
    ctx.fillRect(hx + 9, hy + 9, 11, 10); ctx.fillRect(hx + 27, hy + 9, 11, 10);
    // trees
    for (const t of trees) {
      const s = t.s, bx = t.x, by = GROUND - 26;
      ctx.fillStyle = '#5A3A22'; ctx.fillRect(bx - 3 * s, by - 6 * s, 6 * s, 16 * s);
      for (let k = 0; k < 3; k++) {
        const w = (34 - k * 8) * s, yy = by - 6 * s - k * 18 * s;
        ctx.fillStyle = mixHex('#1E4A44', '#4F7F6E', dawn);
        ctx.beginPath(); ctx.moveTo(bx - w / 2, yy); ctx.lineTo(bx, yy - 28 * s); ctx.lineTo(bx + w / 2, yy); ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#F4F8FF';
        ctx.beginPath(); ctx.moveTo(bx - w / 4, yy - 13 * s); ctx.lineTo(bx, yy - 28 * s); ctx.lineTo(bx + w / 4, yy - 13 * s); ctx.quadraticCurveTo(bx, yy - 10 * s, bx - w / 4, yy - 13 * s); ctx.fill();
      }
    }
    // ground (extends to bottom of screen)
    const yb = (ch - oy) / scale;
    const g = ctx.createLinearGradient(0, GROUND - 20, 0, GROUND + 60);
    g.addColorStop(0, '#F4F8FF'); g.addColorStop(1, '#C9D8F0');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.moveTo(-ox / scale - 2, GROUND - 14);
    for (let x = -60; x <= W + 60; x += 25) ctx.lineTo(x, GROUND - 14 + Math.sin(x * 0.05) * 3);
    ctx.lineTo(cw / scale + 2, GROUND - 14); ctx.lineTo(cw / scale + 2, yb + 2); ctx.lineTo(-ox / scale - 2, yb + 2); ctx.closePath(); ctx.fill();
  }

  function drawFlakes(front) {
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    const blowing = bliz.phase === 'blow';
    for (let i = front ? 0 : 1; i < flakes.length; i += 2) {
      const f = flakes[i];
      if (blowing) {
        ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = f.r * 0.8; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(f.x, f.y); ctx.lineTo(f.x - bliz.dir * f.r * 6, f.y - f.r * 2); ctx.stroke();
      } else {
        ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, TAU); ctx.fill();
      }
    }
  }

  function drawKamakura() {
    if (bliz.phase === 'idle' && bliz.rise <= 0) return;
    const r = bliz.rise, x = bliz.kx;
    ctx.save();
    ctx.translate(x, GROUND - 10);
    ctx.scale(1, Math.max(0.01, r));
    // dome
    const g = ctx.createRadialGradient(-14, -44, 6, 0, -20, 64);
    g.addColorStop(0, '#FFFFFF'); g.addColorStop(1, '#C8D8F2');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.ellipse(0, 0, 52, 58, 0, Math.PI, TAU); ctx.fill();
    ctx.strokeStyle = 'rgba(150,175,215,0.7)'; ctx.lineWidth = 2;
    for (let k = 1; k <= 2; k++) { ctx.beginPath(); ctx.ellipse(0, 0, 52, 58 * k / 3, 0, Math.PI * 1.08, Math.PI * 1.92); ctx.stroke(); }
    // door (warm glow when kid inside)
    ctx.fillStyle = kid.inside ? '#F2A04A' : '#25386A';
    ctx.beginPath(); ctx.ellipse(0, 0, 22, 34, 0, Math.PI, TAU); ctx.fill();
    ctx.restore();
  }

  function drawKamakuraArrow() {
    if (!(bliz.phase === 'warn' || bliz.phase === 'blow') || kid.inside || state !== 'play') return;
    const x = bliz.kx, y = GROUND - 92 + Math.sin(time * 8) * 6;
    ctx.save();
    ctx.fillStyle = '#FFD25A'; ctx.strokeStyle = '#1F3A68'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(x - 14, y - 16); ctx.lineTo(x + 14, y - 16); ctx.lineTo(x + 14, y - 4); ctx.lineTo(x + 24, y - 4); ctx.lineTo(x, y + 16); ctx.lineTo(x - 24, y - 4); ctx.lineTo(x - 14, y - 4); ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.font = '800 14px ' + FB; ctx.textAlign = 'center';
    ctx.lineWidth = 4; ctx.strokeText('ここに にげて！', x, y - 24);
    ctx.fillStyle = '#FFFFFF'; ctx.fillText('ここに にげて！', x, y - 24);
    ctx.restore();
  }

  function drawCroq(it) {
    const img = it.type === 'gold' ? spr.gold : (it.st === 'ground' && it.heat < 0.6 ? spr.cold : spr.hot);
    const w = it.w, h = w * IMG_H / IMG_W;
    let alpha = 1;
    if (it.st === 'ground' && it.t > 3.4) alpha = Math.max(0, 1 - (it.t - 3.4) / 0.8) * (Math.sin(it.t * 30) > 0 ? 1 : 0.5);
    ctx.save();
    ctx.globalAlpha = alpha;
    // glow
    if (it.type === 'gold') {
      const g = ctx.createRadialGradient(it.x, it.y, 4, it.x, it.y, 46);
      g.addColorStop(0, 'rgba(255,220,90,0.6)'); g.addColorStop(1, 'rgba(255,220,90,0)');
      ctx.fillStyle = g; ctx.fillRect(it.x - 50, it.y - 50, 100, 100);
    } else if (it.st === 'fall') {
      const g = ctx.createRadialGradient(it.x, it.y, 4, it.x, it.y, 38);
      g.addColorStop(0, 'rgba(255,150,60,0.35)'); g.addColorStop(1, 'rgba(255,150,60,0)');
      ctx.fillStyle = g; ctx.fillRect(it.x - 40, it.y - 40, 80, 80);
    }
    // steam
    const heat = it.st === 'ground' ? it.heat : 1;
    if (heat > 0.15) {
      ctx.strokeStyle = 'rgba(255,255,255,' + (0.75 * heat) + ')'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
      for (let k = -1; k <= 1; k++) {
        const sx = it.x + k * 12, ph = time * 5 + k * 1.7;
        ctx.beginPath();
        for (let s = 0; s <= 6; s++) {
          const yy = it.y - h / 2 - 4 - s * 3.5;
          const xx = sx + Math.sin(ph + s * 0.9) * 3.5;
          s === 0 ? ctx.moveTo(xx, yy) : ctx.lineTo(xx, yy);
        }
        ctx.stroke();
      }
    }
    ctx.translate(it.x, it.y); ctx.rotate(it.rot || 0);
    if (img) ctx.drawImage(img, -w / 2, -h / 2, w, h);
    else { ctx.fillStyle = '#C97A2A'; ctx.beginPath(); ctx.ellipse(0, 0, w / 2, h / 2, 0, 0, TAU); ctx.fill(); }
    ctx.restore();
    if (it.type === 'gold') {
      for (let k = 0; k < 3; k++) {
        const a = time * 3 + k * TAU / 3;
        drawSpark(it.x + Math.cos(a) * 32, it.y + Math.sin(a) * 20, 4 + Math.sin(time * 9 + k) * 1.5, '#FFF2A8');
      }
    }
  }

  function drawSpark(x, y, r, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    for (let i = 0; i < 8; i++) {
      const a = i * Math.PI / 4, rr2 = i % 2 ? r * 0.35 : r;
      ctx.lineTo(x + Math.cos(a) * rr2, y + Math.sin(a) * rr2);
    }
    ctx.closePath(); ctx.fill();
  }

  function drawSnowball(it) {
    ctx.save(); ctx.translate(it.x, it.y); ctx.rotate(it.rot);
    const g = ctx.createRadialGradient(-it.r * 0.35, -it.r * 0.4, 1, 0, 0, it.r);
    g.addColorStop(0, '#FFFFFF'); g.addColorStop(1, '#BFD3F0');
    ctx.fillStyle = g; ctx.strokeStyle = '#7F9CC8'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(0, 0, it.r, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(127,156,200,0.5)';
    ctx.beginPath(); ctx.arc(it.r * 0.3, it.r * 0.25, 2, 0, TAU); ctx.arc(-it.r * 0.25, it.r * 0.4, 1.5, 0, TAU); ctx.fill();
    ctx.restore();
  }

  function drawIce(it) {
    if (it.st === 'warn') {
      const a = Math.sin(it.t * 30) > 0 ? 1 : 0.4;
      ctx.save(); ctx.globalAlpha = a;
      ctx.fillStyle = '#D83A4E'; ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(it.x, 116); ctx.lineTo(it.x + 16, 144); ctx.lineTo(it.x - 16, 144); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#FFFFFF'; ctx.font = '400 18px ' + FD; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('!', it.x, 134);
      ctx.restore();
      return;
    }
    const L = it.len;
    const g = ctx.createLinearGradient(it.x - 8, 0, it.x + 8, 0);
    g.addColorStop(0, '#E8FBFF'); g.addColorStop(0.5, '#9EE0F5'); g.addColorStop(1, '#5DB8DD');
    ctx.fillStyle = g; ctx.strokeStyle = '#3F8DB8'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(it.x - 9, it.y - L); ctx.lineTo(it.x + 9, it.y - L); ctx.lineTo(it.x, it.y); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,0.8)';
    ctx.beginPath(); ctx.moveTo(it.x - 4, it.y - L + 4); ctx.lineTo(it.x - 1, it.y - 10); ctx.stroke();
  }

  function drawKid() {
    const x = kid.x, y = GROUND - 10;
    const cold = clamp(1 - warmth / 60, 0, 1);
    const frozen = state === 'frozen' || (state === 'over' && warmth <= 0);
    let jx = 0;
    if (!frozen && warmth < 25 && state === 'play') jx = Math.sin(time * 60) * 1.6;
    if (kid.hurt > 0) jx = Math.sin(time * 70) * 3;
    const walk = Math.abs(kid.vx) > 30 ? Math.sin(time * 16) : 0;
    const bob = Math.abs(walk) * 2;
    const f = kid.face;
    ctx.save();
    ctx.translate(x + jx, 0);

    // shadow
    ctx.fillStyle = 'rgba(40,60,110,0.22)';
    ctx.beginPath(); ctx.ellipse(0, y + 2, 26, 6, 0, 0, TAU); ctx.fill();

    // ぽかぽか aura
    if (poka > 0) {
      const a = Math.min(1, poka) * (0.55 + 0.15 * Math.sin(time * 10));
      const g = ctx.createRadialGradient(0, y - 46, 10, 0, y - 46, 70);
      g.addColorStop(0, 'rgba(255,190,80,' + a + ')'); g.addColorStop(1, 'rgba(255,150,60,0)');
      ctx.fillStyle = g; ctx.fillRect(-75, y - 120, 150, 150);
    }

    // boots
    ctx.fillStyle = '#7A4210';
    rr(-17, y - 10 - (walk > 0 ? 3 : 0), 14, 11, 4); ctx.fill();
    rr(3, y - 10 - (walk < 0 ? 3 : 0), 14, 11, 4); ctx.fill();

    const by = y - bob;
    // parka body
    const parka = '#1F3A68';
    ctx.fillStyle = parka;
    rr(-22, by - 50, 44, 44, 16); ctx.fill();
    // zipper + buttons
    ctx.strokeStyle = '#3E5E98'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, by - 40); ctx.lineTo(0, by - 8); ctx.stroke();
    ctx.fillStyle = '#F4F8FF';
    rr(-22, by - 12, 44, 7, 3); ctx.fill();

    // arms / mittens
    const munch = kid.munch > 0;
    ctx.fillStyle = parka;
    ctx.lineCap = 'round';
    ctx.strokeStyle = parka; ctx.lineWidth = 11;
    if (munch) {
      ctx.beginPath(); ctx.moveTo(-17, by - 40); ctx.lineTo(-8, by - 58); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(17, by - 40); ctx.lineTo(8, by - 58); ctx.stroke();
    } else {
      const sw = walk * 4;
      ctx.beginPath(); ctx.moveTo(-18, by - 40); ctx.lineTo(-25, by - 20 + sw); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(18, by - 40); ctx.lineTo(25, by - 20 - sw); ctx.stroke();
    }
    ctx.fillStyle = '#D83A4E';
    if (munch) {
      ctx.beginPath(); ctx.arc(-7, by - 60, 6.5, 0, TAU); ctx.arc(7, by - 60, 6.5, 0, TAU); ctx.fill();
    } else {
      ctx.beginPath(); ctx.arc(-26, by - 18 + walk * 4, 6.5, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(26, by - 18 - walk * 4, 6.5, 0, TAU); ctx.fill();
    }

    // hood
    const hy = by - 66;
    ctx.fillStyle = parka;
    ctx.beginPath(); ctx.arc(0, hy, 23, 0, TAU); ctx.fill();
    // face
    const skin = mixHex('#FFDDBE', '#CFE2FF', cold);
    ctx.fillStyle = skin;
    ctx.beginPath(); ctx.arc(f * 2, hy + 2, 16.5, 0, TAU); ctx.fill();
    // fur trim
    ctx.strokeStyle = '#F7F2E6'; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.arc(f * 2, hy + 2, 18.5, 0, TAU); ctx.stroke();
    // pompom (koromo color)
    ctx.fillStyle = '#E8A53E';
    ctx.beginPath(); ctx.arc(0, hy - 24, 6, 0, TAU); ctx.fill();
    // scarf
    ctx.fillStyle = '#E8A53E';
    rr(-17, by - 52, 34, 9, 4); ctx.fill();
    const flap = Math.sin(time * 9) * (bliz.phase === 'blow' ? 6 : 2);
    const tail = bliz.phase === 'blow' ? bliz.dir : -f;
    ctx.beginPath(); ctx.moveTo(tail * 10, by - 48); ctx.lineTo(tail * 30, by - 42 + flap); ctx.lineTo(tail * 28, by - 34 + flap); ctx.lineTo(tail * 6, by - 43); ctx.closePath(); ctx.fill();

    // eyes / mouth
    const ex = f * 3;
    ctx.fillStyle = '#142849'; ctx.strokeStyle = '#142849'; ctx.lineWidth = 2.2; ctx.lineCap = 'round';
    if (frozen) {
      ctx.beginPath(); ctx.moveTo(ex - 10, hy); ctx.lineTo(ex - 4, hy); ctx.moveTo(ex + 4, hy); ctx.lineTo(ex + 10, hy); ctx.stroke();
    } else if (munch || poka > 0) {
      // happy closed eyes
      ctx.beginPath(); ctx.arc(ex - 7, hy + 1, 3.5, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
      ctx.beginPath(); ctx.arc(ex + 7, hy + 1, 3.5, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
    } else if (kid.hurt > 0 || kid.stun > 0) {
      ctx.beginPath(); ctx.moveTo(ex - 10, hy - 3); ctx.lineTo(ex - 5, hy); ctx.lineTo(ex - 10, hy + 3); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(ex + 10, hy - 3); ctx.lineTo(ex + 5, hy); ctx.lineTo(ex + 10, hy + 3); ctx.stroke();
    } else {
      ctx.beginPath(); ctx.arc(ex - 7, hy, 2.6, 0, TAU); ctx.arc(ex + 7, hy, 2.6, 0, TAU); ctx.fill();
    }
    // cheeks
    if (cold < 0.6) {
      ctx.fillStyle = 'rgba(232,90,100,' + (0.5 - cold * 0.7) + ')';
      ctx.beginPath(); ctx.arc(ex - 11, hy + 7, 3.6, 0, TAU); ctx.arc(ex + 11, hy + 7, 3.6, 0, TAU); ctx.fill();
    }
    // mouth
    const my = hy + 9;
    if (munch) {
      ctx.fillStyle = '#9A3030';
      ctx.beginPath(); ctx.ellipse(ex, my, 4.5, 3.5 + Math.abs(Math.sin(kid.munch * 30)) * 2, 0, 0, TAU); ctx.fill();
    } else if (cold > 0.55 && !frozen) {
      ctx.beginPath(); ctx.moveTo(ex - 6, my);
      for (let k = 1; k <= 4; k++) ctx.lineTo(ex - 6 + k * 3, my + (k % 2 ? -2 : 1.5));
      ctx.stroke();
    } else if (frozen) {
      ctx.beginPath(); ctx.moveTo(ex - 4, my); ctx.lineTo(ex + 4, my); ctx.stroke();
    } else {
      ctx.beginPath(); ctx.arc(ex, my - 2, 4.5, 0.2 * Math.PI, 0.8 * Math.PI); ctx.stroke();
    }
    // nose drip when very cold
    if (cold > 0.75 && !frozen) {
      ctx.fillStyle = 'rgba(170,215,255,0.9)';
      ctx.beginPath(); ctx.ellipse(ex + f * 1, hy + 6 + Math.abs(Math.sin(time * 2)) * 2, 1.6, 2.6, 0, 0, TAU); ctx.fill();
    }
    // croquette at mouth while munching
    if (munch && spr.hot) {
      ctx.drawImage(spr.hot, ex - 16, hy + 8, 32, 32 * IMG_H / IMG_W);
    }

    // stun stars
    if (kid.stun > 0) {
      for (let k = 0; k < 3; k++) {
        const a = time * 6 + k * TAU / 3;
        drawSpark(Math.cos(a) * 22, hy - 28 + Math.sin(a) * 6, 5, '#FFE45A');
      }
    }
    // frozen ice block
    if (frozen) {
      ctx.fillStyle = 'rgba(170,225,255,0.55)'; ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = 2.5;
      rr(-34, y - 100, 68, 104, 8); ctx.fill(); ctx.stroke();
      ctx.strokeStyle = 'rgba(255,255,255,0.7)';
      ctx.beginPath(); ctx.moveTo(-24, y - 88); ctx.lineTo(-14, y - 70); ctx.moveTo(18, y - 30); ctx.lineTo(26, y - 16); ctx.stroke();
    }
    ctx.restore();
  }

  function drawThermo(x, y, w, h) {
    // ぬくぬくゲージ
    ctx.fillStyle = 'rgba(255,253,246,0.95)'; ctx.strokeStyle = '#1F3A68'; ctx.lineWidth = 3;
    rr(x, y, w, h, h / 2); ctx.fill(); ctx.stroke();
    const iw = w - 10, ih = h - 10;
    const v = warmth / 100;
    const g = ctx.createLinearGradient(x + 5, 0, x + 5 + iw, 0);
    g.addColorStop(0, '#5AA9F0'); g.addColorStop(0.35, '#9BD0F5'); g.addColorStop(0.55, '#F6C352'); g.addColorStop(1, '#E8543E');
    ctx.save();
    rr(x + 5, y + 5, iw, ih, ih / 2); ctx.clip();
    ctx.fillStyle = '#DCE6F3'; ctx.fillRect(x + 5, y + 5, iw, ih);
    ctx.fillStyle = g; ctx.fillRect(x + 5, y + 5, iw * v, ih);
    if (warmth < 25 && Math.sin(time * 12) > 0) { ctx.fillStyle = 'rgba(255,255,255,0.45)'; ctx.fillRect(x + 5, y + 5, iw, ih); }
    ctx.restore();
    // label
    ctx.font = '800 13px ' + FB; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#142849';
    const label = poka > 0 ? 'ぽかぽか むてき！' : warmth >= 80 ? 'ぬくぬく' : warmth >= 45 ? 'まあまあ' : warmth >= 25 ? 'さむい…' : 'こごえちゃう！';
    ctx.fillText(label, x + 14, y + h / 2 + 1);
    // little croquette icon at the end of fill
    if (spr.hot) ctx.drawImage(poka > 0 ? spr.gold : spr.hot, x + 5 + iw * v - 18, y - 6, 36, 36 * IMG_H / IMG_W);
  }

  function drawHUD() {
    // score
    ctx.textBaseline = 'middle';
    ctx.font = '400 26px ' + FD; ctx.textAlign = 'left';
    ctx.lineWidth = 6; ctx.strokeStyle = '#142849'; ctx.lineJoin = 'round';
    const s = Math.round(shownScore).toLocaleString();
    ctx.strokeText(s, 16, 30); ctx.fillStyle = '#FFE7A8'; ctx.fillText(s, 16, 30);
    if (combo >= 2) {
      ctx.font = '800 13px ' + FB;
      ctx.lineWidth = 4; ctx.strokeText(combo + ' れんぞく', 18, 56);
      ctx.fillStyle = '#FFFFFF'; ctx.fillText(combo + ' れんぞく', 18, 56);
    }
    drawThermo(16, 70, W - 32, 30);
    // あさまで
    const p = progress();
    const bx = 60, bw = W - 120, byy = 116;
    ctx.fillStyle = 'rgba(20,40,73,0.55)'; rr(bx, byy - 5, bw, 10, 5); ctx.fill();
    const g = ctx.createLinearGradient(bx, 0, bx + bw, 0);
    g.addColorStop(0, '#4A64A8'); g.addColorStop(1, '#FFB070');
    ctx.fillStyle = g; rr(bx, byy - 5, Math.max(10, bw * p), 10, 5); ctx.fill();
    // moon & sun icons
    ctx.fillStyle = '#FFF4C8'; ctx.beginPath(); ctx.arc(bx - 14, byy, 8, 0, TAU); ctx.fill();
    ctx.fillStyle = '#1B2C5C'; ctx.beginPath(); ctx.arc(bx - 10, byy - 3, 7, 0, TAU); ctx.fill();
    ctx.fillStyle = '#FFB040';
    ctx.beginPath(); ctx.arc(bx + bw + 14, byy, 7, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#FFB040'; ctx.lineWidth = 2;
    for (let k = 0; k < 8; k++) { const a = k * Math.PI / 4; ctx.beginPath(); ctx.moveTo(bx + bw + 14 + Math.cos(a) * 9, byy + Math.sin(a) * 9); ctx.lineTo(bx + bw + 14 + Math.cos(a) * 12, byy + Math.sin(a) * 12); ctx.stroke(); }
    ctx.font = '800 11px ' + FB; ctx.textAlign = 'center'; ctx.fillStyle = '#FFFFFF';
    ctx.lineWidth = 3; ctx.strokeStyle = '#142849';
    const left = Math.max(0, Math.ceil(D.time - playT));
    ctx.strokeText('あさまで あと ' + left + ' びょう', W / 2, byy + 16);
    ctx.fillText('あさまで あと ' + left + ' びょう', W / 2, byy + 16);
  }

  function drawBlizBanner() {
    if (state !== 'play') return;
    if (bliz.phase === 'warn' && Math.sin(time * 14) > -0.3) {
      ctx.save();
      ctx.fillStyle = 'rgba(216,58,78,0.9)'; rr(40, 160, W - 80, 40, 12); ctx.fill();
      ctx.font = '400 19px ' + FD; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#FFFFFF';
      ctx.fillText('ふぶき！ かまくらへ にげよう', W / 2, 181);
      ctx.restore();
    }
  }

  function drawParticles() {
    for (const p of parts) {
      const a = 1 - p.t / p.life;
      ctx.globalAlpha = a;
      if (p.kind === 'puff') { ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.fill(); }
      else if (p.kind === 'star') drawSpark(p.x, p.y, p.r * 1.6, p.color);
      else if (p.kind === 'shard') { ctx.fillStyle = p.color; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.t * 10); ctx.fillRect(-p.r, -1.5, p.r * 2, 3); ctx.restore(); }
      else { ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.fill(); }
    }
    ctx.globalAlpha = 1;
    for (const f of floats) {
      const a = f.t < 0.9 ? 1 : 1 - (f.t - 0.9) / 0.3;
      ctx.globalAlpha = Math.max(0, a);
      ctx.font = '400 ' + f.size + 'px ' + FD; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.lineWidth = 5; ctx.strokeStyle = '#142849'; ctx.lineJoin = 'round';
      ctx.strokeText(f.text, f.x, f.y); ctx.fillStyle = f.color; ctx.fillText(f.text, f.x, f.y);
    }
    ctx.globalAlpha = 1;
  }

  function drawCountdown() {
    if (state !== 'count') return;
    const n = 3 - Math.floor(stT / 0.7);
    const k = (stT % 0.7) / 0.7;
    const txt = n > 0 ? String(n) : 'スタート！';
    ctx.save();
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.globalAlpha = n > 0 ? 1 - k * 0.6 : 1;
    ctx.font = '400 ' + Math.round((n > 0 ? 96 : 56) * (1.3 - k * 0.3)) + 'px ' + FD;
    ctx.lineWidth = 10; ctx.strokeStyle = '#1F3A68'; ctx.lineJoin = 'round'; ctx.strokeText(txt, W / 2, H / 2 - 40);
    ctx.fillStyle = '#E8A53E'; ctx.fillText(txt, W / 2, H / 2 - 40);
    ctx.restore();
  }

  function draw() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    let sx = 0, sy = 0;
    if (shake > 0) { sx = (Math.random() - 0.5) * 12 * shake; sy = (Math.random() - 0.5) * 12 * shake; }
    ctx.translate(ox + sx, oy + sy);
    ctx.scale(scale, scale);
    drawSky();
    drawFlakes(false);
    drawScenery();
    drawKamakura();
    for (const it of items) if (it.st === 'ground') drawCroq(it);
    drawKid();
    for (const it of items) {
      if (it.st === 'ground') continue;
      if (it.type === 'croq' || it.type === 'gold') drawCroq(it);
      else if (it.type === 'snow') drawSnowball(it);
      else drawIce(it);
    }
    drawParticles();
    drawFlakes(true);
    const vw = cw / scale, vh = ch / scale, vx = -ox / scale, vy = -oy / scale;
    if (bliz.phase === 'blow') {
      ctx.fillStyle = 'rgba(230,240,255,' + (kid.inside ? 0.22 : 0.35) + ')'; ctx.fillRect(vx - 10, vy - 10, vw + 20, vh + 20);
    }
    // cold vignette
    const cold = state === 'title' ? 0 : clamp(1 - warmth / 35, 0, 1) * 0.6 + coldFlash;
    if (cold > 0.01) {
      const g = ctx.createRadialGradient(W / 2, H / 2, 140, W / 2, H / 2, 460);
      g.addColorStop(0, 'rgba(150,200,255,0)'); g.addColorStop(1, 'rgba(150,200,255,' + Math.min(0.85, cold) + ')');
      ctx.fillStyle = g; ctx.fillRect(vx - 10, vy - 10, vw + 20, vh + 20);
    }
    if (flash > 0) { ctx.fillStyle = 'rgba(255,220,120,' + flash + ')'; ctx.fillRect(vx - 10, vy - 10, vw + 20, vh + 20); }
    drawKamakuraArrow();
    if (state !== 'title') drawHUD();
    drawBlizBanner();
    drawCountdown();
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
