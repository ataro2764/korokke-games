<title>コロッケめいろ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: one-screen maze. Canvas fills the screen (HUD drawn on top strip); DOM panels float over it. Look: cabbage-hedge maze on a kitchen-tile floor. */
:root {
  --ai: #1F3A68;
  --ai-deep: #142849;
  --koromo: #E8A53E;
  --koromo-dark: #7A4210;
  --beni: #D83A4E;
  --leaf: #4E9A3C;
  --sky: #DDEFD3;
  --paper: #FFFDF6;
  --font-display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  --font-body: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; margin: 0; }
body {
  background: var(--sky); color: var(--ai-deep); font-family: var(--font-body);
  overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
}
#app { position: relative; width: 100%; height: 100%; }
canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.panel {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: min(370px, calc(100% - 32px)); max-height: calc(100% - 24px); overflow: auto;
  background: var(--paper); border: 3px solid var(--ai); border-radius: 20px; box-shadow: 6px 6px 0 var(--ai);
  box-sizing: border-box; padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center;
}
.panel[hidden] { display: none; }
.panel h1 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 2.2rem; line-height: 1.15; color: var(--ai); text-wrap: balance; }
.panel h1 small { display: block; font-size: 0.9rem; color: var(--koromo-dark); letter-spacing: 0.2em; margin-bottom: 4px; }
.panel h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 1.6rem; color: var(--ai); }
.panel p { margin: 0; font-size: 0.95rem; font-weight: 500; }
.hero { display: flex; align-items: center; justify-content: center; gap: 10px; }
.hero canvas { width: 64px; height: 64px; }
.how { display: grid; gap: 6px; width: 100%; font-size: 0.86rem; text-align: left; padding: 10px 12px; background: #EEF6E8; border-radius: 12px; line-height: 1.6; box-sizing: border-box; }
.how b { color: var(--ai); }
.how .hit { color: var(--koromo-dark); }
.how .miss { color: var(--leaf); }
kbd { font-family: var(--font-body); font-weight: 800; font-size: 0.76rem; border: 2px solid var(--ai); border-bottom-width: 3px; border-radius: 6px; padding: 0 5px; background: #fff; }
.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
.btn {
  font-family: var(--font-display); font-size: 1.25rem; color: var(--ai-deep); background: var(--koromo);
  border: 3px solid var(--ai); border-radius: 999px; padding: 10px 26px; box-shadow: 0 5px 0 var(--ai); cursor: pointer;
  transition: transform .08s, box-shadow .08s;
}
.btn.mode { border-radius: 16px; padding: 10px 6px 8px; font-size: 1.2rem; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.btn.mode span { font-family: var(--font-body); font-weight: 800; font-size: 0.72rem; color: var(--koromo-dark); }
.btn.mode.easy { background: #A9D98F; }
.btn.mode.easy span { color: #2F6A22; }
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--ai); }
.btn:focus-visible, .sound:focus-visible, .ghost:focus-visible { outline: 3px solid var(--beni); outline-offset: 3px; }
.ghost { font-family: var(--font-body); font-weight: 800; font-size: 0.85rem; background: none; border: none; color: var(--ai); text-decoration: underline; cursor: pointer; padding: 4px; }
.result { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; }
.stat { background: #EEF6E8; border-radius: 12px; padding: 8px 6px; }
.stat span { display: block; font-size: 0.74rem; font-weight: 800; letter-spacing: 0.08em; color: var(--koromo-dark); }
.stat strong { font-family: var(--font-display); font-weight: 400; font-size: 1.5rem; font-variant-numeric: tabular-nums; color: var(--ai); }
.stat.wide { grid-column: 1 / -1; }
.cause { font-family: var(--font-display); color: var(--beni); font-size: 1.05rem; }
.newbest { font-weight: 800; color: var(--beni); font-size: 0.95rem; }
.bestline { font-size: 0.8rem; font-weight: 800; color: var(--koromo-dark); min-height: 1em; }
.sound {
  position: absolute;
  right: max(12px, calc(env(safe-area-inset-right, 0px) + 12px));
  bottom: max(12px, calc(env(safe-area-inset-bottom, 0px) + 12px));
  font-family: var(--font-body); font-weight: 800; font-size: 0.85rem;
  background: var(--paper); color: var(--ai); border: 2px solid var(--ai); border-radius: 999px; padding: 6px 14px; cursor: pointer;
}
.home {
  position: absolute;
  left: max(12px, calc(env(safe-area-inset-left, 0px) + 12px));
  bottom: max(12px, calc(env(safe-area-inset-bottom, 0px) + 12px));
  font-family: var(--font-body); font-weight: 800; font-size: 0.85rem;
  background: var(--paper); color: var(--ai); border: 2px solid var(--ai); border-radius: 999px; padding: 6px 14px; cursor: pointer;
}
.home[hidden] { display: none; }
</style>

<div id="app">
  <canvas id="cv"></canvas>

  <div class="panel" id="titlePanel">
    <h1><small>たからばこを あけろ！</small>コロッケめいろ</h1>
    <div class="how">
      <div>めいろの中の<b>たからばこ</b>をあけよう。<br>あたりは<b class="hit">コロッケ</b>、ハズレは<b class="miss">キャベツ</b>！</div>
      <div>コロッケを<b>ぜんぶ</b>見つけたらステージクリア。ぜんぶで<b>5ステージ</b>、4から先は<b>まっくら</b>だよ。</div>
      <div>うごかす：PC <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> か <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd>、まがりかどまで自動ですすむよ。スマホは<b>コロッケを指でおさえて</b>、そのまま<b>道をなぞって</b>うごかそう。</div>
    </div>
    <div class="modes">
      <button class="btn mode easy" id="easyBtn" type="button">かんたん<span>時間せいげん なし</span></button>
      <button class="btn mode" id="normalBtn" type="button">ふつう<span>時間せいげん あり</span></button>
    </div>
    <div class="bestline" id="bestLine"></div>
  </div>

  <div class="panel" id="clearPanel" hidden>
    <h2 id="clearTitle">ステージ1 クリア！</h2>
    <div class="result" id="clearStats"></div>
    <button class="btn" id="nextBtn" type="button">つぎへ</button>
  </div>

  <div class="panel" id="overPanel" hidden>
    <h2 id="overTitle">ぜんぶクリア！</h2>
    <div class="cause" id="overCause"></div>
    <div class="result" id="overStats"></div>
    <div class="newbest" id="newBest" hidden>ベスト更新！</div>
    <button class="btn" id="retryBtn" type="button">もう一回</button>
    <button class="ghost" id="backBtn" type="button">モードをえらぶ</button>
  </div>

  <button class="home" id="homeBtn" type="button" hidden>やめる</button>
  <button class="sound" id="soundBtn" type="button" aria-pressed="true">音：オン</button>
</div>

  function audio() {

      catch { return null; }
    }

    return ac;
  }
  function tone(freq, dur, vol, type = 'square', slide = 0, delay = 0) {
    const a = audio(); if (!a || !soundOn) return;
    const t = a.currentTime + delay;
    const o = a.createOscillator(); o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), t + dur);
    const g = a.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
  }

  let state = 'title'; // title | play | clear | over
  let mode = 'normal';
  let stageIdx = 0;
  let cols = 0, rows = 0, maze = null, chests = [];
  let cell = 32, viewX = 0, viewY = 0, mazeW = 0, mazeH = 0, follow = false;
  let wallLayer = null;
  let player = null;
  let found = 0, timeLeft = 0, stageTime = 0, elapsed = 0;
  let totalScore = 0, totalTime = 0, totalCabbage = 0, totalKorokke = 0;
  let stageCabbage = 0;
  let popup = null, banner = null;
  let particles = [], floats = [];
  let heldDir = null, nextDir = null;
  let steps = [];   // directions traced by the finger, walked in order
  let grab = null;  // finger holding the croquette
  let hintT = 0;
  let shakeT = 0, lastTick = -1;

  function rnd(n) { return Math.floor(Math.random() * n); }
  function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }

  function genMaze(c, r) {
    const m = new Uint8Array(c * r);
    const seen = new Uint8Array(c * r);
    const stack = [[rnd(c), rnd(r)]];
    seen[stack[0][1] * c + stack[0][0]] = 1;
    while (stack.length) {
      const [x, y] = stack[stack.length - 1];
      const opts = shuffle(DIR_NAMES.slice()).filter(d => {
        const nx = x + D[d].dx, ny = y + D[d].dy;
        return nx >= 0 && ny >= 0 && nx < c && ny < r && !seen[ny * c + nx];
      });
      if (!opts.length) { stack.pop(); continue; }
      const d = opts[0], nx = x + D[d].dx, ny = y + D[d].dy;
      m[y * c + x] |= D[d].bit; m[ny * c + nx] |= D[D[d].opp].bit;
      seen[ny * c + nx] = 1; stack.push([nx, ny]);
    }
    // open a few extra walls so it is less punishing (small loops)
    const extra = Math.floor(c * r * 0.04);
    for (let k = 0; k < extra; k++) {
      const x = rnd(c), y = rnd(r), d = DIR_NAMES[rnd(4)];
      const nx = x + D[d].dx, ny = y + D[d].dy;
      if (nx < 0 || ny < 0 || nx >= c || ny >= r) continue;
      // keep dead ends (chests live there)
      if (bits(m[y * c + x]) === 1 || bits(m[ny * c + nx]) === 1) continue;
      m[y * c + x] |= D[d].bit; m[ny * c + nx] |= D[D[d].opp].bit;
    }
    return m;
  }
  function bits(v) { return (v & 1) + ((v >> 1) & 1) + ((v >> 2) & 1) + ((v >> 3) & 1); }

  function distances(sx, sy) {
    const dist = new Int16Array(cols * rows).fill(-1);
    const q = [[sx, sy]]; dist[sy * cols + sx] = 0;
    for (let i = 0; i < q.length; i++) {
      const [x, y] = q[i];
      for (const d of DIR_NAMES) {
        if (!(maze[y * cols + x] & D[d].bit)) continue;
        const nx = x + D[d].dx, ny = y + D[d].dy;
        if (dist[ny * cols + nx] < 0) { dist[ny * cols + nx] = dist[y * cols + x] + 1; q.push([nx, ny]); }
      }
    }
    return dist;
  }

  function placeChests(sx, sy, count, need) {
    const dist = distances(sx, sy);
    let cands = [];
    for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
      if (x === sx && y === sy) continue;
      if (bits(maze[y * cols + x]) === 1 && dist[y * cols + x] >= 2) cands.push({ x, y, d: dist[y * cols + x] });
    }
    shuffle(cands);
    const picked = [];
    const minGap = Math.max(2, Math.floor(Math.min(cols, rows) / 3));
    for (const c of cands) {
      if (picked.length >= count) break;
      if (picked.every(p => Math.abs(p.x - c.x) + Math.abs(p.y - c.y) >= minGap)) picked.push(c);
    }
    for (const c of cands) { if (picked.length >= count) break; if (!picked.includes(c)) picked.push(c); }
    // fallback: any far cell
    if (picked.length < count) {
      const rest = [];
      for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++)
        if (dist[y * cols + x] >= 2 && !picked.some(p => p.x === x && p.y === y)) rest.push({ x, y });
      shuffle(rest);
      while (picked.length < count && rest.length) picked.push(rest.pop());
    }
    const prizes = shuffle(picked.map((_, i) => i < need ? 'korokke' : 'cabbage'));
    return picked.map((p, i) => ({ x: p.x, y: p.y, item: prizes[i], open: false, openT: 0 }));
  }

  function setupStage() {
    const st = STAGES[stageIdx];
    const availW = cw - 20, availH = ch - HUD_H - 20;
    const portrait = availH > availW;
    const ratio = Math.min(2.1, Math.max(1, (portrait ? availH / availW : availW / availH)));
    const longN = Math.max(st.n, Math.round(st.n * ratio));
    cols = portrait ? st.n : longN; rows = portrait ? longN : st.n;
    maze = genMaze(cols, rows);
    const sx = Math.floor(cols / 2), sy = Math.floor(rows / 2);
    chests = placeChests(sx, sy, st.chests, st.need);
    player = { cx: sx, cy: sy, dir: null, prog: 0, face: 1, bob: 0, steps: 0 };
    found = 0; stageCabbage = 0; elapsed = 0;
    stageTime = Math.round(25 + cols * rows * 0.45 + (st.dark ? 15 : 0));
    timeLeft = stageTime; lastTick = -1;
    heldDir = null; nextDir = null; steps = []; grab = null; hintT = 0; camReset = true; popup = null; particles = []; floats = [];
    banner = { t: 0, title: `ステージ ${stageIdx + 1}`, sub: `コロッケを ${st.need}こ さがせ！` + (st.dark ? '\nまっくらだよ…' : '') };
    layoutMaze();
  }

  function layoutMaze() {
    const availW = cw - 20, availH = ch - HUD_H - 20;
    cell = Math.floor(Math.min(availW / cols, availH / rows, 96));
    follow = false;
    if (cell < 30) { cell = 30; follow = true; }
    mazeW = cols * cell; mazeH = rows * cell;
    buildWallLayer();
  }

  function buildWallLayer() {
    const pad = Math.ceil(cell * 0.2);
    const w = mazeW + pad * 2, h = mazeH + pad * 2;
    wallLayer = document.createElement('canvas');
    wallLayer.width = Math.round(w * dpr); wallLayer.height = Math.round(h * dpr);
    wallLayer.pad = pad;
    const g = wallLayer.getContext('2d');
    g.scale(dpr, dpr); g.translate(pad, pad);
    // floor tiles
    for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
      g.fillStyle = (x + y) % 2 ? '#FBF3DF' : '#F5E8C8';
      g.fillRect(x * cell, y * cell, cell, cell);
    }
    // walls as a set of segments
    const segs = [];
    for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
      const v = maze[y * cols + x];
      const X = x * cell, Y = y * cell;
      if (!(v & 1)) segs.push([X, Y, X + cell, Y]);
      if (!(v & 8)) segs.push([X, Y, X, Y + cell]);
      if (x === cols - 1 && !(v & 2)) segs.push([X + cell, Y, X + cell, Y + cell]);
      if (y === rows - 1 && !(v & 4)) segs.push([X, Y + cell, X + cell, Y + cell]);
    }
    const lw = Math.max(6, cell * 0.26);
    g.lineCap = 'round';
    const stroke = (color, width, oy) => {
      g.strokeStyle = color; g.lineWidth = width; g.beginPath();
      for (const s of segs) { g.moveTo(s[0], s[1] + oy); g.lineTo(s[2], s[3] + oy); }
      g.stroke();
    };
    stroke('rgba(20,40,73,0.18)', lw, lw * 0.35); // shadow
    stroke('#2F6A22', lw + 3, 0);                 // outline
    stroke('#5DAE48', lw, 0);                     // hedge
    stroke('#8FD06F', lw * 0.38, -lw * 0.12);      // highlight
    // little leaf dots on hedges
    g.fillStyle = '#B7E59A';
    for (const s of segs) {
      const mx = (s[0] + s[2]) / 2, my = (s[1] + s[3]) / 2;
      g.beginPath(); g.arc(mx - lw * 0.1, my - lw * 0.15, lw * 0.12, 0, TAU); g.fill();
    }
  }

  // ---------- flow ----------
  function startGame(m) {
    mode = m; stageIdx = 0;
    totalScore = 0; totalTime = 0; totalCabbage = 0; totalKorokke = 0;
    hideAll(); state = 'play'; $('homeBtn').hidden = false;
    audio(); sfx.start();
    setupStage();
  }
  function hideAll() { ['titlePanel', 'clearPanel', 'overPanel'].forEach(id => $(id).hidden = true); }

  function statHTML(label, value, wide) { return `<div class="stat${wide ? ' wide' : ''}"><span>${label}</span><strong>${value}</strong></div>`; }
  function fmtTime(s) { const m = Math.floor(s / 60), r = Math.floor(s % 60); return m ? `${m}分${String(r).padStart(2, '0')}秒` : `${r}秒`; }

  function stageClear() {
    const st = STAGES[stageIdx];
    totalTime += elapsed; totalKorokke += found; totalCabbage += stageCabbage;
    let stageScore = 0;
    if (mode === 'normal') { stageScore = found * 100 + Math.ceil(timeLeft) * 10; totalScore += stageScore; }
    sfx.clear();
    for (let i = 0; i < 40; i++) burst(player.cx + 0.5, player.cy + 0.5, ['#E8A53E', '#D83A4E', '#5DAE48', '#FFD45C'][i % 4], 1);
    setTimeout(() => {
      if (state !== 'clear') return;
      if (stageIdx === STAGES.length - 1) { gameOver(true); return; }
      $('clearTitle').textContent = `ステージ${stageIdx + 1} クリア！`;
      let html = statHTML('かかった時間', fmtTime(elapsed)) + statHTML('キャベツ', stageCabbage + 'こ');
      if (mode === 'normal') html += statHTML('のこり時間ボーナス', Math.ceil(timeLeft) * 10 + '点') + statHTML('いまの点数', totalScore + '点');
      $('clearStats').innerHTML = html;
      $('clearPanel').hidden = false;
      $('nextBtn').focus({ preventScroll: true });
    }, 900);
    state = 'clear';
  }
  function nextStage() {
    if (state !== 'clear' || $('clearPanel').hidden) return;
    hideAll(); stageIdx++; state = 'play'; sfx.start(); setupStage();
  }

  function gameOver(cleared) {
    state = 'over'; $('homeBtn').hidden = true;
    if (!cleared) { totalTime += elapsed; totalKorokke += found; totalCabbage += stageCabbage; sfx.over(); }
    $('overTitle').textContent = cleared ? 'ぜんぶクリア！' : '時間ぎれ…';
    $('overCause').textContent = cleared ? 'コロッケ、ぜんぶ見つけたね！' : `ステージ${stageIdx + 1}で時間がなくなっちゃった`;
    let html = '', isBest = false;
    if (mode === 'normal') {
      const best = store.get('korokke-meiro-best-normal', 0);
      if (totalScore > best) { store.set('korokke-meiro-best-normal', totalScore); isBest = totalScore > 0; }
      html += statHTML('点数', totalScore + '点') + statHTML('ベスト', Math.max(best, totalScore) + '点');
    } else {
      const best = store.get('korokke-meiro-best-easy', 0);
      if (cleared && (!best || totalTime < best)) { store.set('korokke-meiro-best-easy', totalTime); isBest = true; }
      const nb = cleared && (!best || totalTime < best) ? totalTime : best;
      html += statHTML('ぜんぶの時間', fmtTime(totalTime)) + statHTML('ベスト', nb ? fmtTime(nb) : '—');
    }
    html += statHTML('見つけたコロッケ', totalKorokke + 'こ') + statHTML('あけたキャベツ', totalCabbage + 'こ');
    $('overStats').innerHTML = html;
    $('newBest').hidden = !isBest;
    $('overPanel').hidden = false;
    $('retryBtn').focus({ preventScroll: true });
  }
  function toTitle() {
    hideAll(); state = 'title'; $('homeBtn').hidden = true; maze = null;
    renderBest(); $('titlePanel').hidden = false;
  }
  function renderBest() {
    const bn = store.get('korokke-meiro-best-normal', 0), be = store.get('korokke-meiro-best-easy', 0);
    const parts = [];
    if (be) parts.push(`かんたんベスト ${fmtTime(be)}`);
    if (bn) parts.push(`ふつうベスト ${bn}点`);
    $('bestLine').textContent = parts.join('　'); $('bestLine').hidden = !parts.length;
  }

  // ---------- movement ----------
  function canGo(x, y, d) { return !!(maze[y * cols + x] & D[d].bit); }
  function chestAt(x, y) { return chests.find(c => c.x === x && c.y === y && !c.open); }

  function nextStep() {
    const p = player;
    while (steps.length) { const d = steps.shift(); if (canGo(p.cx, p.cy, d)) return d; }
    return null;
  }

  function inputDir(d) {
    steps = []; grab = null;
    if (state !== 'play' || popup) { nextDir = d; return; }
    if (banner && banner.t < 0.6) banner.t = 0.6;
    const p = player;
    if (p.dir) {
      if (d === D[p.dir].opp) { // turn around mid-corridor
        p.cx += D[p.dir].dx; p.cy += D[p.dir].dy; p.prog = 1 - p.prog; p.dir = d;
        if (D[d].dx) p.face = D[d].dx;
        nextDir = null;
      } else nextDir = d;
      return;
    }
    if (canGo(p.cx, p.cy, d)) { startMove(d); nextDir = null; }
    else { sfx.bump(); shakeT = 0.15; nextDir = null; }
  }
  function startMove(d) { player.dir = d; player.prog = 0; if (D[d].dx) player.face = D[d].dx; }

  function arrive() {
    const p = player, d = p.dir;
    p.cx += D[d].dx; p.cy += D[d].dy; p.steps++;
    if (p.steps % 2 === 0) sfx.step();
    const c = chestAt(p.cx, p.cy);
    if (c) { p.dir = null; p.prog = 0; openChest(c); return false; }
    if (grab || steps.length) {
      const f = nextStep();
      if (f) { p.dir = f; if (D[f].dx) p.face = D[f].dx; return true; }
      p.dir = null; p.prog = 0; return false;
    }
    // queued turn
    if (nextDir && canGo(p.cx, p.cy, nextDir)) { const n = nextDir; nextDir = null; p.dir = n; if (D[n].dx) p.face = D[n].dx; return true; }
    if (heldDir && canGo(p.cx, p.cy, heldDir)) { p.dir = heldDir; if (D[heldDir].dx) p.face = D[heldDir].dx; return true; }
    const opts = DIR_NAMES.filter(n => n !== D[d].opp && canGo(p.cx, p.cy, n));
    if (opts.length === 1) { p.dir = opts[0]; if (D[opts[0]].dx) p.face = D[opts[0]].dx; return true; } // follow the corridor
    p.dir = null; p.prog = 0; // junction or dead end: stop and wait
    return false;
  }

  function openChest(c) {
    steps = []; grab = null;
    popup = { chest: c, t: 0, revealed: false };
  }
  function revealChest() {
    const c = popup.chest; c.open = true; popup.revealed = true;
    const x = c.x + 0.5, y = c.y + 0.5;
    if (c.item === 'korokke') {
      found++; sfx.hit();
      for (let i = 0; i < 26; i++) burst(x, y, ['#FFD45C', '#E8A53E', '#FFFFFF'][i % 3], 0.7);
      floats.push({ x, y, str: 'あたり！', color: '#D83A4E', life: 1.4 });
    } else {
      stageCabbage++; sfx.miss();
      for (let i = 0; i < 14; i++) burst(x, y, ['#8FD06F', '#CDEFB4'][i % 2], 0.5);
      if (mode === 'normal') { timeLeft = Math.max(0, timeLeft - PENALTY); floats.push({ x, y: y + 0.6, str: `-${PENALTY}びょう`, color: '#1F3A68', life: 1.4 }); }
      floats.push({ x, y, str: 'ハズレ…', color: '#2F6A22', life: 1.4 });
      shakeT = 0.25;
    }
  }
  function burst(x, y, color, power) {
    const a = Math.random() * TAU, s = (1.5 + Math.random() * 3) * power;
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 2 * power, life: 0.8 + Math.random() * 0.5, c: color, r: 0.05 + Math.random() * 0.07 });
  }

  // ---------- update ----------
  function update(dt) {
    for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 6 * dt; p.vx *= 0.98; p.life -= dt; }
    particles = particles.filter(p => p.life > 0);
    for (const f of floats) { f.y -= 0.7 * dt; f.life -= dt; }
    floats = floats.filter(f => f.life > 0);
    if (shakeT > 0) shakeT -= dt;
    if (hintT > 0) hintT -= dt;
    for (const c of chests) if (c.open) c.openT = Math.min(1, c.openT + dt * 4);
    if (banner) { banner.t += dt; if (banner.t > 2.2) banner = null; }
    if (state !== 'play') return;

    if (popup) {
      popup.t += dt;
      if (!popup.revealed) {
        if (Math.floor(popup.t * 10) !== Math.floor((popup.t - dt) * 10) && popup.t < 0.6) sfx.shake();
        if (popup.t >= 0.6) revealChest();
      }
      if (popup.t >= 1.7) {
        popup = null;
        if (found >= STAGES[stageIdx].need) { stageClear(); return; }
        if (mode === 'normal' && timeLeft <= 0) { gameOver(false); return; }
      }
      return; // clock pauses while a chest opens
    }

    const bannerHold = banner && banner.t < 0.6;
    if (!bannerHold) {
      elapsed += dt;
      if (mode === 'normal') {
        timeLeft -= dt;
        const s = Math.ceil(timeLeft);
        if (s <= 10 && s > 0 && s !== lastTick) { lastTick = s; sfx.tick(); }
        if (timeLeft <= 0) { timeLeft = 0; gameOver(false); return; }
      }
    }

    const p = player;
    p.bob += dt * (p.dir ? 14 : 4);
    if (!p.dir && steps.length) {
      const f = nextStep();
      if (f) startMove(f);
    } else if (!p.dir) {
      const want = nextDir || heldDir;
      if (want) {
        if (canGo(p.cx, p.cy, want)) { startMove(want); nextDir = null; }
        else if (nextDir) { nextDir = null; sfx.bump(); shakeT = 0.15; }
      }
    }
    if (p.dir) {
      p.prog += (steps.length ? SPEED * 1.4 + steps.length * 1.5 : SPEED) * dt;
      while (p.dir && p.prog >= 1) {
        p.prog -= 1;
        if (!arrive()) break;
      }
    }
  }

  // ---------- drawing ----------
  function drawCroquette(x, y, size, face, tilt) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(tilt || 0); ctx.scale(face < 0 ? -1 : 1, 1);
    if (croImg.complete && croImg.naturalWidth) {
      const ar = croImg.naturalWidth / croImg.naturalHeight;
      const w = size, h = size / ar;
      ctx.drawImage(croImg, -w / 2, -h / 2, w, h);
    } else {
      ctx.fillStyle = '#E8A53E'; ctx.strokeStyle = '#7A4210'; ctx.lineWidth = size * 0.06;
      ctx.beginPath(); ctx.ellipse(0, 0, size / 2, size / 3, 0, 0, TAU); ctx.fill(); ctx.stroke();
    }
    ctx.restore();
  }
  function drawFace(x, y, s, face, happy) {
    // tiny face on the croquette so it reads as a character
    ctx.save(); ctx.translate(x, y); ctx.scale(face < 0 ? -1 : 1, 1);
    ctx.fillStyle = '#142849';
    ctx.beginPath(); ctx.arc(s * 0.02, -s * 0.06, s * 0.045, 0, TAU); ctx.arc(s * 0.2, -s * 0.06, s * 0.045, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#142849'; ctx.lineWidth = Math.max(1.5, s * 0.03); ctx.lineCap = 'round';
    ctx.beginPath();
    if (happy) ctx.arc(s * 0.11, s * 0.02, s * 0.07, 0.15 * Math.PI, 0.85 * Math.PI);
    else { ctx.moveTo(s * 0.06, s * 0.07); ctx.lineTo(s * 0.16, s * 0.07); }
    ctx.stroke();
    ctx.fillStyle = 'rgba(232,74,95,0.45)';
    ctx.beginPath(); ctx.arc(-s * 0.08, s * 0.03, s * 0.05, 0, TAU); ctx.arc(s * 0.3, s * 0.03, s * 0.05, 0, TAU); ctx.fill();
    ctx.restore();
  }
  function drawCabbage(x, y, r) {
    ctx.save(); ctx.translate(x, y);
    ctx.fillStyle = '#4E9A3C'; ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.fill();
    ctx.fillStyle = '#7CC45E'; ctx.beginPath(); ctx.arc(-r * 0.08, -r * 0.05, r * 0.82, 0, TAU); ctx.fill();
    ctx.fillStyle = '#B4E394'; ctx.beginPath(); ctx.arc(-r * 0.12, -r * 0.1, r * 0.5, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#E9F8DD'; ctx.lineWidth = Math.max(1, r * 0.08); ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-r * 0.1, r * 0.6); ctx.quadraticCurveTo(-r * 0.15, 0, -r * 0.05, -r * 0.55);
    ctx.moveTo(-r * 0.12, r * 0.15); ctx.quadraticCurveTo(r * 0.3, 0, r * 0.55, -r * 0.2);
    ctx.moveTo(-r * 0.12, r * 0.1); ctx.quadraticCurveTo(-r * 0.45, -r * 0.05, -r * 0.6, -r * 0.3);
    ctx.stroke();
    ctx.strokeStyle = '#2F6A22'; ctx.lineWidth = Math.max(1, r * 0.08);
    ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.stroke();
    ctx.restore();
  }
  function drawChest(x, y, s, lid, wobble) {
    // x,y = center; s = width
    ctx.save(); ctx.translate(x + wobble, y);
    const w = s, h = s * 0.62, bodyTop = -h * 0.15;
    ctx.fillStyle = 'rgba(20,40,73,0.2)';
    ctx.beginPath(); ctx.ellipse(0, h * 0.5, w * 0.55, h * 0.14, 0, 0, TAU); ctx.fill();
    // body
    ctx.fillStyle = '#A0602A'; ctx.strokeStyle = '#4A2A0C'; ctx.lineWidth = Math.max(1.5, s * 0.05);
    roundRect(-w / 2, bodyTop, w, h * 0.65, s * 0.06); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#E2B13C';
    ctx.fillRect(-w / 2 + w * 0.12, bodyTop + ctx.lineWidth / 2, w * 0.1, h * 0.65 - ctx.lineWidth);
    ctx.fillRect(w / 2 - w * 0.22, bodyTop + ctx.lineWidth / 2, w * 0.1, h * 0.65 - ctx.lineWidth);
    // lid
    ctx.save();
    ctx.translate(0, bodyTop);
    if (lid > 0) { ctx.translate(0, -h * 0.05 * lid); ctx.scale(1, 1 - lid * 1.6); }
    ctx.fillStyle = lid > 0.5 ? '#6E3E15' : '#B8723A';
    ctx.beginPath();
    ctx.moveTo(-w / 2, 0); ctx.lineTo(-w / 2, -h * 0.22);
    ctx.quadraticCurveTo(0, -h * 0.62, w / 2, -h * 0.22); ctx.lineTo(w / 2, 0); ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.restore();
    if (lid < 0.3) {
      ctx.fillStyle = '#FFD45C'; ctx.strokeStyle = '#4A2A0C';
      roundRect(-w * 0.09, bodyTop - h * 0.08, w * 0.18, h * 0.24, s * 0.03); ctx.fill(); ctx.stroke();
    } else {
      ctx.fillStyle = '#2A1606'; ctx.fillRect(-w / 2 + ctx.lineWidth, bodyTop - 1, w - ctx.lineWidth * 2, h * 0.08);
    }
    ctx.restore();
  }
  function roundRect(x, y, w, h, r) {
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }

  let darkLayer = null;
  function drawDark(px, py, radius) {
    if (!darkLayer || darkLayer.width !== cv.width || darkLayer.height !== cv.height) {
      darkLayer = document.createElement('canvas'); darkLayer.width = cv.width; darkLayer.height = cv.height;
    }
    const g = darkLayer.getContext('2d');
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.globalCompositeOperation = 'source-over';
    g.clearRect(0, 0, darkLayer.width, darkLayer.height);
    g.fillStyle = 'rgba(14,22,44,0.94)'; g.fillRect(0, 0, darkLayer.width, darkLayer.height);
    g.globalCompositeOperation = 'destination-out';
    const X = px * dpr, Y = py * dpr, R = radius * dpr;
    const grad = g.createRadialGradient(X, Y, R * 0.35, X, Y, R);
    grad.addColorStop(0, 'rgba(0,0,0,1)'); grad.addColorStop(0.7, 'rgba(0,0,0,0.85)'); grad.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = grad; g.beginPath(); g.arc(X, Y, R, 0, TAU); g.fill();
    ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(darkLayer, 0, 0); ctx.restore();
  }

  function playerPos() {
    const p = player;
    let x = p.cx + 0.5, y = p.cy + 0.5;
    if (p.dir) { x += D[p.dir].dx * p.prog; y += D[p.dir].dy * p.prog; }
    return { x, y };
  }

  function drawTitleBg(now) {
    // gentle hedge pattern behind the title panel
    ctx.fillStyle = '#DDEFD3'; ctx.fillRect(0, 0, cw, ch);
    const s = 56;
    ctx.strokeStyle = 'rgba(93,174,72,0.35)'; ctx.lineWidth = 14; ctx.lineCap = 'round';
    ctx.beginPath();
    for (let y = -1; y < ch / s + 1; y++) for (let x = -1; x < cw / s + 1; x++) {
      const h = (x * 73856093 ^ y * 19349663) >>> 0;
      const X = x * s + ((now / 80) % s), Y = y * s;
      if (h % 3 === 0) { ctx.moveTo(X, Y); ctx.lineTo(X + s, Y); }
      else if (h % 3 === 1) { ctx.moveTo(X, Y); ctx.lineTo(X, Y + s); }
    }
    ctx.stroke();
  }

  function draw(now) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, cw, ch);
    if (!maze) { drawTitleBg(now); return; }
    ctx.fillStyle = STAGES[stageIdx].dark ? '#2B3A55' : '#DDEFD3'; ctx.fillRect(0, 0, cw, ch);

    const pp = playerPos();
    const areaW = cw - 20, areaH = ch - HUD_H - 20;
    let ox, oy;
    if (grab && !camReset) { ox = viewX; oy = viewY; } // hold still while the finger drags
    else if (follow) {
      ox = mazeW <= areaW ? (cw - mazeW) / 2 : Math.min(10, Math.max(cw - 10 - mazeW, cw / 2 - pp.x * cell));
      oy = mazeH <= areaH ? HUD_H + 10 + (areaH - mazeH) / 2 : Math.min(HUD_H + 10, Math.max(ch - 10 - mazeH, HUD_H + 10 + areaH / 2 - pp.y * cell));
    } else {
      ox = Math.round((cw - mazeW) / 2); oy = Math.round(HUD_H + 10 + (areaH - mazeH) / 2);
    }
    if (follow && !camReset && !grab) { ox = viewX + (ox - viewX) * 0.15; oy = viewY + (oy - viewY) * 0.15; }
    camReset = false;
    viewX = ox; viewY = oy;
    ctx.save();
    if (shakeT > 0) ctx.translate((Math.random() - 0.5) * 6, (Math.random() - 0.5) * 6);
    const pad = wallLayer.pad;
    ctx.drawImage(wallLayer, ox - pad, oy - pad, wallLayer.width / dpr, wallLayer.height / dpr);

    // chests
    for (const c of chests) {
      const cx = ox + (c.x + 0.5) * cell, cy = oy + (c.y + 0.5) * cell;
      const opening = popup && popup.chest === c;
      let wob = 0, lid = c.open ? c.openT : 0;
      if (opening && !popup.revealed) wob = Math.sin(popup.t * 50) * cell * 0.05 * (popup.t / 0.6);
      drawChest(cx, cy + cell * 0.06, cell * 0.66, lid, wob);
      if (c.open && !opening) {
        if (c.item === 'korokke') { ctx.globalAlpha = 0.9; drawCroquette(cx, cy - cell * 0.08, cell * 0.55, 1, -0.1); ctx.globalAlpha = 1; }
        else drawCabbage(cx, cy - cell * 0.08, cell * 0.2);
      }
    }

    // grab ring / hint ring around the croquette
    {
      const pp0 = playerPos(), gx = ox + pp0.x * cell, gy = oy + pp0.y * cell;
      if (grab) {
        ctx.save(); ctx.strokeStyle = 'rgba(232,165,62,0.9)'; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.arc(gx, gy, cell * 0.5, 0, TAU); ctx.stroke(); ctx.restore();
      } else if (!popup && state === 'play' && (player.steps === 0 || hintT > 0)) {
        const k = (now / 700) % 1;
        ctx.save(); ctx.strokeStyle = '#D83A4E'; ctx.lineWidth = 3; ctx.globalAlpha = 1 - k;
        ctx.beginPath(); ctx.arc(gx, gy, cell * (0.45 + k * 0.4), 0, TAU); ctx.stroke(); ctx.restore();
      }
    }

    // player
    const px = ox + pp.x * cell, py = oy + pp.y * cell;
    const bob = Math.abs(Math.sin(player.bob)) * cell * (player.dir ? 0.08 : 0.03);
    ctx.fillStyle = 'rgba(20,40,73,0.22)';
    ctx.beginPath(); ctx.ellipse(px, py + cell * 0.28, cell * 0.3, cell * 0.08, 0, 0, TAU); ctx.fill();
    const tilt = player.dir ? Math.sin(player.bob) * 0.12 : 0;
    const happy = popup && popup.revealed && popup.chest.item === 'korokke';
    drawCroquette(px, py - bob, cell * 0.86, player.face, tilt);
    drawFace(px, py - bob, cell * 0.86, player.face, !(popup && popup.revealed && popup.chest.item === 'cabbage'));

    // particles
    for (const p of particles) {
      ctx.globalAlpha = Math.min(1, p.life * 2); ctx.fillStyle = p.c;
      ctx.beginPath(); ctx.arc(ox + p.x * cell, oy + p.y * cell, Math.max(2, p.r * cell), 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.restore();

    if (STAGES[stageIdx].dark) drawDark(px, py, cell * 3.3);

    // popup reveal (drawn above darkness)
    if (popup) {
      const c = popup.chest;
      const cx = ox + (c.x + 0.5) * cell, cy = oy + (c.y + 0.5) * cell;
      if (popup.revealed) {
        const t = Math.min(1, (popup.t - 0.6) / 0.35);
        const e = 1 - Math.pow(1 - t, 3);
        const big = Math.min(cw, ch) * 0.34;
        const sz = cell * 0.5 + (big - cell * 0.5) * e;
        const ix = cx + (cw / 2 - cx) * e, iy = cy + (ch / 2 - 10 - cy) * e;
        // glow
        ctx.save();
        ctx.globalAlpha = 0.85 * e;
        ctx.fillStyle = c.item === 'korokke' ? '#FFF3C4' : '#E6F6DA';
        ctx.beginPath(); ctx.arc(ix, iy, sz * 0.75, 0, TAU); ctx.fill();
        if (c.item === 'korokke') {
          ctx.strokeStyle = '#FFD45C'; ctx.lineWidth = 6; ctx.globalAlpha = 0.7 * e;
          for (let i = 0; i < 12; i++) {
            const a = i / 12 * TAU + popup.t * 1.5;
            ctx.beginPath(); ctx.moveTo(ix + Math.cos(a) * sz * 0.8, iy + Math.sin(a) * sz * 0.8);
            ctx.lineTo(ix + Math.cos(a) * sz * 1.05, iy + Math.sin(a) * sz * 1.05); ctx.stroke();
          }
        }
        ctx.restore();
        if (c.item === 'korokke') drawCroquette(ix, iy, sz, 1, Math.sin(popup.t * 6) * 0.08);
        else drawCabbage(ix, iy, sz * 0.4);
        if (t >= 1) {
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          const fs = Math.max(26, Math.min(44, cw * 0.09));
          ctx.font = `${fs}px ${FD}`; ctx.lineJoin = 'round';
          const label = c.item === 'korokke' ? 'あたり！コロッケ！' : 'ハズレ… キャベツ';
          ctx.lineWidth = 9; ctx.strokeStyle = '#FFFDF6'; ctx.strokeText(label, cw / 2, iy + sz * 0.8);
          ctx.fillStyle = c.item === 'korokke' ? '#D83A4E' : '#2F6A22'; ctx.fillText(label, cw / 2, iy + sz * 0.8);
          if (c.item === 'cabbage' && mode === 'normal') {
            ctx.font = `800 ${Math.round(fs * 0.5)}px ${FB}`; ctx.lineWidth = 6;
            ctx.strokeText(`のこり時間 -${PENALTY}びょう`, cw / 2, iy + sz * 0.8 + fs * 0.9);
            ctx.fillStyle = '#1F3A68'; ctx.fillText(`のこり時間 -${PENALTY}びょう`, cw / 2, iy + sz * 0.8 + fs * 0.9);
          }
        }
      }
    }

    // floats
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
    for (const f of floats) {
      if (popup) break;
      ctx.globalAlpha = Math.min(1, f.life * 2);
      ctx.font = `${Math.max(16, cell * 0.45)}px ${FD}`; ctx.lineWidth = 6; ctx.strokeStyle = '#FFFDF6'; ctx.fillStyle = f.color;
      ctx.strokeText(f.str, ox + f.x * cell, oy + f.y * cell - cell * 0.6); ctx.fillText(f.str, ox + f.x * cell, oy + f.y * cell - cell * 0.6);
    }
    ctx.globalAlpha = 1;

    drawHUD();

    if (banner) {
      const t = banner.t, a = t < 0.2 ? t / 0.2 : t > 1.8 ? Math.max(0, (2.2 - t) / 0.4) : 1;
      ctx.globalAlpha = a;
      ctx.fillStyle = 'rgba(31,58,104,0.88)';
      const bh = banner.sub.includes('\n') ? 128 : 104;
      ctx.fillRect(0, ch / 2 - bh / 2, cw, bh);
      ctx.fillStyle = '#FFD45C'; ctx.font = `34px ${FD}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(banner.title, cw / 2, ch / 2 - bh / 2 + 34);
      ctx.fillStyle = '#FFFDF6'; ctx.font = `800 18px ${FB}`;
      banner.sub.split('\n').forEach((line, i) => ctx.fillText(line, cw / 2, ch / 2 - bh / 2 + 70 + i * 26));
      ctx.globalAlpha = 1;
    }
  }

  function drawHUD() {
    const st = STAGES[stageIdx];
    ctx.fillStyle = 'rgba(255,253,246,0.95)';
    ctx.fillRect(0, 0, cw, HUD_H);
    ctx.fillStyle = '#1F3A68'; ctx.fillRect(0, HUD_H - 3, cw, 3);
    const L = 14;
    ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
    ctx.fillStyle = '#7A4210'; ctx.font = `800 12px ${FB}`; ctx.fillText('ステージ', L, 20);
    ctx.fillStyle = '#1F3A68'; ctx.font = `24px ${FD}`; ctx.fillText(`${stageIdx + 1}/${STAGES.length}`, L, 44);
    // croquette slots
    const n = st.need, slot = 34, gap = 6, total = n * slot + (n - 1) * gap;
    let sx = cw / 2 - total / 2 + slot / 2;
    for (let i = 0; i < n; i++) {
      const x = sx + i * (slot + gap), y = HUD_H / 2 - 1;
      ctx.fillStyle = '#F1E7CE'; ctx.strokeStyle = '#C9B48A'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(x, y, slot / 2, 0, TAU); ctx.fill(); ctx.stroke();
      if (i < found) drawCroquette(x, y, slot * 1.05, 1, 0);
      else { ctx.fillStyle = '#C9B48A'; ctx.font = `18px ${FD}`; ctx.textAlign = 'center'; ctx.fillText('？', x, y + 1); ctx.textAlign = 'left'; }
    }
    // timer
    ctx.textAlign = 'right';
    const R = cw - 14;
    if (mode === 'normal') {
      const s = Math.ceil(timeLeft);
      ctx.fillStyle = '#7A4210'; ctx.font = `800 12px ${FB}`; ctx.fillText('のこり時間', R, 20);
      ctx.fillStyle = s <= 10 ? '#D83A4E' : '#1F3A68'; ctx.font = `24px ${FD}`; ctx.fillText(`${s}びょう`, R, 44);
      // bar
      ctx.fillStyle = '#EEE3C9'; ctx.fillRect(0, HUD_H - 7, cw, 4);
      ctx.fillStyle = s <= 10 ? '#D83A4E' : '#E8A53E'; ctx.fillRect(0, HUD_H - 7, cw * Math.max(0, timeLeft / stageTime), 4);
    } else {
      ctx.fillStyle = '#7A4210'; ctx.font = `800 12px ${FB}`; ctx.fillText('じかん', R, 20);
      ctx.fillStyle = '#1F3A68'; ctx.font = `22px ${FD}`; ctx.fillText(fmtTime(elapsed), R, 44);
    }
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    update(dt); draw(now); requestAnimationFrame(frame);
  }

  // ---------- input ----------
  const KEYMAP = { ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right' };
  window.addEventListener('keydown', e => {
    const d = KEYMAP[e.code];
    if (d) {
      e.preventDefault();
      if (state === 'play') { heldDir = d; if (!e.repeat) inputDir(d); }
      return;
    }
    if (e.code === 'Enter' || e.code === 'Space') {
      if (document.activeElement && document.activeElement.tagName === 'BUTTON') return; // let the button handle it
      e.preventDefault();
      if (state === 'clear') nextStage();
      else if (state === 'over') startGame(mode);
    }
  });
  window.addEventListener('keyup', e => { const d = KEYMAP[e.code]; if (d && heldDir === d) heldDir = null; });
  window.addEventListener('blur', () => { heldDir = null; });

  // touch / mouse: press the croquette, then trace the path. It only moves one
  // cell at a time between cells your finger passes through, and never through hedges.
  let camReset = true;
  function tailCell() {
    const p = player;
    let x = p.cx, y = p.cy;
    if (p.dir) { x += D[p.dir].dx; y += D[p.dir].dy; }
    for (const d of steps) { x += D[d].dx; y += D[d].dy; }
    return { x, y };
  }
  function traceTo(fx, fy) {
    const c = { x: Math.floor((fx - viewX) / cell), y: Math.floor((fy - viewY) / cell) };
    const t = tailCell();
    if (c.x === t.x && c.y === t.y) return;
    let dir = null;
    for (const d of DIR_NAMES) if (t.x + D[d].dx === c.x && t.y + D[d].dy === c.y) dir = d;
    if (!dir || !canGo(t.x, t.y, dir)) return; // not next door, or a hedge in the way
    const p = player;
    if (steps.length && steps[steps.length - 1] === D[dir].opp) steps.pop(); // finger went back
    else if (!steps.length && p.dir && dir === D[p.dir].opp) { // turn around mid-step
      p.cx += D[p.dir].dx; p.cy += D[p.dir].dy; p.prog = 1 - p.prog; p.dir = dir; if (D[dir].dx) p.face = D[dir].dx;
    }
    else steps.push(dir);
  }
  cv.addEventListener('pointerdown', e => {
    if (state !== 'play' || !maze) return;
    e.preventDefault();
    if (popup) return;
    const pp = playerPos();
    const dist = Math.hypot(e.clientX - (viewX + pp.x * cell), e.clientY - (viewY + pp.y * cell));
    if (dist > Math.max(cell * 0.85, 34)) { // must start on the croquette
      hintT = 1.6;
      if (!floats.some(f => f.hint)) floats.push({ x: pp.x, y: pp.y - 0.2, str: 'コロッケをおさえてね', color: '#D83A4E', life: 1.4, hint: true });
      return;
    }
    nextDir = null; heldDir = null;
    grab = { id: e.pointerId, lx: e.clientX, ly: e.clientY };
    if (banner && banner.t < 0.6) banner.t = 0.6;
    try { cv.setPointerCapture(e.pointerId); } catch {}
  });
  cv.addEventListener('pointermove', e => {
    if (!grab || grab.id !== e.pointerId) return;
    // sample along the finger's movement so quick strokes don't skip cells
    const dx = e.clientX - grab.lx, dy = e.clientY - grab.ly;
    const n = Math.max(1, Math.ceil(Math.hypot(dx, dy) / (cell * 0.2)));
    for (let i = 1; i <= n; i++) traceTo(grab.lx + dx * i / n, grab.ly + dy * i / n);
    grab.lx = e.clientX; grab.ly = e.clientY;
  });
  const release = e => { if (grab && grab.id === e.pointerId) grab = null; };
  cv.addEventListener('pointerup', release);
  cv.addEventListener('pointercancel', release);

  $('easyBtn').addEventListener('click', () => startGame('easy'));
  $('normalBtn').addEventListener('click', () => startGame('normal'));
  $('nextBtn').addEventListener('click', nextStage);
  $('retryBtn').addEventListener('click', () => startGame(mode));
  $('backBtn').addEventListener('click', toTitle);
  $('homeBtn').addEventListener('click', () => { $('homeBtn').blur(); toTitle(); });
  const soundBtn = $('soundBtn');
  function renderSound() { soundBtn.textContent = soundOn ? '音：オン' : '音：オフ'; soundBtn.setAttribute('aria-pressed', String(soundOn)); }
  soundBtn.addEventListener('click', () => { soundOn = !soundOn; store.set('korokke-meiro-sound', soundOn); renderSound(); if (soundOn) sfx.step(); });

  renderSound(); renderBest(); resize();
  requestAnimationFrame(frame);
})();
</script>

</html>
