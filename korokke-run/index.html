<title>コロッケ ダッシュ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
/* Layout: one-screen endless runner. Canvas fills the screen; DOM panels float on top. Single deliberate look (sunny kitchen sky over a fryer). */
:root {
  --ai: #1F3A68;
  --ai-deep: #142849;
  --koromo: #E8A53E;
  --koromo-dark: #7A4210;
  --sky: #BFE3EE;
  --paper: #FFFDF6;
  --hot: #E84A5F;
  --font-display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  --font-body: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body {
  background: var(--sky); color: var(--ai-deep); font-family: var(--font-body);
  overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
}
#app { position: relative; width: 100%; height: 100%; }
canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.panel {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: min(360px, calc(100% - 32px)); max-height: calc(100% - 24px); overflow: auto;
  background: var(--paper); border: 3px solid var(--ai); border-radius: 20px; box-shadow: 6px 6px 0 var(--ai);
  box-sizing: border-box; padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center;
}
.panel h1 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 2.1rem; line-height: 1.15; color: var(--ai); text-wrap: balance; }
.panel h1 small { display: block; font-size: 0.9rem; color: var(--koromo-dark); letter-spacing: 0.2em; margin-bottom: 4px; }
.panel h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 1.5rem; color: var(--ai); }
.panel p { margin: 0; font-size: 0.95rem; font-weight: 500; }
.how { display: grid; gap: 6px; width: 100%; font-size: 0.88rem; text-align: left; padding: 10px 12px; background: #EAF4F7; border-radius: 12px; line-height: 1.6; }
.how b { color: var(--ai); }
kbd { font-family: var(--font-body); font-weight: 800; font-size: 0.78rem; border: 2px solid var(--ai); border-bottom-width: 3px; border-radius: 6px; padding: 0 6px; background: #fff; }
.btn {
  font-family: var(--font-display); font-size: 1.3rem; color: var(--ai-deep); background: var(--koromo);
  border: 3px solid var(--ai); border-radius: 999px; padding: 10px 34px; box-shadow: 0 5px 0 var(--ai); cursor: pointer;
  transition: transform .08s, box-shadow .08s;
}
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--ai); }
.btn:focus-visible, .sound:focus-visible { outline: 3px solid var(--hot); outline-offset: 3px; }
.result { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; }
.stat { background: #EAF4F7; border-radius: 12px; padding: 8px 6px; }
.stat span { display: block; font-size: 0.75rem; font-weight: 800; letter-spacing: 0.1em; color: var(--koromo-dark); }
.stat strong { font-family: var(--font-display); font-weight: 400; font-size: 1.6rem; font-variant-numeric: tabular-nums; color: var(--ai); }
.cause { font-family: var(--font-display); color: var(--hot); font-size: 1.05rem; }
.newbest { font-weight: 800; color: var(--hot); font-size: 0.9rem; }
.sound {
  position: absolute;
  right: max(12px, calc(env(safe-area-inset-right, 0px) + 12px));
  bottom: max(12px, calc(env(safe-area-inset-bottom, 0px) + 12px));
  font-family: var(--font-body); font-weight: 800; font-size: 0.85rem;
  background: var(--paper); color: var(--ai); border: 2px solid var(--ai); border-radius: 999px; padding: 6px 14px; cursor: pointer;
}
</style>

<div id="app">
  <canvas id="cv"></canvas>
  <div class="panel" id="titlePanel">
    <h1><small>あげたて</small>コロッケ<br>ダッシュ</h1>
    <div class="how">
      <div>コロッケは勝手に走るよ。<b>穴</b>と<b>フォーク</b>と<b>ソースのしずく</b>をよけてね。</div>
      <div>ジャンプ：PC <kbd>スペース</kbd> / <kbd>↑</kbd>、スマホは画面タップ。長押しで高く、空中でもう一回押すと<b>二段ジャンプ</b>。</div>
      <div>ゴールはなし。どんどん速くなるよ。</div>
    </div>
    <button class="btn" id="startBtn">はしる</button>
  </div>
  <div class="panel" id="overPanel" hidden>
    <h2>ゲームオーバー</h2>
    <div class="cause" id="causeText"></div>
    <div class="result">
      <div class="stat"><span>きょり</span><strong id="resDist">0m</strong></div>
      <div class="stat"><span>ベスト</span><strong id="resBest">0m</strong></div>
    </div>
    <div class="newbest" id="newBest" hidden>ベスト更新！</div>
    <button class="btn" id="retryBtn">もう一回</button>
  </div>
  <button class="sound" id="soundBtn" aria-pressed="true">音：オン</button>
</div>

  const VH = 400;              // world height; width follows the screen
  const GROUND = 300;          // base ground line
  const PX = 120;              // croquette x on screen
  const TAU = Math.PI * 2;
  const FD = '"Dela Gothic One", "Hiragino Sans", "Yu Gothic", sans-serif';
  const FB = '"M PLUS Rounded 1c", "Hiragino Sans", "Yu Gothic", sans-serif';
  const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  const titlePanel = document.getElementById('titlePanel'), overPanel = document.getElementById('overPanel');
  const soundBtn = document.getElementById('soundBtn');
  const croImg = new Image(); croImg.src = 'data:image/webp;base64,' + CRO_B64;

  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };
  let best = store.get('korokke-run-best', 0);
  let soundOn = store.get('korokke-run-sound', true);

  // ---------- audio ----------
  let ac = null;
  function audio() {
    if (!soundOn) return null;
    if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch { return null; } }
    if (ac.state === 'suspended') ac.resume();
    return ac;
  }
  function tone(f1, f2, dur, type = 'square', vol = 0.06, delay = 0) {
    const a = audio(); if (!a) return;
    const t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + 0.02);
  }
  const sfx = {
    jump() { tone(380, 720, 0.12, 'square', 0.045); },
    jump2() { tone(560, 1100, 0.12, 'square', 0.045); },
    up() { [523, 659, 784, 1047].forEach((f, i) => tone(f, f, 0.1, 'square', 0.045, i * 0.07)); },
    hit() { tone(240, 60, 0.4, 'sawtooth', 0.08); },
    fall() { tone(700, 90, 0.6, 'triangle', 0.08); tone(120, 80, 0.4, 'sawtooth', 0.05, 0.5); }
  };
  function renderSound() { soundBtn.textContent = soundOn ? '音：オン' : '音：オフ'; soundBtn.setAttribute('aria-pressed', String(soundOn)); }
  renderSound();

  // ---------- sizing ----------
  let dpr = 1, cw = 0, ch = 0, scale = 1, VW = 700;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    cw = cv.clientWidth; ch = cv.clientHeight;
    cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr);
    scale = ch / VW_H(); VW = cw / scale;
  }
  // keep the world at least ~520 wide on tall phones by zooming out
  function VW_H() { const s = Math.min(cv.clientHeight / VH, cv.clientWidth / 460); return cv.clientHeight / s; }
  let VHH = VH;
  function resize2() { resize(); VHH = ch / scale; }
  window.addEventListener('resize', resize2); resize2();

  // ---------- state ----------
  let state = 'title';
  let camX = 0, speed = 260, dist = 0, time = 0, runT = 0, tier = 0;
  let py = GROUND, vy = 0, onGround = true, jumpsLeft = 2, holding = false, holdT = 0;
  let platforms = [], enemies = [], particles = [], texts = [];
  let deadT = 0, cause = '', squash = 0, shake = 0;
  const GRAV = 2300, JUMP_V = 780, MAX_SPEED = 720;
  const HW = 52, HH = 46; // croquette half-width, height

  function rand(a, b) { return a + Math.random() * (b - a); }

  function genUntil(x) {
    let last = platforms[platforms.length - 1];
    while (last.x + last.w < x) {
      const sp = speed;
      const diff = Math.min(1, runT / 90);
      const gap = rand(sp * 0.18, sp * (0.28 + 0.14 * diff)) + 30;
      let y = last.y;
      const r = Math.random();
      if (r < 0.25 + 0.2 * diff) y = Math.max(GROUND - 90, Math.min(GROUND + 40, last.y + (Math.random() < 0.5 ? -1 : 1) * rand(30, 60)));
      if (y < last.y - 70) y = last.y - 70;
      const w = rand(260, 620) * (1 - 0.35 * diff) + sp * 0.4;
      const p = { x: last.x + last.w + gap, w, y };
      platforms.push(p);
      // enemies
      if (w > 300 && Math.random() < 0.55 + 0.3 * diff) {
        const ex = p.x + rand(140, w - 80);
        enemies.push({ type: 'fork', x: ex, y: p.y, vx: -rand(20, 60), plat: p, t: Math.random() * 10 });
      }
      if (runT > 12 && Math.random() < 0.25 + 0.3 * diff) {
        enemies.push({ type: 'drop', x: p.x + rand(60, w), baseY: p.y - rand(100, 130), y: 0, t: Math.random() * 10 });
      }
      last = p;
    }
    platforms = platforms.filter(p => p.x + p.w > camX - 200);
    enemies = enemies.filter(e => e.x > camX - 200);
  }

  function reset() {
    camX = 0; speed = 260; dist = 0; runT = 0; tier = 0;
    py = GROUND; vy = 0; onGround = true; jumpsLeft = 2; holding = false;
    platforms = [{ x: -400, w: 1400, y: GROUND }]; enemies = []; particles = []; texts = [];
    squash = 0; shake = 0; deadT = 0;
    genUntil(camX + VW + 600);
  }

  function start() {
    audio(); reset();
    titlePanel.hidden = true; overPanel.hidden = true;
    state = 'play';
  }

  function jumpPress() {
    if (state !== 'play') return;
    holding = true;
    if (onGround) { vy = -JUMP_V; onGround = false; jumpsLeft = 1; holdT = 0; squash = -0.2; sfx.jump(); puff(4); }
    else if (jumpsLeft > 0) { vy = -JUMP_V * 0.85; jumpsLeft = 0; holdT = 0; squash = -0.15; sfx.jump2(); puff(6, py - 10); }
  }
  function jumpRelease() { holding = false; if (vy < -260) vy *= 0.5; }

  function puff(n, y = py) {
    for (let i = 0; i < n; i++) particles.push({ x: camX + PX + rand(-20, 20), y: y - 4, vx: rand(-120, 40), vy: rand(-140, -40), life: rand(0.4, 0.7), s: rand(2, 4), c: Math.random() > 0.5 ? '#F2C063' : '#B86E22' });
  }
  function popText(str, color) { texts.push({ str, color, life: 1.4, y: 0 }); }

  function die(c) {
    if (state !== 'play') return;
    state = 'dead'; cause = c; deadT = 1.2; shake = c === 'fall' ? 0 : 0.4;
    if (c === 'fall') sfx.fall(); else { sfx.hit(); vy = -520; }
    for (let i = 0; i < 18; i++) particles.push({ x: camX + PX, y: py - 20, vx: rand(-220, 220), vy: rand(-320, -60), life: rand(0.5, 1), s: rand(2, 4.5), c: Math.random() > 0.5 ? '#F2C063' : '#B86E22' });
  }

  function gameOver() {
    state = 'over';
    const m = Math.floor(dist / 50);
    const nb = m > best; if (nb) { best = m; store.set('korokke-run-best', best); }
    document.getElementById('resDist').textContent = m + 'm';
    document.getElementById('resBest').textContent = best + 'm';
    document.getElementById('newBest').hidden = !nb;
    document.getElementById('causeText').textContent =
      cause === 'fall' ? '油の海に落ちた！ もう一度あがっちゃった…' : cause === 'fork' ? 'フォークにささった！' : cause === 'wall' ? 'まな板のかべにぶつかった！' : 'ソースでしなしなに…';
    overPanel.hidden = false;
    setTimeout(() => document.getElementById('retryBtn').focus({ preventScroll: true }), 50);
  }

  function groundAt(x) {
    // highest platform top under x (within croquette width)
    let g = null;
    for (const p of platforms) if (x + HW * 0.55 > p.x && x - HW * 0.55 < p.x + p.w) { if (g === null || p.y < g) g = p.y; }
    return g;
  }

  // ---------- update ----------
  function update(dt) {
    time += dt;
    squash *= Math.pow(0.0008, dt);
    shake = Math.max(0, shake - dt);
    for (const p of particles) { p.vy += 900 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; }
    particles = particles.filter(p => p.life > 0);
    for (const t of texts) { t.life -= dt; t.y -= 30 * dt; }
    texts = texts.filter(t => t.life > 0);

    if (state === 'title') {
      // demo: run on an endless floor
      camX += 200 * dt; dist = camX;
      return;
    }
    if (state === 'dead') {
      vy += GRAV * dt; py += vy * dt;
      deadT -= dt; if (deadT <= 0) gameOver();
      return;
    }
    if (state !== 'play') return;

    runT += dt;
    speed = Math.min(MAX_SPEED, 260 + runT * 7);
    const nt = Math.floor(runT / 15);
    if (nt > tier) { tier = nt; popText('スピードアップ！', '#E84A5F'); sfx.up(); }
    const dx = speed * dt;
    camX += dx; dist += dx;
    genUntil(camX + VW + 600);

    const wx = camX + PX;
    // vertical
    const prevY = py;
    vy += GRAV * (holding && vy < 0 ? 0.55 : 1) * dt;
    py += vy * dt;
    const g = groundAt(wx);
    if (g !== null && vy >= 0 && prevY <= g + 2 && py >= g) {
      if (!onGround) { squash = 0.22; puff(3); }
      py = g; vy = 0; onGround = true; jumpsLeft = 2;
    } else if (onGround && (g === null || g > py + 1)) {
      onGround = false; jumpsLeft = 1;
    }
    // walking into a raised platform's wall
    for (const p of platforms) {
      if (p.y < py - 4 && wx + HW * 0.6 > p.x && wx + HW * 0.6 < p.x + 24 && prevY > p.y + 4) {
        // bump: you hit the side of a step
        die('fork'); cause = 'wall';
      }
    }
    if (py > VH + 80) die('fall');

    // enemies
    for (const e of enemies) {
      e.t += dt;
      if (e.type === 'fork') {
        e.x += e.vx * dt;
        if (e.x < e.plat.x + 20 || e.x > e.plat.x + e.plat.w - 20) { e.vx *= -1; e.x = Math.max(e.plat.x + 20, Math.min(e.plat.x + e.plat.w - 20, e.x)); }
        if (Math.abs(e.x - wx) < HW * 0.55 + 10 && py > e.y - 58 && py - HH < e.y) die('fork');
      } else {
        e.y = e.baseY + Math.sin(e.t * 2.4) * 22;
        const ddx = e.x - wx, ddy = e.y - (py - HH / 2);
        if ((ddx * ddx) / ((HW * 0.6 + 12) ** 2) + (ddy * ddy) / ((HH * 0.55 + 12) ** 2) < 1) die('drop');
      }
    }
  }

  // ---------- drawing ----------
  function face(x, y, s, mood) {
    ctx.save(); ctx.translate(x, y);
    ctx.strokeStyle = '#2A1A0E'; ctx.lineWidth = 2.4 * s; ctx.lineCap = 'round';
    if (mood === 'hurt') {
      [-1, 1].forEach(d => { ctx.beginPath(); ctx.moveTo(d * 12 * s - 4 * s, -6 * s); ctx.lineTo(d * 12 * s + 4 * s, 2 * s); ctx.moveTo(d * 12 * s + 4 * s, -6 * s); ctx.lineTo(d * 12 * s - 4 * s, 2 * s); ctx.stroke(); });
    } else if (mood === 'focus') {
      [-1, 1].forEach(d => { ctx.beginPath(); ctx.arc(d * 12 * s, 0, 4.5 * s, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke(); });
    } else {
      [-1, 1].forEach(d => {
        ctx.fillStyle = '#2A1A0E'; ctx.beginPath(); ctx.ellipse(d * 12 * s, -2 * s, 4 * s, 5 * s, 0, 0, TAU); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(d * 12 * s + 1.3 * s, -4 * s, 1.6 * s, 0, TAU); ctx.fill();
      });
    }
    ctx.fillStyle = 'rgba(240,110,120,0.55)';
    [-1, 1].forEach(d => { ctx.beginPath(); ctx.ellipse(d * 22 * s, 7 * s, 6 * s, 3.5 * s, 0, 0, TAU); ctx.fill(); });
    ctx.fillStyle = '#C2414F';
    if (mood === 'jump' || mood === 'hurt') { ctx.beginPath(); ctx.ellipse(0, 8 * s, 4 * s, 5 * s, 0, 0, TAU); ctx.fill(); ctx.stroke(); }
    else { ctx.beginPath(); ctx.arc(-3 * s, 5 * s, 3 * s, 0.1, Math.PI - 0.1); ctx.stroke(); ctx.beginPath(); ctx.arc(3 * s, 5 * s, 3 * s, 0.1, Math.PI - 0.1); ctx.stroke(); }
    ctx.restore();
  }

  function drawBackground() {
    const g = ctx.createLinearGradient(0, -OY, 0, VH);
    g.addColorStop(0, '#9FD3E6'); g.addColorStop(1, '#E6F4F2');
    ctx.fillStyle = g; ctx.fillRect(0, -OY - 10, VW, VHH + 20);
    // clouds (far)
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    for (let i = 0; i < 6; i++) {
      const x = ((i * 260 - camX * 0.1) % (VW + 300) + VW + 300) % (VW + 300) - 150;
      const y = 50 + (i % 3) * 30;
      ctx.beginPath(); ctx.arc(x, y, 18, 0, TAU); ctx.arc(x + 20, y - 10, 22, 0, TAU); ctx.arc(x + 44, y, 16, 0, TAU); ctx.fill();
    }
    // ごはん山 (mid): white rice mountains with nori bands
    for (let layer = 0; layer < 2; layer++) {
      const par = layer ? 0.35 : 0.2, base = layer ? 270 : 240, step = layer ? 220 : 300;
      ctx.fillStyle = layer ? '#F4F1E8' : '#DDEBE6';
      const off = camX * par % step;
      for (let x = -step - off; x < VW + step; x += step) {
        const h = layer ? 90 : 130;
        ctx.beginPath(); ctx.moveTo(x, base + 40); ctx.quadraticCurveTo(x + step / 2, base - h, x + step, base + 40); ctx.fill();
      }
      if (layer) {
        ctx.fillStyle = '#26332B';
        for (let x = -step - off; x < VW + step; x += step) ctx.fillRect(x + step * 0.36, base - 8, step * 0.28, 22);
      }
    }
    // fryer oil at the bottom
    const oy = GROUND + 90;
    const og = ctx.createLinearGradient(0, oy, 0, VHH);
    og.addColorStop(0, '#F3B53C'); og.addColorStop(1, '#C4731C');
    ctx.fillStyle = og;
    ctx.beginPath(); ctx.moveTo(0, VHH + 200);
    for (let x = 0; x <= VW + 20; x += 20) ctx.lineTo(x, oy + Math.sin((x + camX * 0.6) * 0.03 + time * 3) * 4);
    ctx.lineTo(VW, VHH + 200); ctx.fill();
    ctx.fillStyle = 'rgba(255,240,190,0.8)';
    for (let i = 0; i < 14; i++) {
      const x = ((i * 97 - camX * 0.6) % VW + VW) % VW, ph = (time * 0.9 + i * 0.37) % 1;
      ctx.beginPath(); ctx.arc(x, oy + 30 - ph * 24, 3 + ph * 4, 0, TAU); ctx.fill();
    }
  }

  function drawPlatforms() {
    for (const p of platforms) {
      const x = p.x - camX; if (x > VW + 10 || x + p.w < -10) continue;
      // cutting board block
      ctx.fillStyle = '#C99E66'; ctx.fillRect(x, p.y + 10, p.w, VHH - p.y + 200);
      ctx.fillStyle = '#E9C99A'; ctx.beginPath(); ctx.roundRect(x, p.y, p.w, 22, [8, 8, 0, 0]); ctx.fill();
      ctx.strokeStyle = 'rgba(122,66,16,0.25)'; ctx.lineWidth = 2;
      for (let k = 0; k < 3; k++) { ctx.beginPath(); ctx.moveTo(x + 6, p.y + 6 + k * 5); ctx.lineTo(x + p.w - 6, p.y + 6 + k * 5 + Math.sin(k + p.x) * 1.5); ctx.stroke(); }
      ctx.strokeStyle = '#7A4210'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(x, VHH + 200); ctx.lineTo(x, p.y + 8); ctx.quadraticCurveTo(x, p.y, x + 8, p.y); ctx.lineTo(x + p.w - 8, p.y); ctx.quadraticCurveTo(x + p.w, p.y, x + p.w, p.y + 8); ctx.lineTo(x + p.w, VHH + 200); ctx.stroke();
      // cabbage tufts
      ctx.fillStyle = '#9BC85A';
      for (let gx = 30; gx < p.w - 20; gx += 170) {
        const bx = x + gx + (p.x % 40);
        ctx.beginPath(); ctx.arc(bx, p.y + 1, 7, Math.PI, 0); ctx.arc(bx + 9, p.y + 1, 6, Math.PI, 0); ctx.fill();
      }
    }
  }

  function drawEnemies() {
    for (const e of enemies) {
      const x = e.x - camX; if (x < -60 || x > VW + 60) continue;
      if (e.type === 'fork') {
        const step = Math.sin(e.t * 10) * 3;
        ctx.save(); ctx.translate(x, e.y);
        // legs
        ctx.strokeStyle = '#4A5563'; ctx.lineWidth = 4; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(-5, -14); ctx.lineTo(-7 + step, 0); ctx.moveTo(5, -14); ctx.lineTo(7 - step, 0); ctx.stroke();
        // handle + tines
        ctx.fillStyle = '#B7C0CC'; ctx.strokeStyle = '#4A5563'; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.roundRect(-9, -40, 18, 28, 8); ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(-12, -40); ctx.lineTo(12, -40); ctx.lineTo(10, -46); ctx.lineTo(-10, -46); ctx.closePath(); ctx.fill(); ctx.stroke();
        for (let i = -1.5; i <= 1.5; i++) { ctx.beginPath(); ctx.roundRect(i * 6 - 2, -64, 4, 20, 2); ctx.fill(); ctx.stroke(); }
        // angry face
        ctx.fillStyle = '#2A1A0E';
        ctx.beginPath(); ctx.arc(-4, -28, 2.2, 0, TAU); ctx.arc(4, -28, 2.2, 0, TAU); ctx.fill();
        ctx.strokeStyle = '#2A1A0E'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(-7, -34); ctx.lineTo(-2, -32); ctx.moveTo(7, -34); ctx.lineTo(2, -32); ctx.stroke();
        ctx.beginPath(); ctx.arc(0, -19, 3, Math.PI + 0.3, -0.3); ctx.stroke();
        ctx.restore();
      } else {
        ctx.save(); ctx.translate(x, e.y);
        ctx.fillStyle = '#4A2410'; ctx.strokeStyle = '#2A1208'; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.moveTo(0, -22); ctx.bezierCurveTo(10, -8, 16, 2, 16, 8); ctx.arc(0, 8, 16, 0, Math.PI); ctx.bezierCurveTo(-16, 2, -10, -8, 0, -22); ctx.fill(); ctx.stroke();
        ctx.fillStyle = 'rgba(255,255,255,0.45)'; ctx.beginPath(); ctx.ellipse(-6, 2, 3, 6, -0.4, 0, TAU); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(-5, 8, 3.5, 0, TAU); ctx.arc(5, 8, 3.5, 0, TAU); ctx.fill();
        ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(-4, 9, 1.8, 0, TAU); ctx.arc(4, 9, 1.8, 0, TAU); ctx.fill();
        // wings
        const f = Math.sin(e.t * 20) * 0.5;
        ctx.fillStyle = 'rgba(255,255,255,0.75)';
        ctx.beginPath(); ctx.ellipse(-18, -2, 9, 5, -0.5 + f, 0, TAU); ctx.ellipse(18, -2, 9, 5, 0.5 - f, 0, TAU); ctx.fill();
        ctx.restore();
      }
    }
  }

  function drawPlayer() {
    const x = PX;
    let y = py;
    const running = state === 'play' && onGround;
    const bob = running ? Math.abs(Math.sin(time * speed / 22)) * 3 : 0;
    if (state === 'title') { y = GROUND; }
    // shadow
    if (state !== 'dead') {
      const g = state === 'title' ? GROUND : groundAt(camX + PX);
      if (g !== null) {
        const k = Math.max(0.3, 1 - (g - y) / 200);
        ctx.fillStyle = 'rgba(80,45,10,0.2)'; ctx.beginPath(); ctx.ellipse(x, g + 2, 44 * k, 6 * k, 0, 0, TAU); ctx.fill();
      }
    }
    ctx.save();
    ctx.translate(x, y - (state === 'title' ? Math.abs(Math.sin(time * 9)) * 3 : bob));
    const legLen = 12;
    const ph = time * (state === 'title' ? 14 : speed / 18);
    ctx.strokeStyle = '#7A4210'; ctx.lineWidth = 6.5; ctx.lineCap = 'round';
    [-1, 1].forEach((d, i) => {
      const sw = (onGround || state === 'title') && state !== 'dead' ? Math.sin(ph + i * Math.PI) * 9 : d * 6;
      ctx.beginPath(); ctx.moveTo(d * 14, -legLen - 4); ctx.lineTo(d * 14 + sw, -3); ctx.stroke();
      ctx.fillStyle = '#5B300B'; ctx.beginPath(); ctx.ellipse(d * 14 + sw + 3, -3, 7, 4, 0, 0, TAU); ctx.fill();
    });
    const rw = 120, rh = rw * 220 / 420, ry = rh / 2;
    ctx.translate(0, -legLen - ry + 2);
    if (state === 'dead') ctx.rotate((1.2 - deadT) * 4);
    ctx.scale(1 + squash, 1 - squash);
    // arms swing
    ctx.strokeStyle = '#7A4210'; ctx.lineWidth = 5.5;
    [-1, 1].forEach((d, i) => {
      const a = onGround || state === 'title' ? Math.sin(ph + i * Math.PI) * 10 : -14;
      ctx.beginPath(); ctx.moveTo(d * 54, 4); ctx.quadraticCurveTo(d * 64, 2, d * 68, a); ctx.stroke();
      ctx.fillStyle = '#C47A22'; ctx.beginPath(); ctx.arc(d * 68, a, 4.5, 0, TAU); ctx.fill();
    });
    if (croImg.complete && croImg.naturalWidth) ctx.drawImage(croImg, -rw / 2, -ry, rw, rh);
    else { ctx.fillStyle = '#E39A3A'; ctx.beginPath(); ctx.ellipse(0, 0, rw / 2, ry, 0, 0, TAU); ctx.fill(); }
    const mood = state === 'dead' ? 'hurt' : (!onGround && state === 'play') ? 'jump' : speed > 500 ? 'focus' : 'idle';
    face(14, -1, 0.85, mood);
    ctx.restore();
  }

  function drawHUD() {
    ctx.save();
    if (state === 'play' || state === 'dead') {
      const m = Math.floor(dist / 50);
      ctx.textAlign = 'left';
      ctx.font = `800 13px ${FB}`; ctx.fillStyle = '#7A4210'; ctx.fillText('きょり', 16, 30);
      ctx.font = `34px ${FD}`; ctx.fillStyle = '#1F3A68'; ctx.fillText(m + 'm', 16, 64);
      ctx.textAlign = 'right';
      ctx.font = `800 13px ${FB}`; ctx.fillStyle = '#7A4210'; ctx.fillText('スピード', VW - 16, 30);
      ctx.font = `22px ${FD}`; ctx.fillStyle = '#1F3A68'; ctx.fillText(`${(speed / 260).toFixed(1)}倍`, VW - 16, 58);
      if (best > 0) { ctx.font = `800 12px ${FB}`; ctx.fillStyle = '#7A4210'; ctx.fillText(`ベスト ${best}m`, VW - 16, 78); }
    }
    ctx.textAlign = 'center';
    for (const t of texts) {
      ctx.globalAlpha = Math.min(1, t.life * 2);
      ctx.font = `30px ${FD}`; ctx.lineWidth = 7; ctx.strokeStyle = '#FFFDF6'; ctx.fillStyle = t.color;
      ctx.strokeText(t.str, VW / 2, 130 + t.y); ctx.fillText(t.str, VW / 2, 130 + t.y);
    }
    ctx.restore();
  }

  function draw() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, cw, ch);
    ctx.scale(scale, scale);
    // vertically center the 400-high world in the visible height
    const oy = Math.max(0, (VHH - VH) * 0.6); OY = oy;
    if (shake > 0) ctx.translate((Math.random() - 0.5) * 10 * shake, (Math.random() - 0.5) * 10 * shake);
    ctx.translate(0, oy);
    VHH_draw = VHH - oy;
    drawBackground();
    if (state === 'title') {
      platforms = [{ x: camX - 50, w: VW + 100, y: GROUND }];
      enemies = [];
    }
    drawPlatforms();
    drawEnemies();
    drawPlayer();
    for (const p of particles) {
      ctx.globalAlpha = Math.min(1, p.life * 2); ctx.fillStyle = p.c;
      ctx.beginPath(); ctx.arc(p.x - camX, p.y, p.s, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.translate(0, -oy);
    drawHUD();
  }
  let VHH_draw = VH, OY = 0;

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000); last = now;
    update(dt); draw(); requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // ---------- input ----------
  const app = document.getElementById('app');
  app.addEventListener('pointerdown', e => {
    if (e.target.closest('button') || e.target.closest('.panel')) return;
    e.preventDefault(); jumpPress();
  });
  window.addEventListener('pointerup', () => { if (holding) jumpRelease(); });
  window.addEventListener('pointercancel', () => { if (holding) jumpRelease(); });
  const JUMP_KEYS = ['Space', 'ArrowUp', 'KeyW'];
  window.addEventListener('keydown', e => {
    if (!JUMP_KEYS.includes(e.code)) return;
    e.preventDefault(); if (e.repeat) return;
    if (state === 'title' || state === 'over') start(); else jumpPress();
  });
  window.addEventListener('keyup', e => { if (JUMP_KEYS.includes(e.code) && holding) jumpRelease(); });
  document.getElementById('startBtn').addEventListener('click', start);
  document.getElementById('retryBtn').addEventListener('click', start);
  soundBtn.addEventListener('click', () => { soundOn = !soundOn; store.set('korokke-run-sound', soundOn); renderSound(); if (soundOn) tone(880, 880, 0.05, 'triangle'); });
})();
</script>
