<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>コロッケしょうぼうたい</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
/* Layout: one-screen game. Canvas = 道路(運転) と 火事の建物(消火). DOM panels and pads float on top. */
:root {
  --ai: #1F3A68;
  --ai-deep: #142849;
  --koromo: #E8A53E;
  --koromo-dark: #7A4210;
  --paper: #FFFDF6;
  --beni: #D83A4E;
  --font-display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  --font-body: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  color-scheme: light;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  background: #23314A;
  color: var(--ai-deep);
  font-family: var(--font-body);
  overflow: hidden;
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
}
#app { position: relative; width: 100%; height: 100%; touch-action: manipulation; }
canvas { display: block; width: 100%; height: 100%; touch-action: none; }

.panel {
  position: absolute; left: 50%; top: 50%;
  transform: translate(-50%, -50%);
  width: min(350px, calc(100% - 32px));
  max-height: calc(100% - 32px); overflow-y: auto;
  box-sizing: border-box;
  background: var(--paper);
  border: 3px solid var(--ai);
  border-radius: 20px;
  box-shadow: 6px 6px 0 var(--ai);
  padding: 20px 18px 18px;
  display: flex; flex-direction: column; align-items: center; gap: 11px;
  text-align: center;
}
.panel h1 {
  margin: 0; font-family: var(--font-display); font-weight: 400;
  font-size: 2.1rem; line-height: 1.15; color: var(--beni);
  text-wrap: balance; letter-spacing: 0.02em;
}
.panel h1 small { display: block; font-size: 0.95rem; color: var(--koromo-dark); letter-spacing: 0.2em; margin-bottom: 4px; }
.panel h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 1.6rem; color: var(--ai); text-wrap: balance; line-height: 1.25; }
.panel p { margin: 0; font-size: 0.95rem; line-height: 1.7; font-weight: 500; }
.how { display: grid; gap: 7px; width: 100%; box-sizing: border-box; font-size: 0.86rem; line-height: 1.55; text-align: left; padding: 10px 12px; background: #F3EEE2; border-radius: 12px; }
.how b { color: var(--beni); }
kbd {
  font-family: var(--font-body); font-weight: 800; font-size: 0.75rem;
  border: 2px solid var(--ai); border-bottom-width: 3px; border-radius: 6px; padding: 0 4px; background: #fff;
}
.diff { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; width: 100%; }
.diff button {
  font-family: var(--font-body); font-weight: 800; font-size: 0.82rem; color: var(--ai);
  background: #fff; border: 2px solid var(--ai); border-radius: 10px; padding: 8px 0; cursor: pointer;
}
.diff button[aria-pressed="true"] { background: var(--ai); color: var(--paper); }
.diff button.oni[aria-pressed="true"] { background: var(--beni); border-color: var(--beni); }
.diffnote { font-size: 0.8rem; font-weight: 800; color: var(--koromo-dark); min-height: 1.3em; }
.btn {
  font-family: var(--font-display); font-size: 1.3rem; color: var(--ai-deep);
  background: var(--koromo); border: 3px solid var(--ai); border-radius: 999px;
  padding: 10px 34px; box-shadow: 0 5px 0 var(--ai); cursor: pointer;
  transition: transform .08s, box-shadow .08s;
}
.btn.sub { font-size: 0.95rem; background: #fff; padding: 7px 22px; box-shadow: 0 3px 0 var(--ai); }
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--ai); }
.btn:focus-visible, .sound:focus-visible, .pbtn:focus-visible, .diff button:focus-visible { outline: 3px solid var(--beni); outline-offset: 3px; }
.big { font-family: var(--font-display); font-size: 1.15rem; color: var(--beni); }
.note { font-size: 0.85rem; font-weight: 800; color: var(--koromo-dark); }
.stars { font-size: 2rem; letter-spacing: 0.1em; color: var(--koromo); line-height: 1; }
.stars .off { color: #DDD3BF; }
.res { width: 100%; display: grid; gap: 3px; font-size: 0.9rem; font-weight: 800; }
.res div { display: flex; justify-content: space-between; padding: 3px 8px; background: #F3EEE2; border-radius: 8px; }
.res div.total { background: var(--koromo); color: var(--ai-deep); }
.stagechips { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; font-size: 0.72rem; font-weight: 800; color: var(--koromo-dark); }
.stagechips span { padding: 2px 7px; border-radius: 999px; background: #F3EEE2; }
.stagechips span.done { background: var(--koromo); color: var(--ai-deep); }
.stagechips span.now { background: var(--beni); color: var(--paper); }

.pad {
  position: absolute; left: 0; right: 0; bottom: 0;
  display: grid; grid-template-columns: 1fr 1fr; gap: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-bottom: max(14px, calc(env(safe-area-inset-bottom, 0px) + 10px));
  max-width: 480px; margin: 0 auto;
  pointer-events: none;
}
.pbtn {
  pointer-events: auto; touch-action: none;
  font-family: var(--font-display); font-size: 1.6rem; line-height: 1;
  border: 3px solid var(--ai); border-radius: 18px;
  padding: 14px 8px; cursor: pointer; color: var(--ai);
  background: rgba(255, 253, 246, 0.92);
  box-shadow: 0 6px 0 var(--ai);
  transition: transform .05s, box-shadow .05s;
}
.pbtn.down { transform: translateY(5px); box-shadow: 0 1px 0 var(--ai); background: #DCE6F5; }
.jumbo {
  position: absolute;
  right: max(14px, calc(env(safe-area-inset-right, 0px) + 14px));
  bottom: max(16px, calc(env(safe-area-inset-bottom, 0px) + 12px));
  width: 92px; height: 92px; border-radius: 50%;
  font-family: var(--font-display); font-size: 0.95rem; line-height: 1.15; color: var(--ai);
  border: 3px solid var(--ai); background: #E9E3D4; cursor: pointer;
  box-shadow: 0 5px 0 var(--ai); touch-action: none;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  overflow: hidden;
}
.jumbo .fill { position: absolute; left: 0; right: 0; bottom: 0; background: var(--koromo); z-index: 0; transition: height .15s; }
.jumbo span { position: relative; z-index: 1; }
.jumbo small { position: relative; z-index: 1; font-family: var(--font-body); font-weight: 800; font-size: 0.65rem; }
.jumbo.ready { background: var(--koromo); animation: pulse .7s ease-in-out infinite alternate; color: var(--ai-deep); }
.jumbo:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--ai); }
@keyframes pulse { from { transform: scale(1); } to { transform: scale(1.08); } }
@media (prefers-reduced-motion: reduce) { .jumbo.ready { animation: none; } }

.sound {
  position: absolute;
  right: max(12px, calc(env(safe-area-inset-right, 0px) + 12px));
  top: max(12px, calc(env(safe-area-inset-top, 0px) + 12px));
  font-family: var(--font-body); font-weight: 800; font-size: 0.8rem;
  background: var(--paper); color: var(--ai); border: 2px solid var(--ai);
  border-radius: 999px; padding: 5px 12px; cursor: pointer;
}
</style>
<style data-fix="hidden">[hidden]{display:none!important}</style>
</head>
<body>
<div id="app">
  <canvas id="cv"></canvas>

  <div class="panel" id="titlePanel">
    <h1><small>しゅつどう！</small>コロッケ<br>しょうぼうたい</h1>
    <div class="how">
      <div>🚒 道路では <b>◀ ▶</b> で車線をかえて、車やコーンをよけよう。とちゅうの<b>コロッケ</b>をひろうとタマがふえる。</div>
      <div>🔥 火事の家についたら、<b>火をタップ</b>！ カチコチの<b>冷凍コロッケ</b>をなげて火を消せ！</div>
      <div>はやく着くほど火は小さい。<b>ジャンボ</b>がたまったら、ぜんぶの火にドーン！</div>
      <div>PC：<kbd>←</kbd><kbd>→</kbd> 車線／火はクリック（<kbd>矢印</kbd>でえらんで<kbd>スペース</kbd>も可）<kbd>J</kbd> ジャンボ</div>
    </div>
    <div class="diff" id="diffBtns" role="group" aria-label="むずかしさ">
      <button type="button" data-d="easy">かんたん</button>
      <button type="button" data-d="normal">ふつう</button>
      <button type="button" data-d="hard">むずかしい</button>
      <button type="button" data-d="oni" class="oni">おに</button>
    </div>
    <div class="diffnote" id="diffNote"></div>
    <div class="note" id="bestTitle"></div>
    <button class="btn" id="startBtn" type="button">しゅつどう！</button>
  </div>

  <div class="panel" id="introPanel" hidden>
    <div class="stagechips" id="chipsIntro"></div>
    <div class="note" id="introStage"></div>
    <h2 id="introHead"></h2>
    <p id="introText"></p>
    <button class="btn" id="goBtn" type="button">しゅつどう！</button>
  </div>

  <div class="panel" id="clearPanel" hidden>
    <h2 id="clearHead">火が消えた！</h2>
    <div class="stars" id="clearStars"></div>
    <div class="res" id="clearRes"></div>
    <button class="btn" id="nextBtn" type="button">つぎの現場へ</button>
  </div>

  <div class="panel" id="failPanel" hidden>
    <h2>まっくろこげ…</h2>
    <p id="failText">火が強くなりすぎた！<br>もういちど、いそいで出動だ！</p>
    <button class="btn" id="retryBtn" type="button">もういちど</button>
    <button class="btn sub" id="toTitleBtn" type="button">タイトルへ</button>
  </div>

  <div class="panel" id="endPanel" hidden>
    <h2>ぜんぶの火事を<br>消しとめた！</h2>
    <div class="big" id="endRank"></div>
    <div class="stars" id="endStars"></div>
    <p id="endText"></p>
    <div class="note" id="endBest"></div>
    <button class="btn" id="againBtn" type="button">もういちど</button>
    <button class="btn sub" id="endTitleBtn" type="button">むずかしさをかえる</button>
  </div>

  <div class="pad" id="drivePad" hidden>
    <button class="pbtn" id="leftBtn" type="button" aria-label="ひだりの車線へ">◀</button>
    <button class="pbtn" id="rightBtn" type="button" aria-label="みぎの車線へ">▶</button>
  </div>

  <button class="jumbo" id="jumboBtn" type="button" hidden><div class="fill" id="jumboFill"></div><span>ジャンボ</span><small id="jumboSub">ためよう</small></button>

  <button class="sound" id="soundBtn" type="button" aria-pressed="true">音：オン</button>
</div>

  window.addEventListener('keydown', e => {
    if (e.repeat && mode === 'drive') return;
    const k = e.key;
    if (mode === 'drive') {
      if (k === 'ArrowLeft' || k === 'a' || k === 'A') { moveLane(-1); e.preventDefault(); }
      if (k === 'ArrowRight' || k === 'd' || k === 'D') { moveLane(1); e.preventDefault(); }
    } else if (mode === 'fire') {
      const s = S();
      if (k.startsWith('Arrow')) {
        e.preventDefault();
        if (cursor < 0) { const b = wins.findIndex(w => w.fire > 0); cursor = b < 0 ? 0 : b; return; }
        let r = Math.floor(cursor / s.cols), c = cursor % s.cols;
        if (k === 'ArrowLeft') c = Math.max(0, c - 1);
        if (k === 'ArrowRight') c = Math.min(s.cols - 1, c + 1);
        if (k === 'ArrowUp') r = Math.max(0, r - 1);
        if (k === 'ArrowDown') r = Math.min(s.rows - 1, r + 1);
        cursor = r * s.cols + c;
      } else if (k === ' ' || k === 'Enter') {
        e.preventDefault();

  // ---------- drawing ----------
  function drawFlame(cx, base, L, seed, wScale = 1) {
    if (L <= 0) return;
    const s = (0.35 + Math.min(L, 3) / 3 * 0.75) * wScale;
    const tt = time * 9 + seed;
    // glow
    const g = ctx.createRadialGradient(cx, base - 20 * s, 2, cx, base - 20 * s, 70 * s);
    g.addColorStop(0, 'rgba(255,170,60,0.45)'); g.addColorStop(1, 'rgba(255,120,40,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, base - 20 * s, 70 * s, 0, Math.PI * 2); ctx.fill();
    const tongue = (x, w, h, col) => {
      ctx.fillStyle = col; ctx.beginPath();
      ctx.moveTo(x - w / 2, base);
      ctx.bezierCurveTo(x - w / 2, base - h * 0.5, x - w * 0.15 + Math.sin(tt) * 4, base - h * 0.7, x + Math.sin(tt * 0.7) * 6, base - h);
      ctx.bezierCurveTo(x + w * 0.15 + Math.sin(tt * 1.3) * 4, base - h * 0.7, x + w / 2, base - h * 0.5, x + w / 2, base);
      ctx.closePath(); ctx.fill();
    };
    const f = k => 1 + Math.sin(tt * (1.1 + k * 0.3) + k) * 0.12;
    tongue(cx - 18 * s, 30 * s, 52 * s * f(1), '#E2402B');
    tongue(cx + 18 * s, 30 * s, 48 * s * f(2), '#E2402B');
    tongue(cx, 44 * s, 78 * s * f(0), '#EF5B2A');
    tongue(cx - 8 * s, 26 * s, 50 * s * f(3), '#FF9A2E');
    tongue(cx + 9 * s, 24 * s, 44 * s * f(4), '#FF9A2E');
    tongue(cx, 18 * s, 32 * s * f(5), '#FFE066');
  }

          const k = Math.min(1, (mode === 'clearAnim' ? st * 2 : (w.happy - 1.2) * 2));
          const bob = Math.sin(time * 8 + w.seed) * 3;
          ctx.save(); ctx.beginPath(); ctx.rect(w.x, w.y, w.w, w.h); ctx.clip();
          drawCro(w.x + w.w / 2, w.y + w.h + 8 - 26 * k + bob, w.w * 0.8, Math.sin(time * 4 + w.seed) * 0.1);
          // eyes
          const ex = w.x + w.w / 2, ey = w.y + w.h + 4 - 26 * k + bob;
          ctx.fillStyle = '#2A1A10'; ctx.beginPath(); ctx.arc(ex - 9, ey, 3, 0, Math.PI * 2); ctx.arc(ex + 9, ey, 3, 0, Math.PI * 2); ctx.fill();
          ctx.strokeStyle = '#2A1A10'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(ex, ey + 4, 6, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
          ctx.restore();
        }
      }
      ctx.strokeStyle = '#3A2E26'; ctx.lineWidth = 2; ctx.strokeRect(w.x, w.y, w.w, w.h);
      ctx.beginPath(); ctx.moveTo(w.x + w.w / 2, w.y); ctx.lineTo(w.x + w.w / 2, w.y + w.h); ctx.stroke();
    }
    // flames
    for (const w of wins) if (w.fire > 0) drawFlame(w.x + w.w / 2, w.y + w.h - 4, w.fire, w.seed, w.w / 78);
    // danger bar fill under flames for low fire
    for (const w of wins) if (w.fire > 0 && w.fire >= 2 && D.spread - w.sp < 1.5) {
      ctx.strokeStyle = `rgba(216,58,78,${0.5 + 0.5 * Math.sin(time * 14)})`; ctx.lineWidth = 3;
      ctx.strokeRect(w.x - 6, w.y - 6, w.w + 12, w.h + 12);
    }
    // keyboard cursor
    if (cursor >= 0 && wins[cursor] && mode === 'fire') {
      const w = wins[cursor];
      ctx.save(); ctx.setLineDash([6, 4]); ctx.lineDashOffset = -time * 20;
      ctx.strokeStyle = '#FFE066'; ctx.lineWidth = 4; ctx.strokeRect(w.x - 8, w.y - 8, w.w + 16, w.h + 16); ctx.restore();
    }
    // fail darkening
    if (mode === 'failAnim' || (mode === 'panel' && burn >= 1)) {
      ctx.fillStyle = `rgba(30,25,25,${Math.min(0.55, st * 0.4)})`; ctx.fillRect(VX0, VY0, VX1 - VX0, VY1 - VY0);
    }
    drawTruckBack();
  }
  function mix(a, b, k) {
    const pa = [1, 3, 5].map(i => parseInt(a.slice(i, i + 2), 16)), pb = [1, 3, 5].map(i => parseInt(b.slice(i, i + 2), 16));
    return `rgb(${pa.map((v, i) => Math.round(v + (pb[i] - v) * k)).join(',')})`;
  }
  function drawTruckBack() {
    const x = W / 2, y = H - 150;
    ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.beginPath(); ctx.ellipse(x, y + 54, 96, 12, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#222'; rr(x - 84, y + 26, 30, 30, 6); ctx.fill(); rr(x + 54, y + 26, 30, 30, 6); ctx.fill();
    ctx.fillStyle = '#D8302A'; rr(x - 90, y - 10, 180, 50, 10); ctx.fill();
    ctx.strokeStyle = '#7E1712'; ctx.lineWidth = 3; ctx.stroke();
    ctx.fillStyle = '#F5F5F5'; ctx.fillRect(x - 90, y + 8, 180, 7);
    txt('コロッケ消防', x, y + 28, 14, '#FFFDF6', { align: 'center', display: true });
    const blink = Math.floor(time * 6) % 2 === 0;
    ctx.fillStyle = blink ? '#FF3B3B' : '#7A1010'; ctx.beginPath(); ctx.arc(x - 76, y - 14, 7, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = blink ? '#2B5FA0' : '#4DA3FF'; ctx.beginPath(); ctx.arc(x + 76, y - 14, 7, 0, Math.PI * 2); ctx.fill();
    // freezer box with croquettes
    ctx.fillStyle = '#E8F4FB'; rr(x - 70, y - 34, 50, 26, 5); ctx.fill(); ctx.strokeStyle = '#5B7FA0'; ctx.lineWidth = 2; ctx.stroke();
    txt('冷凍', x - 45, y - 21, 11, '#2D6FB0', { align: 'center' });
    const n = stock === Infinity ? 3 : Math.min(3, stock);
    for (let i = 0; i < n; i++) drawCro(x + 32 + i * 12, y - 18 - i * 5, 30, -0.2, true);
    // launcher (slingshot-ish tube)
    ctx.save(); ctx.translate(LAUNCH.x, LAUNCH.y); ctx.rotate(aimAng + Math.PI / 2);
    ctx.fillStyle = '#9AA4B0'; rr(-11, -40, 22, 44, 6); ctx.fill(); ctx.strokeStyle = '#4A5260'; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.fillStyle = '#4A5260'; ctx.fillRect(-13, -44, 26, 7);
    ctx.restore();
    ctx.fillStyle = '#4A5260'; ctx.beginPath(); ctx.arc(LAUNCH.x, LAUNCH.y, 13, 0, Math.PI * 2); ctx.fill();
  }

  function drawFireHud() {
    drawHudTop();
    // burn meter
    const bx = 16, bw = W - 32, by = 48;
    txt('もえてる度', bx, by - 1, 12, '#FFFDF6', { stroke: '#142849', sw: 4 });
    const mx = bx + 72, mw = bw - 72;
    ctx.fillStyle = 'rgba(20,40,73,0.85)'; rr(mx, by - 9, mw, 18, 9); ctx.fill();
    const k = clamp(burn, 0, 1);
    ctx.fillStyle = k > 0.7 ? (Math.floor(time * 6) % 2 ? '#FF4A3A' : '#D83A4E') : k > 0.4 ? '#F08A2E' : '#F2C14E';
    if (k > 0) { rr(mx + 2, by - 7, Math.max(14, (mw - 4) * k), 14, 7); ctx.fill(); }
    drawStock(16, 80);
    const left = wins.filter(w => w.fire > 0).length;
    txt(`のこりの火 ${left}`, W - 16, 80, 16, '#FFFDF6', { align: 'right', stroke: '#142849', sw: 4 });
    txt(`${score.toLocaleString()} てん`, W - 16, 106, 13, '#FFFDF6', { align: 'right', stroke: '#142849', sw: 4 });
    if (combo >= 2) txt(`${combo} コンボ！`, 16, 106, 14, '#FFE066', { stroke: '#142849', sw: 4 });
    if (D.wind) {
      const wx = W / 2, wy = 106;
      txt('かぜ', wx - 44, wy, 12, '#FFFDF6', { align: 'right', stroke: '#142849', sw: 4 });
      ctx.save(); ctx.translate(wx, wy);
      ctx.fillStyle = 'rgba(20,40,73,0.7)'; rr(-38, -8, 76, 16, 8); ctx.fill();
      const len = wind * 34;
      ctx.strokeStyle = '#8FD0FF'; ctx.fillStyle = '#8FD0FF'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(len, 0); ctx.stroke();
      if (Math.abs(len) > 4) { const d = Math.sign(len); ctx.beginPath(); ctx.moveTo(len + d * 6, 0); ctx.lineTo(len - d * 2, -6); ctx.lineTo(len - d * 2, 6); ctx.fill(); }
      ctx.restore();
    }
  }

  function drawProjs() {
    for (const p of projs) {
      const t = p.t;
      const x = p.x0 + (p.x1 - p.x0) * t;
      const arc = p.big ? 180 : 70 + Math.abs(p.y0 - p.y1) * 0.15;
      const y = p.y0 + (p.y1 - p.y0) * t - Math.sin(Math.PI * t) * arc;
      const w = p.big ? 150 - 40 * t : 46 - 14 * t;
      ctx.fillStyle = 'rgba(160,220,255,0.35)'; ctx.beginPath(); ctx.arc(x, y, w * 0.45, 0, Math.PI * 2); ctx.fill();
      drawCro(x, y, w, p.spin * t, true);
      if (Math.random() < 0.5) parts.push({ type: 'ice', x, y, vx: rand(-20, 20), vy: rand(-10, 30), life: 0, max: 0.35, size: rand(1.5, 3) });
    }
  }
  function updateParts(dt) {
    for (const p of parts) {
      p.life += dt; p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.type === 'spark' || p.type === 'ice') p.vy += 300 * dt;
      if (p.type === 'cro') { p.vy += 600 * dt; p.rot += p.vr * dt; }
      if (p.type === 'confetti') { p.rot += p.vr * dt; p.vx += Math.sin(time * 3 + p.size) * 20 * dt; }
      if (p.type === 'smoke' || p.type === 'steam') { p.size += dt * 10; p.vx *= Math.pow(0.6, dt); }
    }
    parts = parts.filter(p => p.life < p.max);
    if (parts.length > 400) parts.splice(0, parts.length - 400);
    for (const p of pops) { p.t += dt; p.y -= 30 * dt; }
    pops = pops.filter(p => p.t < 1.1);
  }
  function drawParts(layer) {
    for (const p of parts) {
      const k = 1 - p.life / p.max;
      if (layer === 'back' && p.type !== 'smoke') continue;
      if (layer === 'front' && p.type === 'smoke') continue;
      if (p.type === 'smoke') { ctx.fillStyle = `rgba(70,62,60,${0.35 * k})`; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill(); }
      else if (p.type === 'steam') { ctx.fillStyle = `rgba(255,255,255,${0.75 * k})`; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill(); }
      else if (p.type === 'spark') { ctx.fillStyle = p.color; ctx.globalAlpha = k; ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size); ctx.globalAlpha = 1; }
      else if (p.type === 'ice') { ctx.fillStyle = `rgba(200,235,255,${k})`; ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size); }
      else if (p.type === 'cro') drawCro(p.x, p.y, p.size, p.rot, true, k);
      else if (p.type === 'confetti') { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillStyle = p.color; ctx.globalAlpha = Math.min(1, k * 2); ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2); ctx.restore(); }
    }
  }
  function drawPops() {
    for (const p of pops) {
      const a = p.t < 0.8 ? 1 : 1 - (p.t - 0.8) / 0.3;
      ctx.globalAlpha = Math.max(0, a);
      txt(p.text, p.x, p.y, p.size, p.color, { align: 'center', stroke: '#FFFDF6', sw: 4 });
      ctx.globalAlpha = 1;
    }
  }
  function drawBanner() {
    if (!banner) return;
    const b = banner;
    const k = b.t < 0.2 ? b.t / 0.2 : b.t > b.dur - 0.3 ? (b.dur - b.t) / 0.3 : 1;
    ctx.save(); ctx.globalAlpha = clamp(k, 0, 1);
    const y = H * 0.42;
    ctx.translate(W / 2, y); ctx.scale(0.8 + 0.2 * clamp(k, 0, 1), 0.8 + 0.2 * clamp(k, 0, 1));
    ctx.fillStyle = 'rgba(20,40,73,0.82)'; rr(-180, -46, 360, b.sub ? 92 : 70, 18); ctx.fill();
    txt(b.text, 0, b.sub ? -14 : -11, 34, '#FFE066', { align: 'center', display: true, stroke: '#D83A4E', sw: 6 });
    if (b.sub) txt(b.sub, 0, 26, 15, '#FFFDF6', { align: 'center' });
    ctx.restore();
  }
  function drawTitleBg() {
    // a cozy idle scene behind the title panel: road with truck & flames
    ctx.fillStyle = '#1F3A68'; ctx.fillRect(VX0, VY0, VX1 - VX0, VY1 - VY0);
    for (let i = 0; i < 14; i++) {
      const x = ((i * 97 + time * 30) % (W + 200)) - 100, y = 80 + ((i * 131) % (H - 160));
      drawFlame(x, y, 1 + (i % 3) * 0.6, i * 3, 0.6);
    }
    for (let i = 0; i < 8; i++) {
      const x = ((i * 151 - time * 60) % (W + 200) + W + 200) % (W + 200) - 100, y = 40 + ((i * 211) % (H - 80));
      drawCro(x, y, 50, time * 2 + i, true, 0.9);
    }
  }

  function draw() {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, cv.width, cv.height);
    let sx = 0, sy = 0;
    if (shake > 0) { sx = rand(-6, 6) * shake; sy = rand(-6, 6) * shake; }
    ctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * (ox + sx * scale), dpr * (oy + sy * scale));
    if (mode === 'title') drawTitleBg();
    else if (mode === 'drive' || mode === 'arrive' || (mode === 'panel' && !bld && truck)) {
      if (truck) { drawDrive(); drawParts('front'); drawPops(); }
      else drawTitleBg();
    } else if (bld && (mode === 'fire' || mode === 'clearAnim' || mode === 'failAnim' || mode === 'panel')) {
      drawFireScene();
      drawParts('back');
      drawProjs();
      drawParts('front');
      drawPops();
      if (mode !== 'panel') drawFireHud();
    } else drawTitleBg();
    if (mode !== 'panel' && mode !== 'title') drawBanner();
  }

  // ---------- loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    time += dt; st += dt;
    shake = Math.max(0, shake - dt);
    if (banner) { banner.t += dt; if (banner.t >= banner.dur) banner = null; }
    if (mode === 'drive') updateDrive(dt);
    else if (mode === 'arrive') { truck.x += (LANES[1] - truck.x) * Math.min(1, dt * 4); dist += D.speed * 0.2 * dt; if (st > 1.7) { startFire(); } }
    else if (mode === 'fire') updateFire(dt);
    else if (mode === 'clearAnim') { if (st > 2.4) showClear(); }
    else if (mode === 'failAnim') { if (st > 2) showFail(); }
    updateParts(dt);
    draw();
    requestAnimationFrame(frame);
  }
  // when going to a new stage's intro, clear previous fire scene so the intro shows the road
  const _showIntro = showIntro;
  showIntro = function () { bld = null; truck = null; _showIntro(); };
  requestAnimationFrame(frame);
})();
</script>
