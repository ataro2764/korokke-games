<title>コロッケつりざお</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: one-screen game. Canvas = さんばし（手前）から海へのびる つりざお。DOM panels float on top. */
:root {
  --ai: #1F3A68;
  --ai-deep: #142849;
  --koromo: #E8A53E;
  --koromo-dark: #7A4210;
  --paper: #FFFDF6;
  --beni: #D83A4E;
  --font-display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  --font-body: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  color-scheme: light;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  background: #6B4424;
  color: var(--ai-deep);
  font-family: var(--font-body);
  overflow: hidden;
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
}
#app { position: relative; width: 100%; height: 100%; touch-action: manipulation; }
canvas { display: block; width: 100%; height: 100%; touch-action: none; }

.panel {
  position: absolute; left: 50%; top: 50%;
  transform: translate(-50%, -50%);
  width: min(350px, calc(100% - 32px));
  max-height: calc(100% - 32px); overflow-y: auto;
  background: var(--paper);
  border: 3px solid var(--ai);
  border-radius: 20px;
  box-shadow: 6px 6px 0 var(--ai);
  padding: 20px 18px 18px;
  display: flex; flex-direction: column; align-items: center; gap: 11px;
  text-align: center;
  box-sizing: border-box;
}
.panel h1 {
  margin: 0; font-family: var(--font-display); font-weight: 400;
  font-size: 2.1rem; line-height: 1.15; color: var(--ai);
  text-wrap: balance; letter-spacing: 0.02em;
}
.panel h1 small { display: block; font-size: 0.9rem; color: var(--koromo-dark); letter-spacing: 0.15em; margin-bottom: 4px; }
.panel h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 1.7rem; color: var(--ai); text-wrap: balance; }
.how { display: grid; gap: 6px; width: 100%; font-size: 0.86rem; line-height: 1.55; text-align: left; padding: 10px 12px; background: #F3EEE2; border-radius: 12px; box-sizing: border-box; }
.how b { color: var(--beni); }
kbd {
  font-family: var(--font-body); font-weight: 800; font-size: 0.76rem;
  border: 2px solid var(--ai); border-bottom-width: 3px; border-radius: 6px; padding: 0 5px; background: #fff;
}
.diffs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; }
.diff {
  font-family: var(--font-body); font-weight: 800; font-size: 1rem; color: var(--ai);
  background: #fff; border: 2px solid var(--ai); border-radius: 14px;
  padding: 7px 4px 6px; cursor: pointer; line-height: 1.2;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
}
.diff small { font-size: 0.68rem; font-weight: 500; color: var(--koromo-dark); }
.diff .best { font-size: 0.66rem; font-weight: 800; color: var(--ai); opacity: .75; }
.diff[aria-pressed="true"] { background: var(--koromo); box-shadow: inset 0 0 0 2px var(--ai); }
.diff[aria-pressed="true"] small { color: var(--ai-deep); }
.diff.oni[aria-pressed="true"] { background: var(--beni); color: var(--paper); }
.diff.oni[aria-pressed="true"] small, .diff.oni[aria-pressed="true"] .best { color: var(--paper); }
.btn {
  font-family: var(--font-display); font-size: 1.3rem; color: var(--ai-deep);
  background: var(--koromo); border: 3px solid var(--ai); border-radius: 999px;
  padding: 10px 34px; box-shadow: 0 5px 0 var(--ai); cursor: pointer;
  transition: transform .08s, box-shadow .08s;
}
.btn.sub { font-size: 0.95rem; padding: 6px 20px; background: #fff; box-shadow: 0 3px 0 var(--ai); }
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--ai); }
.btn:focus-visible, .sound:focus-visible, .diff:focus-visible { outline: 3px solid var(--beni); outline-offset: 3px; }
.big { font-family: var(--font-display); font-size: 2.6rem; color: var(--beni); line-height: 1; }
.rank { font-family: var(--font-display); font-size: 1.15rem; color: var(--ai); }
.stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; width: 100%; }
.stats div { background: #F3EEE2; border-radius: 10px; padding: 6px 2px; font-size: 0.7rem; font-weight: 800; color: var(--koromo-dark); }
.stats b { display: block; font-family: var(--font-display); font-weight: 400; font-size: 1.15rem; color: var(--ai); }
.note { font-size: 0.85rem; font-weight: 800; color: var(--koromo-dark); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center; }

.sound {
  position: absolute;
  right: max(12px, calc(env(safe-area-inset-right, 0px) + 12px));
  top: max(12px, calc(env(safe-area-inset-top, 0px) + 12px));
  font-family: var(--font-body); font-weight: 800; font-size: 0.8rem;
  background: var(--paper); color: var(--ai); border: 2px solid var(--ai);
  border-radius: 999px; padding: 5px 12px; cursor: pointer;
}
</style>

<div id="app">
  <canvas id="cv"></canvas>

  <div class="panel" id="titlePanel">
    <h1><small>さんばしの おもし大作戦</small>コロッケ<br>つりざお</h1>
    <div class="how">
      <div>さかなが かかると、さおが 海へ <b>ひっぱられる</b>！ さおを <b>タップ</b>して コロッケを のせ、おもしにしよう。</div>
      <div>ふきだしの <b>コロッケの数</b>だけ のせれば さおは とまる。そのまま まつと <b>つれる</b>よ！ ぴったりの数なら <b>ボーナス</b>。</div>
      <div>コロッケの数は かぎりあり。つれたら もどってくる。のせすぎたら <b>「もどす」</b>。むずかしいでは <b>カモメ</b>を タップで おいはらえ！</div>
      <div>PC：<kbd>1</kbd>〜<kbd>5</kbd> のせる ／ <kbd>Q</kbd><kbd>W</kbd><kbd>E</kbd><kbd>R</kbd><kbd>T</kbd> もどす ／ <kbd>スペース</kbd> カモメ</div>
    </div>
    <div class="diffs" id="diffs"></div>
    <button class="btn" id="startBtn">スタート</button>
  </div>

  <div class="panel" id="overPanel" hidden>
    <h2 id="overHead">おしまい！</h2>
    <div class="big" id="overScore">0</div>
    <div class="rank" id="overRank"></div>
    <div class="stats">
      <div>つれた<b id="stCaught">0</b></div>
      <div>ぴったり<b id="stPerfect">0</b></div>
      <div>大もの<b id="stBig">-</b></div>
    </div>
    <div class="note" id="overBest"></div>
    <div class="row">
      <button class="btn" id="retryBtn">もういっかい</button>
      <button class="btn sub" id="menuBtn">むずかしさを かえる</button>
    </div>
  </div>

  <button class="sound" id="soundBtn" type="button" aria-pressed="true">音：オン</button>
</div>

    s.connect(f).connect(g).connect(a.destination); s.start(t);

  soundBtn.addEventListener('click', e => { e.stopPropagation(); setSound(!soundOn); if (soundOn) sfx.remove(); soundBtn.blur(); });

  // ---------- canvas sizing ----------
  let dpr = 1, cw = 0, ch = 0, scale = 1, ox = 0, oy = 0;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    cw = cv.clientWidth; ch = cv.clientHeight;
    cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr);
    scale = Math.min(cw / W, ch / H);
    ox = (cw - W * scale) / 2;
    oy = (ch - H * scale) / 2;
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- sprite ----------
  const IMG_W = 380, IMG_H = 199, IMG_R = IMG_H / IMG_W;
  const croImg = new Image();
  let croReady = false;
  croImg.onload = () => { croReady = true; };
  croImg.src = 'data:image/webp;base64,' + CRO_B64;
  function drawCro(x, y, w, alpha = 1) {
    const h = w * IMG_R;
    ctx.globalAlpha = alpha;
    if (croReady) ctx.drawImage(croImg, x - w / 2, y - h / 2, w, h);
    else { ctx.fillStyle = '#C9852E'; ctx.beginPath(); ctx.ellipse(x, y, w / 2, h / 2, 0, 0, TAU); ctx.fill(); }
    ctx.globalAlpha = 1;
  }

  // ---------- state ----------
  let state = 'title';   // title | count | play | over
  let D = DIFFS[diffIdx];
  let rods = [];
  let stT = 0, time = 0, playT = 0;
  let score = 0, shownScore = 0, combo = 0, caught = 0, perfects = 0, bigFish = null;
  let lives = 0, stock = 0, fryT = 0, spawnT = 0, gullT = 0, shake = 0, trayShake = 0, hintLeft = 0;
  let floats = [], parts = [], flyers = [], jumpers = [], gulls = [], ripples = [];
  let lastCount = -1;

  function layout() {
    rods = [];
    const n = D.rods, colW = W / n;
    for (let i = 0; i < n; i++) {
      rods.push({
        i, x: colW * (i + 0.5), colW, sw: Math.min(60, colW * 0.72),
        st: 'idle', t: 0, cd: rand(0.5, 2.5), weight: 0, p: 0, prog: 0, fish: null,
        dropT: 1, bob: rand(0, TAU), fishPh: rand(0, TAU), hint: false, warnT: 0, fade: 1,
      });
    }
  }

  const progress = () => clamp(playT / ROUND, 0, 1);
  const curGap = () => lerp(D.gap[0], D.gap[1], progress());
  const curMax = () => Math.round(lerp(D.max[0], D.max[1], progress()));
  const totalCro = () => stock + rods.reduce((a, r) => a + r.weight, 0) + flyers.filter(f => f.toTray).length;

  function startGame() {
    D = DIFFS[diffIdx];
    layout();
    score = 0; shownScore = 0; combo = 0; caught = 0; perfects = 0; bigFish = null;
    lives = D.lives; stock = D.stock; fryT = 0; spawnT = 1.2; playT = 0; shake = 0; trayShake = 0;
    gullT = D.gull ? rand(D.gull.gap[0] * 0.6, D.gull.gap[0]) : 0;
    hintLeft = D.hints;
    floats = []; parts = []; flyers = []; jumpers = []; gulls = []; ripples = [];
    state = 'count'; stT = 0; lastCount = -1;
    $('titlePanel').hidden = true; $('overPanel').hidden = true;
    audio();
  }

  function endGame(reason) {
    if (state !== 'play') return;
    state = 'over'; stT = 0;
    const prev = best[D.id] || 0;
    const isBest = score > prev;
    if (isBest) { best[D.id] = score; store.set('korokke-tsurizao-best', best); }
    reason === 'time' ? sfx.end() : sfx.over();
    setTimeout(() => {
      if (state !== 'over') return;
      $('overHead').textContent = reason === 'time' ? 'タイムアップ！' : 'さおが なくなった…';
      $('overScore').textContent = score.toLocaleString() + ' てん';
      const ratio = score / D.target;
      const ri = ratio >= 1 ? 4 : ratio >= 0.7 ? 3 : ratio >= 0.45 ? 2 : ratio >= 0.2 ? 1 : 0;
      $('overRank').textContent = D.name + '：' + RANKS[ri];
      $('stCaught').textContent = caught; $('stPerfect').textContent = perfects;
      $('stBig').textContent = bigFish ? FISH[bigFish].name : '-';
      $('overBest').textContent = isBest ? 'じこベスト こうしん！' : 'じこベスト ' + prev.toLocaleString() + ' てん';
      $('overPanel').hidden = false;
      $('retryBtn').focus({ preventScroll: true });
    }, 1100);
  }

  // ---------- helpers ----------
  function addFloat(x, y, text, color, size = 20) {
    const half = Math.min(170, text.length * size * 0.5 + 6);
    floats.push({ x: clamp(x, half, W - half), y, text, color, size, t: 0 });
  }
  function burst(x, y, color, n, spd = 160, g = 300) {
    for (let i = 0; i < n; i++) {
      const a = rand(0, TAU), s = rand(spd * 0.4, spd);
      parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 60, life: rand(0.4, 0.8), t: 0, color, r: rand(2, 4.5), g });
    }
  }
  function splash(x, y, big) {
    for (let i = 0; i < (big ? 22 : 10); i++) {
      parts.push({ x: x + rand(-8, 8), y, vx: rand(-90, 90), vy: rand(-260, -120) * (big ? 1.2 : 0.8), life: rand(0.5, 0.9), t: 0, color: i % 3 ? '#DDF3FF' : '#FFFFFF', r: rand(2, 4), g: 600 });
    }
    ripples.push({ x, y, t: 0, big });
  }
  function pickFish() {
    const k = progress(); let sum = 0;
    const ws = FISH_ORDER.map(id => { const w = lerp(D.fish[id][0], D.fish[id][1], k); sum += w; return w; });
    let r = Math.random() * sum;
    for (let i = 0; i < ws.length; i++) { r -= ws[i]; if (r <= 0) return FISH_ORDER[i]; }
    return 'aji';
  }
  // geometry of a rod for drawing and hit tests
  function rodGeom(r) {
    const f = r.fish ? FISH[r.fish] : null;
    let pull = 0, sway = 0;
    if (r.st === 'hooked') {
      const deficit = f.s - r.weight;
      pull = deficit > 0 ? 1 : 0.55;
      sway = Math.sin(time * (deficit > 0 ? 11 : 6) + r.fishPh) * (deficit > 0 ? 7 : 3);
    } else if (r.st === 'nibble') {
      sway = Math.sin(time * 28) * 1.5;
    }
    const danger = r.st === 'hooked' && r.p > 0.5 ? (r.p - 0.5) * 2 : 0;
    const bx = r.x + (danger ? (Math.random() - 0.5) * 4 * danger : 0);
    const by = BUTT_Y - r.p * 115;
    const tx = r.x + sway, ty = TIP_Y + pull * 26 + (r.st === 'nibble' ? Math.abs(Math.sin(time * 14)) * 5 : 0);
    const cx = (bx + tx) / 2 + sway * 0.6, cy = (by + ty) / 2 + pull * 24 - 14;
    return { bx, by, tx, ty, cx, cy };
  }
  const stackY = (by, i) => by - 6 - i * 14;

  // ---------- actions ----------
  function addCro(r) {
    if (state !== 'play' || r.st === 'lost' || r.st === 'gone') return;
    const g = rodGeom(r);
    if (r.weight >= MAX_STACK) { addFloat(r.x, g.by - 100, 'もう のらないよ', '#7A4210', 15); sfx.empty(); return; }
    if (stock <= 0) {
      trayShake = 0.4; sfx.empty(); buzz(20);
      addFloat(r.x, g.by - 40 - r.weight * 14, 'コロッケが ないよ！', '#D83A4E', 15);
      return;
    }
    stock--; r.weight++; r.dropT = 0; r.hint = false;
    sfx.place(); buzz(10);
  }
  function removeCro(r) {
    if (state !== 'play' || r.weight <= 0 || r.st === 'lost' || r.st === 'gone') return;
    const g = rodGeom(r);
    r.weight--;
    flyers.push({ x0: r.x, y0: stackY(g.by, r.weight), t: 0, dur: 0.35, toTray: true, w: r.sw });
    sfx.remove();
  }
  function shoo(gl) {
    if (gl.st !== 'in' && gl.st !== 'hover') return;
    gl.st = 'shoo'; gl.t = 0; gl.vx = gl.x < W / 2 ? -260 : 260;
    score += 30;
    addFloat(gl.x, gl.y - 30, 'シッシッ！ +30', '#1F3A68', 17);
    burst(gl.x, gl.y, '#FFFFFF', 8, 120);
    sfx.shoo(); buzz(15);
  }

  function catchFish(r) {
    const f = FISH[r.fish];
    const perfect = r.weight === f.s;
    combo++; caught++;
    let pts = Math.round(f.pts * (1 + Math.min(combo - 1, 10) * 0.1));
    if (perfect) { pts = Math.round(pts * 1.5); perfects++; }
    score += pts;
    if (!f.boot && (!bigFish || FISH[bigFish].pts < f.pts)) bigFish = r.fish;
    const g = rodGeom(r);
    jumpers.push({ fish: r.fish, x: g.tx, y: BOB_Y, vx: rand(-40, 40), vy: -430, rot: 0, vr: rand(-6, 6), t: 0 });
    splash(g.tx, BOB_Y, f.s >= 3);
    if (f.boot) { sfx.boot(); addFloat(g.tx, BOB_Y - 70, 'ながぐつ… +' + pts, '#7A4210', 17); }
    else {
      sfx.catch(combo);
      addFloat(g.tx, BOB_Y - 70, f.name + '！ +' + pts, f.box ? '#B8860B' : '#E8A53E', 21);
      if (f.box) burst(g.tx, BOB_Y - 40, '#FFD43B', 26, 220);
    }
    if (perfect) { sfx.perfect(); addFloat(g.tx, BOB_Y - 96, 'ぴったり！', '#D83A4E', 18); }
    if (combo >= 3 && combo % 3 === 0) addFloat(W / 2, 150, combo + ' れんぞく！', '#1F3A68', 24);
    // croquettes come back to the tray
    for (let i = r.weight - 1; i >= 0; i--) {
      flyers.push({ x0: r.x + (i % 2 ? 3 : -3), y0: stackY(g.by, i), t: -i * 0.07, dur: 0.45, toTray: true, w: r.sw });
    }
    r.weight = 0;
    r.st = 'idle'; r.t = 0; r.cd = rand(1.2, 2.6); r.fish = null; r.p = 0; r.prog = 0;
    buzz(25);
  }

  function loseRod(r) {
    const g = rodGeom(r);
    r.st = 'lost'; r.t = 0;
    combo = 0; lives--; shake = 0.45;
    sfx.lose(); buzz([40, 40, 60]);
    addFloat(r.x, 300, 'さおが…！', '#D83A4E', 20);
    if (D.keepOnLost && r.weight > 0) {
      for (let i = r.weight - 1; i >= 0; i--) flyers.push({ x0: r.x, y0: stackY(g.by, i), t: -i * 0.07, dur: 0.45, toTray: true, w: r.sw });
    }
    r.lostWeight = D.keepOnLost ? 0 : r.weight;
    r.weight = 0;
    if (lives <= 0) endGame('lives');
  }

  // ---------- input ----------
  function toWorld(e) {
    const rc = cv.getBoundingClientRect();
    return { x: (e.clientX - rc.left - ox) / scale, y: (e.clientY - rc.top - oy) / scale };
  }
  function tapAt(x, y) {
    if (state !== 'play') return;
    for (const gl of gulls) {
      if ((gl.st === 'in' || gl.st === 'hover') && Math.hypot(x - gl.x, y - gl.y) < 50) { shoo(gl); return; }
    }
    for (const r of rods) {
      if (r.weight > 0 && Math.abs(x - r.x) < Math.min(34, r.colW / 2) && Math.abs(y - BTN_Y) < 20) { removeCro(r); return; }
    }
    if (y < 110 || x < 0 || x > W) return;
    const r = rods[clamp(Math.floor(x / (W / rods.length)), 0, rods.length - 1)];
    addCro(r);
  }
  cv.addEventListener('pointerdown', e => {
    e.preventDefault();
    const p = toWorld(e);
    tapAt(p.x, p.y);
  });
  const REMOVE_KEYS = ['q', 'w', 'e', 'r', 't'];
  window.addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if (state === 'play') {
      const n = parseInt(k, 10);
      if (n >= 1 && n <= rods.length) { addCro(rods[n - 1]); e.preventDefault(); return; }
      const ri = REMOVE_KEYS.indexOf(k);
      if (ri >= 0 && ri < rods.length) { removeCro(rods[ri]); e.preventDefault(); return; }
      if (k === ' ') {
        const gl = gulls.find(g => g.st === 'in' || g.st === 'hover');
        if (gl) shoo(gl);
        e.preventDefault();
      }
    } else if ((e.key === 'Enter' || e.key === ' ') && state === 'title' && document.activeElement === document.body) {
      startGame(); e.preventDefault();
    }
  });

  // ---------- title UI ----------
  const diffsEl = $('diffs');
  function renderDiffs() {
    diffsEl.innerHTML = '';
    DIFFS.forEach((d, i) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'diff' + (d.id === 'oni' ? ' oni' : '');
      b.setAttribute('aria-pressed', String(i === diffIdx));
      b.innerHTML = d.name + '<small>' + d.sub + '</small>' + (best[d.id] ? '<span class="best">ベスト ' + best[d.id].toLocaleString() + '</span>' : '');
      b.addEventListener('click', () => { diffIdx = i; store.set('korokke-tsurizao-diff', i); D = DIFFS[i]; layout(); demoLoad(); renderDiffs(); sfx.remove(); });
      diffsEl.appendChild(b);
    });
  }
  function demoLoad() { rods.forEach((r, i) => { r.weight = (i * 2 + 1) % 3; }); }
  renderDiffs();
  layout(); demoLoad();
  $('startBtn').addEventListener('click', startGame);
  $('retryBtn').addEventListener('click', startGame);
  $('menuBtn').addEventListener('click', () => {
    state = 'title'; $('overPanel').hidden = true; layout(); demoLoad(); renderDiffs(); $('titlePanel').hidden = false;
  });

  // ---------- update ----------
  function spawnBite() {
    const active = rods.filter(r => r.st === 'nibble' || r.st === 'hooked').length;
    if (active >= curMax()) return;
    const free = rods.filter(r => r.st === 'idle' && r.cd <= 0);
    if (!free.length) return;
    const r = free[Math.floor(Math.random() * free.length)];
    r.st = 'nibble'; r.t = 0; r.fish = pickFish(); r.warnT = D.warn * rand(0.9, 1.15); r.fishPh = rand(0, TAU);
    sfx.nibble();
  }

  function update(dt) {
    time += dt; stT += dt;
    shake = Math.max(0, shake - dt * 1.5);
    trayShake = Math.max(0, trayShake - dt);
    shownScore += (score - shownScore) * Math.min(1, dt * 12);
    const live = state === 'play';

    if (state === 'count') {
      const n = 3 - Math.floor(stT / 0.7);
      if (n !== lastCount) { lastCount = n; sfx.count(n <= 0); }
      if (stT >= 2.8) { state = 'play'; stT = 0; }
    }
    if (live) {
      playT += dt;
      spawnT -= dt;
      if (spawnT <= 0) { spawnBite(); spawnT = curGap() * rand(0.75, 1.25); }
      // fryer refills up to the cap
      if (totalCro() < D.cap) {
        fryT += dt;
        if (fryT >= D.fry) { fryT = 0; stock++; sfx.fry(); }
      } else fryT = 0;
      // gulls
      if (D.gull && !gulls.some(g => g.st === 'in' || g.st === 'hover')) {
        gullT -= dt;
        if (gullT <= 0) {
          const loaded = rods.filter(r => r.weight > 0 && (r.st === 'idle' || r.st === 'nibble' || r.st === 'hooked'));
          if (loaded.length) {
            const maxW = Math.max(...loaded.map(r => r.weight));
            const cands = loaded.filter(r => r.weight >= maxW - 1);
            const r = cands[Math.floor(Math.random() * cands.length)];
            const fromLeft = Math.random() < 0.5;
            gulls.push({ rod: r, st: 'in', t: 0, x: fromLeft ? -40 : W + 40, y: rand(120, 200), sx: 0, sy: 0, carry: false, flap: rand(0, TAU) });
            gulls[gulls.length - 1].sx = gulls[gulls.length - 1].x; gulls[gulls.length - 1].sy = gulls[gulls.length - 1].y;
            sfx.gull();
          }
          gullT = lerp(D.gull.gap[0], D.gull.gap[1], progress()) * rand(0.8, 1.2);
        }
      }
      if (playT >= ROUND) endGame('time');
    }

    for (const r of rods) {
      r.t += dt; r.bob += dt;
      r.dropT = Math.min(1, r.dropT + dt / 0.18);
      if (r.st === 'idle') {
        if (live) r.cd -= dt;
        r.fade = Math.min(1, r.fade + dt * 3);
      } else if (r.st === 'nibble') {
        if (live && r.t >= r.warnT) {
          r.st = 'hooked'; r.t = 0; r.p = 0; r.prog = 0;
          sfx.hit(); buzz(20);
          addFloat(r.x, 200, 'かかった！', '#1F3A68', 17);
          const f = FISH[r.fish];
          if (hintLeft > 0 && r.weight < f.s && stock > 0) { r.hint = true; hintLeft--; }
        }
      } else if (r.st === 'hooked') {
        if (!live) continue;
        const f = FISH[r.fish];
        const deficit = f.s - r.weight;
        if (deficit <= 0) {
          r.prog += dt / f.time;
          r.p = Math.max(0, r.p - dt * 0.35);
          r.hint = false;
          if (r.prog >= 1) catchFish(r);
        } else {
          const before = r.p;
          r.p += D.pull * (0.5 + 0.5 * deficit) * dt;
          if (Math.floor(before * 6) !== Math.floor(r.p * 6)) sfx.creak();
          if (r.p >= 1) loseRod(r);
        }
      } else if (r.st === 'lost') {
        if (r.t > 0.55 && !r.splashed) { r.splashed = true; splash(r.x, 300, true); }
        if (r.t >= 1) { r.st = 'gone'; r.t = 0; r.splashed = false; }
      } else if (r.st === 'gone') {
        if (r.t >= 2.2 && (live || state === 'title')) {
          r.st = 'idle'; r.t = 0; r.cd = rand(1, 2); r.fish = null; r.p = 0; r.prog = 0; r.fade = 0;
          if (live) { sfx.respawn(); addFloat(r.x, 470, 'あたらしい さお！', '#1F3A68', 14); }
        }
      }
    }

    // gulls
    for (const gl of gulls) {
      gl.t += dt; gl.flap += dt * (gl.st === 'hover' ? 16 : 10);
      const r = gl.rod;
      const g = rodGeom(r);
      const tx = r.x + 16, ty = stackY(g.by, Math.max(0, r.weight - 1)) - 34;
      if (gl.st === 'in') {
        const k = clamp(gl.t / 1.2, 0, 1), e = 1 - Math.pow(1 - k, 2);
        gl.x = lerp(gl.sx, tx, e); gl.y = lerp(gl.sy, ty, e) - Math.sin(k * Math.PI) * 40;
        if (k >= 1) { gl.st = 'hover'; gl.t = 0; sfx.gull(); }
        if (r.weight <= 0 || r.st === 'lost' || r.st === 'gone') { gl.st = 'out'; gl.t = 0; gl.vx = gl.x < W / 2 ? -200 : 200; }
      } else if (gl.st === 'hover') {
        gl.x = tx + Math.sin(gl.t * 5) * 3; gl.y = ty + Math.sin(gl.t * 9) * 3;
        if (r.weight <= 0 || r.st === 'lost' || r.st === 'gone') { gl.st = 'out'; gl.t = 0; gl.vx = gl.x < W / 2 ? -200 : 200; }
        else if (live && gl.t >= D.gull.hover) {
          r.weight--; gl.carry = true; gl.st = 'out'; gl.t = 0; gl.vx = r.x < W / 2 ? -230 : 230;
          sfx.steal(); combo = 0;
          addFloat(r.x, ty - 20, 'とられた！', '#D83A4E', 16);
        }
      } else {
        const spd = gl.st === 'shoo' ? 1.6 : 1;
        gl.x += gl.vx * spd * dt; gl.y -= 150 * spd * dt;
      }
    }
    gulls = gulls.filter(gl => gl.x > -100 && gl.x < W + 100 && gl.y > -100);

    // flyers back to tray
    for (const f of flyers) {
      f.t += dt;
      if (f.t >= f.dur && !f.done) { f.done = true; if (f.toTray) stock++; }
    }
    flyers = flyers.filter(f => !f.done);

    for (const j of jumpers) { j.t += dt; j.vy += 900 * dt; j.x += j.vx * dt; j.y += j.vy * dt; j.rot += j.vr * dt; }
    jumpers = jumpers.filter(j => j.t < 1.1);
    for (const p of parts) { p.t += dt; p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; }
    parts = parts.filter(p => p.t < p.life);
    for (const f of floats) f.t += dt;
    floats = floats.filter(f => f.t < 1.1);
    for (const rp of ripples) rp.t += dt;
    ripples = ripples.filter(rp => rp.t < 0.9);
  }

  // ---------- drawing ----------
  function rrect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  const clouds = [{ x: 60, y: 125, s: 1 }, { x: 250, y: 150, s: 0.7 }, { x: 380, y: 118, s: 0.85 }];
  function drawBackground() {
    // sky (extends beyond the world box for letterboxing)
    let g = ctx.createLinearGradient(0, -200, 0, HORIZON);
    g.addColorStop(0, '#6EC1E8'); g.addColorStop(1, '#DDF3FB');
    ctx.fillStyle = g; ctx.fillRect(-400, -400, W + 800, HORIZON + 400);
    // sun
    ctx.fillStyle = 'rgba(255,240,170,0.5)'; ctx.beginPath(); ctx.arc(330, 150, 36, 0, TAU); ctx.fill();
    ctx.fillStyle = '#FFE58A'; ctx.beginPath(); ctx.arc(330, 150, 24, 0, TAU); ctx.fill();
    // clouds
    ctx.fillStyle = 'rgba(255,255,255,0.92)';
    for (const c of clouds) {
      const x = ((c.x + time * 6 * c.s) % (W + 160)) - 80, y = c.y, s = c.s;
      ctx.beginPath();
      ctx.arc(x, y, 16 * s, 0, TAU); ctx.arc(x + 18 * s, y - 8 * s, 20 * s, 0, TAU); ctx.arc(x + 38 * s, y, 15 * s, 0, TAU);
      ctx.rect(x, y, 38 * s, 12 * s); ctx.fill();
    }
    // island
    ctx.fillStyle = '#7FA7B8';
    ctx.beginPath(); ctx.moveTo(20, HORIZON); ctx.quadraticCurveTo(70, HORIZON - 26, 130, HORIZON); ctx.fill();
    ctx.beginPath(); ctx.moveTo(100, HORIZON); ctx.quadraticCurveTo(140, HORIZON - 14, 180, HORIZON); ctx.fill();
    // sea
    g = ctx.createLinearGradient(0, HORIZON, 0, PIER + 40);
    g.addColorStop(0, '#5FB0D8'); g.addColorStop(1, '#1F6F9E');
    ctx.fillStyle = g; ctx.fillRect(-400, HORIZON, W + 800, PIER + 40 - HORIZON);
    // waves
    ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 2; ctx.lineCap = 'round';
    for (let row = 0; row < 7; row++) {
      const y = HORIZON + 18 + row * row * 6 + row * 8;
      const amp = 1.5 + row * 0.6, len = 22 + row * 6;
      const off = (time * (12 + row * 4) + row * 37) % (len * 3);
      for (let x = -len * 3 + off - 400; x < W + 400; x += len * 3) {
        ctx.beginPath(); ctx.moveTo(x, y);
        ctx.quadraticCurveTo(x + len / 2, y - amp * 2, x + len, y); ctx.stroke();
      }
    }
  }
  function drawPier() {
    // shadow on water
    ctx.fillStyle = 'rgba(10,40,70,0.35)'; ctx.fillRect(-400, PIER - 10, W + 800, 12);
    // posts in the water
    ctx.fillStyle = '#5A3A1E';
    for (let x = -360; x < W + 400; x += 90) ctx.fillRect(x, PIER - 16, 12, 18);
    // deck
    const g = ctx.createLinearGradient(0, PIER, 0, H + 200);
    g.addColorStop(0, '#C8925A'); g.addColorStop(1, '#A8743F');
    ctx.fillStyle = g; ctx.fillRect(-400, PIER, W + 800, H + 400 - PIER);
    ctx.strokeStyle = 'rgba(90,55,25,0.45)'; ctx.lineWidth = 2;
    for (let i = 0; i < 9; i++) {
      const y = PIER + 14 + i * i * 2.6 + i * 12;
      ctx.beginPath(); ctx.moveTo(-400, y); ctx.lineTo(W + 400, y); ctx.stroke();
    }
    // edge beam
    ctx.fillStyle = '#7A4A22'; ctx.fillRect(-400, PIER, W + 800, 9);
    ctx.fillStyle = 'rgba(255,230,180,0.35)'; ctx.fillRect(-400, PIER, W + 800, 2);
  }

  function drawWaterStuff(r) {
    if (r.st === 'lost' || r.st === 'gone') return;
    const g = rodGeom(r);
    let bx = g.tx, by = BOB_Y + Math.sin(r.bob * 2) * 1.5;
    const f = r.fish ? FISH[r.fish] : null;
    // fish shadow
    if (f && (r.st === 'nibble' || r.st === 'hooked')) {
      const size = f.boot ? 12 : f.box ? 16 : 8 + f.s * 6;
      const wob = r.st === 'hooked' ? 10 : 18;
      const sx = bx + Math.sin(time * 2.3 + r.fishPh) * wob, sy = by + 20 + Math.cos(time * 1.7 + r.fishPh) * 5;
      ctx.fillStyle = 'rgba(8,30,60,0.38)';
      ctx.beginPath(); ctx.ellipse(sx, sy, size * 1.4, size * 0.55, 0, 0, TAU); ctx.fill();
      if (!f.boot && !f.box) { ctx.beginPath(); ctx.moveTo(sx + size * 1.3, sy); ctx.lineTo(sx + size * 2, sy - size * 0.5); ctx.lineTo(sx + size * 2, sy + size * 0.5); ctx.fill(); }
    }
    if (r.st === 'nibble') by += Math.sin(time * 30) * 3;
    const sunk = r.st === 'hooked';
    if (sunk) { bx += Math.sin(time * 9 + r.fishPh) * 2; by += 5; }
    // line
    ctx.strokeStyle = 'rgba(255,255,255,0.75)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(g.tx, g.ty); ctx.lineTo(bx, by - 6); ctx.stroke();
    // ripple
    if (r.st !== 'idle' || Math.sin(r.bob) > 0.6) {
      const k = (time * (sunk ? 2.4 : 1.2) + r.fishPh) % 1;
      ctx.strokeStyle = 'rgba(255,255,255,' + (0.6 * (1 - k)) + ')'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.ellipse(bx, by + 4, 6 + k * 18, 2 + k * 5, 0, 0, TAU); ctx.stroke();
    }
    // bobber
    ctx.save();
    ctx.beginPath(); ctx.rect(bx - 12, by - 20, 24, sunk ? 18 : 24); ctx.clip();
    ctx.fillStyle = '#FFFFFF'; ctx.beginPath(); ctx.arc(bx, by, 6, 0, TAU); ctx.fill();
    ctx.fillStyle = '#E8423A'; ctx.beginPath(); ctx.arc(bx, by, 6, Math.PI, TAU); ctx.fill();
    ctx.fillStyle = '#E8423A'; ctx.fillRect(bx - 1, by - 12, 2, 7);
    ctx.restore();
  }

  function rodPoint(g, t) {
    const u = 1 - t;
    return { x: u * u * g.bx + 2 * u * t * g.cx + t * t * g.tx, y: u * u * g.by + 2 * u * t * g.cy + t * t * g.ty };
  }
  function drawRest(r) {
    ctx.fillStyle = '#4A2E16';
    ctx.fillRect(r.x - 2, PIER + 2, 4, 14);
    ctx.strokeStyle = '#4A2E16'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(r.x - 8, PIER - 6); ctx.lineTo(r.x, PIER + 3); ctx.lineTo(r.x + 8, PIER - 6); ctx.stroke();
  }
  function drawRod(r) {
    if (r.st === 'gone') return;
    let g = rodGeom(r);
    ctx.save();
    if (r.st === 'lost') {
      const k = r.t;
      g = { bx: r.x, by: 460 - k * 420, tx: r.x + k * 10, ty: TIP_Y - k * 120, cx: r.x, cy: 330 - k * 300 };
      ctx.globalAlpha = clamp(1 - (k - 0.4) / 0.5, 0, 1);
    } else ctx.globalAlpha = r.fade;
    // rod body
    const N = 16;
    ctx.lineCap = 'round';
    for (let i = 0; i < N; i++) {
      const a = rodPoint(g, i / N), b = rodPoint(g, (i + 1) / N);
      const t = i / N;
      ctx.strokeStyle = t < 0.2 ? '#B07A45' : '#1F3A68';
      ctx.lineWidth = t < 0.2 ? 10 : lerp(6, 2, (t - 0.2) / 0.8);
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    }
    // guides
    ctx.fillStyle = '#C9D3E2';
    for (const t of [0.45, 0.65, 0.85]) { const p = rodPoint(g, t); ctx.beginPath(); ctx.arc(p.x, p.y, 2, 0, TAU); ctx.fill(); }
    // reel
    const rp = rodPoint(g, 0.24);
    ctx.fillStyle = '#8A93A6'; ctx.beginPath(); ctx.arc(rp.x + 8, rp.y, 8, 0, TAU); ctx.fill();
    ctx.fillStyle = '#D9DEE8'; ctx.beginPath(); ctx.arc(rp.x + 8, rp.y, 4, 0, TAU); ctx.fill();
    const ang = r.st === 'hooked' ? time * 14 : 0.8;
    ctx.strokeStyle = '#5A6275'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(rp.x + 8, rp.y); ctx.lineTo(rp.x + 8 + Math.cos(ang) * 9, rp.y + Math.sin(ang) * 9); ctx.stroke();
    ctx.restore();
    if (r.st === 'lost') return;

    // danger glow
    const danger = r.st === 'hooked' && r.p > 0.45;
    if (danger && Math.sin(time * 16) > -0.2) {
      ctx.fillStyle = 'rgba(216,58,78,0.28)';
      ctx.beginPath(); ctx.ellipse(g.bx, g.by - 10 - r.weight * 7, r.sw * 0.75, 26 + r.weight * 8, 0, 0, TAU); ctx.fill();
    }
    // croquette stack on the butt
    ctx.globalAlpha = r.fade;
    for (let i = 0; i < r.weight; i++) {
      let y = stackY(g.by, i);
      if (i === r.weight - 1 && r.dropT < 1) y -= (1 - r.dropT) * 60;
      const squash = i === r.weight - 1 && r.dropT >= 1 ? 1 : 1;
      drawCro(g.bx + (i % 2 ? 3 : -3), y, r.sw * squash);
    }
    ctx.globalAlpha = 1;
    if (danger) {
      ctx.font = '400 15px ' + FD; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      const y = stackY(g.by, r.weight) - 18;
      ctx.lineWidth = 4; ctx.strokeStyle = '#FFFDF6'; ctx.strokeText('あぶない！', g.bx, y);
      ctx.fillStyle = '#D83A4E'; ctx.fillText('あぶない！', g.bx, y);
    }
  }

  function drawRemoveBtn(r) {
    if (r.weight <= 0 || r.st === 'lost' || r.st === 'gone' || state === 'title') return;
    const w = Math.min(56, r.colW - 12), h = 24;
    rrect(r.x - w / 2, BTN_Y - h / 2, w, h, 12);
    ctx.fillStyle = '#FFFDF6'; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = '#1F3A68'; ctx.stroke();
    ctx.fillStyle = '#1F3A68'; ctx.font = '800 12px ' + FB; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('もどす', r.x, BTN_Y + 1);
  }

  function drawBadge(r) {
    if (!(r.st === 'nibble' || r.st === 'hooked')) return;
    const f = FISH[r.fish];
    const g = rodGeom(r);
    const x = g.tx, y = g.ty - 46;
    const iconW = 15, n = f.s;
    const w = Math.max(48, n * iconW + 16), h = 26;
    const held = r.st === 'hooked' && r.weight >= f.s;
    const short = r.st === 'hooked' && !held;
    const pulse = short ? 1 + Math.sin(time * 12) * 0.05 : 1;
    ctx.save();
    ctx.translate(x, y); ctx.scale(pulse, pulse);
    // bubble
    rrect(-w / 2, -h / 2, w, h, 13);
    ctx.fillStyle = short ? '#FFE3E6' : held ? '#E4F6E4' : '#FFFDF6'; ctx.fill();
    ctx.lineWidth = 2.5; ctx.strokeStyle = short ? '#D83A4E' : held ? '#2F8A4A' : '#1F3A68'; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-6, h / 2 - 1); ctx.lineTo(0, h / 2 + 8); ctx.lineTo(6, h / 2 - 1);
    ctx.fillStyle = short ? '#FFE3E6' : held ? '#E4F6E4' : '#FFFDF6'; ctx.fill(); ctx.stroke();
    // croquette icons
    for (let i = 0; i < n; i++) {
      const ix = -((n - 1) * iconW) / 2 + i * iconW;
      if (i < r.weight) drawCro(ix, 0, 17);
      else {
        ctx.setLineDash([3, 2]); ctx.strokeStyle = '#9A7A5A'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.ellipse(ix, 0, 7, 4.5, 0, 0, TAU); ctx.stroke(); ctx.setLineDash([]);
      }
    }
    ctx.restore();
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    if (r.st === 'nibble') {
      ctx.font = '400 13px ' + FD;
      ctx.lineWidth = 4; ctx.strokeStyle = '#FFFDF6'; ctx.strokeText('くるよ！', x, y - 22);
      ctx.fillStyle = '#E8A53E'; ctx.fillText('くるよ！', x, y - 22);
    } else if (short) {
      const t = 'あと' + (f.s - r.weight) + 'こ';
      ctx.font = '400 14px ' + FD;
      ctx.lineWidth = 4; ctx.strokeStyle = '#FFFDF6'; ctx.strokeText(t, x, y - 23);
      ctx.fillStyle = '#D83A4E'; ctx.fillText(t, x, y - 23);
    } else {
      // catch progress bar
      const bw = 44;
      rrect(x - bw / 2, y - 27, bw, 8, 4); ctx.fillStyle = '#FFFDF6'; ctx.fill();
      ctx.lineWidth = 1.5; ctx.strokeStyle = '#2F8A4A'; ctx.stroke();
      rrect(x - bw / 2 + 1.5, y - 25.5, (bw - 3) * clamp(r.prog, 0, 1), 5, 2.5); ctx.fillStyle = '#4CB860'; ctx.fill();
      if (r.weight === f.s) {
        ctx.font = '800 11px ' + FB; ctx.fillStyle = '#D83A4E';
        ctx.lineWidth = 3; ctx.strokeStyle = '#FFFDF6'; ctx.strokeText('ぴったり', x, y - 38); ctx.fillText('ぴったり', x, y - 38);
      }
    }
  }

  function drawFishShape(fid, s) {
    const f = FISH[fid];
    if (f.boot) {
      ctx.fillStyle = '#3E7D4A'; ctx.strokeStyle = '#1F3A28'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(-8, -16); ctx.lineTo(6, -16); ctx.lineTo(6, 4); ctx.lineTo(16, 8); ctx.lineTo(16, 14); ctx.lineTo(-8, 14); ctx.closePath(); ctx.fill(); ctx.stroke();
      return;
    }
    if (f.box) {
      ctx.fillStyle = '#9A5A22'; ctx.strokeStyle = '#4A2A10'; ctx.lineWidth = 2;
      rrect(-16, -8, 32, 20, 3); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#B86E2C'; rrect(-16, -16, 32, 10, 5); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#FFD43B'; ctx.fillRect(-3, -9, 6, 8);
      return;
    }
    const L = f.len, Hh = L * 0.36;
    ctx.fillStyle = f.col;
    ctx.beginPath(); ctx.moveTo(L * 0.42, 0); ctx.lineTo(L * 0.7, -Hh * 0.7); ctx.lineTo(L * 0.7, Hh * 0.7); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.ellipse(0, 0, L / 2, Hh / 2, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = f.belly; ctx.beginPath(); ctx.ellipse(-2, Hh * 0.18, L * 0.38, Hh * 0.22, 0, 0, Math.PI); ctx.fill();
    if (f.stripes) { ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 2; for (let i = -1; i <= 1; i++) { ctx.beginPath(); ctx.moveTo(-L * 0.2 + i * 8, -Hh * 0.05); ctx.lineTo(L * 0.25 + i * 8, -Hh * 0.05); ctx.stroke(); } }
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(-L * 0.3, -Hh * 0.1, 3.4, 0, TAU); ctx.fill();
    ctx.fillStyle = '#142849'; ctx.beginPath(); ctx.arc(-L * 0.31, -Hh * 0.1, 1.8, 0, TAU); ctx.fill();
  }
  function drawJumpers() {
    for (const j of jumpers) {
      ctx.save();
      ctx.globalAlpha = clamp(1.6 - j.t * 1.6, 0, 1);
      ctx.translate(j.x, j.y); ctx.rotate(j.rot * 0.3);
      const s = 1 + Math.min(j.t, 0.3);
      ctx.scale(s, s);
      drawFishShape(j.fish);
      ctx.restore();
    }
  }

  function drawGull(gl) {
    ctx.save();
    ctx.translate(gl.x, gl.y);
    const dir = gl.st === 'in' ? (gl.sx < W / 2 ? 1 : -1) : gl.st === 'hover' ? (gl.sx < W / 2 ? 1 : -1) : (gl.vx > 0 ? 1 : -1);
    ctx.scale(dir, 1);
    const fl = Math.sin(gl.flap) * 0.8;
    ctx.strokeStyle = '#1F3A68'; ctx.lineWidth = 2; ctx.lineJoin = 'round';
    // wings
    ctx.fillStyle = '#F4F7FA';
    for (const side of [-1, 1]) {
      ctx.beginPath(); ctx.moveTo(-4, -2);
      ctx.quadraticCurveTo(-14, -16 * fl * side - 6, -26, -12 * fl * side - 4);
      ctx.quadraticCurveTo(-14, -2, 4, 2); ctx.closePath(); ctx.fill(); ctx.stroke();
    }
    // body
    ctx.fillStyle = '#FFFFFF';
    ctx.beginPath(); ctx.ellipse(0, 0, 16, 9, 0, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(13, -7, 7, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#F2A23A'; ctx.beginPath(); ctx.moveTo(19, -8); ctx.lineTo(28, -5); ctx.lineTo(19, -3); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#142849'; ctx.beginPath(); ctx.arc(15, -9, 1.6, 0, TAU); ctx.fill();
    ctx.fillStyle = '#8A93A6'; ctx.beginPath(); ctx.moveTo(-14, -2); ctx.lineTo(-22, 2); ctx.lineTo(-14, 5); ctx.fill();
    if (gl.carry) drawCro(24, 2, 22);
    ctx.restore();
    if (gl.st === 'hover' || gl.st === 'in') {
      const k = gl.st === 'hover' ? gl.t / D.gull.hover : 0;
      // timer ring + "!"
      ctx.strokeStyle = '#D83A4E'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(gl.x, gl.y - 30, 11, -Math.PI / 2, -Math.PI / 2 + TAU * (1 - k)); ctx.stroke();
      ctx.font = '400 15px ' + FD; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = '#D83A4E'; ctx.fillText('！', gl.x, gl.y - 29);
    }
  }

  function drawFlyers() {
    for (const f of flyers) {
      if (f.t < 0) continue;
      const k = clamp(f.t / f.dur, 0, 1), e = k * k * (3 - 2 * k);
      const slot = Math.min(stock, D.cap - 1);
      const tx = TRAY_X0 + slot * TRAY_STEP, ty = 85;
      const x = lerp(f.x0, tx, e), y = lerp(f.y0, ty, e) - Math.sin(k * Math.PI) * 60;
      drawCro(x, y, lerp(f.w, 22, e));
    }
  }
  function drawParticles() {
    for (const p of parts) {
      ctx.globalAlpha = 1 - p.t / p.life;
      ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
    for (const rp of ripples) {
      const k = rp.t / 0.9;
      ctx.strokeStyle = 'rgba(255,255,255,' + (0.8 * (1 - k)) + ')'; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.ellipse(rp.x, rp.y + 4, 10 + k * (rp.big ? 50 : 30), 3 + k * 10, 0, 0, TAU); ctx.stroke();
    }
  }
  function drawFloats() {
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (const f of floats) {
      const k = f.t / 1.1;
      ctx.globalAlpha = k < 0.7 ? 1 : 1 - (k - 0.7) / 0.3;
      const y = f.y - k * 34;
      ctx.font = '400 ' + f.size + 'px ' + FD;
      ctx.lineWidth = 5; ctx.strokeStyle = '#FFFDF6'; ctx.strokeText(f.text, f.x, y);
      ctx.fillStyle = f.color; ctx.fillText(f.text, f.x, y);
    }
    ctx.globalAlpha = 1;
  }

  const TRAY_X0 = 92, TRAY_STEP = 24;
  function drawHeart(x, y, s, on) {
    ctx.fillStyle = on ? '#D83A4E' : 'rgba(31,58,104,0.18)';
    ctx.beginPath();
    ctx.moveTo(x, y + s * 0.9);
    ctx.bezierCurveTo(x - s * 1.4, y, x - s * 0.8, y - s * 1.0, x, y - s * 0.35);
    ctx.bezierCurveTo(x + s * 0.8, y - s * 1.0, x + s * 1.4, y, x, y + s * 0.9);
    ctx.fill();
  }
  function drawHUD() {
    if (state === 'title') return;
    ctx.textBaseline = 'middle';
    // score
    ctx.textAlign = 'left';
    ctx.font = '400 26px ' + FD;
    ctx.lineWidth = 5; ctx.strokeStyle = '#FFFDF6';
    const sc = Math.round(shownScore).toLocaleString();
    ctx.strokeText(sc, 14, 28); ctx.fillStyle = '#1F3A68'; ctx.fillText(sc, 14, 28);
    const sw = ctx.measureText(sc).width;
    ctx.font = '800 12px ' + FB; ctx.strokeText('てん', 18 + sw, 32); ctx.fillText('てん', 18 + sw, 32);
    // time
    const left = Math.max(0, Math.ceil(ROUND - playT));
    ctx.textAlign = 'center';
    ctx.font = '400 26px ' + FD;
    ctx.strokeText(String(left), 200, 26);
    ctx.fillStyle = left <= 10 ? '#D83A4E' : '#1F3A68'; ctx.fillText(String(left), 200, 26);
    ctx.font = '800 10px ' + FB; ctx.fillStyle = '#1F3A68'; ctx.strokeText('のこり', 200, 8); ctx.fillText('のこり', 200, 8);
    // hearts
    const hn = D.lives, hs = 7, step = 18;
    for (let i = 0; i < hn; i++) drawHeart(200 - ((hn - 1) * step) / 2 + i * step, 50, hs, i < lives);
    // tray
    const tsx = trayShake > 0 ? Math.sin(trayShake * 60) * 4 : 0;
    ctx.save(); ctx.translate(tsx, 0);
    rrect(8, 66, 384, 38, 14);
    ctx.fillStyle = 'rgba(255,253,246,0.93)'; ctx.fill();
    ctx.lineWidth = 2.5; ctx.strokeStyle = trayShake > 0 ? '#D83A4E' : '#1F3A68'; ctx.stroke();
    ctx.textAlign = 'left'; ctx.font = '800 11px ' + FB; ctx.fillStyle = '#7A4210';
    ctx.fillText('のせられる', 16, 79); ctx.fillText('コロッケ', 20, 93);
    for (let i = 0; i < D.cap; i++) {
      const x = TRAY_X0 + i * TRAY_STEP;
      if (i < stock) drawCro(x, 85, 24);
      else {
        ctx.setLineDash([3, 2]); ctx.strokeStyle = 'rgba(122,66,16,0.35)'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.ellipse(x, 85, 10, 6, 0, 0, TAU); ctx.stroke(); ctx.setLineDash([]);
      }
    }
    // fryer
    const fx = 356, fy = 87;
    ctx.fillStyle = '#5A6275'; rrect(fx - 18, fy - 6, 36, 14, 5); ctx.fill();
    ctx.fillRect(fx - 26, fy - 4, 9, 3);
    ctx.fillStyle = '#E8C36A'; ctx.fillRect(fx - 15, fy - 6, 30, 4);
    const frying = state === 'play' && totalCro() < D.cap;
    if (frying) {
      for (let i = 0; i < 3; i++) {
        const k = (time * 1.5 + i / 3) % 1;
        ctx.fillStyle = 'rgba(255,255,255,' + (0.8 * (1 - k)) + ')';
        ctx.beginPath(); ctx.arc(fx - 8 + i * 8, fy - 8 - k * 8, 2, 0, TAU); ctx.fill();
      }
      ctx.strokeStyle = '#E8A53E'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(fx, fy - 2, 17, -Math.PI / 2, -Math.PI / 2 + TAU * (fryT / D.fry)); ctx.stroke();
    }
    ctx.textAlign = 'center'; ctx.font = '800 9px ' + FB; ctx.fillStyle = '#7A4210';
    ctx.fillText(frying ? 'あげてる' : 'おやすみ', fx, 73);
    ctx.restore();
  }

  function drawHints() {
    if (state !== 'play') return;
    for (const r of rods) {
      if (!r.hint) continue;
      const g = rodGeom(r);
      const y = stackY(g.by, r.weight) - 40 + Math.sin(time * 8) * 6;
      ctx.fillStyle = '#D83A4E';
      ctx.beginPath(); ctx.moveTo(r.x, y + 16); ctx.lineTo(r.x - 12, y); ctx.lineTo(r.x - 5, y); ctx.lineTo(r.x - 5, y - 14);
      ctx.lineTo(r.x + 5, y - 14); ctx.lineTo(r.x + 5, y); ctx.lineTo(r.x + 12, y); ctx.closePath(); ctx.fill();
      ctx.font = '400 15px ' + FD; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.lineWidth = 4; ctx.strokeStyle = '#FFFDF6'; ctx.strokeText('タップ！', r.x, y - 26);
      ctx.fillStyle = '#D83A4E'; ctx.fillText('タップ！', r.x, y - 26);
    }
  }

  function drawCountdown() {
    if (state !== 'count') return;
    const n = 3 - Math.floor(stT / 0.7);
    const k = (stT % 0.7) / 0.7;
    const txt = n > 0 ? String(n) : 'つるぞ！';
    ctx.save();
    ctx.fillStyle = 'rgba(20,40,73,0.25)'; ctx.fillRect(-400, -400, W + 800, H + 800);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.globalAlpha = n > 0 ? 1 - k * 0.6 : 1;
    ctx.font = '400 ' + Math.round((n > 0 ? 96 : 60) * (1.3 - k * 0.3)) + 'px ' + FD;
    ctx.lineWidth = 10; ctx.strokeStyle = '#1F3A68'; ctx.strokeText(txt, W / 2, H / 2);
    ctx.fillStyle = '#E8A53E'; ctx.fillText(txt, W / 2, H / 2);
    ctx.restore();
  }

  function draw() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = '#A8743F'; ctx.fillRect(0, 0, cw, ch);
    let sx = 0, sy = 0;
    if (shake > 0) { sx = (Math.random() - 0.5) * 14 * shake; sy = (Math.random() - 0.5) * 14 * shake; }
    ctx.translate(ox + sx, oy + sy);
    ctx.scale(scale, scale);
    drawBackground();
    for (const r of rods) drawWaterStuff(r);
    drawPier();
    for (const r of rods) drawRest(r);
    for (const r of rods) drawRod(r);
    for (const r of rods) drawRemoveBtn(r);
    for (const r of rods) drawBadge(r);
    drawJumpers();
    for (const gl of gulls) drawGull(gl);
    drawParticles();
    drawHUD();
    drawFlyers();
    drawHints();
    drawFloats();
    drawCountdown();
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
