<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style data-fix="hidden">[hidden]{display:none!important}</style>
<title>コロッケ絵合わせ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
/* Layout: one-screen memory game. HUD on top, card grid fills the rest (JS sizes cards to fit), panels float in the middle. */
:root {
  --ai: #1F3A68;
  --ai-deep: #142849;
  --koromo: #E8A53E;
  --koromo-dark: #7A4210;
  --paper: #FFFDF6;
  --beni: #D83A4E;
  --shiba: #3E8E4A;
  --tatami: #E9D9AE;
  --font-display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  --font-body: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  color-scheme: light;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--tatami);
  background-image:
    repeating-linear-gradient(90deg, rgba(122,66,16,0.07) 0 2px, transparent 2px 9px),
    radial-gradient(ellipse at 50% 40%, #F4E8C4 0%, #E2CF9C 100%);
  color: var(--ai-deep);
  font-family: var(--font-body);
  overflow: hidden;
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
}
#app { position: relative; width: 100%; height: 100%; touch-action: manipulation; display: flex; flex-direction: column; }

.hud {
  flex: none;
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding-top: max(10px, calc(env(safe-area-inset-top, 0px) + 8px));
  padding-left: max(12px, calc(env(safe-area-inset-left, 0px) + 12px));
  padding-right: max(12px, calc(env(safe-area-inset-right, 0px) + 12px));
  padding-bottom: 6px;
}
.board {
  background: rgba(20, 40, 73, 0.9); color: var(--paper);
  border: 2px solid var(--paper); border-radius: 14px;
  padding: 5px 10px; display: flex; align-items: center; gap: 12px;
  box-shadow: 0 3px 0 rgba(20,40,73,0.45);
  min-width: 0;
}
.stat { display: flex; flex-direction: column; align-items: center; line-height: 1.1; }
.stat span { font-size: 0.64rem; font-weight: 800; letter-spacing: 0.04em; opacity: 0.85; white-space: nowrap; }
.stat b { font-family: var(--font-display); font-weight: 400; font-size: 1.15rem; color: var(--koromo); font-variant-numeric: tabular-nums; }
.pl { display: flex; align-items: center; gap: 6px; padding: 2px 8px 2px 4px; border-radius: 10px; border: 2px solid transparent; transition: background .2s, border-color .2s; }
.pl i { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-family: var(--font-display); font-size: 0.7rem; color: #fff; }
.pl.p1 i { background: var(--beni); }
.pl.p2 i { background: #2F8FD8; }
.pl.on { background: rgba(255,253,246,0.16); border-color: var(--koromo); }
.pl b { font-family: var(--font-display); font-weight: 400; font-size: 1.2rem; color: var(--koromo); font-variant-numeric: tabular-nums; min-width: 1.1em; text-align: center; }
.right { display: flex; gap: 6px; align-items: center; flex: none; }
.chip {
  font-family: var(--font-body); font-weight: 800; font-size: 0.76rem;
  background: var(--paper); color: var(--ai); border: 2px solid var(--ai);
  border-radius: 999px; padding: 4px 10px; cursor: pointer; white-space: nowrap;
}
.chip:focus-visible, .btn:focus-visible, .card:focus-visible, .seg button:focus-visible { outline: 3px solid var(--beni); outline-offset: 3px; }

.stage { flex: 1; min-height: 0; position: relative; display: grid; place-items: center;
  padding-left: max(10px, env(safe-area-inset-left, 0px)); padding-right: max(10px, env(safe-area-inset-right, 0px));
  padding-bottom: max(10px, calc(env(safe-area-inset-bottom, 0px) + 6px)); }
.grid { display: grid; gap: var(--gap, 8px); }

.card {
  width: var(--cw, 70px); height: var(--ch, 94px);
  perspective: 600px; border: 0; padding: 0; background: none; cursor: pointer;
  font: inherit; color: inherit; position: relative;
}
.card .in {
  position: absolute; inset: 0; transform-style: preserve-3d;
  transition: transform .34s cubic-bezier(.3,1.4,.6,1);
}
.card.up .in, .card.done .in { transform: rotateY(180deg); }
.card .f {
  position: absolute; inset: 0; border-radius: calc(var(--cw, 70px) * 0.14);
  backface-visibility: hidden; -webkit-backface-visibility: hidden;
  border: 3px solid var(--ai); box-sizing: border-box; overflow: hidden;
  box-shadow: 0 4px 0 var(--ai-deep);
}
.card .back {
  background-color: var(--ai);
  background-image:
    radial-gradient(circle at 50% 50%, transparent 0 34%, rgba(255,253,246,0.0) 34%),
    repeating-linear-gradient(45deg, rgba(255,253,246,0.07) 0 6px, transparent 6px 12px);
  display: grid; place-items: center;
}
.card .back::after {
  content: ""; width: 62%; aspect-ratio: 1; border-radius: 50%;
  background: var(--back-img) center/80% no-repeat, var(--koromo);
  border: 3px solid var(--paper); box-sizing: border-box;
}
.card .face {
  transform: rotateY(180deg);
  background: var(--bg, #fff);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}
.card .face .pic { width: 100%; flex: 1; background: var(--img) center/contain no-repeat; margin-top: 4%; }
.card .face .lb {
  font-weight: 800; font-size: calc(var(--cw, 70px) * 0.15); line-height: 1; white-space: nowrap;
  color: var(--ai-deep); padding: 0 2px 9%; letter-spacing: -0.02em;
}
.card.wide .face .lb { font-size: calc(var(--cw, 70px) * 0.12); }
.card:not(.up):not(.done):active .in { transform: scale(0.95); }
.card.done .face { animation: pop .5s ease-out; }
.card.done.got1 .face { border-color: var(--beni); box-shadow: 0 4px 0 #8E1F30; }
.card.done.got2 .face { border-color: #2F8FD8; box-shadow: 0 4px 0 #1B5A8C; }
.card.done .face::after { content: ""; position: absolute; inset: 0; background: rgba(255,253,246,0.0); }
.card.miss .face { animation: shake .4s; }
.card.peek .in { transform: rotateY(180deg); }
@keyframes pop { 0% { transform: rotateY(180deg) scale(1); } 40% { transform: rotateY(180deg) scale(1.13); } 100% { transform: rotateY(180deg) scale(1); } }
@keyframes shake { 0%,100% { translate: 0; } 25% { translate: -5px 0; } 75% { translate: 5px 0; } }

.toast {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) scale(0.6);
  font-family: var(--font-display); font-size: clamp(1.6rem, 8vw, 2.6rem); color: var(--koromo);
  -webkit-text-stroke: 2px var(--ai-deep); paint-order: stroke fill;
  text-shadow: 0 4px 0 var(--ai-deep); white-space: nowrap; pointer-events: none; opacity: 0;
  z-index: 5;
}
.toast.show { animation: toast 0.9s ease-out forwards; }
@keyframes toast { 0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); } 18% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); } 30% { transform: translate(-50%, -50%) scale(1); } 75% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -80%) scale(1); } }

.hint {
  position: absolute; left: 50%; transform: translateX(-50%);
  bottom: max(14px, calc(env(safe-area-inset-bottom, 0px) + 10px));
  font-family: var(--font-display); font-size: 0.95rem; color: var(--paper);
  background: rgba(20,40,73,0.86); border: 2px solid var(--paper);
  border-radius: 999px; padding: 7px 16px; white-space: nowrap; pointer-events: none; z-index: 4;
  max-width: calc(100% - 32px); box-sizing: border-box; overflow: hidden; text-overflow: ellipsis;
}

.veil { position: absolute; inset: 0; background: rgba(20,40,73,0.35); z-index: 8; }
.panel {
  position: absolute; left: 50%; top: 50%; z-index: 9;
  transform: translate(-50%, -50%);
  width: min(360px, calc(100% - 32px));
  max-height: calc(100% - 32px); overflow-y: auto; box-sizing: border-box;
  background: var(--paper);
  border: 3px solid var(--ai);
  border-radius: 20px;
  box-shadow: 6px 6px 0 var(--ai);
  padding: 20px 18px 18px;
  display: flex; flex-direction: column; align-items: center; gap: 12px;
  text-align: center;
}
.panel h1 {
  margin: 0; font-family: var(--font-display); font-weight: 400;
  font-size: 2.1rem; line-height: 1.15; color: var(--ai);
  text-wrap: balance; letter-spacing: 0.02em;
}
.panel h1 small { display: block; font-size: 0.9rem; color: var(--koromo-dark); letter-spacing: 0.2em; margin-bottom: 4px; }
.panel h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 1.7rem; color: var(--ai); text-wrap: balance; }
.panel p { margin: 0; font-size: 0.95rem; line-height: 1.7; font-weight: 500; }
.hero { width: 150px; height: 80px; background: var(--back-img) center/contain no-repeat; animation: bob 1.6s ease-in-out infinite; }
@keyframes bob { 0%,100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-6px) rotate(4deg); } }
.how { display: grid; gap: 6px; width: 100%; box-sizing: border-box; font-size: 0.86rem; line-height: 1.55; text-align: left; padding: 10px 12px; background: #F3EEE2; border-radius: 12px; }
.how b { color: var(--beni); }
.lbl { font-size: 0.74rem; font-weight: 800; color: var(--koromo-dark); align-self: flex-start; margin-bottom: -6px; }
.seg { display: flex; width: 100%; gap: 6px; }
.seg button {
  flex: 1; font-family: var(--font-body); font-weight: 800; font-size: 0.9rem;
  background: #F3EEE2; color: var(--ai); border: 2px solid #D9CFB8; border-radius: 12px;
  padding: 7px 2px 6px; cursor: pointer; line-height: 1.25;
}
.seg button small { display: block; font-size: 0.66rem; font-weight: 800; color: var(--koromo-dark); }
.seg button[aria-pressed="true"] { background: var(--koromo); border-color: var(--ai); box-shadow: 0 3px 0 var(--ai); }
.btn {
  font-family: var(--font-display); font-size: 1.3rem; color: var(--ai-deep);
  background: var(--koromo); border: 3px solid var(--ai); border-radius: 999px;
  padding: 10px 34px; box-shadow: 0 5px 0 var(--ai); cursor: pointer;
  transition: transform .08s, box-shadow .08s;
}
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--ai); }
.btn.sub { font-size: 0.95rem; padding: 6px 20px; background: var(--paper); box-shadow: 0 3px 0 var(--ai); }
.stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; width: 100%; }
.stats div { background: #F3EEE2; border-radius: 12px; padding: 8px 4px; display: flex; flex-direction: column; gap: 2px; }
.stats span { font-size: 0.7rem; font-weight: 800; color: var(--koromo-dark); }
.stats b { font-family: var(--font-display); font-weight: 400; font-size: 1.25rem; color: var(--ai); font-variant-numeric: tabular-nums; }
.stars { font-size: 2.2rem; letter-spacing: 0.1em; line-height: 1; color: #D9CFB8; }
.stars .on { color: var(--koromo); -webkit-text-stroke: 1.5px var(--koromo-dark); display: inline-block; animation: starpop .45s backwards; }
@keyframes starpop { 0% { transform: scale(0); } 70% { transform: scale(1.3); } 100% { transform: scale(1); } }
.title { font-family: var(--font-display); font-size: 1.1rem; color: var(--beni); }
.note { font-size: 0.85rem; font-weight: 800; color: var(--koromo-dark); }
.row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.zukan { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; width: 100%; }
.zukan div { aspect-ratio: 1; border-radius: 8px; background: var(--bg) ; background-image: var(--img); background-size: 86%; background-position: center; background-repeat: no-repeat; border: 2px solid var(--ai); box-sizing: border-box; }

.confetti { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 7; }
.confetti i { position: absolute; top: -20px; width: 10px; height: 14px; border-radius: 2px; animation: fall linear forwards; }
@keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }

@media (max-width: 380px) {
  .board { gap: 8px; padding: 4px 8px; }
  .stat b { font-size: 1rem; }
  .chip { font-size: 0.7rem; padding: 3px 8px; }
}
@media (prefers-reduced-motion: reduce) {
  .card .in { transition-duration: .01s; }
  .hero { animation: none; }
}
</style>

<div id="app">
  <div class="hud" id="hud">
    <div class="board" id="soloBoard" aria-label="記録">
      <div class="stat"><span>めくった</span><b id="hTries">0</b></div>
      <div class="stat"><span>そろった</span><b id="hPairs">0/6</b></div>
      <div class="stat"><span>じかん</span><b id="hTime">0:00</b></div>
    </div>
    <div class="board" id="duoBoard" aria-label="得点" hidden>
      <div class="pl p1" id="pl1"><i>1P</i><b id="s1">0</b></div>
      <div class="pl p2" id="pl2"><i>2P</i><b id="s2">0</b></div>
    </div>
    <div class="right">
      <button class="chip" id="soundBtn" type="button" aria-pressed="true">音：オン</button>
      <button class="chip" id="menuBtn" type="button">やめる</button>
    </div>
  </div>
  <div class="stage" id="stage">
    <div class="grid" id="grid" role="grid" aria-label="カード"></div>
    <div class="toast" id="toast"></div>
    <div class="hint" id="hint" hidden></div>
    <div class="confetti" id="confetti"></div>
  </div>

  <div class="veil" id="veil"></div>

  <div class="panel" id="titlePanel">
    <h1><small>あげたて商店街</small>コロッケ<br>絵合わせ</h1>
    <div class="hero" aria-hidden="true"></div>
    <div class="how">
      <div>カードを<b>2まい</b>めくって、<b>おなじ絵</b>ならゲット！ ちがったら元にもどるよ。どこに何があったか、よーく<b>おぼえて</b>ね。</div>
      <div>ふたりであそぶときは、そろえたら<b>もう1回</b>。たくさんそろえたほうが勝ち！</div>
    </div>
    <div class="lbl">むずかしさ</div>
    <div class="seg" id="segLv">
      <button type="button" data-lv="0" aria-pressed="true">かんたん<small>12まい</small></button>
      <button type="button" data-lv="1" aria-pressed="false">ふつう<small>16まい</small></button>
      <button type="button" data-lv="2" aria-pressed="false">むずかしい<small>20まい</small></button>
    </div>
    <div class="lbl">あそびかた</div>
    <div class="seg" id="segMode">
      <button type="button" data-mode="solo" aria-pressed="true">ひとりで</button>
      <button type="button" data-mode="duo" aria-pressed="false">ふたりで</button>
    </div>
    <div class="note" id="titleBest"></div>
    <button class="btn" id="startBtn" type="button">はじめる</button>
  </div>

  <div class="panel" id="resPanel" hidden>
    <h2 id="resHead">ぜんぶそろった！</h2>
    <div class="stars" id="resStars" aria-label=""></div>
    <div class="title" id="resTitle"></div>
    <div class="stats" id="resStats">
      <div><span>めくった</span><b id="rTries">0</b></div>
      <div><span>じかん</span><b id="rTime">0:00</b></div>
      <div><span>れんぞく</span><b id="rCombo">0</b></div>
    </div>
    <p id="resText"></p>
    <div class="note" id="resBest"></div>
    <div class="row">
      <button class="btn" id="againBtn" type="button">もう1回</button>
    </div>
    <button class="btn sub" id="toTitleBtn" type="button">タイトルへ</button>
  </div>
</div>

  const KINDS = [
