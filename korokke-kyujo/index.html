<title>コロッケきゅうじょたい</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: one-screen game. Canvas = うみ（上）と さんばし（下）。プレイヤーは さんばしから コロッケの うきわを なげる。 */
:root {
  --ai: #1F3A68;
  --ai-deep: #142849;
  --koromo: #E8A53E;
  --koromo-dark: #7A4210;
  --paper: #FFFDF6;
  --beni: #D83A4E;
  --font-display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  --font-body: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  color-scheme: light;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  background: #2B8EC2;
  color: var(--ai-deep);
  font-family: var(--font-body);
  overflow: hidden;
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
}
#app { position: relative; width: 100%; height: 100%; touch-action: none; }
canvas { display: block; width: 100%; height: 100%; touch-action: none; }

.panel {
  position: absolute; left: 50%; top: 50%;
  transform: translate(-50%, -50%);
  width: min(350px, calc(100% - 32px));
  max-height: calc(100% - 32px); overflow-y: auto;
  background: var(--paper);
  border: 3px solid var(--ai);
  border-radius: 20px;
  box-shadow: 6px 6px 0 var(--ai);
  padding: 20px 18px 18px;
  display: flex; flex-direction: column; align-items: center; gap: 11px;
  text-align: center;
  box-sizing: border-box;
}
.panel h1 {
  margin: 0; font-family: var(--font-display); font-weight: 400;
  font-size: 2.0rem; line-height: 1.15; color: var(--ai);
  text-wrap: balance; letter-spacing: 0.02em;
}
.panel h1 small { display: block; font-size: 0.9rem; color: var(--koromo-dark); letter-spacing: 0.15em; margin-bottom: 4px; }
.panel h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 1.7rem; color: var(--ai); text-wrap: balance; }
.how { display: grid; gap: 6px; width: 100%; font-size: 0.86rem; line-height: 1.55; text-align: left; padding: 10px 12px; background: #F3EEE2; border-radius: 12px; box-sizing: border-box; }
.how b { color: var(--beni); }
kbd {
  font-family: var(--font-body); font-weight: 800; font-size: 0.76rem;
  border: 2px solid var(--ai); border-bottom-width: 3px; border-radius: 6px; padding: 0 5px; background: #fff;
}
.diffs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; }
.diff {
  font-family: var(--font-body); font-weight: 800; font-size: 1rem; color: var(--ai);
  background: #fff; border: 2px solid var(--ai); border-radius: 14px;
  padding: 7px 4px 6px; cursor: pointer; line-height: 1.2;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
}
.diff small { font-size: 0.68rem; font-weight: 500; color: var(--koromo-dark); }
.diff .best { font-size: 0.66rem; font-weight: 800; color: var(--ai); opacity: .75; }
.diff[aria-pressed="true"] { background: var(--koromo); box-shadow: inset 0 0 0 2px var(--ai); }
.diff[aria-pressed="true"] small { color: var(--ai-deep); }
.diff.oni[aria-pressed="true"] { background: var(--beni); color: var(--paper); }
.diff.oni[aria-pressed="true"] small, .diff.oni[aria-pressed="true"] .best { color: var(--paper); }
.btn {
  font-family: var(--font-display); font-size: 1.3rem; color: var(--ai-deep);
  background: var(--koromo); border: 3px solid var(--ai); border-radius: 999px;
  padding: 10px 34px; box-shadow: 0 5px 0 var(--ai); cursor: pointer;
  transition: transform .08s, box-shadow .08s;
}
.btn.sub { font-size: 0.95rem; padding: 6px 20px; background: #fff; box-shadow: 0 3px 0 var(--ai); }
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--ai); }
.btn:focus-visible, .sound:focus-visible, .diff:focus-visible { outline: 3px solid var(--beni); outline-offset: 3px; }
.big { font-family: var(--font-display); font-size: 2.6rem; color: var(--beni); line-height: 1; }
.rank { font-family: var(--font-display); font-size: 1.15rem; color: var(--ai); }
.stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; width: 100%; }
.stats div { background: #F3EEE2; border-radius: 10px; padding: 6px 2px; font-size: 0.7rem; font-weight: 800; color: var(--koromo-dark); }
.stats b { display: block; font-family: var(--font-display); font-weight: 400; font-size: 1.25rem; color: var(--ai); }
.note { font-size: 0.85rem; font-weight: 800; color: var(--koromo-dark); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center; }

.sound {
  position: absolute;
  left: max(12px, calc(env(safe-area-inset-left, 0px) + 12px));
  bottom: max(12px, calc(env(safe-area-inset-bottom, 0px) + 12px));
  font-family: var(--font-body); font-weight: 800; font-size: 0.8rem;
  background: var(--paper); color: var(--ai); border: 2px solid var(--ai);
  border-radius: 999px; padding: 5px 12px; cursor: pointer;
}
</style>

<div id="app">
  <canvas id="cv"></canvas>

  <div class="panel" id="titlePanel">
    <h1><small>うみで こまってる人を たすけよう！</small>コロッケ<br>きゅうじょたい</h1>
    <div class="how">
      <div>うみで <b>「たすけて〜！」</b>と 手を ふっている人が いるよ。<b>コロッケの うきわ</b>を なげて たすけよう！</div>
      <div>がめんを <b>したに ひっぱって はなす</b>と なげられるよ。ながく ひっぱるほど <b>とおくまで</b> とぶ。</div>
      <div>人に <b>ぴったり</b> とどくと ボーナス。とおくの人や <b>いぬ・ねこ</b>は とくてんアップ！</div>
      <div>ゲージが なくなると イルカが たすけてくれるけど、ハートが へるよ。</div>
      <div>PC：マウスで ひっぱる ／ <kbd>←</kbd><kbd>→</kbd>で むき、<kbd>↑</kbd><kbd>↓</kbd>で つよさ、<kbd>スペース</kbd>で なげる</div>
    </div>
    <div class="diffs" id="diffs"></div>
    <button class="btn" id="startBtn">スタート</button>
  </div>

  <div class="panel" id="overPanel" hidden>
    <h2 id="overHead">おしまい！</h2>
    <div class="big" id="overScore">0</div>
    <div class="rank" id="overRank"></div>
    <div class="stats">
      <div>たすけた<b id="stSaved">0</b></div>
      <div>ぴったり<b id="stPerfect">0</b></div>
      <div>さいこう<br>れんぞく<b id="stCombo">0</b></div>
    </div>
    <div class="note" id="overBest"></div>
    <div class="row">
      <button class="btn" id="retryBtn">もういっかい</button>
      <button class="btn sub" id="menuBtn">むずかしさを かえる</button>
    </div>
  </div>

  <button class="sound" id="soundBtn" type="button" aria-pressed="true">音：オン</button>
</div>

    if (croReady) ctx.drawImage(croImg, -w / 2, -w * IMG_R / 2, w, w * IMG_R);
    else { ctx.fillStyle = '#E8A53E'; ctx.beginPath(); ctx.ellipse(0, 0, w / 2, w * IMG_R / 2, 0, 0, TAU); ctx.fill(); }
    ctx.restore();
  }

  // ---------- game state ----------
  let state = 'title'; // title | count | play | over
  let people = [], cros = [], fx = [];
  let score = 0, timeLeft = ROUND, lives = 0, combo = 0, maxCombo = 0, saved = 0, perfects = 0;
  let spawnT = 0, elapsed = 0, countT = 0, endT = 0, throwCD = 0, throwAnim = 0;
  let wind = 0, windTarget = 0, windT = 0, current = 0;
  let hintT = 0, lastTick = 0;
  let aim = null;                       // pointer aiming
  const kb = { a: 0, p: 0.5, active: false, keys: {} };
  let clock = 0;

  function startGame() {
    D = DIFFS[diffIdx];
    people = []; cros = []; fx = [];
    score = 0; timeLeft = ROUND; lives = D.lives; combo = 0; maxCombo = 0; saved = 0; perfects = 0;
    spawnT = 0.6; elapsed = 0; endT = 0; throwCD = 0; throwAnim = 0;
    wind = 0; windTarget = 0; windT = 4; current = 0; hintT = 0; lastTick = 0;
    aim = null; kb.active = false; kb.a = 0; kb.p = 0.5;
    countT = 3.0; state = 'count';
    $('titlePanel').hidden = true; $('overPanel').hidden = true;
    sfx.count(false);
  }

  function endGame(byLives) {
    state = 'over';
    aim = null;
    const prev = best[D.id] || 0;
    const isBest = score > prev;
    if (isBest) { best[D.id] = score; store.set('korokke-kyujo-best', best); }
    $('overHead').textContent = byLives ? 'ハートが なくなった！' : 'おしまい！';
    $('overScore').textContent = score.toLocaleString();
    let rk = RANKS[0][1]; for (const [n, name] of RANKS) if (saved >= n) rk = name;
    $('overRank').textContent = rk;
    $('stSaved').textContent = saved + 'にん';
    $('stPerfect').textContent = perfects;
    $('stCombo').textContent = maxCombo;
    $('overBest').textContent = isBest ? '★ じこベスト こうしん！ ★' : 'じこベスト ' + prev.toLocaleString();
    $('overPanel').hidden = false;
    byLives ? sfx.gameover() : sfx.end();
  }

  // ---------- spawning ----------
  function swimmingCount() { return people.filter(p => p.state === 'swim' || p.state === 'pop').length; }
  function spawn() {
    const prog = clamp(elapsed / ROUND, 0, 1);
    for (let tries = 0; tries < 24; tries++) {
      const farBias = D.id === 'easy' ? 0.35 : D.id === 'normal' ? 0.5 : 0.65;
      const fy = Math.random() < farBias ? rand(0, 0.55) : rand(0.4, 1);
      const y = lerp(HORIZON + 36, PIER - 72, fy);
      const x = rand(36, W - 36);
      if (people.some(p => (p.state === 'swim' || p.state === 'pop') && Math.hypot(p.x - x, (p.y - y) * 1.4) < 72)) continue;
      const k = pickKind();
      const stamMax = D.stam ? lerp(D.stam[0], D.stam[1], prog) * rand(0.9, 1.15) + (1 - persp(y)) * 2.5 : 0;
      people.push({
        kind: k, x, y, vx: rand(-1, 1) * D.drift, phase: rand(0, TAU),
        stam: stamMax, stamMax, state: 'pop', t: 0, talk: 1.8, talkCycle: rand(3.5, 5),
        dir: 1, alpha: 1,
      });
      fx.push({ type: 'splash', x, y, t: 0, life: 0.6, s: persp(y) });
      return;
    }
  }

  // ---------- throwing ----------
  function shotFromPull(a) {
    const vx = a.sx - a.cx, vy = a.sy - a.cy;
    const len = Math.hypot(vx, vy);
    if (len < 14) return null;
    const ang = clamp(Math.atan2(vx, -vy), -1.25, 1.25);
    const pow = clamp(len / MAXPULL, 0, 1);
    return shotFromAngle(ang, pow);
  }
  function shotFromAngle(ang, pow) {
    const dist = lerp(40, 520, pow);
    const sx = PLAYER.x, sy = PLAYER.y - 28;
    let x = sx + Math.sin(ang) * dist, y = sy - Math.cos(ang) * dist;
    x = clamp(x, 8, W - 8); y = clamp(y, HORIZON + 14, PIER - 4);
    return { x, y, ang, pow };
  }
  function throwTo(sh) {
    if (throwCD > 0 || state !== 'play') return;
    const sx = PLAYER.x + 16, sy = PLAYER.y - 34;
    const dist = Math.hypot(sh.x - sx, sh.y - sy);
    const dur = 0.36 + dist / 760;
    const x1 = clamp(sh.x + wind * dur, 4, W - 4);
    cros.push({ state: 'fly', x0: sx, y0: sy, x1, y1: sh.y, x: sx, y: sy, z: 0, t: 0, dur, h: 30 + dist * 0.3, rot: 0, spin: rand(8, 12) * (Math.random() < 0.5 ? -1 : 1), life: 0, phase: rand(0, TAU) });
    throwCD = 0.28; throwAnim = 0.3;
    sfx.throw(); buzz(10);
  }

  function landCro(c) {
    const s = persp(c.y);
    fx.push({ type: 'splash', x: c.x, y: c.y, t: 0, life: 0.6, s });
    sfx.splash();
    const caught = [];
    for (const p of people) {
      if (p.state !== 'swim' && p.state !== 'pop') continue;
      const d = Math.hypot(p.x - c.x, (p.y - c.y) * 1.25);
      if (d < D.catchR * persp(p.y)) caught.push([p, d]);
    }
    if (caught.length) {
      caught.sort((a, b) => a[1] - b[1]);
      caught.forEach(([p, d], i) => rescue(p, d < D.catchR * persp(p.y) * 0.42, i > 0 ? null : c, caught.length));
    } else {
      c.state = 'float'; c.life = 4.2; c.rot = 0;
    }
  }

  function popup(x, y, text, color, size = 18, life = 1.1, delay = 0) {
    fx.push({ type: 'text', x, y, text, color, size, t: -delay, life });
  }

  function rescue(p, perfect, cro, together) {
    p.state = 'pull'; p.t = 0;
    if (cro) { cro.state = 'held'; p.cro = cro; } else { p.cro = { state: 'held', rot: 0 }; cros.push(p.cro); }
    combo++; maxCombo = Math.max(maxCombo, combo); saved++;
    if (perfect) perfects++;
    const s = persp(p.y);
    const far = clamp((PIER - 72 - p.y) / (PIER - HORIZON - 108), 0, 1);
    let pts = 100 + Math.round(far * 10) * 10;
    const tags = [];
    if (perfect) { pts += 50; tags.push('ぴったり！'); }
    if (D.stam && p.stam / p.stamMax > 0.65) { pts += 30; tags.push('はやい！'); }
    if (together > 1 && cro) tags.push(together + 'にん いっしょ！');
    pts *= p.kind.mult;
    pts = Math.round(pts * (1 + Math.min(combo - 1, 10) * 0.1) / 10) * 10;
    score += pts;
    popup(p.x, p.y - 46 * s, '+' + pts, '#FFE14D', 22);
    tags.forEach((tg, i) => popup(p.x, p.y - 24 * s + i * 18, tg, '#FFFFFF', 15, 1.1, 0.05 + i * 0.08));
    if (combo >= 2) popup(p.x, p.y - 70 * s, combo + ' れんぞく！', '#FF9E3D', 14, 1.0, 0.1);
    sfx.rescue(combo); if (perfect) sfx.perfect();
    buzz(perfect ? [20, 30, 20] : 20);
  }

  function loseOne(p) {
    p.state = 'dolphin'; p.t = 0; p.dir = p.x < W / 2 ? -1 : 1;
    combo = 0;
    if (D.lives) { lives--; buzz([40, 40, 40]); sfx.lose(); }
    popup(p.x, p.y - 44 * persp(p.y), 'イルカが たすけてくれた！', '#FFFFFF', 13, 1.6);
    sfx.dolphin();
    if (D.lives && lives <= 0 && !endT) endT = 1.0;
  }

  // ---------- input ----------
  function toWorld(e) {
    const r = cv.getBoundingClientRect();
    return { x: (e.clientX - r.left - ox) / scale, y: (e.clientY - r.top - oy) / scale };
  }
  cv.addEventListener('pointerdown', e => {
    if (state !== 'play' && state !== 'count') return;
    e.preventDefault();
    audio();
    const p = toWorld(e);
    aim = { id: e.pointerId, sx: p.x, sy: p.y, cx: p.x, cy: p.y };
    kb.active = false;
    try { cv.setPointerCapture(e.pointerId); } catch {}
  });
  cv.addEventListener('pointermove', e => {
    if (!aim || e.pointerId !== aim.id) return;
    const p = toWorld(e); aim.cx = p.x; aim.cy = p.y;
  });
  function release(e, cancel) {
    if (!aim || e.pointerId !== aim.id) return;
    const sh = cancel ? null : shotFromPull(aim);
    aim = null;
    if (cancel) return;
    if (sh && state === 'play') throwTo(sh);
    else if (!sh && state === 'play') { hintT = 2.4; sfx.hint(); }
  }
  cv.addEventListener('pointerup', e => release(e, false));
  cv.addEventListener('pointercancel', e => release(e, true));

  window.addEventListener('keydown', e => {
    const k = e.key;
    if (state === 'play' || state === 'count') {
      if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(k)) { kb.keys[k] = true; kb.active = true; e.preventDefault(); }
      if ((k === ' ' || k === 'Enter') && state === 'play') {
        audio();
        if (!kb.active) kb.active = true; else throwTo(shotFromAngle(kb.a, kb.p));
        e.preventDefault();
      }
    } else if ((k === 'Enter' || k === ' ') && state === 'title' && document.activeElement === document.body) {
      startGame(); e.preventDefault();
    }
  });
  window.addEventListener('keyup', e => { kb.keys[e.key] = false; });

  // ---------- title UI ----------
  const diffsEl = $('diffs');
  function renderDiffs() {
    diffsEl.innerHTML = '';
    DIFFS.forEach((d, i) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'diff' + (d.id === 'oni' ? ' oni' : '');
      b.setAttribute('aria-pressed', String(i === diffIdx));
      b.innerHTML = d.name + '<small>' + d.sub + '</small>' + (best[d.id] ? '<span class="best">ベスト ' + best[d.id].toLocaleString() + '</span>' : '');
      b.addEventListener('click', () => { diffIdx = i; store.set('korokke-kyujo-diff', i); D = DIFFS[i]; renderDiffs(); sfx.hint(); });
      diffsEl.appendChild(b);
    });
  }
  renderDiffs();
  $('startBtn').addEventListener('click', startGame);
  $('retryBtn').addEventListener('click', startGame);
  $('menuBtn').addEventListener('click', () => {
    state = 'title'; $('overPanel').hidden = true; renderDiffs(); $('titlePanel').hidden = false;
    people = []; cros = []; fx = []; demoSpawn();
  });

  // ---------- update ----------
  function update(dt) {
    clock += dt;
    if (state === 'count') {
      const before = Math.ceil(countT);
      countT -= dt;
      if (countT <= 0) { state = 'play'; sfx.count(true); }
      else if (Math.ceil(countT) !== before) sfx.count(false);
    }
    const playing = state === 'play';
    if (playing) {
      elapsed += dt;
      timeLeft = Math.max(0, ROUND - elapsed);
      const sec = Math.ceil(timeLeft);
      if (sec <= 5 && sec !== lastTick && sec > 0) { lastTick = sec; sfx.tick(); }
      spawnT -= dt;
      const prog = clamp(elapsed / ROUND, 0, 1);
      const maxP = Math.round(lerp(D.max[0], D.max[1], prog));
      if (spawnT <= 0) {
        if (swimmingCount() < maxP) spawn();
        spawnT = lerp(D.gap[0], D.gap[1], prog) * rand(0.8, 1.2);
      }
      if (swimmingCount() === 0 && spawnT > 0.5) spawnT = 0.5;
      if (D.wind) {
        windT -= dt;
        if (windT <= 0) { windTarget = Math.round(rand(-1, 1) * D.wind); windT = rand(6, 10); }
      }
      if (timeLeft <= 0 && !endT) { endGame(false); return; }
      if (endT) { endT -= dt; if (endT <= 0) { endGame(true); return; } }
    }
    wind += (windTarget - wind) * Math.min(1, dt * 1.5);
    current = Math.sin(clock * 0.23) * D.drift * 0.5;
    throwCD = Math.max(0, throwCD - dt);
    throwAnim = Math.max(0, throwAnim - dt);
    hintT = Math.max(0, hintT - dt);

    // keyboard aiming
    if (kb.active) {
      if (kb.keys.ArrowLeft) kb.a -= 1.5 * dt;
      if (kb.keys.ArrowRight) kb.a += 1.5 * dt;
      if (kb.keys.ArrowUp) kb.p += 0.75 * dt;
      if (kb.keys.ArrowDown) kb.p -= 0.75 * dt;
      kb.a = clamp(kb.a, -1.25, 1.25); kb.p = clamp(kb.p, 0, 1);
    }

    // croquettes
    for (const c of cros) {
      if (c.state === 'fly') {
        c.t += dt;
        const k = clamp(c.t / c.dur, 0, 1);
        c.x = lerp(c.x0, c.x1, k); c.y = lerp(c.y0, c.y1, k);
        c.z = 4 * c.h * k * (1 - k);
        c.rot += c.spin * dt;
        if (k >= 1) { c.z = 0; landCro(c); }
      } else if (c.state === 'float') {
        c.life -= dt;
        c.x = clamp(c.x + (current + wind * 0.25) * dt * persp(c.y), 4, W - 4);
        if (c.life <= 0) {
          c.state = 'sink'; c.life = 0.7; sfx.sink();
          if (combo > 0 && D.id !== 'easy') { combo = 0; }
        }
      } else if (c.state === 'sink') {
        c.life -= dt;
        if (c.life <= 0) c.dead = true;
      }
    }

    // people
    for (const p of people) {
      p.t += dt;
      const s = persp(p.y);
      if (p.state === 'pop') {
        if (p.t > 0.45) { p.state = 'swim'; p.t = 0; }
      }
      if (p.state === 'swim' || p.state === 'pop') {
        // drift
        let mx = (p.vx + current) * s;
        // swim toward a floating croquette nearby
        let near = null, nd = 1e9;
        for (const c of cros) {
          if (c.state !== 'float') continue;
          const d = Math.hypot(c.x - p.x, (c.y - p.y) * 1.25);
          if (d < D.attract * s && d < nd) { nd = d; near = c; }
        }
        if (near) {
          const sp = 34 * s;
          p.x += (near.x - p.x) / Math.max(nd, 1) * sp * dt;
          p.y += (near.y - p.y) / Math.max(nd, 1) * sp * dt;
          if (nd < D.catchR * s * 0.55) { near.life = 99; rescue(p, false, near, 1); continue; }
        } else {
          p.x += mx * dt;
        }
        if (p.x < 26) { p.x = 26; p.vx = Math.abs(p.vx); }
        if (p.x > W - 26) { p.x = W - 26; p.vx = -Math.abs(p.vx); }
        if (playing) {
          if (D.stam) {
            p.stam -= dt;
            if (p.stam <= 0) { loseOne(p); continue; }
          }
          p.talk -= dt;
          if (p.talk < -p.talkCycle) p.talk = 1.4;
        }
      } else if (p.state === 'pull') {
        const tx = clamp(p.x, 40, W - 40), ty = PIER - 6;
        const dx = tx - p.x, dy = ty - p.y, d = Math.hypot(dx, dy);
        const sp = 190;
        if (d < sp * dt + 1) {
          p.state = 'safe'; p.t = 0;
          let x = clamp(p.x, 46, W - 46);
          if (Math.abs(x - PLAYER.x) < 56) x = PLAYER.x + (x < PLAYER.x ? -56 : 56);
          p.x = x; p.y = PIER + 30; p.dir = x < PLAYER.x ? -1 : 1;
          if (p.cro) p.cro.dead = true;
          sfx.thanks();
        } else { p.x += dx / d * sp * dt; p.y += dy / d * sp * dt; }
      } else if (p.state === 'safe') {
        if (p.t > 0.9) p.x += p.dir * 80 * dt;
        if (p.t > 1.6) p.alpha = Math.max(0, 1 - (p.t - 1.6) / 0.6);
        if (p.t > 2.2) p.dead = true;
      } else if (p.state === 'dolphin') {
        p.x += p.dir * (60 + p.t * 160) * dt;
        if (p.x < VL - 80 || p.x > VR + 80) p.dead = true;
      }
    }
    people = people.filter(p => !p.dead);
    cros = cros.filter(c => !c.dead);

    for (const f of fx) f.t += dt;
    fx = fx.filter(f => f.t < f.life);
  }

  // ---------- drawing helpers ----------
  function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h); }
  function outlined(text, x, y, size, fill, stroke = '#142849', font = FD, lw = 4) {
    ctx.font = size + 'px ' + font;
    ctx.lineJoin = 'round'; ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.strokeText(text, x, y);
    ctx.fillStyle = fill; ctx.fillText(text, x, y);
  }

  function drawBackground() {
    const L = VL - 2, R = VR + 2, T = VT - 2, B = VB + 2;
    // sky
    let g = ctx.createLinearGradient(0, T, 0, HORIZON);
    g.addColorStop(0, '#7FCBEF'); g.addColorStop(1, '#DDF4FB');
    ctx.fillStyle = g; ctx.fillRect(L, T, R - L, HORIZON - T + 1);
    // sun
    ctx.fillStyle = 'rgba(255,240,150,0.45)'; ctx.beginPath(); ctx.arc(330, 40, 28, 0, TAU); ctx.fill();
    ctx.fillStyle = '#FFE35C'; ctx.beginPath(); ctx.arc(330, 40, 18, 0, TAU); ctx.fill();
    // clouds
    ctx.fillStyle = 'rgba(255,255,255,0.92)';
    for (let i = 0; i < 3; i++) {
      const span = (R - L) + 160;
      const cx = L - 80 + ((i * 160 + clock * (6 + i * 2)) % span);
      const cy = 24 + i * 16;
      ctx.beginPath();
      ctx.ellipse(cx, cy, 26, 9, 0, 0, TAU); ctx.ellipse(cx + 16, cy - 6, 15, 10, 0, 0, TAU); ctx.ellipse(cx - 14, cy - 3, 12, 8, 0, 0, TAU);
      ctx.fill();
    }
    // seagulls
    ctx.strokeStyle = '#3B4E6B'; ctx.lineWidth = 1.6; ctx.lineCap = 'round';
    for (let i = 0; i < 2; i++) {
      const span = (R - L) + 100;
      const gx = R + 50 - ((i * 220 + clock * 18) % span), gy = 50 + i * 12 + Math.sin(clock * 2 + i) * 3;
      const fl = Math.sin(clock * 7 + i * 2) * 3;
      ctx.beginPath(); ctx.moveTo(gx - 7, gy - fl); ctx.quadraticCurveTo(gx - 3, gy - 4, gx, gy); ctx.quadraticCurveTo(gx + 3, gy - 4, gx + 7, gy - fl); ctx.stroke();
    }
    // island + lighthouse
    ctx.fillStyle = '#5FA85A';
    ctx.beginPath(); ctx.ellipse(70, HORIZON + 2, 50, 14, 0, Math.PI, TAU); ctx.fill();
    ctx.fillStyle = '#4B8F47';
    ctx.beginPath(); ctx.ellipse(52, HORIZON + 2, 22, 9, 0, Math.PI, TAU); ctx.fill();
    ctx.fillStyle = '#FFFFFF'; ctx.fillRect(78, HORIZON - 34, 9, 24);
    ctx.fillStyle = '#D83A4E'; ctx.fillRect(78, HORIZON - 28, 9, 5); ctx.fillRect(78, HORIZON - 18, 9, 5);
    ctx.fillStyle = '#D83A4E'; ctx.beginPath(); ctx.moveTo(76, HORIZON - 34); ctx.lineTo(82.5, HORIZON - 42); ctx.lineTo(89, HORIZON - 34); ctx.fill();
    // sea
    g = ctx.createLinearGradient(0, HORIZON, 0, PIER);
    g.addColorStop(0, '#86D3EC'); g.addColorStop(0.35, '#4FB4DD'); g.addColorStop(1, '#2A8BC0');
    ctx.fillStyle = g; ctx.fillRect(L, HORIZON, R - L, Math.max(PIER, B) - HORIZON);
    ctx.fillStyle = 'rgba(255,255,255,0.55)'; ctx.fillRect(L, HORIZON, R - L, 1.5);
    // waves
    ctx.lineCap = 'round';
    for (let r = 0; r < 14; r++) {
      const fy = r / 13;
      const y = lerp(HORIZON + 8, PIER - 10, fy * fy * 0.3 + fy * 0.7);
      const s = persp(y);
      const step = 64 * s;
      const off = ((clock * 14 * s * (r % 2 ? 1 : -0.7)) + r * 37) % step;
      ctx.strokeStyle = 'rgba(255,255,255,' + (0.18 + s * 0.22) + ')';
      ctx.lineWidth = 1.6 * s + 0.4;
      for (let x = L - step + off; x < R + step; x += step) {
        const yy = y + Math.sin(clock * 1.8 + x * 0.05 + r) * 2 * s;
        ctx.beginPath(); ctx.moveTo(x, yy); ctx.quadraticCurveTo(x + 9 * s, yy - 5 * s, x + 18 * s, yy); ctx.stroke();
      }
    }
  }

  function drawPier() {
    const L = VL - 2, R = VR + 2, B = VB + 2;
    // posts in water
    for (let x = 30; x < W; x += 85) {
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.beginPath(); ctx.ellipse(x, PIER - 1, 12, 3.5, 0, 0, TAU); ctx.fill();
    }
    ctx.fillStyle = '#C98E52'; ctx.fillRect(L, PIER, R - L, B - PIER);
    ctx.fillStyle = '#8A5A2E'; ctx.fillRect(L, PIER, R - L, 7);
    ctx.fillStyle = '#E2AE72'; ctx.fillRect(L, PIER + 7, R - L, 2);
    ctx.strokeStyle = 'rgba(110,65,25,0.45)'; ctx.lineWidth = 1.5;
    for (let y = PIER + 26, i = 0; y < B; y += 19, i++) {
      ctx.beginPath(); ctx.moveTo(L, y); ctx.lineTo(R, y); ctx.stroke();
      for (let x = Math.floor(L / 90) * 90 + (i % 2) * 45; x < R; x += 90) { ctx.beginPath(); ctx.moveTo(x, y - 19); ctx.lineTo(x, y); ctx.stroke(); }
    }
    // life ring decoration
    ctx.save(); ctx.translate(58, 606);
    ctx.lineWidth = 9;
    for (let i = 0; i < 4; i++) { ctx.strokeStyle = i % 2 ? '#FFFFFF' : '#F26B3A'; ctx.beginPath(); ctx.arc(0, 0, 15, i * TAU / 4, (i + 1) * TAU / 4); ctx.stroke(); }
    ctx.restore();
    // basket of croquettes
    ctx.fillStyle = '#A8743E'; rr(258, 600, 46, 22, 6); ctx.fill();
    drawCro(270, 600, 26, -0.2); drawCro(290, 598, 26, 0.25); drawCro(280, 592, 26, 0.05);
    ctx.fillStyle = '#C08A4E'; rr(255, 604, 52, 20, 6); ctx.fill();
    ctx.strokeStyle = '#8A5A2E'; ctx.lineWidth = 1.5;
    for (let x = 262; x < 305; x += 9) { ctx.beginPath(); ctx.moveTo(x, 606); ctx.lineTo(x, 622); ctx.stroke(); }
    // wind flag
    const px = 352, top = 520;
    ctx.fillStyle = '#E7E2D6'; ctx.fillRect(px - 2, top, 4, 104);
    ctx.fillStyle = '#8A5A2E'; ctx.fillRect(px - 6, 620, 12, 6);
    const wv = clamp(wind / 50, -1, 1);
    const len = 14 + Math.abs(wv) * 20;
    const dir = Math.abs(wv) < 0.08 ? 0 : Math.sign(wv);
    ctx.fillStyle = '#D83A4E';
    ctx.beginPath(); ctx.moveTo(px, top + 2);

      ctx.quadraticCurveTo(px + dir * len * 0.5, top + 14 + wob, px, top + 16);
    }
    ctx.fill();
  }

  function drawPlayer() {
    const x = PLAYER.x, y = PLAYER.y;
    const k = throwAnim > 0 ? throwAnim / 0.3 : 0;
    const bob = Math.sin(clock * 3) * 1.5;
    // shadow
    ctx.fillStyle = 'rgba(80,45,15,0.3)'; ctx.beginPath(); ctx.ellipse(x, y + 26, 44, 8, 0, 0, TAU); ctx.fill();
    // legs
    ctx.strokeStyle = '#7A4210'; ctx.lineWidth = 5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x - 14, y + 10); ctx.lineTo(x - 18, y + 26); ctx.moveTo(x + 14, y + 10); ctx.lineTo(x + 18, y + 26); ctx.stroke();
    // body
    drawCro(x, y + bob - k * 4, 96, Math.sin(clock * 2) * 0.02 - k * 0.08);
    // cap (lifeguard)
    ctx.fillStyle = '#D83A4E';
    ctx.beginPath(); ctx.ellipse(x - 4, y - 18 + bob, 22, 9, 0, Math.PI, TAU); ctx.fill();
    ctx.fillStyle = '#FFFFFF'; ctx.fillRect(x - 26, y - 19 + bob, 44, 3);
    ctx.fillStyle = '#B42A3C'; ctx.beginPath(); ctx.ellipse(x + 20, y - 17 + bob, 12, 3.5, 0.15, 0, TAU); ctx.fill();
    // face
    const ey = y - 2 + bob;
    ctx.fillStyle = '#FFFFFF';
    ctx.beginPath(); ctx.ellipse(x - 13, ey, 7, 8, 0, 0, TAU); ctx.ellipse(x + 13, ey, 7, 8, 0, 0, TAU); ctx.fill();
    // look toward aim
    let lx = 0, ly = -2;
    const sh = aim ? shotFromPull(aim) : (kb.active ? shotFromAngle(kb.a, kb.p) : null);
    if (sh) { lx = Math.sin(sh.ang) * 3; ly = -3; }
    ctx.fillStyle = '#142849';
    ctx.beginPath(); ctx.arc(x - 13 + lx, ey + ly, 3.6, 0, TAU); ctx.arc(x + 13 + lx, ey + ly, 3.6, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#4A1F0E'; ctx.lineWidth = 2.2;
    ctx.beginPath(); ctx.arc(x, ey + 9, 6, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
    ctx.fillStyle = 'rgba(255,120,120,0.45)';
    ctx.beginPath(); ctx.ellipse(x - 24, ey + 8, 5, 3, 0, 0, TAU); ctx.ellipse(x + 24, ey + 8, 5, 3, 0, 0, TAU); ctx.fill();
    // whistle
    ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(x - 8, y + 12 + bob); ctx.lineTo(x - 2, y + 18 + bob); ctx.stroke();
    ctx.fillStyle = '#FFD84A'; rr(x - 4, y + 16 + bob, 8, 5, 2); ctx.fill();
    // arm + croquette in hand
    ctx.strokeStyle = '#7A4210'; ctx.lineWidth = 5;
    const ang = k > 0 ? lerp(-2.2, 0.4, 1 - k) : -0.4 + Math.sin(clock * 3) * 0.08;
    const ax = x + 40, ay = y + 2 + bob;
    const hx = ax + Math.cos(ang) * 18, hy = ay + Math.sin(ang) * 18;
    ctx.beginPath(); ctx.moveTo(ax - 4, ay); ctx.lineTo(hx, hy); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x - 40, y + 2 + bob); ctx.lineTo(x - 52, y + 12 + bob); ctx.stroke();
    if (throwCD <= 0 && state !== 'over') drawCro(hx + 2, hy - 6, 32, -0.3);
  }

  function drawStamina(p, x, y, s) {
    const f = clamp(p.stam / p.stamMax, 0, 1);

    ctx.fillStyle = 'rgba(255,255,255,0.9)'; ctx.beginPath(); ctx.arc(x, y, r + 2, 0, TAU); ctx.fill();

  }

  function bubble(x, y, text, s, alpha = 1) {

  function drawFace(x, y, s, happy, kind) {

      ctx.strokeStyle = dark; ctx.lineWidth = 1.8 * s; ctx.lineCap = 'round';

    } else {
      ctx.fillStyle = dark;
      ctx.beginPath(); ctx.ellipse(x - 4.5 * s, y, 1.7 * s, 2.3 * s, 0, 0, TAU); ctx.ellipse(x + 4.5 * s, y, 1.7 * s, 2.3 * s, 0, 0, TAU); ctx.fill();

    ctx.beginPath(); ctx.ellipse(x - 8 * s, y + 3.5 * s, 2.6 * s, 1.6 * s, 0, 0, TAU); ctx.ellipse(x + 8 * s, y + 3.5 * s, 2.6 * s, 1.6 * s, 0, 0, TAU); ctx.fill();
  }

  function drawHead(p, x, y, s, happy) {
    const id = p.kind.id;
    if (id === 'dog' || id === 'cat') {
      const col = id === 'dog' ? '#C8925A' : '#F2A541';
      if (id === 'dog') {
        ctx.fillStyle = '#7A4A26';
        ctx.beginPath(); ctx.ellipse(x - 11 * s, y + 1 * s, 4.5 * s, 9 * s, 0.35, 0, TAU); ctx.ellipse(x + 11 * s, y + 1 * s, 4.5 * s, 9 * s, -0.35, 0, TAU); ctx.fill();
      } else {
        ctx.fillStyle = col;
        ctx.beginPath(); ctx.moveTo(x - 11 * s, y - 4 * s); ctx.lineTo(x - 9 * s, y - 16 * s); ctx.lineTo(x - 2 * s, y - 9 * s); ctx.fill();
        ctx.beginPath(); ctx.moveTo(x + 11 * s, y - 4 * s); ctx.lineTo(x + 9 * s, y - 16 * s); ctx.lineTo(x + 2 * s, y - 9 * s); ctx.fill();
        ctx.fillStyle = '#FFB3C0';
        ctx.beginPath(); ctx.moveTo(x - 9.5 * s, y - 6 * s); ctx.lineTo(x - 8.5 * s, y - 13 * s); ctx.lineTo(x - 4.5 * s, y - 9 * s); ctx.fill();
        ctx.beginPath(); ctx.moveTo(x + 9.5 * s, y - 6 * s); ctx.lineTo(x + 8.5 * s, y - 13 * s); ctx.lineTo(x + 4.5 * s, y - 9 * s); ctx.fill();
      }
      ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, y, 11.5 * s, 0, TAU); ctx.fill();
      if (id === 'cat') {
        ctx.strokeStyle = '#C97A1E'; ctx.lineWidth = 1.6 * s;
        ctx.beginPath(); ctx.moveTo(x - 3 * s, y - 11 * s); ctx.lineTo(x - 2 * s, y - 6 * s); ctx.moveTo(x + 3 * s, y - 11 * s); ctx.lineTo(x + 2 * s, y - 6 * s); ctx.stroke();
      }
      // snout
      ctx.fillStyle = id === 'dog' ? '#EBCB9F' : '#FFE3C2';
      ctx.beginPath(); ctx.ellipse(x, y + 5 * s, 6 * s, 4.2 * s, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = '#2A1A10';
      ctx.beginPath(); ctx.ellipse(x, y + 3 * s, 2.2 * s, 1.5 * s, 0, 0, TAU); ctx.fill();
      // eyes
      if (happy) {
        ctx.strokeStyle = '#2A1A10'; ctx.lineWidth = 1.8 * s; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.arc(x - 4.5 * s, y - 1 * s, 2.4 * s, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
        ctx.beginPath(); ctx.arc(x + 4.5 * s, y - 1 * s, 2.4 * s, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
      } else {
        ctx.fillStyle = '#2A1A10';
        ctx.beginPath(); ctx.arc(x - 4.5 * s, y - 2.5 * s, 1.9 * s, 0, TAU); ctx.arc(x + 4.5 * s, y - 2.5 * s, 1.9 * s, 0, TAU); ctx.fill();
      }
      if (id === 'cat') {
        ctx.strokeStyle = 'rgba(60,40,20,0.7)'; ctx.lineWidth = 0.8 * s;
        ctx.beginPath();
        ctx.moveTo(x - 5 * s, y + 5 * s); ctx.lineTo(x - 14 * s, y + 3 * s); ctx.moveTo(x - 5 * s, y + 6.5 * s); ctx.lineTo(x - 14 * s, y + 7.5 * s);
        ctx.moveTo(x + 5 * s, y + 5 * s); ctx.lineTo(x + 14 * s, y + 3 * s); ctx.moveTo(x + 5 * s, y + 6.5 * s); ctx.lineTo(x + 14 * s, y + 7.5 * s);
        ctx.stroke();
      }
      if (id === 'dog' && happy) {
        ctx.fillStyle = '#F07A8A'; ctx.beginPath(); ctx.ellipse(x, y + 9.5 * s, 2.2 * s, 3 * s, 0, 0, TAU); ctx.fill();
      }
      return;
    }
    // humans
    if (id === 'girl') {
      ctx.fillStyle = '#5A3420';
      ctx.beginPath(); ctx.arc(x - 12 * s, y + 2 * s, 4.5 * s, 0, TAU); ctx.arc(x + 12 * s, y + 2 * s, 4.5 * s, 0, TAU); ctx.fill();
    }
    ctx.fillStyle = '#FFD9B0'; ctx.beginPath(); ctx.arc(x, y, 12 * s, 0, TAU); ctx.fill();
    if (id === 'boy') {
      ctx.fillStyle = '#3A2414';
      ctx.beginPath(); ctx.arc(x, y - 1 * s, 12.4 * s, Math.PI * 1.02, Math.PI * 1.98); ctx.quadraticCurveTo(x, y - 7 * s, x - 12.2 * s, y - 2.5 * s); ctx.fill();
      ctx.beginPath(); ctx.moveTo(x + 1 * s, y - 12 * s); ctx.quadraticCurveTo(x + 4 * s, y - 17 * s, x + 6 * s, y - 14 * s); ctx.lineTo(x + 3 * s, y - 11 * s); ctx.fill();
    } else if (id === 'girl') {
      ctx.fillStyle = '#5A3420';
      ctx.beginPath(); ctx.arc(x, y - 1 * s, 12.6 * s, Math.PI * 1.0, Math.PI * 2.0); ctx.quadraticCurveTo(x + 4 * s, y - 6 * s, x, y - 5 * s); ctx.quadraticCurveTo(x - 4 * s, y - 6 * s, x - 12.6 * s, y - 1 * s); ctx.fill();
      ctx.fillStyle = '#FF5C8A';
      ctx.beginPath(); ctx.moveTo(x + 6 * s, y - 11 * s); ctx.lineTo(x + 1 * s, y - 15 * s); ctx.lineTo(x + 1 * s, y - 8 * s); ctx.closePath();
      ctx.moveTo(x + 6 * s, y - 11 * s); ctx.lineTo(x + 11 * s, y - 15 * s); ctx.lineTo(x + 11 * s, y - 7 * s); ctx.closePath(); ctx.fill();

      ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.beginPath(); ctx.ellipse(x - 4 * s, y - 8 * s, 3 * s, 1.6 * s, -0.4, 0, TAU); ctx.fill();

      ctx.beginPath(); ctx.arc(x - 4.5 * s, y + 1 * s, 3.4 * s, 0, TAU); ctx.moveTo(x + 7.9 * s, y + 1 * s); ctx.arc(x + 4.5 * s, y + 1 * s, 3.4 * s, 0, TAU); ctx.moveTo(x - 1.1 * s, y + 1 * s); ctx.lineTo(x + 1.1 * s, y + 1 * s); ctx.stroke();
      ctx.fillStyle = '#F2F2F2';
      ctx.beginPath(); ctx.ellipse(x - 3 * s, y + 5.5 * s, 3.4 * s, 1.6 * s, 0.2, 0, TAU); ctx.ellipse(x + 3 * s, y + 5.5 * s, 3.4 * s, 1.6 * s, -0.2, 0, TAU); ctx.fill();
    }
  }

  function drawPerson(p) {
    let s = persp(p.y) * 1.18;
    if (p.state === 'pop') s *= clamp(p.t / 0.35, 0.1, 1);
    const happy = p.state === 'pull' || p.state === 'safe' || p.state === 'dolphin';
    const animal = p.kind.id === 'dog' || p.kind.id === 'cat';
    const bobY = Math.sin(clock * 3 + p.phase) * 2.2 * s;
    let x = p.x, y = p.y + bobY;
    ctx.save(); ctx.globalAlpha = p.alpha;

    if (p.state === 'safe') {
      // standing on the pier, cheering
      const hop = Math.abs(Math.sin(p.t * 9)) * (p.t < 0.9 ? 8 : 3);
      y = p.y - hop;
      ctx.fillStyle = 'rgba(80,45,15,0.3)'; ctx.beginPath(); ctx.ellipse(x, p.y + 16, 12, 3.5, 0, 0, TAU); ctx.fill();
      if (animal) {
        ctx.fillStyle = p.kind.id === 'dog' ? '#C8925A' : '#F2A541';
        ctx.beginPath(); ctx.ellipse(x, y + 6, 13, 8, 0, 0, TAU); ctx.fill();
        ctx.strokeStyle = ctx.fillStyle; ctx.lineWidth = 3.5; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(x - 8, y + 10); ctx.lineTo(x - 9, y + 16); ctx.moveTo(x + 8, y + 10); ctx.lineTo(x + 9, y + 16);
        ctx.moveTo(x - p.dir * 12, y + 4); ctx.quadraticCurveTo(x - p.dir * 20, y - 2 + Math.sin(clock * 20) * 3, x - p.dir * 18, y - 8); ctx.stroke();
        drawHead(p, x + p.dir * 9, y - 6, 1, true);
      } else {
        ctx.strokeStyle = '#3A3A55'; ctx.lineWidth = 4; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(x - 4, y + 6); ctx.lineTo(x - 5, y + 16); ctx.moveTo(x + 4, y + 6); ctx.lineTo(x + 5, y + 16); ctx.stroke();
        ctx.fillStyle = p.kind.shirt; rr(x - 9, y - 9, 18, 17, 6); ctx.fill();
        ctx.strokeStyle = '#FFD9B0'; ctx.lineWidth = 4;
        const wv = Math.sin(clock * 14) * 4;
        ctx.beginPath(); ctx.moveTo(x - 8, y - 6); ctx.lineTo(x - 15, y - 20 + wv); ctx.moveTo(x + 8, y - 6); ctx.lineTo(x + 15, y - 20 - wv); ctx.stroke();
        drawHead(p, x, y - 19, 0.95, true);
      }
      if (p.t < 1.6) bubble(x, y - 34, 'ありがとう！', 1);
      ctx.restore();
      return;
    }

    if (p.state === 'dolphin') {
      const jump = Math.abs(Math.sin(p.t * 6)) * 10 * s;
      y = p.y - jump;
      // dolphin
      ctx.save(); ctx.translate(x, y + 6 * s); ctx.scale(p.dir, 1);
      ctx.fillStyle = '#6FA8DC';
      ctx.beginPath(); ctx.ellipse(0, 0, 30 * s, 9 * s, 0, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-28 * s, 0); ctx.lineTo(-40 * s, -8 * s); ctx.lineTo(-38 * s, 6 * s); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-6 * s, -7 * s); ctx.lineTo(-14 * s, -17 * s); ctx.lineTo(4 * s, -8 * s); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.ellipse(32 * s, 2 * s, 7 * s, 3.5 * s, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = '#D6ECFA'; ctx.beginPath(); ctx.ellipse(6 * s, 4 * s, 20 * s, 4 * s, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = '#142849'; ctx.beginPath(); ctx.arc(22 * s, -2 * s, 1.8 * s, 0, TAU); ctx.fill();
      ctx.strokeStyle = '#142849'; ctx.lineWidth = 1 * s; ctx.beginPath(); ctx.arc(30 * s, 2 * s, 4 * s, 0.2, 1.4); ctx.stroke();
      ctx.restore();
      ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.beginPath(); ctx.ellipse(x - p.dir * 34 * s, p.y + 8 * s, 10 * s, 3 * s, 0, 0, TAU); ctx.fill();
      drawHead(p, x - p.dir * 4 * s, y - 10 * s, s, true);
      ctx.restore();
      return;
    }

    // in the water
    const urgent = D.stam && (p.stam / p.stamMax) < 0.3;
    const rip = (clock * 0.8 + p.phase) % 1;
    ctx.strokeStyle = 'rgba(255,255,255,' + (0.6 * (1 - rip)) + ')'; ctx.lineWidth = 1.5 * s;
    ctx.beginPath(); ctx.ellipse(x, p.y + 2 * s, (18 + rip * 14) * s, (5 + rip * 4) * s, 0, 0, TAU); ctx.stroke();

    const held = p.state === 'pull';
    if (held) drawCro(x, y + 1 * s, 50 * s, Math.sin(clock * 4 + p.phase) * 0.06);

    if (!animal) {
      // body
      ctx.fillStyle = p.kind.shirt; ctx.beginPath(); ctx.ellipse(x, y - 4 * s, 11 * s, 8 * s, 0, 0, TAU); ctx.fill();
      // arms
      ctx.strokeStyle = '#FFD9B0'; ctx.lineWidth = 4.5 * s; ctx.lineCap = 'round';
      if (held) {
        ctx.beginPath(); ctx.moveTo(x - 9 * s, y - 6 * s); ctx.lineTo(x - 16 * s, y - 1 * s); ctx.moveTo(x + 9 * s, y - 6 * s); ctx.lineTo(x + 16 * s, y - 1 * s); ctx.stroke();
      } else {
        const sp = urgent ? 14 : 8;
        const w1 = Math.sin(clock * sp + p.phase), w2 = Math.sin(clock * sp + p.phase + 2);
        const lh = { x: x - 18 * s + w1 * 5 * s, y: y - 32 * s + Math.abs(w1) * 3 * s };
        const rh = { x: x + 18 * s + w2 * 5 * s, y: y - 32 * s + Math.abs(w2) * 3 * s };
        ctx.beginPath(); ctx.moveTo(x - 8 * s, y - 8 * s); ctx.lineTo(lh.x, lh.y); ctx.moveTo(x + 8 * s, y - 8 * s); ctx.lineTo(rh.x, rh.y); ctx.stroke();
        ctx.fillStyle = '#FFD9B0';
        ctx.beginPath(); ctx.arc(lh.x, lh.y, 3.4 * s, 0, TAU); ctx.arc(rh.x, rh.y, 3.4 * s, 0, TAU); ctx.fill();
      }
    } else if (!held) {
      // paddling paws
      const pw = Math.sin(clock * 10 + p.phase) * 3 * s;
      ctx.fillStyle = p.kind.id === 'dog' ? '#C8925A' : '#F2A541';
      ctx.beginPath(); ctx.ellipse(x - 10 * s, y - 1 * s + pw, 4 * s, 3 * s, 0, 0, TAU); ctx.ellipse(x + 10 * s, y - 1 * s - pw, 4 * s, 3 * s, 0, 0, TAU); ctx.fill();
    }
    // front water
    if (!held) {
      ctx.fillStyle = 'rgba(56,160,210,0.92)';
      ctx.beginPath(); ctx.ellipse(x, y + 2 * s, 17 * s, 5 * s, 0, 0, TAU); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 1.6 * s;
      ctx.beginPath(); ctx.ellipse(x, y + 2 * s, 17 * s, 5 * s, 0, Math.PI * 1.05, Math.PI * 1.95); ctx.stroke();
    }
    const hy = animal ? y - 13 * s : y - 19 * s;
    drawHead(p, x, hy, s, held);
    ctx.restore();

    if (!held && (p.state === 'swim' || p.state === 'pop')) {
      if (D.stam && state !== 'title') drawStamina(p, x + 17 * s, hy - 12 * s, s);
      if (state !== 'title' && (p.talk > 0 || urgent)) bubble(x, hy - 16 * s, urgent ? 'はやく〜！' : p.kind.cry, s);
    }
  }

  function drawFloatCro(c) {
    const s = persp(c.y);
    const a = c.state === 'sink' ? clamp(c.life / 0.7, 0, 1) : 1;
    const bob = Math.sin(clock * 3 + c.phase) * 1.5 * s;
    const rip = (clock * 0.7 + c.phase) % 1;
    ctx.strokeStyle = 'rgba(255,255,255,' + (0.55 * (1 - rip) * a) + ')'; ctx.lineWidth = 1.4 * s;
    ctx.beginPath(); ctx.ellipse(c.x, c.y + 2 * s, (24 + rip * 12) * s, (6 + rip * 3) * s, 0, 0, TAU); ctx.stroke();
    const sinkY = c.state === 'sink' ? (1 - a) * 6 * s : 0;
    drawCro(c.x, c.y + bob + sinkY, 46 * s, 0, a);
    if (c.state === 'float' && c.life < 1.5) {
      // blink to show it will go away soon
      if (Math.floor(clock * 6) % 2 === 0) { ctx.fillStyle = 'rgba(255,255,255,0.25)'; ctx.beginPath(); ctx.ellipse(c.x, c.y + bob, 23 * s, 12 * s, 0, 0, TAU); ctx.fill(); }
    }
  }

  function drawFlyCro(c) {
    const s = persp(c.y);
    // shadow
    ctx.fillStyle = 'rgba(10,50,90,0.25)';
    ctx.beginPath(); ctx.ellipse(c.x, c.y + 2 * s, 18 * s, 5 * s, 0, 0, TAU); ctx.fill();
    drawCro(c.x, c.y - c.z, 46 * s * (1 + c.z / 400), c.rot);
  }

  function drawRope(p) {
    if (p.state !== 'pull') return;
    const s = persp(p.y);
    ctx.strokeStyle = '#F5EBD0'; ctx.lineWidth = 2;
    ctx.setLineDash([5, 3]);
    const hx = PLAYER.x + 52, hy = PLAYER.y - 10;
    ctx.beginPath(); ctx.moveTo(hx, hy); ctx.quadraticCurveTo((hx + p.x) / 2, (hy + p.y) / 2 + 20, p.x + 18 * s, p.y); ctx.stroke();
    ctx.setLineDash([]);
  }

  function drawGuide() {
    if (state !== 'play' && state !== 'count') return;
    let sh = null;
    if (aim) sh = shotFromPull(aim);
    else if (kb.active) sh = shotFromAngle(kb.a, kb.p);
    if (aim) {
      // the pull band where the finger is
      ctx.strokeStyle = 'rgba(255,253,246,0.8)'; ctx.lineWidth = 3; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(aim.sx, aim.sy); ctx.lineTo(aim.cx, aim.cy); ctx.stroke();
      ctx.fillStyle = 'rgba(255,253,246,0.5)'; ctx.beginPath(); ctx.arc(aim.sx, aim.sy, 9, 0, TAU); ctx.fill();
      ctx.fillStyle = '#E8A53E'; ctx.strokeStyle = '#1F3A68'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(aim.cx, aim.cy, 11, 0, TAU); ctx.fill(); ctx.stroke();
    }
    if (!sh) return;
    const sx = PLAYER.x + 16, sy = PLAYER.y - 34;
    const dist = Math.hypot(sh.x - sx, sh.y - sy);
    const hgt = 30 + dist * 0.3;
    const upto = D.guide === 2 ? 1 : D.guide === 1 ? 0.42 : 0.14;
    const n = 22;
    for (let i = 1; i <= n; i++) {
      const k = i / n;
      if (k > upto) break;
      const x = lerp(sx, sh.x, k), y = lerp(sy, sh.y, k) - 4 * hgt * k * (1 - k);
      const s = persp(lerp(sy, sh.y, k));
      ctx.fillStyle = 'rgba(255,255,255,' + (0.95 - k * 0.4) + ')';
      ctx.beginPath(); ctx.arc(x, y, 3.2 * s + 0.6, 0, TAU); ctx.fill();
    }
    if (D.guide === 2) {
      const s = persp(sh.y);
      ctx.strokeStyle = 'rgba(255,255,255,0.95)'; ctx.lineWidth = 2.5;
      ctx.setLineDash([6, 4]);
      ctx.beginPath(); ctx.ellipse(sh.x, sh.y, D.catchR * s, D.catchR * s / 1.25, 0, 0, TAU); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = 'rgba(255,225,77,0.9)'; ctx.beginPath(); ctx.arc(sh.x, sh.y, 3.5, 0, TAU); ctx.fill();
    }
    // power meter next to the player
    const mx = PLAYER.x - 62, my = PLAYER.y - 44, mh = 50;
    ctx.fillStyle = 'rgba(20,40,73,0.75)'; rr(mx - 5, my - 2, 10, mh + 4, 5); ctx.fill();
    const ph = mh * sh.pow;
    ctx.fillStyle = sh.pow > 0.8 ? '#D83A4E' : sh.pow > 0.45 ? '#E8A53E' : '#4CBB5E';
    rr(mx - 3, my + mh - ph, 6, ph, 3); ctx.fill();
  }

  function drawFx() {
    for (const f of fx) {
      if (f.t < 0) continue;
      const k = f.t / f.life;
      if (f.type === 'splash') {
        const s = f.s;
        ctx.strokeStyle = 'rgba(255,255,255,' + (1 - k) + ')'; ctx.lineWidth = 2 * s;
        ctx.beginPath(); ctx.ellipse(f.x, f.y, (10 + k * 30) * s, (3 + k * 9) * s, 0, 0, TAU); ctx.stroke();
        ctx.fillStyle = 'rgba(255,255,255,' + (1 - k) + ')';
        for (let i = 0; i < 6; i++) {
          const a = (i / 6) * Math.PI + Math.PI;
          const r = (8 + k * 22) * s;
          const dx = Math.cos(a) * r, dy = Math.sin(a) * r * 0.8 - (1 - (2 * k - 1) ** 2) * 10 * s;
          ctx.beginPath(); ctx.arc(f.x + dx, f.y + dy, 2.4 * s, 0, TAU); ctx.fill();
        }
      } else if (f.type === 'text') {
        if (!f.text) continue;
        ctx.save();
        ctx.globalAlpha = k < 0.7 ? 1 : 1 - (k - 0.7) / 0.3;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        const sc = k < 0.15 ? 0.6 + k / 0.15 * 0.4 : 1;
        const fs = f.size * sc;
        const tx = clamp(f.x, VL + 70, VR - 70);
        outlined(f.text, tx, f.y - k * 26, fs, f.color, '#142849', FD, 4);
        ctx.restore();
      }
    }
  }

  function drawHUD() {
    if (state === 'title') return;
    ctx.textBaseline = 'middle';
    const top = Math.max(VT + 10, 8);
    // score
    ctx.fillStyle = 'rgba(20,40,73,0.88)'; ctx.strokeStyle = '#FFFDF6'; ctx.lineWidth = 2;
    rr(10, top, 118, 44, 12); ctx.fill(); ctx.stroke();
    ctx.textAlign = 'left'; ctx.fillStyle = '#FFFDF6'; ctx.font = '800 10px ' + FB; ctx.fillText('とくてん', 20, top + 12);
    ctx.fillStyle = '#E8A53E'; ctx.font = '22px ' + FD; ctx.fillText(score.toLocaleString(), 20, top + 30);
    // timer
    const sec = Math.ceil(timeLeft);
    ctx.fillStyle = sec <= 10 && state === 'play' ? '#D83A4E' : 'rgba(20,40,73,0.88)';
    ctx.beginPath(); ctx.arc(W / 2, top + 22, 24, 0, TAU); ctx.fill(); ctx.strokeStyle = '#FFFDF6'; ctx.stroke();
    ctx.textAlign = 'center'; ctx.fillStyle = '#FFFDF6'; ctx.font = '20px ' + FD; ctx.fillText(String(sec), W / 2, top + 21);
    ctx.font = '800 8px ' + FB; ctx.fillText('のこり', W / 2, top + 38);
    // right box: lives + saved
    ctx.fillStyle = 'rgba(20,40,73,0.88)';
    rr(W - 128, top, 118, 44, 12); ctx.fill(); ctx.stroke();
    ctx.textAlign = 'right';
    if (D.lives) {
      for (let i = 0; i < D.lives; i++) {
        const hx = W - 24 - i * 22, hy = top + 13;
        heart(hx, hy, 8, i < lives ? '#FF5C70' : 'rgba(255,255,255,0.25)');
      }
    } else {
      ctx.fillStyle = '#FFFDF6'; ctx.font = '800 10px ' + FB; ctx.fillText('ミスなし', W - 20, top + 13);
    }
    ctx.fillStyle = '#FFFDF6'; ctx.font = '800 10px ' + FB; ctx.textAlign = 'left'; ctx.fillText('たすけた', W - 118, top + 32);
    ctx.textAlign = 'right'; ctx.fillStyle = '#E8A53E'; ctx.font = '18px ' + FD; ctx.fillText(saved + 'にん', W - 18, top + 31);
    // wind
    if (D.wind) {
      const a = Math.abs(wind), n = a < 6 ? 0 : a < D.wind * 0.45 ? 1 : a < D.wind * 0.8 ? 2 : 3;
      const arrow = n === 0 ? 'なし' : (wind < 0 ? '←'.repeat(n) : '→'.repeat(n));
      const txt = 'かぜ ' + arrow;
      ctx.font = '800 12px ' + FB; const tw = ctx.measureText(txt).width + 18;
      ctx.fillStyle = 'rgba(255,253,246,0.92)'; rr(W / 2 - tw / 2, top + 52, tw, 22, 11); ctx.fill();
      ctx.fillStyle = n >= 2 ? '#D83A4E' : '#1F3A68'; ctx.textAlign = 'center'; ctx.fillText(txt, W / 2, top + 63.5);
    }
    if (combo >= 2 && state === 'play') {
      ctx.textAlign = 'left';
      outlined(combo + ' れんぞく', 14, top + 62, 14, '#FFB547', '#142849', FD, 3.5);
    }
  }

  function heart(x, y, r, col) {
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.moveTo(x, y + r * 0.9);
    ctx.bezierCurveTo(x - r * 1.4, y - r * 0.1, x - r * 0.7, y - r * 1.1, x, y - r * 0.35);
    ctx.bezierCurveTo(x + r * 0.7, y - r * 1.1, x + r * 1.4, y - r * 0.1, x, y + r * 0.9);
    ctx.fill();
  }

  function drawOverlayText() {
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    if (state === 'count') {
      const n = Math.ceil(countT);
      const k = countT - Math.floor(countT);
      outlined(String(n), W / 2, 300, 70 + k * 20, '#FFE14D', '#142849', FD, 7);
      outlined('したに ひっぱって はなすと なげるよ！', W / 2, 370, 15, '#FFFFFF', '#142849', FB, 4);
    } else if (state === 'play' && elapsed < 0.8) {
      outlined('スタート！', W / 2, 300, 46, '#FFE14D', '#142849', FD, 7);
    }
    if (state === 'play' && hintT > 0) {
      ctx.save(); ctx.globalAlpha = Math.min(1, hintT);
      const txt = '↓ したに ひっぱって、はなしてね！';
      ctx.font = '800 14px ' + FB; const tw = ctx.measureText(txt).width + 28;
      ctx.fillStyle = 'rgba(20,40,73,0.9)'; rr(W / 2 - tw / 2, 488, tw, 34, 17); ctx.fill();
      ctx.strokeStyle = '#FFFDF6'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = '#FFFDF6'; ctx.fillText(txt, W / 2, 505);
      ctx.restore();
    }
    if (state === 'play' && kb.active && !aim && elapsed < 6) {
      outlined('←→ むき  ↑↓ つよさ  スペース なげる', W / 2, 530, 12, '#FFFFFF', '#142849', FB, 3);
    }
    if (state === 'play' && timeLeft <= 5 && timeLeft > 0) {
      ctx.save(); ctx.globalAlpha = 0.5;
      outlined(String(Math.ceil(timeLeft)), W / 2, 260, 80, '#FFFFFF', '#142849', FD, 6);
      ctx.restore();
    }
  }

  function render() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, cw, ch);
    ctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * ox, dpr * oy);
    drawBackground();
    // water layer sorted by depth
    const items = [];
    for (const p of people) if (p.state !== 'safe') items.push([p.y, () => drawPerson(p)]);
    for (const c of cros) if (c.state === 'float' || c.state === 'sink') items.push([c.y - 1, () => drawFloatCro(c)]);
    items.sort((a, b) => a[0] - b[0]);
    items.forEach(i => i[1]());
    drawPier();
    for (const p of people) if (p.state === 'safe') drawPerson(p);
    drawPlayer();
    for (const p of people) drawRope(p);
    for (const c of cros) if (c.state === 'fly') drawFlyCro(c);
    drawFx();
    drawGuide();
    drawHUD();
    drawOverlayText();
  }

  // title screen demo: a few swimmers bobbing in the background
  function demoSpawn() {
    const spots = [[90, 230, 0], [300, 180, 3], [220, 380, 1], [120, 440, 4]];
    for (const [x, y, ki] of spots) people.push({ kind: KINDS[ki], x, y, vx: 0, phase: rand(0, TAU), stam: 1, stamMax: 1, state: 'swim', t: 0, talk: 0, talkCycle: 4, dir: 1, alpha: 1 });
  }
  demoSpawn();

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>

</html>
