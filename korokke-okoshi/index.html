<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style data-fix="hidden">[hidden]{display:none!important}</style>
<title>コロッケおこしたい</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: one-screen game. Canvas = 台所のテーブルにならんだコロッケ。DOM panels float on top. */
:root {
  --ai: #1F3A68;
  --ai-deep: #142849;
  --koromo: #E8A53E;
  --koromo-dark: #7A4210;
  --sauce: #4A1F0E;
  --paper: #FFFDF6;
  --beni: #D83A4E;
  --font-display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  --font-body: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  color-scheme: light;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  background: #3A2416;
  color: var(--ai-deep);
  font-family: var(--font-body);
  overflow: hidden;
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
}
#app { position: relative; width: 100%; height: 100%; touch-action: manipulation; }
canvas { display: block; width: 100%; height: 100%; touch-action: none; }
canvas.mouse { cursor: none; }

.panel {
  position: absolute; left: 50%; top: 50%;
  transform: translate(-50%, -50%);
  width: min(350px, calc(100% - 32px));
  max-height: calc(100% - 32px); overflow-y: auto;
  background: var(--paper);
  border: 3px solid var(--ai);
  border-radius: 20px;
  box-shadow: 6px 6px 0 var(--ai);
  padding: 20px 18px 18px;
  display: flex; flex-direction: column; align-items: center; gap: 11px;
  text-align: center;
  box-sizing: border-box;
}
.panel h1 {
  margin: 0; font-family: var(--font-display); font-weight: 400;
  font-size: 2.1rem; line-height: 1.15; color: var(--ai);
  text-wrap: balance; letter-spacing: 0.02em;
}
.panel h1 small { display: block; font-size: 0.9rem; color: var(--koromo-dark); letter-spacing: 0.15em; margin-bottom: 4px; }
.panel h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 1.7rem; color: var(--ai); text-wrap: balance; }
.panel p { margin: 0; font-size: 0.95rem; line-height: 1.7; font-weight: 500; }
.how { display: grid; gap: 6px; width: 100%; font-size: 0.86rem; line-height: 1.55; text-align: left; padding: 10px 12px; background: #F3EEE2; border-radius: 12px; box-sizing: border-box; }
.how b { color: var(--beni); }
kbd {
  font-family: var(--font-body); font-weight: 800; font-size: 0.76rem;
  border: 2px solid var(--ai); border-bottom-width: 3px; border-radius: 6px; padding: 0 5px; background: #fff;
}
.diffs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; }
.diff {
  font-family: var(--font-body); font-weight: 800; font-size: 1rem; color: var(--ai);
  background: #fff; border: 2px solid var(--ai); border-radius: 14px;
  padding: 7px 4px 6px; cursor: pointer; line-height: 1.2;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
}
.diff small { font-size: 0.68rem; font-weight: 500; color: var(--koromo-dark); }
.diff .best { font-size: 0.66rem; font-weight: 800; color: var(--ai); opacity: .75; }
.diff[aria-pressed="true"] { background: var(--koromo); box-shadow: inset 0 0 0 2px var(--ai); }
.diff[aria-pressed="true"] small { color: var(--ai-deep); }
.diff.oni[aria-pressed="true"] { background: var(--beni); color: var(--paper); }
.diff.oni[aria-pressed="true"] small, .diff.oni[aria-pressed="true"] .best { color: var(--paper); }
.btn {
  font-family: var(--font-display); font-size: 1.3rem; color: var(--ai-deep);
  background: var(--koromo); border: 3px solid var(--ai); border-radius: 999px;
  padding: 10px 34px; box-shadow: 0 5px 0 var(--ai); cursor: pointer;
  transition: transform .08s, box-shadow .08s;
}
.btn.sub { font-size: 0.95rem; padding: 6px 20px; background: #fff; box-shadow: 0 3px 0 var(--ai); }
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--ai); }
.btn:focus-visible, .sound:focus-visible, .diff:focus-visible { outline: 3px solid var(--beni); outline-offset: 3px; }
.big { font-family: var(--font-display); font-size: 2.6rem; color: var(--beni); line-height: 1; }
.rank { font-family: var(--font-display); font-size: 1.15rem; color: var(--ai); }
.stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; width: 100%; }
.stats div { background: #F3EEE2; border-radius: 10px; padding: 6px 2px; font-size: 0.7rem; font-weight: 800; color: var(--koromo-dark); }
.stats b { display: block; font-family: var(--font-display); font-weight: 400; font-size: 1.25rem; color: var(--ai); }
.note { font-size: 0.85rem; font-weight: 800; color: var(--koromo-dark); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center; }

.sound {
  position: absolute;
  right: max(12px, calc(env(safe-area-inset-right, 0px) + 12px));
  top: max(12px, calc(env(safe-area-inset-top, 0px) + 12px));
  font-family: var(--font-body); font-weight: 800; font-size: 0.8rem;
  background: var(--paper); color: var(--ai); border: 2px solid var(--ai);
  border-radius: 999px; padding: 5px 12px; cursor: pointer;
}
</style>

<div id="app">
  <canvas id="cv"></canvas>

  <div class="panel" id="titlePanel">
    <h1><small>ねむいの だめ！</small>コロッケ<br>おこしたい</h1>
    <div class="how">
      <div>コロッケが <b>うとうと</b>（目がとろーん＆Zzz）してきたら、<b>タップ</b>して ソースをかけて おこそう！</div>
      <div>ねむる まぎわに おこすと <b>ギリギリボーナス</b>。おきてる子に かけると おこられるよ。</div>
      <div><b>ナイトキャップ</b>の子は 3回、<b>金のコロッケ</b>は 大チャンス。むずかしいでは <b>あくび</b>（目がぱっちり）に だまされないで！</div>
      <div>PC：マウスでクリック ／ テンキー <kbd>1</kbd>〜<kbd>9</kbd> でも かけられる</div>
    </div>
    <div class="diffs" id="diffs"></div>
    <button class="btn" id="startBtn">スタート</button>
  </div>

  <div class="panel" id="overPanel" hidden>
    <h2 id="overHead">おしまい！</h2>
    <div class="big" id="overScore">0</div>
    <div class="rank" id="overRank"></div>
    <div class="stats">
      <div>おこした<b id="stWoke">0</b></div>
      <div>ギリギリ<b id="stClose">0</b></div>
      <div>さいこう<br>れんぞく<b id="stCombo">0</b></div>
    </div>
    <div class="note" id="overBest"></div>
    <div class="row">
      <button class="btn" id="retryBtn">もういっかい</button>
      <button class="btn sub" id="menuBtn">むずかしさを かえる</button>
    </div>
  </div>

  <button class="sound" id="soundBtn" type="button" aria-pressed="true">音：オン</button>
</div>

        x: cellW * (c + 0.5), y: TOP + cellH * (r + 0.56),

        st: 'awake', t: 0, cd: rand(0.5, 2), m: 0, dur: 3, kind: 'normal', taps: 1, tapsMax: 1,
        blink: rand(1, 4), bob: rand(0, TAU), stains: [], hint: false, shakeT: 0, snoreT: 0,
      });
    }
  }

  const progress = () => clamp(playT / ROUND, 0, 1);
  function curDur() { return lerp(D.dur[0], D.dur[1], progress()); }
  function curGap() { return lerp(D.gap[0], D.gap[1], progress()); }
  function curMax() { return Math.round(lerp(D.max[0], D.max[1], progress())); }

  function startGame() {
    D = DIFFS[diffIdx];
    layout();
    score = 0; shownScore = 0; combo = 0; maxCombo = 0; woke = 0; closeCalls = 0;
    lives = D.lives; spawnT = 0.6; playT = 0; shake = 0; flash = 0;
    hintLeft = diffIdx <= 1 ? 2 : 0;
    floats = []; parts = []; pours = [];
    state = 'count'; stT = 0; lastCount = -1;
    $('titlePanel').hidden = true; $('overPanel').hidden = true;
    audio();
  }

  function endGame(reason) {
    state = 'over'; stT = 0;
    const prev = best[D.id] || 0;
    const isBest = score > prev;
    if (isBest) { best[D.id] = score; store.set('korokke-okoshi-best', best); }
    reason === 'time' ? sfx.end() : sfx.lose();
    setTimeout(() => {
      if (state !== 'over') return;
      $('overHead').textContent = reason === 'time' ? 'タイムアップ！' : 'みんな ねちゃった…';
      $('overScore').textContent = score.toLocaleString() + ' てん';
      const ratio = score / D.target;
      const ri = ratio >= 1 ? 4 : ratio >= 0.7 ? 3 : ratio >= 0.45 ? 2 : ratio >= 0.2 ? 1 : 0;
      $('overRank').textContent = D.name + '：' + RANKS[ri];
      $('stWoke').textContent = woke; $('stClose').textContent = closeCalls; $('stCombo').textContent = maxCombo;
      $('overBest').textContent = isBest ? 'じこベスト こうしん！' : 'じこベスト ' + prev.toLocaleString() + ' てん';
      $('overPanel').hidden = false;
      $('retryBtn').focus({ preventScroll: true });
    }, 1100);
  }

  // ---------- spawning ----------
  function spawn() {
    const active = cells.filter(c => c.st === 'drowsy' || c.st === 'yawn').length;
    if (active >= curMax()) return;
    const free = cells.filter(c => c.st === 'awake' && c.cd <= 0);
    if (!free.length) return;
    const c = free[Math.floor(Math.random() * free.length)];
    const r = Math.random();
    if (D.fake && r < D.fake) {
      c.st = 'yawn'; c.t = 0; c.dur = rand(1.3, 1.7); sfx.yawn();
      return;
    }
    c.st = 'drowsy'; c.t = 0; c.m = 0;
    const r2 = Math.random();
    if (playT > 4 && r2 < D.gold) { c.kind = 'gold'; c.dur = curDur() * 0.75; c.taps = c.tapsMax = 1; }
    else if (playT > 6 && r2 < D.gold + D.cap) { c.kind = 'cap'; c.dur = curDur() * 1.7; c.taps = c.tapsMax = 3; }
    else { c.kind = 'normal'; c.dur = curDur() * rand(0.9, 1.1); c.taps = c.tapsMax = 1; }
    if (hintLeft > 0) { c.hint = true; hintLeft--; }
  }

  function addFloat(x, y, text, color, size = 22) { floats.push({ x, y, text, color, size, t: 0 }); }
  function burst(x, y, color, n, spd = 160) {
    for (let i = 0; i < n; i++) {
      const a = rand(0, TAU), s = rand(spd * 0.4, spd);
      parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 60, life: rand(0.4, 0.8), t: 0, color, r: rand(2, 4.5), g: 300 });
    }
  }

  // ---------- tapping ----------
  function pour(c) {
    pours.push({ c, t: 0 });
    sfx.pour(); buzz(12);
  }
  function tapCell(c) {
    if (state !== 'play') return;
    if (c.st === 'drowsy') {
      pour(c);
      c.hint = false;
      c.taps--;
      if (c.taps > 0) {
        c.m = Math.max(0, c.m - 0.22);
        c.shakeT = 0.3;
        sfx.partial();
        addFloat(c.x, c.y - c.h - 6, 'あと' + c.taps + 'かい！', '#1F3A68', 18);
        return;
      }
      const isClose = c.m >= 0.75;
      const base = c.kind === 'gold' ? 500 : c.kind === 'cap' ? 250 : 100;
      combo++; maxCombo = Math.max(maxCombo, combo); woke++;
      let pts = Math.round(base * (1 + Math.min(combo, 20) * 0.05));
      if (isClose) { pts = Math.round(pts * 1.5); closeCalls++; }
      score += pts;
      c.st = 'woke'; c.t = 0;
      sfx.wake(combo);
      if (isClose) { sfx.close(); addFloat(c.x, c.y - c.h - 30, 'ギリギリ！', '#D83A4E', 20); }
      if (c.kind === 'gold') { sfx.gold(); burst(c.x, c.y - c.h * 0.3, '#FFD43B', 26, 220); flash = 0.25; }
      burst(c.x, c.y - c.h * 0.3, '#FFF3B0', 10, 140);
      addFloat(c.x, c.y - c.h - 6, '+' + pts, c.kind === 'gold' ? '#B8860B' : '#E8A53E', 24);
      if (combo >= 3 && combo % 5 === 0) addFloat(W / 2, TOP + 20, combo + ' れんぞく！', '#1F3A68', 26);
    } else if (c.st === 'asleep') {
      pour(c);
      score += 20; c.st = 'woke'; c.t = 0;
      sfx.wake(0);
      addFloat(c.x, c.y - c.h - 6, 'やっと おきた +20', '#7A4210', 16);
    } else if (c.st === 'yawn' || c.st === 'awake') {
      pour(c);
      c.st = 'grumpy'; c.t = 0; c.cd = 0.8;
      combo = 0;
      sfx.angry(); buzz(40);
      const pen = D.missPen;
      if (pen) score = Math.max(0, score - pen);
      addFloat(c.x, c.y - c.h - 6, c.st === 'grumpy' && pen ? 'おきてるよ！ -' + pen : 'おきてるよ〜', '#D83A4E', 18);
      if (D.mistakeHurts) loseLife(c);
    }
    // woke / grumpy: ignore extra taps
  }
  function loseLife(c) {
    if (!D.lives) return;
    lives--; shake = 0.4;
    if (lives <= 0) endGame('lives');
  }

  function cellAt(wx, wy) {
    let bestC = null, bd = Infinity;
    for (const c of cells) {
      if (Math.abs(wx - c.x) > c.cw / 2 || wy < c.y - c.chh * 0.66 || wy > c.y + c.chh * 0.44) continue;
      const d = Math.hypot(wx - c.x, wy - (c.y - c.h * 0.3));
      if (d < bd) { bd = d; bestC = c; }
    }
    return bestC;
  }
  function toWorld(e) {
    const r = cv.getBoundingClientRect();
    return { x: (e.clientX - r.left - ox) / scale, y: (e.clientY - r.top - oy) / scale };
  }
  cv.addEventListener('pointerdown', e => {
    e.preventDefault();
    const p = toWorld(e);
    const c = cellAt(p.x, p.y);
    if (c) tapCell(c);
  });
  cv.addEventListener('pointermove', e => {
    if (e.pointerType !== 'mouse') { mouse.on = false; cv.classList.remove('mouse'); return; }
    const p = toWorld(e); mouse.on = true; mouse.x = p.x; mouse.y = p.y;
    cv.classList.toggle('mouse', state === 'play' || state === 'count');
  });
  cv.addEventListener('pointerleave', () => { mouse.on = false; });

  const KEYMAP = { '7': [0, 0], '8': [1, 0], '9': [2, 0], '4': [0, 1], '5': [1, 1], '6': [2, 1], '1': [0, 2], '2': [1, 2], '3': [2, 2] };
  window.addEventListener('keydown', e => {
    if (state === 'play' && KEYMAP[e.key]) {
      // Numpad layout maps to the bottom-aligned 3x3 block of the grid
      const [col, rowFromTop] = KEYMAP[e.key];
      const rows = D.rows;
      let row = rowFromTop + (rows - 3);
      if (rows < 3) row = rowFromTop - (3 - rows);
      if (row < 0 || row >= rows || col >= D.cols) return;
      tapCell(cells[row * D.cols + col]);
      e.preventDefault();
    } else if ((e.key === 'Enter' || e.key === ' ') && state === 'title' && document.activeElement === document.body) {
      startGame(); e.preventDefault();
    }
  });

  // ---------- title UI ----------
  const diffsEl = $('diffs');
  function renderDiffs() {
    diffsEl.innerHTML = '';
    DIFFS.forEach((d, i) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'diff' + (d.id === 'oni' ? ' oni' : '');
      b.setAttribute('aria-pressed', String(i === diffIdx));
      b.innerHTML = d.name + '<small>' + d.sub + '</small>' + (best[d.id] ? '<span class="best">ベスト ' + best[d.id].toLocaleString() + '</span>' : '');
      b.addEventListener('click', () => { diffIdx = i; store.set('korokke-okoshi-diff', i); D = DIFFS[i]; layout(); renderDiffs(); sfx.partial(); });
      diffsEl.appendChild(b);
    });
  }
  renderDiffs();
  layout();
  $('startBtn').addEventListener('click', startGame);
  $('retryBtn').addEventListener('click', startGame);
  $('menuBtn').addEventListener('click', () => {
    state = 'title'; $('overPanel').hidden = true; renderDiffs(); layout(); $('titlePanel').hidden = false;
  });

  // ---------- update ----------
  let lastCount = -1;
  function update(dt) {
    time += dt; stT += dt;
    shake = Math.max(0, shake - dt * 1.5);
    flash = Math.max(0, flash - dt);
    shownScore += (score - shownScore) * Math.min(1, dt * 12);

    if (state === 'count') {
      const n = 3 - Math.floor(stT / 0.7);
      if (n !== lastCount) { lastCount = n; sfx.count(n <= 0); }
      if (stT >= 2.8) { state = 'play'; stT = 0; }
    }
    if (state === 'play') {
      playT += dt;
      spawnT -= dt;
      if (spawnT <= 0) { spawn(); spawnT = curGap() * rand(0.75, 1.25); }
      if (playT >= ROUND) { endGame('time'); }
    }

    for (const c of cells) {
      c.t += dt; c.bob += dt;
      c.shakeT = Math.max(0, c.shakeT - dt);
      for (const s of c.stains) s.a -= dt * 0.22;
      c.stains = c.stains.filter(s => s.a > 0);
      const live = state === 'play';
      if (c.st === 'awake') {
        if (live) c.cd -= dt;
        c.blink -= dt;
        if (c.blink < -0.12) c.blink = rand(1.5, 4.5);
      } else if (c.st === 'drowsy') {
        if (live) c.m += dt / c.dur;
        if (c.m >= 1) {
          c.st = 'asleep'; c.t = 0; c.hint = false;
          combo = 0;
          sfx.sleep();
          addFloat(c.x, c.y - c.h - 6, 'ねちゃった…', '#5A6CB0', 18);
          loseLife(c);
        }
      } else if (c.st === 'yawn') {
        if (c.t >= c.dur) { c.st = 'awake'; c.cd = 0.6; }
      } else if (c.st === 'asleep') {
        c.snoreT -= dt;
        if (c.snoreT <= 0) { c.snoreT = 1.6; if (live) sfx.snore(); }
        if (c.t >= 3.2) { c.st = 'awake'; c.cd = 1.2; c.kind = 'normal'; }
      } else if (c.st === 'woke') {
        if (c.t >= 0.7) { c.st = 'awake'; c.cd = rand(0.6, 1.4); c.kind = 'normal'; }
      } else if (c.st === 'grumpy') {
        if (c.t >= 0.7) { c.st = 'awake'; c.cd = 0.8; }
      }
    }

    for (const p of pours) {
      const prevT = p.t; p.t += dt;
      const c = p.c;
      if (p.t > 0.06 && p.t < 0.32) {
        for (let i = 0; i < 2; i++) parts.push({ x: c.x + 20 + rand(-2, 2), y: c.y - c.h - 26, vx: rand(-12, 6), vy: rand(120, 220), life: 0.35, t: 0, color: '#4A1F0E', r: rand(2.5, 4), g: 900, sauce: c });
      }
      if (prevT < 0.16 && p.t >= 0.16) {
        for (let i = 0; i < 4; i++) c.stains.push({ dx: rand(-c.w * 0.3, c.w * 0.3), dy: rand(-c.h * 0.35, c.h * 0.1), r: rand(5, 11), a: 1, seed: Math.random() * 10 });
      }
    }
    pours = pours.filter(p => p.t < 0.45);

    for (const p of parts) {
      p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += p.g * dt;
      if (p.sauce && p.y > p.sauce.y - p.sauce.h * 0.55) p.t = p.life;
    }
    parts = parts.filter(p => p.t < p.life);
    for (const f of floats) f.t += dt;
    floats = floats.filter(f => f.t < 1.0);
  }

  // ---------- drawing ----------
  function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h); }

  function drawBackground() {
    // wall
    const g = ctx.createLinearGradient(0, -300, 0, TOP);
    g.addColorStop(0, '#2E4A7A'); g.addColorStop(1, '#3F6296');
    ctx.fillStyle = g; ctx.fillRect(-400, -400, W + 800, TOP + 400);
    // window with moon/sun
    ctx.save();
    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    for (let i = 0; i < 14; i++) ctx.fillRect(-400 + i * 90, -400, 2, TOP + 400);
    ctx.restore();
    // table cloth (checker)
    ctx.fillStyle = '#FFF6E6'; ctx.fillRect(-400, TOP - 8, W + 800, H + 400);
    const s = 32;
    ctx.fillStyle = 'rgba(216,58,78,0.16)';
    for (let y = TOP - 8; y < H + 400; y += s) for (let x = -400; x < W + 400; x += s) {
      const ix = Math.floor((x + 400) / s), iy = Math.floor((y - TOP) / s);
      if ((ix + iy) % 2 === 0) ctx.fillRect(x, y, s, s);
    }
    ctx.fillStyle = 'rgba(216,58,78,0.10)';
    for (let x = -400; x < W + 400; x += s) ctx.fillRect(x + s * 0.4, TOP - 8, s * 0.2, H + 400);
    ctx.fillStyle = 'rgba(0,0,0,0.12)'; ctx.fillRect(-400, TOP - 8, W + 800, 4);
  }

  function drawHUD() {
    ctx.save();
    ctx.textBaseline = 'middle';
    // score
    ctx.fillStyle = '#FFFDF6'; ctx.font = '800 13px ' + FB; ctx.textAlign = 'left';
    ctx.fillText('スコア', 16, 22);
    ctx.font = '400 30px ' + FD;
    ctx.fillText(Math.round(shownScore).toLocaleString(), 14, 52);
    // combo
    if (combo >= 2 && state === 'play') {
      ctx.font = '800 14px ' + FB; ctx.fillStyle = '#FFD43B';
      ctx.fillText(combo + ' れんぞく', 16, 80);
    }
    // lives
    if (D.lives) {
      for (let i = 0; i < D.lives; i++) drawHeart(170 + i * 30, 40, 11, i < lives);
    } else {
      ctx.font = '800 12px ' + FB; ctx.fillStyle = 'rgba(255,253,246,0.85)'; ctx.textAlign = 'center';
      ctx.fillText('ねちゃっても だいじょうぶ', 200, 40);
    }
    // time bar
    const left = state === 'title' ? ROUND : Math.max(0, ROUND - playT);
    const bw = W - 32, bx = 16, by = 92, bh = 14;
    rr(bx, by, bw, bh, 7); ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.fill();
    const fr = left / ROUND;
    if (fr > 0) { rr(bx, by, Math.max(14, bw * fr), bh, 7); ctx.fillStyle = fr < 0.17 ? '#D83A4E' : '#E8A53E'; ctx.fill(); }
    ctx.font = '800 11px ' + FB; ctx.fillStyle = '#142849'; ctx.textAlign = 'center';
    ctx.fillText('のこり ' + Math.ceil(left) + ' びょう', W / 2, by + bh / 2 + 1);
    ctx.restore();
  }
  function drawHeart(x, y, r, full) {
    ctx.save(); ctx.translate(x, y);
    ctx.beginPath();
    ctx.moveTo(0, r * 0.9);
    ctx.bezierCurveTo(-r * 1.6, -r * 0.2, -r * 0.7, -r * 1.3, 0, -r * 0.4);
    ctx.bezierCurveTo(r * 0.7, -r * 1.3, r * 1.6, -r * 0.2, 0, r * 0.9);
    ctx.fillStyle = full ? '#D83A4E' : 'rgba(255,255,255,0.18)'; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = full ? '#FFFDF6' : 'rgba(255,255,255,0.4)'; ctx.stroke();
    ctx.restore();
  }

  function drawPlate(c) {
    ctx.save();
    ctx.fillStyle = 'rgba(60,30,10,0.18)';
    ctx.beginPath(); ctx.ellipse(c.x + 3, c.y + 5, c.w * 0.62, c.w * 0.17, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#FFFFFF';
    ctx.beginPath(); ctx.ellipse(c.x, c.y, c.w * 0.62, c.w * 0.17, 0, 0, TAU); ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = '#3F6296'; ctx.stroke();
    ctx.lineWidth = 1.2; ctx.strokeStyle = 'rgba(63,98,150,0.4)';
    ctx.beginPath(); ctx.ellipse(c.x, c.y, c.w * 0.46, c.w * 0.11, 0, 0, TAU); ctx.stroke();
    // shredded cabbage
    ctx.strokeStyle = '#8DC63F'; ctx.lineWidth = 2; ctx.lineCap = 'round';
    for (let i = 0; i < 6; i++) {
      const a = c.x + c.w * 0.32 + i * 3, b = c.y - 4 + (i % 3) * 3;
      ctx.beginPath(); ctx.moveTo(a, b); ctx.quadraticCurveTo(a + 6, b - 6, a + 12, b - 2); ctx.stroke();
    }
    ctx.restore();
  }

  function drawCroquette(c) {
    const { w, h } = c;
    let lift = 0, rot = 0, sx = 1, sy = 1, sprite = spr.normal;
    const m = c.st === 'drowsy' ? c.m : 0;
    if (c.st === 'awake' || c.st === 'yawn') { lift = Math.abs(Math.sin(c.bob * 2.2)) * 2.5; }
    if (c.st === 'drowsy') {
      rot = Math.sin(c.bob * (2 + m * 1.5)) * (0.04 + m * 0.16);
      lift = -m * 3;
      sy = 1 - m * 0.05;
    }
    if (c.st === 'asleep') { rot = 0.18; lift = -4; sy = 0.95 + Math.sin(c.t * 4) * 0.02; sprite = spr.sleepy || spr.normal; }
    if (c.st === 'woke') { const k = c.t / 0.7; lift = Math.sin(Math.min(1, k) * Math.PI) * 34; sy = 1 + Math.sin(k * Math.PI * 2) * 0.08; sx = 1 / sy; }
    if (c.st === 'grumpy') { rot = Math.sin(c.t * 40) * 0.06 * (1 - c.t / 0.7); }
    if (c.kind === 'gold' && (c.st === 'drowsy' || c.st === 'woke')) sprite = spr.gold || sprite;
    if (c.shakeT > 0) rot += Math.sin(c.shakeT * 60) * 0.08;

    ctx.save();
    ctx.translate(c.x, c.y - h * 0.32 - lift);
    ctx.rotate(rot);
    ctx.scale(sx, sy);
    if (sprite) ctx.drawImage(sprite, -w / 2, -h / 2, w, h);
    else { ctx.fillStyle = '#C98A3A'; ctx.beginPath(); ctx.ellipse(0, 0, w / 2, h / 2, 0, 0, TAU); ctx.fill(); }

    // gold glow
    if (c.kind === 'gold' && c.st === 'drowsy') {
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = 'rgba(255,220,80,' + (0.15 + 0.1 * Math.sin(time * 10)) + ')';
      ctx.beginPath(); ctx.ellipse(0, 0, w * 0.55, h * 0.6, 0, 0, TAU); ctx.fill();
      ctx.restore();
    }
    // sauce stains
    for (const s of c.stains) {
      ctx.fillStyle = 'rgba(58,22,8,' + Math.min(0.85, s.a) + ')';
      ctx.beginPath(); ctx.ellipse(s.dx, s.dy, s.r * 1.2, s.r * 0.75, s.seed, 0, TAU); ctx.fill();
      ctx.fillRect(s.dx - 1.5, s.dy, 3, s.r * 0.9);
      ctx.fillStyle = 'rgba(255,255,255,' + 0.35 * Math.min(1, s.a) + ')';
      ctx.beginPath(); ctx.arc(s.dx - s.r * 0.35, s.dy - s.r * 0.25, s.r * 0.22, 0, TAU); ctx.fill();
    }
    drawFace(c, m, w, h);
    ctx.restore();

    if (c.kind === 'cap' && (c.st === 'drowsy' || c.st === 'asleep')) drawCap(c, lift, rot);
  }

  function drawFace(c, m, w, h) {
    const ex = w * 0.15, ey = -h * 0.08, er = Math.max(6, w * 0.07);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    const st = c.st;
    // cheeks
    ctx.fillStyle = 'rgba(255,110,110,0.35)';
    ctx.beginPath(); ctx.ellipse(-ex * 1.75, ey + er * 1.3, er * 0.9, er * 0.55, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(ex * 1.75, ey + er * 1.3, er * 0.9, er * 0.55, 0, 0, TAU); ctx.fill();

    ctx.strokeStyle = '#2A1408'; ctx.fillStyle = '#2A1408'; ctx.lineWidth = Math.max(2.2, w * 0.022);
    const closedEye = (x, smile) => {
      ctx.beginPath();
      if (smile) ctx.arc(x, ey + er * 0.3, er * 0.75, Math.PI * 1.15, Math.PI * 1.85);
      else ctx.arc(x, ey - er * 0.2, er * 0.75, Math.PI * 0.15, Math.PI * 0.85);
      ctx.stroke();
    };
    const openEye = (x, lid, big) => {
      const r = er * (big ? 1.2 : 1);
      ctx.save();
      ctx.fillStyle = '#FFFFFF';
      ctx.beginPath(); ctx.ellipse(x, ey, r * 0.85, r, 0, 0, TAU); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(x, ey, r * 0.85, r, 0, 0, TAU); ctx.clip();
      ctx.fillStyle = '#2A1408';
      ctx.beginPath(); ctx.arc(x + r * 0.05, ey + r * 0.15 + lid * r * 0.3, r * 0.52, 0, TAU); ctx.fill();
      ctx.fillStyle = '#FFFFFF';
      ctx.beginPath(); ctx.arc(x - r * 0.15, ey - r * 0.12 + lid * r * 0.3, r * 0.18, 0, TAU); ctx.fill();
      if (lid > 0) {
        // eyelid: croquette-colored cover coming down
        ctx.fillStyle = '#B9732D';
        ctx.fillRect(x - r, ey - r - 1, r * 2, r * 2 * lid + 1);
        ctx.strokeStyle = '#2A1408';
        ctx.beginPath(); ctx.moveTo(x - r, ey - r + r * 2 * lid); ctx.lineTo(x + r, ey - r + r * 2 * lid); ctx.stroke();
      }
      ctx.restore();
      ctx.beginPath(); ctx.ellipse(x, ey, r * 0.85, r, 0, 0, TAU); ctx.stroke();
    };

    if (st === 'awake') {
      if (c.blink < 0) { closedEye(-ex, false); closedEye(ex, false); }
      else { openEye(-ex, 0); openEye(ex, 0); }
      ctx.beginPath(); ctx.arc(0, ey + er * 1.3, er * 0.7, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
    } else if (st === 'drowsy') {
      const lid = clamp(0.25 + m * 0.75, 0, 0.92);
      openEye(-ex, lid); openEye(ex, lid);
      // slack mouth
      ctx.beginPath(); ctx.ellipse(0, ey + er * 1.6, er * 0.32, er * (0.25 + m * 0.2), 0, 0, TAU); ctx.fill();
      // drool
      if (m > 0.55) {
        ctx.fillStyle = 'rgba(150,210,255,0.9)';
        ctx.beginPath(); ctx.ellipse(er * 0.45, ey + er * 2.1 + (m - 0.55) * er * 1.5, er * 0.16, er * 0.3 + (m - 0.55) * er, 0, 0, TAU); ctx.fill();
      }
    } else if (st === 'yawn') {
      const k = Math.sin(clamp(c.t / c.dur, 0, 1) * Math.PI);
      // eyes squeezed but OPEN wide at the start/end; big round mouth
      if (k > 0.6) {
        ctx.beginPath(); ctx.moveTo(-ex - er * 0.7, ey - er * 0.4); ctx.lineTo(-ex + er * 0.6, ey); ctx.lineTo(-ex - er * 0.7, ey + er * 0.4); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(ex + er * 0.7, ey - er * 0.4); ctx.lineTo(ex - er * 0.6, ey); ctx.lineTo(ex + er * 0.7, ey + er * 0.4); ctx.stroke();
      } else { openEye(-ex, 0); openEye(ex, 0); }
      ctx.fillStyle = '#7A1A1A';
      ctx.beginPath(); ctx.ellipse(0, ey + er * 1.8, er * (0.4 + k * 0.4), er * (0.3 + k * 0.9), 0, 0, TAU); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#FF8A8A';
      ctx.beginPath(); ctx.ellipse(0, ey + er * (1.8 + k * 0.5), er * 0.3 * (0.4 + k), er * 0.25 * k, 0, 0, TAU); ctx.fill();
    } else if (st === 'asleep') {
      closedEye(-ex, false); closedEye(ex, false);
      ctx.beginPath(); ctx.moveTo(-er * 0.4, ey + er * 1.6); ctx.lineTo(er * 0.4, ey + er * 1.6); ctx.stroke();
      // nose bubble
      const br = er * (0.5 + 0.5 * (0.5 + 0.5 * Math.sin(c.t * 3)));
      ctx.fillStyle = 'rgba(190,230,255,0.55)'; ctx.strokeStyle = 'rgba(120,180,230,0.9)'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(er * 0.9 + br, ey + er * 1.0, br, 0, TAU); ctx.fill(); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      ctx.beginPath(); ctx.arc(er * 0.9 + br * 0.6, ey + er * 1.0 - br * 0.4, br * 0.22, 0, TAU); ctx.fill();
    } else if (st === 'woke') {
      openEye(-ex, 0, true); openEye(ex, 0, true);
      ctx.fillStyle = '#7A1A1A';
      ctx.beginPath(); ctx.arc(0, ey + er * 1.3, er * 0.75, 0, Math.PI); ctx.closePath(); ctx.fill(); ctx.stroke();
    } else if (st === 'grumpy') {
      // angry brows
      ctx.beginPath(); ctx.moveTo(-ex - er, ey - er * 1.4); ctx.lineTo(-ex + er * 0.7, ey - er * 0.8); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(ex + er, ey - er * 1.4); ctx.lineTo(ex - er * 0.7, ey - er * 0.8); ctx.stroke();
      openEye(-ex, 0.3); openEye(ex, 0.3);
      ctx.beginPath(); ctx.arc(0, ey + er * 2.0, er * 0.6, 1.15 * Math.PI, 1.85 * Math.PI); ctx.stroke();
    }
  }

  function drawCap(c, lift, rot) {
    const { w, h } = c;
    ctx.save();
    ctx.translate(c.x, c.y - h * 0.32 - lift);
    ctx.rotate(rot);
    ctx.translate(-w * 0.1, -h * 0.42);
    ctx.rotate(-0.25);
    ctx.fillStyle = '#5A6CB0'; ctx.strokeStyle = '#1F3A68'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-w * 0.26, 0); ctx.quadraticCurveTo(-w * 0.05, -h * 0.9, w * 0.38, -h * 0.25); ctx.quadraticCurveTo(w * 0.1, -h * 0.25, w * 0.26, 0); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#FFFDF6';
    for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.arc(-w * 0.1 + i * w * 0.1, -h * 0.2 - i * h * 0.08, 2.2, 0, TAU); ctx.fill(); }
    rr(-w * 0.3, -h * 0.06, w * 0.6, h * 0.16, 6); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(w * 0.4, -h * 0.25, w * 0.06, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.restore();
    // remaining taps
    if (c.st === 'drowsy') {
      for (let i = 0; i < c.tapsMax; i++) {
        ctx.beginPath(); ctx.arc(c.x - (c.tapsMax - 1) * 7 + i * 14, c.y + 16, 5, 0, TAU);
        ctx.fillStyle = i < c.tapsMax - c.taps ? '#4A1F0E' : '#FFFFFF'; ctx.fill();
        ctx.lineWidth = 1.5; ctx.strokeStyle = '#4A1F0E'; ctx.stroke();
      }
    }
  }

  function drawZzz(c) {
    const m = c.st === 'drowsy' ? c.m : 1;
    const n = c.st === 'asleep' ? 3 : 1 + Math.floor(m * 3);
    ctx.save();
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (let i = 0; i < n; i++) {
      const ph = (time * 0.8 + i / 3) % 1;
      const x = c.x + c.w * 0.28 + ph * 18 + Math.sin(ph * 6 + i) * 4;
      const y = c.y - c.h * 0.9 - ph * 34;
      ctx.globalAlpha = Math.sin(ph * Math.PI) * (c.st === 'asleep' ? 0.9 : 0.5 + m * 0.5);
      ctx.font = '400 ' + Math.round(12 + ph * 10 + m * 4) + 'px ' + FD;
      ctx.lineWidth = 3; ctx.strokeStyle = '#FFFDF6'; ctx.strokeText('Z', x, y);
      ctx.fillStyle = '#5A6CB0'; ctx.fillText('Z', x, y);
    }
    ctx.restore();
  }

  function drawBar(c) {
    if (!D.bar || c.st !== 'drowsy') return;
    const bw = c.w * 0.7, bx = c.x - bw / 2, by = c.y + (c.kind === 'cap' ? 26 : 14);
    rr(bx, by, bw, 7, 3.5); ctx.fillStyle = 'rgba(31,58,104,0.25)'; ctx.fill();
    const col = c.m > 0.75 ? '#D83A4E' : c.m > 0.45 ? '#E8A53E' : '#5A6CB0';
    rr(bx, by, Math.max(7, bw * c.m), 7, 3.5); ctx.fillStyle = col; ctx.fill();
  }

  function drawHint(c) {
    if (!c.hint || c.st !== 'drowsy') return;
    const bob = Math.sin(time * 8) * 5;
    const x = c.x + c.w * 0.25, y = c.y + 8 + bob;
    ctx.save();
    ctx.font = '400 15px ' + FD; ctx.textAlign = 'center';
    ctx.lineWidth = 4; ctx.strokeStyle = '#FFFDF6'; ctx.strokeText('タップ！', c.x, c.y + 40 + bob * 0.3);
    ctx.fillStyle = '#D83A4E'; ctx.fillText('タップ！', c.x, c.y + 40 + bob * 0.3);
    // finger
    ctx.translate(x, y); ctx.rotate(-0.4);
    ctx.fillStyle = '#FFE3C8'; ctx.strokeStyle = '#7A4210'; ctx.lineWidth = 2;
    rr(-5, -18, 10, 22, 5); ctx.fill(); ctx.stroke();
    rr(-10, 0, 20, 16, 7); ctx.fill(); ctx.stroke();
    ctx.restore();
  }

  function drawBottle(x, y, tilt, s = 1) {
    ctx.save();
    ctx.translate(x, y); ctx.rotate(tilt); ctx.scale(s, s);
    // body
    ctx.fillStyle = '#4A1F0E'; ctx.strokeStyle = '#1E0C04'; ctx.lineWidth = 2;
    rr(-13, -20, 26, 44, 8); ctx.fill(); ctx.stroke();
    // shoulder/neck
    ctx.beginPath(); ctx.moveTo(-13, -14); ctx.quadraticCurveTo(-12, -30, -5, -32); ctx.lineTo(5, -32); ctx.quadraticCurveTo(12, -30, 13, -14); ctx.closePath(); ctx.fill(); ctx.stroke();
    // cap
    ctx.fillStyle = '#D83A4E'; rr(-6, -42, 12, 11, 3); ctx.fill(); ctx.stroke();
    // label
    ctx.fillStyle = '#FFE08A'; rr(-11, -8, 22, 22, 3); ctx.fill();
    ctx.fillStyle = '#D83A4E'; ctx.font = '400 8px ' + FD; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('ソー', 0, -1); ctx.fillText('ス', 0, 8);
    ctx.fillStyle = 'rgba(255,255,255,0.25)'; rr(-10, -18, 4, 34, 2); ctx.fill();
    ctx.restore();
  }

  function drawPours() {
    for (const p of pours) {
      const c = p.c;
      const k = p.t / 0.45;
      const tilt = Math.PI * 0.75 * Math.min(1, p.t / 0.1) * (k > 0.75 ? 1 - (k - 0.75) * 4 : 1);
      const a = k > 0.8 ? 1 - (k - 0.8) * 5 : 1;
      ctx.save(); ctx.globalAlpha = a;
      drawBottle(c.x + 34, c.y - c.h - 46, tilt, 1);
      // stream
      if (p.t > 0.06 && p.t < 0.34) {
        ctx.strokeStyle = '#4A1F0E'; ctx.lineWidth = 5; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(c.x + 22, c.y - c.h - 30); ctx.quadraticCurveTo(c.x + 18, c.y - c.h - 6, c.x + 14, c.y - c.h * 0.5); ctx.stroke();
      }
      ctx.restore();
    }
  }

  function drawParticles() {
    for (const p of parts) {
      ctx.globalAlpha = 1 - p.t / p.life;
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (const f of floats) {
      const k = f.t / 1.0;
      ctx.globalAlpha = k < 0.7 ? 1 : 1 - (k - 0.7) / 0.3;
      const y = f.y - 30 * Math.sqrt(k);
      const s = f.size * (k < 0.12 ? 0.6 + k / 0.12 * 0.4 : 1);
      ctx.font = '400 ' + Math.round(s) + 'px ' + FD;
      ctx.lineWidth = 5; ctx.strokeStyle = '#FFFDF6'; ctx.strokeText(f.text, f.x, y);
      ctx.fillStyle = f.color; ctx.fillText(f.text, f.x, y);
    }
    ctx.globalAlpha = 1;
  }

  function drawCountdown() {
    if (state !== 'count') return;
    const n = 3 - Math.floor(stT / 0.7);
    const k = (stT % 0.7) / 0.7;
    const txt = n > 0 ? String(n) : 'おこせ！';
    ctx.save();
    ctx.fillStyle = 'rgba(20,40,73,0.25)'; ctx.fillRect(-400, -400, W + 800, H + 800);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.globalAlpha = n > 0 ? 1 - k * 0.6 : 1;
    ctx.font = '400 ' + Math.round((n > 0 ? 96 : 60) * (1.3 - k * 0.3)) + 'px ' + FD;
    ctx.lineWidth = 10; ctx.strokeStyle = '#1F3A68'; ctx.strokeText(txt, W / 2, H / 2);
    ctx.fillStyle = '#E8A53E'; ctx.fillText(txt, W / 2, H / 2);
    ctx.restore();
  }

  function draw() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = '#3A2416'; ctx.fillRect(0, 0, cw, ch);
    let sx = 0, sy = 0;
    if (shake > 0) { sx = (Math.random() - 0.5) * 14 * shake; sy = (Math.random() - 0.5) * 14 * shake; }
    ctx.translate(ox + sx, oy + sy);
    ctx.scale(scale, scale);
    drawBackground();
    drawHUD();
    for (const c of cells) drawPlate(c);
    for (const c of cells) drawCroquette(c);
    for (const c of cells) { if (c.st === 'drowsy' || c.st === 'asleep') drawZzz(c); drawBar(c); }
    drawPours();
    drawParticles();
    for (const c of cells) drawHint(c);
    if (flash > 0) { ctx.fillStyle = 'rgba(255,230,120,' + flash + ')'; ctx.fillRect(-400, -400, W + 800, H + 800); }
    drawCountdown();
    if (mouse.on && (state === 'play' || state === 'count')) drawBottle(mouse.x + 10, mouse.y - 22, 0.5, 0.75);
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
